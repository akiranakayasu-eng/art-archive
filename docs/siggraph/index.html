ape. The audience carries on art works which have a fragrance and lollipop shape. This is a fake lollipop, however it may represent a hope for everyone."}, {"v": "", "img": "thumbs/c3ab0f458267.jpg", "t": "Silly Faces", "a": ["Amanda Long"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425789", "abs": "Silly Faces is an interactive video installation in which the viewers create their own 5 second movie. The video uploads immediately to a grid on the wall, an animated mosaic of faces. Everyone is a star. The video mural shows the 65 most recent videos, moving portraits of the audience looping back and forth. Silly Faces was commissioned for the show Yinz Play by the Children's Museum of Pittsburgh. The interaction of pressing a button on an arcade to record the video makes a fun, social and potentially intimate relationship between the audience playing and the video technology. When a new video is recorded it \"bumps\" the previous video to the left. The movies are saved into a database in the computer. Custom software enables a collaboration between myself and the audience, creating an evolving animated mural, blurring the line between artist, performer, and spectator. Silly Faces will act as a visualization of the temporary community that comes together at SIGGRAPH. The mural is composed from the audience's faces and bodies, creating a family or class portrait of the visitors. The playfulness of making a silly face is a unifying gesture that people of all ages and cultures can enjoy."}, {"v": "", "img": "thumbs/dccdec8da08e.jpg", "t": "Sweet Home", "a": ["Mayuko Kanazawa", "Masataka Imura", "Ichiroh Kanaya"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425807", "abs": "Art is not what you see, but is what you interact with. Good paintings make their viewers imaginative. As every artist has been expressing love in many ways, the authors introduce a novel way to express the shape of love in an interactive way using state-of-the-art computing technology. The viewers of the art will not see the picture, but will interact with the picture literally. The concept of the interactive art that the authors propose in this paper is that the viewer of the art feel as if he/she is inside the painting. You first find yourself moving in the acrylic painting as if it reflects you like a mirror. In the picture you interact with a family of Alpaca, who will present you with a gift. If you stare at yourself in the picture carefully you will see your face is slightly morphed to that of your child age. You are to bring a candle with you to lighten the picture. As you move the candle, the lighting in the picture changes. You can even blow out the candle, and every animated character disappear from the picture, though the gift from Alpaca family remains inside you."}, {"v": "", "img": "thumbs/0686f2010bf4.jpg", "t": "The Door", "a": ["Byongsue Kang", "Hyohoun No", "Junghwan Sung", "Jaeyoung Kim", "Hwanik Jo", "Semi Kim", "Minju Lee"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425810", "abs": "We want to express digital communication with a human touch. So we pay attention to the properties of a door because it links one place to another. We think the linking of different places and sharing of places is one of the substantial qualities of network technology. Another reason that we focus on a door is because it bears great meanings. For example, a door is the first spot for a meeting with someone or for kissing someone goodbye. It could be your children, spouse, or your friends. These days, we talk and say hello to friends by Messenger or mobiles. Accustomed to digital devices which neglect time or space, we expect that the devices can carry our emotions to others. However, these have limits in expression. We want to show through the our work \"The Door\" that network technology should have a little more humanity and love in the near future."}, {"v": "", "img": "thumbs/2da21203d78b.jpg", "t": "The Galloping Horse", "a": ["Remi Brun"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425788", "abs": "The Galloping Horse sculpture is a homage to the works of Marey and Muybridge, both pioneers at the frontiers of art, science, the cinema and biomechanics. This animated sculpture pushes us to understand the extent to which we are movement ourselves: in our actions as we can ride this animal, or even as we imitate a galloping horse through child's play. With no more than 18 light diodes, we sense the presence of the horse. We are movement before anything else."}, {"v": "", "img": "thumbs/f49628552a45.jpg", "t": "Time of Doubles", "a": ["Hyunkyung (Haru) Ji", "Graham Wakefield"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425799", "abs": "\"Time of Doubles\" is an immersive interactive art installation. It invites visitors to experience mirror existences of themselves taking upon new roles as sources of energy and kinetic disturbance within a virtual ecosystem, a uniquely created computational world. Visitors encounter their doubles in a deep hyper space with 3D stereoscopic projection and 3D depth cameras. The immersive projection dissolves the illusion of a window to form an entryway into a shared, co-present world, and the volumetric sensors take the visitors beyond avatar-based representation to become embodied within a world of physical simulation. This world displays some familiar characteristics as our own, but is populated by unfamiliar life-forms swimming through the sensitive motions of dark fluids and singing continuously. The visitor doubles are energy fields which emanate myriad bright fluid particles, food sources which are eaten by the virtual organisms. Visitors hear, see and feel how they are fed to unknown species in the virtual ecosystem aesthetically. Without visitors, the world-fluid is filled with life seeds that cannot grow, but with a human presence the populations explode into alien orchestras. Larger organisms leave physical residues and films behind as they pass, which constrain the fluid flows and which can be sculpted by visitor doubles."}, {"v": "", "img": "thumbs/7294214e11cd.jpg", "t": "Urban Spirits", "a": ["Judith Darmont"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425792", "abs": "With Urban Spirits, Judith Darmont creates both digital street art and an interactive tool for citizens and urbanists. Digital street art is taking spontaneous art expression like graffiti into a new dimension. Using pico-LED or Laser projectors, screenings can happen anytime, any place. With HD Cam, Internet and social networks, you can easily find tracks from Urban Spirits. In many cities, Urban Spirits can be viewed with augmented reality by video artworks."}, {"v": "", "img": "thumbs/ca6e7067a8e4.jpg", "t": "Wonder", "a": ["Alicia Eggert"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425802", "abs": "Wonder (2011) is an interactive, kinetic sculpture. The work is essentially a living drawing, a residuum of movement that is brought to life by the movement of others. From a distance, the white dots appear to be a constellation, and the work remains static. As a person approaches, the motors suddenly come to life and the dots slowly coalesce to spell the word 'wonder'. However, much like a pointillist painting, the word is illegible when viewed up close. Because of that, it ideally requires two or more people to participate. The person approaching or 'wondering' becomes the artist/performer, physically bringing the work to fruition with their movements. Onlookers are given the ability to see the 'wonder' in the making, both literally and metaphorically. The typically passive act of looking becomes a physically active performance, and people in the vicinity are able to watch and be entertained by the spectacle of it. It is the sculpture's playful nature that really interests me. Whether or not viewers ever discover the word 'wonder' within the work is not important. Meaning is constructed and elaborated collectively, through a shared and hopefully memorable experience."}, {"v": "", "img": "thumbs/1125123d17d7.jpg", "t": "ADB", "a": ["Nicholas Stedman"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836808", "abs": "ADB is a snake-like, modular robot designed for haptic interactions with people, writhing, wriggling, twisting, and squeezing in response to how it is held and touched. It can be used to explore intimate and emotional relationships with technology through direct physical contact. ADB adapts to and reciprocates the energy one puts into it through one's body. When touched, it comes to life. When stroked, it seeks more of you. When harmed, it defends."}, {"v": "", "img": "thumbs/c2c09656c421.jpg", "t": "Cursor Caressor Eraser", "a": ["Michael Filimowicz"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836797", "abs": "Cursor Caressor Eraser is an installation and online artwork exploring the erotic image and the seductive potential of tangible interfaces."}, {"v": "", "img": "thumbs/17ed74d87fde.jpg", "t": "Dinner Party", "a": ["Hye Yeon Nam"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836802", "abs": "Dinner Party is an interactive installation, where a single chair and a place set for one person seem to provide a solitary dining experience. However, the installation offers an interaction between oneself and imaginary creatures. As if she or he is about to enjoy a meal, a participant sits down at an interactive table on which are placed several objects that he or she can move. The objects cast virtual shadows on the tabletop, with animated creatures hiding in these shadows."}, {"v": "", "img": "thumbs/766a83406700.jpg", "t": "Echidna", "a": ["Tine Bech"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836795", "abs": "Echidna is an interactive sound sculpture, made partly in collaboration with PhD researcher Tom Frame from the Surrey Space Centre. Echidna is like a fussy tumbled creature that has its own (electronic) voice. When it is touched, and the electromagnetic field around it is disturbed, sound emerges. The sculpture is made of tangled wire and sits on a plinth with electronics inside. It hums happily until touched, at which point it will squeak and react to one's presence. The work combines a circuit which directly measures electrostatic changes in the environment and a custom-designed phase-locked loop system, used to drive an audio speaker."}, {"v": "", "img": "thumbs/1e4f6b771d2a.jpg", "t": "Empire of Sleep", "a": ["Alan Price"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836804", "abs": "Empire of Sleep is an interactive virtual environment installation viewed in stereoscopic 3D on a large rear projection screen. Participants interact using a hand-held camera to take photographs of the scene, triggering the virtual camera to move to new points of interest. A group of surreal-looking figures, clothed in early 20th century bathing suits, are scattered about on several isolated sand bars somewhere on an open and calm body of water. They first appear as if there for recreation, but there is a pensive mood, as if some unusual event is taking place unknown to the viewer."}, {"v": "", "img": "thumbs/f427687cdd7e.jpg", "t": "Final Wisdom I", "a": ["John Fillwalk"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836798", "abs": "Final Wisdom I is an interactive installation where participants shape their experience with a work of visual and sonic poetry by means of gesture, touch, and proximity. The work is engaged through an interactive software framework that provides an interface to the physical world through objects reacting to touch, sound, and pressure, presenting viewers with a shifting environment of media as they navigate and shape their experience with a work of spatialized poetry. Final Wisdom I is the work of artists Hans Breder and John Fillwalk, with poetry by Donald Kuspit, music by Carlos Cuellar Brown, and programmer Jesse Allison."}, {"v": "", "img": "thumbs/4ea3f05bbeb2.jpg", "t": "Glowing Pathfinder Bugs", "a": ["Anthony Rowe", "Liam Birtles"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836790", "abs": "Glowing Pathfinder Bugs is an interactive art project primarily aimed at children and created by the digital arts group Squidsoup. It uses projection to visualize virtual bugs on a real sandpit. The bugs are aware of their surroundings and respond to its form in their vicinity. By altering the topography of the sand, participants affect the bugs' environment in real time, facilitating direct communication between them and computer-generated creatures.This highly malleable and tactile physical environment lets us define and carve out the landscape in which the creatures exist in real time. Thus, virtual creatures and real people coexist and communicate through a shared tactile environment. Participants can use natural modes of play, kinesthetic intelligence, and their sense of tactility to collaboratively interact with creatures inhabiting a hybrid parallel world.This paper describes the project and analyzes how children in particular respond to the experience; it looks at the types of physical formations that tend to be built and notes how children instinctively anthropomorphize the bugs, treating projected imagery as living creatures - though with a ludic twist."}, {"v": "", "img": "thumbs/50364ecbeef9.jpg", "t": "Glowing Pathfinder Bugs", "a": ["Anthony Rowe"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836807", "abs": "Using the shared environment of a sandpit, Glowing Pathfinder Bugs allows virtual creatures and real people to coexist and communicate. The sand operates as a tactile interface, allowing participants to define physical landscapes to which the digital creatures respond in real time. The result is a form of animal husbandry---a sense of controlling and caring for the bugs."}, {"v": "", "img": "thumbs/d050d50cc100.jpg", "t": "hanahanahana", "a": ["Yasuaki Kakehi", "Motoshi Chikamori", "Kyoko Kunoh"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836799", "abs": "To experience hanahanahana, the participant applies perfume to a leaf-shaped piece of paper and holds or shakes it in front of the wall. A flower image then appears in each bud-like device. The degree of transparency of the flower changes gradually according to the strength of the floating scent, while color and shape also vary according to the sort of fragrance applied to the paper. Participants can enjoy temporal and spatial variations of floating air with olfactory sensations from the scent, visual sensations from the projection screen, and tactile sensations from the wind."}, {"v": "", "img": "thumbs/f1f7d2925744.jpg", "t": "In the Line of Sight", "a": ["Daniel Sauter", "Fabian Winkler"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836806", "abs": "In the Line of Sight is a light installation that uses 100 computer-controlled tactical flashlights to project low-resolution video footage of suspicious human motion into the exhibition space. Each flashlight projects a light spot on the wall. All flashlights combined create a ten-by-ten matrix representation of the source footage, featured on a video monitor in an adjacent part of the gallery. In the Line of Sight is an artistic exploration of low-resolution video projections exploring electronic images not as simulations of reality but as objects anchored in the physical space."}, {"v": "", "img": "thumbs/02ed3413bc79.jpg", "t": "Lotus 7.0", "a": ["Daan Roosegaarde"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836805", "abs": "What happens when technology makes the leap out of the computer screen and becomes embedded in our walls, bodies, and urban landscapes? This was the inspiration for Studio Roosegaarde's most recent interactive artwork, Lotus 7.0. Lotus 7.0 is a \"living\" wall made of smart foils, electronics, and lamps that interacts with human behavior."}, {"v": "", "img": "thumbs/447b0ed2f2ba.jpg", "t": "Strata-Caster", "a": ["Joseph Farbrook"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836796", "abs": "Strata-Caster is an online virtual art installation, created on a private island in Second Life (secondlife.com). Viewers travel by way of a wheelchair, while being made acutely aware of their physical and virtual status, and are invited to re-examine this position in life in relation to all others (both physical and virtual)."}, {"v": "", "img": "thumbs/9b6a84a020c5.jpg", "t": "The lightness of your touch", "a": ["Henry Kaufman"], "c": "SIGGRAPH", "y": 2010, "k": "Art Gallery", "doi": "10.1145/1836786.1836800", "abs": "In this piece one touches a larger-than-life torso that reacts. The skin of the body moves subtly as one's hand moves over the surface. If the hand is held down for a moment and then taken away, an impression of the hand is left behind. This imprint soon lifts off the surface and begins to blow around as if it were a leaf or tissue caught in a breeze. Many people can touch the surface at the same time, sharing in the interaction."}, {"v": "", "img": "", "t": "Data portraits", "a": ["Judith Donath", "Alex Dragulescu", "Aaron Zinman", "Fernanda Viégas", "Rebecca Xiong"], "c": "SIGGRAPH", "y": 2010, "k": "Art Papers", "doi": "10.1145/1836786.1836793", "abs": "Data portraits depict their subjects' accumulated data rather than their faces. They can be visualizations of discussion contributions, browsing histories, social networks, travel patterns, etc. They are subjective renderings that mediate between the artist's vision, the subject's self-presentation, and the audience's interest. Designed to evocatively depict an individual, a data portrait can be a decorative object or be used as an avatar, one's information body for an online space."}, {"v": "", "img": "", "t": "Learning from weaving for digital fabrication in architecture", "a": ["Rizal Muslimin"], "c": "SIGGRAPH", "y": 2010, "k": "Art Papers", "doi": "10.1145/1836786.1836789", "abs": "This project restructures weaving performance in architecture by analyzing the tacit knowledge of traditional weavers through perceptual study and converting it into an explicit rule in computational design. Three implementations with different materials show the advantages of using computational weaving that combines traditional principles with today's digital (CAD/CAM) tools to develop affordable fabrication techniques."}, {"v": "", "img": "", "t": "samplingplong", "a": ["Joerg Niehage"], "c": "SIGGRAPH", "y": 2010, "k": "Art Papers", "doi": "10.1145/1836786.1836803", "abs": "samplingplong features a projected mouse cursor interacting in physical space, generating miniature sound compositions with pleasurable arrangements from the everyday soundtrack of the digital age."}, {"v": "", "img": "", "t": "Session details: Touchpoint: haptic exchange between digits", "a": [], "c": "SIGGRAPH", "y": 2010, "k": "Art Papers", "doi": "10.1145/3252013"}, {"v": "", "img": "", "t": "The immediacy of the artist's mark in shape computation", "a": ["Jacquelyn A. Martino"], "c": "SIGGRAPH", "y": 2010, "k": "Art Papers", "doi": "10.1145/1836786.1836788", "abs": "This paper contributes to the area of computation in the production of artistic form. The author-artist describes a computational system in the form of a curvilinear, parametric shape grammar. Based on an analysis of over 3,000 entries in her traditionally hand-drawn sketchbooks, she describes the grammar that synthesizes drawings in the design language of her evolving style and serves as a tool for self-understanding of her artistic process."}, {"v": "", "img": "", "t": "Tools for Improved Social Interacting", "a": ["Lauren McCarthy"], "c": "SIGGRAPH", "y": 2010, "k": "Art Papers", "doi": "10.1145/1836786.1836801", "abs": "Tools for Improved Social Interacting is a series of wearable devices---including the Anti-Day-dreaming Device, Happiness Hat, and Body Contact Training Suit---that use sensors to condition the behavior of the wearer to better adapt to expected social behaviors. The work explores the potential for technology to shape how we think, feel, and act. It also questions our social expectations, attempting to better understand their function and worth."}, {"v": "", "img": "", "t": "Touching space", "a": ["Kim Vincs", "John McCormick"], "c": "SIGGRAPH", "y": 2010, "k": "Art Papers", "doi": "10.1145/1836786.1836791", "abs": "This paper describes the work of a group of artists in Australia who used real-time motion capture and 3D stereo projection to create a large-scale performance environment in which dancers seemed to \"touch\" the volume. This project re-versions Suzanne Langer's 1950s philosophy of dance as \"virtual force\" to realize the idea of a \"virtual haptics\" of dance that extends the dancer's physical agency literally across and through the surrounding spatial volume. The project presents a vision of interactive dance performance that \"touches\" space by visualizing kinematics as intentionality and agency. In doing so, we suggest the possibility of new kinds of human-computer interfaces that emphasize touch as embodied, nuanced agency that is mediated by the subtle qualities of whole-body movement, in addition to more goal-oriented, task-based gestures such as pointing or clicking."}, {"v": "", "img": "", "t": "Visual anecdote", "a": ["Dietmar Offenhuber"], "c": "SIGGRAPH", "y": 2010, "k": "Art Papers", "doi": "10.1145/1836786.1836792", "abs": "The discourse on information visualization often remains limited to the exploratory function - its potential for discovering patterns in the data. However, representations also have a rhetorical function: they demonstrate, persuade, and facilitate communication.In observing how visualization is used in presentations and discussions, I often notice the use of what could be called visual anecdotes. Small narratives are tied to individual data points in the visualization, giving human context to the data and rooting the abstract representation in personal experience. This paper argues that these narratives are more than just illustrations of the dataset; they constitute a central epistemological element of the visualization. By considering these narrative elements as parts of the visualization, its design and knowledge organization appear in a different light.This paper investigates how the story of data representation is delivered. By means of ethnographic interviews and observations, the author highlights the different aspects of the anecdote, a specific point where the exploratory and the rhetorical functions of visualization meet."}, {"v": "", "img": "", "t": "Show Case", "a": [], "c": "SIGGRAPH Asia", "y": 2010, "k": "Art Papers", "doi": "10.1145/1900351.1900353", "abs": "research-article Share on Show CaseSA '10: ACM SIGGRAPH ASIA 2010 Art + Tech ShowcaseDecember 2010 Article No.: 2Pages 1–58https://doi.org/10.1145/1900351.1900353Online:15 December 2010Publication History 0citation159DownloadsMetricsTotal Citations0Total Downloads159Last 12 Months5Last 6 weeks0 Get Citation AlertsNew Citation Alert added!This alert has been successfully added and will be sent to:You will be notified whenever a record that you have chosen has been cited.To manage your alert preferences, click on the button below.Manage my AlertsNew Citation Alert!Please log in to your account Save to BinderSave to BinderCreate a New BinderNameCancelCreateExport CitationPublisher SiteGet Access"}, {"v": "", "img": "", "t": "The Invitation", "a": [], "c": "SIGGRAPH Asia", "y": 2010, "k": "Art Paper const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = {q:'', year:'', conf:'', cat:''};

function chips(el, field, values){
  const all = [''].concat(values);
  el.innerHTML = all.map(v => `<button class="chip" data-v="${esc(v)}" aria-pressed="${v===''}">${v||'All'}</button>`).join('');
  el.onclick = e => {
    const b = e.target.closest('.chip'); if(!b) return;
    state[field] = b.dataset.v;
    el.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x===b));
    render();
  };
}
const uniq = f => [...new Set(DATA.map(f))];
uniq(d => d.y).sort((a,b)=>b-a).forEach(y => $('#year').insertAdjacentHTML('beforeend', `<option>${y}</option>`));
chips($('#conf'), 'conf', uniq(d => d.c).sort());
chips($('#cat'), 'cat', uniq(d => d.k).sort().reverse());
$('#year').onchange = e => { state.year = e.target.value; render(); };
// サムネイルの大きさ（小・中・大）。選んだ大きさはこのブラウザに記憶する
function setSize(s){
  document.body.dataset.size = s;
  $('#size').querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === s));
  try { localStorage.setItem('thumbSize', s); } catch(e) {}
}
$('#size').onclick = e => { const b = e.target.closest('.chip'); if (b) setSize(b.dataset.s); };
let saved = 'm'; try { saved = localStorage.getItem('thumbSize') || 'm'; } catch(e) {}
setSize(saved);
$('#q').oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };

const TPL = document.getElementById('card-tpl').content;
function fill(el, d){
  const set = (f, v) => el.querySelectorAll(`[data-f="${f}"]`).forEach(n => n.textContent = v || '');
  set('title', d.t); set('authors', d.a.join(', ')); set('event', `${d.c} ${d.y}`);
  set('kind', d.k); set('venue', d.v); set('abs', d.abs); set('ja', d.ja);
  set('tags', (d.tags || []).map(x => '#' + x).join('  '));
  const noabs = d.k === 'Art Gallery' && !d.abs && !d.ja;
  el.querySelectorAll('[data-show]').forEach(n => n.hidden = !(n.dataset.show === 'noabs' ? noabs : d[n.dataset.show]));
  el.querySelectorAll('[data-f="doi"]').forEach(n => { n.href = `https://doi.org/${d.doi}`; n.textContent = d.doi ? "Open in ACM Digital Library ↗" : ''; });
  el.querySelectorAll('[data-f="img"]').forEach(n => {
    const box = n.parentElement;
    if (d.img) {
      n.src = d.img; n.hidden = false; box.classList.remove('none');
      n.style.objectPosition = d.pos || '';
      // とても横長の画像はカードでは切らずに全体を見せる（data/thumb-pos.json で位置を指定した画像は除く）
      const fit = () => box.classList.toggle('wide', !d.pos && n.naturalWidth / n.naturalHeight > 1.9);
      if (n.complete && n.naturalWidth) fit(); else n.onload = fit;
    }
    else { n.removeAttribute('src'); n.hidden = true; box.classList.add('none'); }
  });
}
function card(d){
  const el = TPL.firstElementChild.cloneNode(true);
  // カードはリンクにしない（ACMへは詳細表示の中のリンクから）
  el.tabIndex = 0; el.setAttribute('role', 'button');
  fill(el, d);
  el.onclick = e => { e.preventDefault(); open(d); };
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(d); } };
  return el;
}
const DLG = $('#detail');
function open(d){ fill(DLG, d); DLG.showModal(); DLG.scrollTop = 0; }
DLG.querySelector('.close').onclick = () => DLG.close();
DLG.onclick = e => { if (e.target === DLG) DLG.close(); };
function render(){
  const list = DATA.filter(d =>
    (!state.year || String(d.y) === state.year) &&
    (!state.conf || d.c === state.conf) &&
    (!state.cat || d.k === state.cat) &&
    (!state.q || [d.t, d.a.join(' '), d.abs, d.ja, (d.tags||[]).join(' ')].join(' ').toLowerCase().includes(state.q)));
  $('#count').textContent = `${list.length} / ${DATA.length} works`;
  const groups = new Map();
  list.forEach(d => { const g = `${d.c} ${d.y}|${d.k}`; (groups.get(g) || groups.set(g, []).get(g)).push(d); });
  const out = $('#out'); out.replaceChildren();
  if (!list.length) { out.innerHTML = '<div class="empty">No results</div>'; return; }
  for (const [g, ds] of groups) {
    const [ev, k] = g.split('|');
    out.insertAdjacentHTML('beforeend', `<h2><b>${esc(ev)}</b>${esc(k)} · ${ds.length}</h2><div class="grid"></div>`);
    out.lastElementChild.append(...ds.map(card));
  }
}
render();
</script>
</body>
</html>

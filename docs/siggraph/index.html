le. On days of high solar radiation, bright, clear ice and sun predominate and also move the images on screen accordingly, on cloudy days, the image darkens. La Niña conditions for the past three years have brought sunny settled weather to this region in the central South Island and melting has accelerated, indicating the changing climate. This installation expresses what it feels like to be inside that ice and water, responsive to heat, rain and bright sunlight."}, {"v": "", "img": "thumbs/1bd7446b0c2f.jpg", "t": "Penumbra2.0", "a": ["Dennis Del Favero", "Yang Song", "Khalid Moinuddin", "Charles Green", "Jason Sharples", "Alex Ong", "Navin Brohier"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622946", "abs": "Penumbra2.0 is an AI immersive art installation exploring the visualisation of an unpredictable extreme wildfire scenario using a pyro-aesthetic, an aesthetic based on the perceptual qualities of this fire type. Currently seen in Canada, these wildfires are extreme in their speed and scale. They are unpredictable as their behaviour moves across terrains in unforeseen ways, unlike the linear and predictable paths of bushfires. Using geo-located data, Penumbra2.0 recreates an actual wildfire in the Vosges mountains, France, 2020. It has been collaboratively developed by art, AI and fire researchers."}, {"v": "", "img": "thumbs/7d5193a3af97.jpg", "t": "Plastic Landscape - The Reversible World", "a": ["Yoon Chung Han", "Seong-Lyun Kim", "Hung Tsai"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622949", "abs": "\"Plastic Landscape - The Reversible World\" is an Al-generated 3D animated video design that shows the apocalyptic and surreal world surrounded by artificial plastic mixtures and objects in the ocean, urban city, Antarctica, and forest. Four different scenes are animated, with the camera panning slowly from left to right. Viewers can observe how the plastics are decomposed at a slower speed by looking at particle animations. Sound is created by the data of the decomposition of plastics. Different types of plastics and speed of decomposition determine the frequency, amplitude, and parameters of audio synthesis. This scene animation is inspired by Ilwalobongbyeong (a folding screen) behind the king's throne of the Joseon Dynasty. This animation depicts the twist of the landscape. Surreal objects/buildings in this animation made out of plastic look beautiful and mesmerizing at first glance. However, the viewers can notice that they are the decayed objects and destroyed nature impacted by human beings. This new multi-sensory artwork addresses the awareness of plastic pollution through the apocalyptic lens."}, {"v": "", "img": "thumbs/8057b2716b58.jpg", "t": "Sensitive Floral", "a": ["Scottie Chih-Chieh Huang"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622962", "abs": "\"Sensitive Floral\" is an interactive, generative artwork that ventures into the exploration of a unique generative system, biomimetically emulating the reactive behaviors of the Mimosa plant. By synthesizing the complexity of fractal tree data structures with the Cellular Automata mechanisms of grid computations, the artwork elegantly mirrors nature's adaptive and responsive traits. The interactive interface allows users to initiate a ripple of movement by simply touching the screen, triggering a cascade of changes across thousands of leaves, akin to the group leaf movements observed in Mimosa. The system, instantaneously detects which branch of the tree structure on the touch screen is being externally triggered. It then notifies the grid calculation system, based on the Cellular Automata mechanism, to generate parameters for angle gradients of closing behavior between branches. These parameters are applied in real time to the image generation system of the floral structure, altering the overall appearance of the flower."}, {"v": "", "img": "thumbs/d283f348dc76.jpg", "t": "Sonus Maris; Strange Attractor", "a": ["Nigel Llwyd William Helyer"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622944", "abs": "Sonus Maris; Strange Attractor- is a two-channel video work that navigates the intersections between art and science, developed during an ongoing collaboration between artist Dr. Nigel Helyer and water engineers and scientists at the UNSW Water Research Laboratory (WRL)."}, {"v": "", "img": "thumbs/d802d9fa277a.jpg", "t": "Superb Lyrebird Sequences, 2023.", "a": ["Wade Marynowsky"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622950", "abs": "In Unruly Times, like many of us, I have experienced two significant stand-out events, the devastating bushfires of 2019- 2020 and the COVID-19 pandemic. In response, my focus has been on reconnecting with the natural world by closely observing local Superb Lyrebirds, documenting their unique behaviours, vocalizations, and dance."}, {"v": "", "img": "thumbs/64ff4626552f.jpg", "t": "The Garden of Unearthly Delights", "a": ["Andrew Yip"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622960", "abs": "The Garden of Unearthly Desires is an interactive physical/digital installation in which three, real-time simulated biomes evolve over the course of a day as users make ethical decisions that alter the paramaters of the virtual worlds."}, {"v": "", "img": "thumbs/697247b76a42.jpg", "t": "TreeGAN", "a": ["Peter Andrew Clarke Nelson"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622953", "abs": "TreeGAN is an investigation into how machine learning and generative adversarial networks (GANS) create 3-dimensional objects. As machine learning finds an increasing number of applications within visual culture, we was interested to see how such systems might influence how we think about 3D objects. When this project started in 2019, there were relatively few art projects that used machine learning to produce 3D objects and even fewer that were trained on 3D objects to produce 3D objects (as opposed to synthesising 3D forms from 2D images), partly due to the paucity of conditional datasets of 3D objects. We synthesised a dataset of 3D objects using a form that is easy to produce and recognise - trees. Previous studies for 3D machine learning tended to focus on geometrically simple objects such as IKEA furniture (Lim et al 2013) and industrial objects (Wu et al 2016), therefore, trees presented an opportunity to observe how a 3D machine learning system would approach complex yet familiar organic forms. Trees are often used in visual art as metaphors for the human experience, from the scholarly pines of Chinese ink painting (Clunas 2002) (McMahon 2003) to the martyred oaks of German Romanticism (Rosenblum 1975), and thus add an empathetic layer to our formal exploration. Three-dimensional trees are easy to produce on a large scale using Lindenmayer systems, and we made 76 unique tree templates, based on art historical references and exported 350 random variations of these templates, giving us a dataset of just over 26,000 3D trees. We watched the transition of beautiful abstractions as the system progressed from random 3D noise to recognizable trees, a process we likened to the analytical cubism of Picasso and Braque in the early 20th century, where we could observe a new technological system developing its own form of figuration."}, {"v": "", "img": "thumbs/bb29cbf31d13.jpg", "t": "Visions of Destruction", "a": ["Mar Canet Sola", "Varvara Guljajeva"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622947", "abs": "\"Visions of Destruction\" is an interactive AI-aided artwork that critiques the human impact on the environment. A viewer's gaze, detected by an eye-tracking sensor, causes transformations in the landscape imagery. Hence, merely by observing the digital scenery, the spectator induces dramatic changes at the points their gaze touches."}, {"v": "", "img": "thumbs/e5f73fd0fe12.jpg", "t": "Δt-Sphere", "a": ["Masaki Kanayama"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622948", "abs": "This artwork has a unique name, \"Δt,\" which combines the Greek letter delta (Δ) representing a small increment in mathematics and physics, and the initial letter of \"Thickness.\" This work :Δt-Sphere is part of the Δt series, and was born out of a study of the monement of living creatures. The principles of elasticity and pendulum is used by penetrating a piano wire through a stack of thin acrylic plates."}, {"v": "", "img": "thumbs/307b15bf6a68.jpg", "t": "AI Nüshu: An Exploration of Language Emergence in Sisterhood Through the Lens of Computational Linguistics", "a": ["Yuqian Sun", "Yuying Tang", "Ze Gao", "Zhijun Pan", "Chuyan Xu", "Yurou Chen", "Kejiang Qian", "Zhigang Wang", "Tristan Braud", "Chang Hee Lee", "Ali Asadipour"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616427", "abs": "This paper presents “AI Nüshu,\" an emerging language system inspired by Nüshu (women’s scripts), the unique language created and used exclusively by ancient Chinese women who were thought to be illiterate under a patriarchal society. In this interactive installation, two artificial intelligence (AI) agents are trained in the Chinese dictionary and the Nüshu corpus. By continually observing their environment and communicating, these agents collaborate towards creating a standard writing system to encode Chinese. It offers an artistic interpretation of the creation of a non-western script from a computational linguistics perspective, integrating AI technology with Chinese cultural heritage and a feminist viewpoint.", "ja": "この論文は「AIヌシュ」と題し、古代中国の女性だけが使用し、識字できないと考えられていた女性のための独自の文字体系であるヌシュにインスパイアされた新興言語システムを提示する。インタラクティブなインスタレーションにおいて、2つの人工知能（AI）エージェントが中国語辞書とヌシュコーパスで訓練される。エージェントは環境を継続的に観察し、コミュニケーションを取りながら、中国語を符号化する標準的な書記体系の創造に協力する。本作品は、計算言語学の視点から非西洋的な文字の創造を芸術的に解釈し、AI技術と中国文化遺産、そしてフェミニスト的視点を統合したものです。", "tags": ["AI Nüshu", "Chinese Cultural Heritage", "Computational Linguistics", "Language Emergence"]}, {"v": "", "img": "thumbs/bb21dd184446.jpg", "t": "AI-Generated Imagery: A New Era for the `Readymade'", "a": ["Amy Smith", "Michael Cook"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616432", "abs": "This paper examines the classification of digital images created by generative AI systems and their emergence as art. The term ‘art’ defies precise definition, but there is a growing tendency to label AI-generated images as such. The current discourse on AI-generated imagery as art lacks the nuanced understanding of traditional artistic media. To address this, we introduce some philosophical considerations. By applying existing frameworks and theories of language, we argue that certain AI-generated images possess properties aligned with ‘readymades’, qualifying them for consideration as art.", "ja": "この論文では、生成AIシステムによって作成されたデジタル画像の分類と、それらが芸術として台頭している現象を検証します。「芸術」という概念は明確に定義することが困難ですが、AI生成画像を芸術と呼ぶ傾向が高まっています。AI生成画像を芸術と位置付ける現在の議論は、従来の芸術的媒体に関する微細な理解に欠けています。これに対処するため、いくつかの哲学的考察を導入します。既存の言語理論や枠組みを適用することにより、特定のAI生成画像が「レディメイド」の特性を備えており、芸術としての検討に値することを論証します。", "tags": ["AI art", "Art", "Artificial Intelligence", "Computational Creativity", "Generative AI", "Philosophy"]}, {"v": "", "img": "thumbs/b01118c710f5.jpg", "t": "Alternative Photographic Processes Reimagined: The Role of Digital Technology in Revitalizing Classic Printing Techniques", "a": ["Chinatsu Ozawa", "Kenta Yamamoto", "Kazuya Izumi", "Yoichi Ochiai"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616430", "abs": "The transition from film to digital has influenced photography techniques, with implications for both cultural and technical aspects. By examining the history and concepts of classical photography and incorporating computer intervention in revitalizing alternative photographic processes, we aim to expand aesthetic expressions in art, computer graphics, and our understanding of photography’s cultural significance. Integrating computer processing with techniques such as salt print, platinum print, and cyanotype, this study seeks to create a new photographic experience that embraces the joy of materializing scenery and highlights the interconnectedness of technology and art.", "ja": "フィルムからデジタルへの移行は、写真技術に影響を与え、文化的および技術的側面の両方に示唆をもたらしています。古典的な写真の歴史と概念を検証し、代替的な写真プロセスを活性化するためにコンピュータ介入を組み込むことで、芸術、コンピュータグラフィックスにおける美的表現を拡大し、写真の文化的意義に対する理解を深めることを目的としています。塩版、プラチナ版、シアノタイプなどの技法とコンピュータ処理を統合することで、風景を具現化する喜びを取り入れ、技術と芸術の相互関係を強調した新しい写真体験を創出しようとしています。", "tags": ["Alternative Photographic Processes", "Cyanotype", "Data-driven Simulation", "Optimization", "Platinum Print", "Salt Print"]}, {"v": "", "img": "thumbs/8eb2a935e2e1.jpg", "t": "Computational Three Distances: Exploring the Aesthetics of the Southern Song Dynasty and Its Adapted Simulation and Rendering", "a": ["Chi-Min Hsieh", "Hsiao-Ching Chou"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616426", "abs": "This paper references the painting theory of the \"three distances\" concept from the Southern Song Dynasty. It introduces a contemporary reinterpretation termed \"Computational Three Distances,\" which employs computer algorithms as the means of painting, departing from traditional ink-brush techniques. The three distances encompass \"micro-distance, volume-distance,\" and \"time-distance.\" This study reexamines the adjustability of microscopic world units, the density of medium within volumes along with light-scattering effects, and the accumulation and erosion of time. It then puts this theory into practice, offering illustrative methods for each aspect.", "ja": "この論文は、南宋時代の絵画理論である「三距離」概念を参照しています。従来の墨筆技法から離れ、コンピュータアルゴリズムを絵画手段として用いる「コンピューテーショナル・スリー・ディスタンス」と呼ばれる現代的再解釈を導入します。三距離は「マイクロ距離、ボリューム距離、時間距離」を含みます。本研究は、微視的世界単位の調整可能性、ボリューム内の媒質密度と光散乱効果、時間の蓄積と侵食を再検討し、各側面の具体的手法を提示します。"}, {"v": "", "img": "thumbs/dfb8f481213b.jpg", "t": "Environmental Inversion: A Collection of Artworks that Subvert Methods of Climate Change Action", "a": ["Jonah Brucker-Cohen"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616423", "abs": "This paper details Environmental Inversion, a collection of artworks that propose a critical examination of climate change, waste creation and removal. “Inversion” is defined and its relevance to climate change research, followed by detailed descriptions of projects by the author that examine this exploratory integration. Each project consists of an energy source that reverses its intended use. Examples include creating pollution through green energy to contaminating air through filtering hardware powered by fossil fuels. The works act as a critical reminder of attempts to greenify our planet, why they are pursued, and the energy-wasteful methods employed to reach these solutions.", "ja": "この論文は、環境インバージョンという作品集を詳細に述べており、気候変動、廃棄物の生成と除去に対する批判的検証を提案しています。「インバージョン」は定義され、気候変動研究におけるその関連性が示された後、著者が実施したプロジェクトの詳細な説明が続きます。各プロジェクトは、意図された使用法を逆転させるエネルギー源で構成されています。例として、グリーンエネルギーで汚染を創出したり、化石燃料で動くフィルタリングハードウェアで空気を汚染したりすることが挙げられます。これらの作品は、我々の惑星を緑化しようとする試み、その追求理由、そしてそれらの解決策に至るエネルギー浪費的手法を思い起こさせる重要な警告として機能します。"}, {"v": "", "img": "thumbs/8a7872f2ccae.jpg", "t": "Exploring the Eco-Digital: Performative Sensing with Plants and Data", "a": ["Rewa Wright", "Simon Howden"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616428", "abs": "Artistic practices influenced by philosophical understandings that extend ‘beyond the human’, such as posthuman and post-Anthropocene approaches, partially connect on a qualitative level with ancient understandings of an expanded nature that engulfs both human and nonhuman kin. Preserved in Indigenous epistemes, such as mundefinedtauranga Mundefinedori (Mundefinedori knowledge), this research brings selected aspects of this complex knowledge system into contact with artistic practice generated with networked technologies, to manifest speculative methods of data visualization and signal flow. While there are many different approaches of the eco-digital currently at play, this research looks at practices engaging plants as co-composers. Articulating various situational assemblages that entangle humans, plants, and data, this paper explores theoretical positions that cross-pollinate natural ecology and digital technology. We do this through the prism of two iterative works by the authors: Contact/Sense (2019) and Nga manawataki o te koiora: Biorhythms (2022).", "ja": "芸術的実践は、人間を超える哲学的理解、例えばポストヒューマンやポスト人類世的アプローチに影響されており、これらは人間と非人間の親族関係の両方を包み込む拡張された自然への古代的理解と定性的に部分的に接続しています。先住民の認識体系であるmundefinedtauranga Mundefinedori（Mundefinedori知識）に保存されているこの研究は、ネットワーク技術で生成された芸術的実践と接触させ、投機的なデータ可視化と信号フローの方法を具現化するために、この複雑な知識体系の選択された側面を取り込みます。現在エコデジタル分野でさまざまなアプローチが展開されていますが、本研究は植物を共作家として活用する実践に注目します。人間、植物、データを絡め合うさまざまな状況的アセンブリを明示しながら、本稿は自然エコロジーとデジタル技術を交差させる理論的立場を探求します。これを、著者らの2つの反復作品、Contact/Sense（2019）とNga manawataki o te koiora: Biorhythms（2022）を通じて実証します。"}, {"v": "", "img": "thumbs/7b7b74877804.jpg", "t": "Ghost in the Machine : Discourses with AI", "a": ["Purav Bhardwaj", "Misha Sra"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616429", "abs": "AI systems analyze vast amounts of data, uncover patterns, and make decisions - emulating a semblance of intelligence despite lacking qualia and embodiment that form the basis of the human condition. In this paper, we expound on \"Ghost in the Machine\", an interactive installation that delves into our pervasive tendency to anthropomorphize AI, ascribing human-like qualities, intentions, and even consciousness. Participants engage in dialogue with the AI as it collaboratively materializes the AI's thoughts in moving image and generative sound. The installation attempts to forge embodiment for an amorphous AI, revealing errors in its comprehension, represented by the metaphor of hallucinations.", "ja": "AIシステムは膨大なデータを分析し、パターンを発見し、意思決定を行います――人間の条件の基礎であるクオリアや具現化が欠けているにもかかわらず、知性の類似性をエミュレートしています。本論文では「Ghost in the Machine」というインタラクティブなインスタレーションを詳述し、AIを人間化し、人間らしい特性、意図、さらには意識さえも付与しようとする我々の広範な傾向を掘り下げます。参加者はAIと対話しながら、AIの考えを動く映像と生成音で共同制作します。このインスタレーションは、曖昧なAIに具現化を試み、AIの理解の誤りを「幻覚」というメタファーで表現します。", "tags": ["Anthropomorphism", "Artificial Intelligence", "Simulation"]}, {"v": "", "img": "thumbs/3447bebe65b5.jpg", "t": "Media Interpretation: Revisiting McLuhans' Laws of Media and Ant Farm", "a": ["Rem Rungu Lin", "Kang Zhang"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616424", "abs": "This paper reexamines the work of Marshall McLuhan and Ant Farm, highlighting their enduring relevance for contemporary mediated urbanism and architecture. By exploring their historical context, connections, and influences, the authors provide insights for architects and artists navigating the complex interplay between media, technology, and the built environment. The analysis bridges the gap between historical context and contemporary practice, focusing on the motivations, possibilities, and limitations of media interpretation as a critical and creative practice. The paper addresses the pressing questions concerning the future design of architectural spaces and urban forms, ultimately fostering innovative approaches that challenge conventional design thinking", "ja": "この論文は、マーシャル・マクルーハンとアンティファームの作品を再検討し、現代のメディア化された都市主義と建築に対する彼らの永続的な関連性を強調しています。歴史的文脈、つながり、影響を探求することで、著者はメディア、技術、そして構築された環境との複雑な相互作用をナビゲートする建築家やアーティストに洞察を提供します。分析は、歴史的文脈と現代的実践のギャップを埋め、メディア解釈を批判的かつ創造的な実践としての動機、可能性、限界に焦点を当てています。本論文は、建築空間と都市形態の将来設計に関わる喫緊の質問に取り組み、従来のデザイン思考に挑戦する革新的なアプローチを促進します。", "tags": ["Ant Farm", "Counterculture Movements", "Media Interpretation", "Media Theory", "Mediated Urbanism", "Technology and Culture"]}, {"v": "", "img": "thumbs/a19547f3472a.jpg", "t": "Reflection on Abstract Art through Kandinsky's Teaching: Reflection on Abstract Art through Reconstruction of Kandinsky's Teaching at the Bauhaus", "a": ["Jungah Son", "Marko Peljhan", "George Legrady"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616436", "abs": "Wassily Kandinsky is considered as one of the pioneers of abstract painting in Europe. In this paper, our goal is to develop a user interface that models Kandinsky's analytical drawing process within a computational context to advance research in artificial intelligence and the arts. A user first chooses a photograph from the ObjectNet3D database, objects of which are aligned with the 3D shapes. Using the 3D shape information, the software extracts 2D projection contours. Then, it performs corner detection and finds structural networks. Lastly, the software transforms the photograph into an abstract image based on a student example.", "ja": "ワシリー・カンディンスキーは、ヨーロッパにおける抽象絵画の先駆者の一人とされています。本論文の目的は、人工知能と芸術の研究を進めるために、カンディンスキーの分析的な描画プロセスを計算的文脈でモデル化するユーザインタフェースを開発することです。ユーザはまず、ObjectNet3D データベースから写真を選択します。このデータベースのオブジェクトは 3D 形状と整列しています。3D 形状情報を利用して、ソフトウェアは 2D 投影輪郭を抽出します。その後、コーナー検出を行い、構造的ネットワークを見つけ出します。最後に、ソフトウェアは学生の例に基づいて写真を抽象画像に変換します。", "tags": ["Abstract art", "Analytical drawing", "Image stylization", "Kandinsky"]}, {"v": "", "img": "thumbs/439b365992fb.jpg", "t": "Reimagining Animation Making through Style Transfer", "a": ["Sujin Kim"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616435", "abs": "\"Dissolution” and “Cunabula” are experimental animation projects that explore the potential of artistic style transfer with neural networks in animation filmmaking. The objective is to discover novel production methods using fast, arbitrary, and stroke-adjustable style transfer networks that allow for unconventional technical approaches during the production process and the creation of unique and unexplored aesthetics in moving images powered by deep learning. These projects exemplify a creative approach to leveraging existing neural style transfer techniques to create compelling animations that go beyond mere passive pastiches of certain artistic styles, thereby advancing the aesthetics of contemporary animation.", "ja": "「“Dissolution” と “Cunabula” は、ニューラルネットワークを用いた芸術的スタイル転送の可能性を探求する実験的アニメーションプロジェクトです。目的は、制作過程での非凡な技術的アプローチや、深層学習によって動く映像に独自で未踏の美学を創出できる、迅速で任意かつ筆調整可能なスタイル転送ネットワークを用いて、新しい制作手法を発見することです。これらのプロジェクトは、既存のニューラルスタイル転送技術を活用し、単なる特定の芸術様式の受動的な模倣を超えて、魅力的なアニメーションを創り出す創造的アプローチの例であり、現代アニメーションの美学を前進させます。", "tags": ["Experimental Animation", "Neural Style Transfer"]}, {"v": "", "img": "thumbs/5dd9f01ac478.jpg", "t": "see-saw: A Kinetic Installation that Unfolds in Silence Driven by Liquid Flow", "a": ["Takafumi Morita", "Yasuaki Kakehi"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616434", "abs": "see-saw is a kinetic installation unfolding silently, driven by the behavior of liquid flowing inside the objects. A group of these objects, shaped like seesaws, are aligned. By changing the position of the center of gravity of the liquid inside, each see-saw alters its inclination dynamically. The behavior of liquid is realized using the Electrohydrodynamics (EHD) phenomenon. We generate these movements that appear to depart from conventional physics by electrically manipulating an invisible driving force to move the liquid against gravity. This installation embodies a natural and smooth kinetic aesthetic that blends seamlessly into the surrounding environment through silent movement.", "ja": "see‑sawは、内部を流れる液体の挙動により静かに展開するキネティックインスタレーションです。シーソー形状のオブジェクトが複数並び、液体の重心位置を変えることで各シーソーの傾斜が動的に変化します。液体の挙動は静電流体力学（EHD）現象を利用して実現されます。見えない駆動力を電気的に操作し、重力に逆らって液体を移動させることで、従来の物理法則から離れたように見える動きを生成します。このインスタレーションは、自然で滑らかなキネティック美学を体現し、静かな動きを通じて周囲の環境とシームレスに融合します。"}, {"v": "", "img": "thumbs/5217fe8cc44d.jpg", "t": "The Most Expensive Museum in the World: Three Player Cooperative Game Between VR and PC Platforms Investigating Empathy between Players and Historical Characters.", "a": ["Vojtěch Radakulan", "David Sedláček"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616425", "abs": "The paper describes an art installation based on a local cooperative cross platform VR/PC game for three players. The story is based on the historical story of a nuclear power plant, which was built, but never turned on because of a public referendum. The game mechanics are built upon the interaction of three playable historical characters: engineer, activist, and politician. The main goal was to foster empathy in the players by replaying the game from each character’s perspective. We present the story implementation, custom-made interfaces, physical setup, and an evaluation of recordings from a four-month display in a public gallery.", "ja": "この論文は、3人のプレイヤー向けのローカル協力型クロスプラットフォームVR/PCゲームに基づくアートインスタレーションについて述べています。ストーリーは、建設されたものの住民投票により稼働しなかった原子力発電所の歴史的出来事に基づいています。ゲームメカニクスは、エンジニア、活動家、政治家という3つの歴史的キャラクターを操作することにより構築されています。プレイヤーが各キャラクターの視点からゲームを再体験することで、共感を育むことが主な目的です。私たちは、ストーリーの実装、カスタムインターフェース、物理的セットアップ、そして公共ギャラリーでの4か月間の展示における記録の評価を提示します。", "tags": ["Cooperation between PC and VR", "Crossplatform", "Empathy", "History", "Interactive Games", "Keyboard modification", "Media Art", "Serious Games", "virtual reality", "Virtual reality physical modification"]}, {"v": "", "img": "thumbs/6b7c0a5f6c14.jpg", "t": "“Achi Mukua Experience Space”——A Multi-Player Immersive Experience of Yunnan ICH Dance", "a": ["Siyu Luo", "Shuo Yan"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Papers", "doi": "10.1145/3610591.3616431", "abs": "Increasingly, intangible cultural heritage (ICH) dance is being performed interactively through immersive experiences. However, these experiences often leaving participants isolated and lacking the connection to the cultural context of ICH dances. This project focuses on designing interactive mechanism that combine collaborative multi-players interactions with the collective nature of ICH dance. It explores the advantage of bio-signals as visual feedback in multi-player dance interactions. The project aims to create an immersive social space where participants can be fully immersed in the dance atmosphere and gain a deeper understanding of intangible heritage.", "ja": "増加する無形文化遺産（ICH）ダンスは、没入型体験を通じてインタラクティブに演じられています。しかし、これらの体験はしばしば参加者を孤立させ、ICHダンスの文化的文脈とのつながりが不足しています。このプロジェクトは、協力的なマルチプレイヤーインタラクションとICHダンスの集合的性質を組み合わせたインタラクティブメカニズムの設計に焦点を当てています。バイオ信号を視覚的フィードバックとして活用することの利点を、マルチプレイヤーダンスインタラクションで探ります。プロジェクトは、参加者がダンスの雰囲気に完全に没入し、無形遺産への理解を深めることができる没入型ソーシャルスペースの創造を目指しています。", "tags": ["ICH dances", "Immersive experiences", "Multiplayer"]}, {"v": "", "img": "thumbs/2bac86468f69.jpg", "t": "Glacier’s lament", "a": ["Jiabao Li", "Cooper Galvin"], "c": "SIGGRAPH", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3532837.3534948", "abs": "Glaciers are sentinels of climate change. They are the most visible evidence of global warming today. This series of works embodies the stunning beauty, rapid change, fragility, destructive power, and magnificence of glaciers. At the same time, they challenge the audience with the dramatic, irreversible ecological damages from climate change."}, {"v": "", "img": "thumbs/dadf02e18f15.jpg", "t": "Imagraph", "a": ["Goki Muramoto"], "c": "SIGGRAPH", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3532837.3534947", "abs": "Imagraph is a medium that arbitrates between two primordial \"attitudes\": projecting the images and closing the senses. Participants lie on their backs in a box-shaped bed and shut their eyes. Two pieces of LED display board are suspended above their heads, with optical fibers from each pixel extending to the surface of their eyelids. The video prepared in advance is unilaterally played after the spectral compensation against the \"blood-red\" unique to their own flesh. There, the eyelid becomes the medium for the very object it is trying to block off. The intended colors and their placements are sent, but this in no way implies the triumph of projection over closing. The ritualistic posture forms a distinctive video place filled with the \"tone of the unconscious.\" Just as eye closure deprives the participant of the rejection capability, projection as the arrayed commands also loses its authority. Participants unintentionally derive movements and colors that are not actually presented to them and blend the internally sprung image into the video irreversibly. Both projecting and closing are dysfunctional, and a singular relationship is established between the \"projector\" and the \"projectee.\" What is the freedom each pole has, and where does the \"image\" inhabit?"}, {"v": "", "img": "thumbs/776ef55afc5f.jpg", "t": "Morphogenesis I: coast, shrub, forest", "a": ["Hye Min Cho", "Maru Garcia", "Maura Palacios Mejia"], "c": "SIGGRAPH", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3532837.3534949", "abs": "Soil is the foundation for healthy ecosystems and plays an important role in sustaining life. Soil serves as the baseline for life and provides a variety of ecosystems and societal functions. Despite sustaining the world's demands of food, fibers, and fuels, regulating Earth's air and water quality, and storing greenhouse gases, the value of soil, commonly termed \"dirt\", is often dismissed. This human disconnect from this important source of life, especially in the middle of our climate crisis, needs to be addressed as a vital sustainability practice. Soil health is largely dependent on a diverse thriving microorganism composition. This unseen world of microorganism biodiversity (diversity of life) can be detected, enumerated, and characterized through advancement in molecular methods such as the use of Environmental DNA (eDNA). This tool takes advantage of DNA found in the environment, from organisms in the form of feces, skin cells, pollen, whole cells (microbes) that can then be collected from soil, sediment, water, and even air! We can use the eDNA from the sample to obtain information on the organisms found in soil from microbes, plants, and vertebrates. From the Greek morphê - shape, and genesis - creation, literally means \"the generation of form.\" Morphogenesis is the process that controls the spatial organization and distribution of cells during the development of an organism. An example of this mechanism includes the transformation of a caterpillar to a butterfly, which demonstrates the ability of an organism's cells to self-organize a new body shape. However, morphogenesis also represents coordinated behavior to build and develop the shape, position, and interconnection of a structure, for example, the replicated pattern of termite mounds. Morphogenesis is a transcending concept that captivates the human imagination. Morphogenesis captures the essence of this project, by expressing how soil can be considered a complex living organism in combination with the computational process of neural cellular automata."}, {"v": "", "img": "thumbs/bdc528188179.jpg", "t": "My data body", "a": ["Marilène Oliver", "Scott Smallwood", "Stephan Moore", "J. R. Carpenter"], "c": "SIGGRAPH", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3532837.3534953", "abs": "In My Data Body, the magnetic resonance (MR) scanned body of the artist Marilène Oliver floats prone within a `cloud' of her textual Facebook data. Into the semi-transparent, virtual body are multiple other data corpuses downloaded from social media platforms plotted into cross sections of the body. In the horizontal plane, Mac terminal data is plotted into bone, Google data into muscle and Facebook data into fat. In the vertical plane are plotted data usage agreements. Passwords and logins flow back and forth through veins and arteries, whilst retinal images, dental scans and 3D meshes of organs and bones are suspended within the quantified and datafied body [Lupton 2016; Van Dijck 2014]. There is a continuous stream of text particles that flow through and around the data body that one can swat away or nestle into."}, {"v": "", "img": "thumbs/2f9f884519fa.jpg", "t": "Radiant soma", "a": ["Jayson Haebich", "Eugenia S. Kim", "Alvaro Cassinelli"], "c": "SIGGRAPH", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3532837.3534950", "abs": "The human body has historically been a constant source of fascination in the arts and sciences. With the impact of the COVID-19 pandemic, the debate over the virtues and disadvantages of physical versus virtual bodies has increased dramatically. One of the most difficult attributes of the human body to translate into other forms is the essence of human movement and, by extension, energy. Radiant Soma emphasizes the ephemerality of human movement by visualizing motion capture data with light. The installation of lasers and phosphorescent objects transforms choreography that the original performer can no longer perform into a constant stream of lively spirits."}, {"v": "", "img": "thumbs/dd0196bbfde6.jpg", "t": "Sympathetic wear", "a": ["Junichi Kanebako", "Naoya Watabe", "Miki Yamamura", "Haruki Nakamura", "Keisuke Shuto", "Hiroko Uchiyama"], "c": "SIGGRAPH", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3532837.3534955", "abs": "In situations where people must maintain physical distance from one another and rely on communication through digital screens, we sometimes feel a sense of absence and loneliness. Sympathetic Wear is artwork that supplements communication through digital displays and considers the person on the other side of the network. When we are sad or in pain, the action of having our backs rubbed can provide comfort. Adopting the back as our theme, Sympathetic Wear brings gentle healing to people's minds and bodies by creating a soft tactile sensation on the back that is invisible on screen."}, {"v": "", "img": "thumbs/7407dd53475e.jpg", "t": "Three stage drawing transfer: collaborative drawing between a generative adversarial network, co-robotic arm, and five-year-old child", "a": ["Robert Twomey"], "c": "SIGGRAPH", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3532837.3534954", "abs": "Three Stage Drawing Transfer is an experimental human-robot performance and emerging media arts research project exploring drawing, cognition, and new possibilities for creative, embodied interactions between humans and machines. The work creates a visual-mental-physical circuit between a Generative Adversarial Network (GAN), a co-robotic arm, and a five-year-old child. Building on traditions from experimental performance and collaborative drawing, it extends these with the emergent capabilities of generative neural networks and robotic automation. The live child-robot interaction occurs within the space of a shared sheet of paper, where they together develop a collaborative drawing guided by the GAN's understanding and the child's imagination, resulting in a drawing as artifact and video as documentation."}, {"v": "", "img": "thumbs/b39250b94e20.jpg", "t": "VastWaste", "a": ["Ozge Samanci", "Jennifer Hutson", "Jonathan David", "Wren Gottschalk", "Jack Burkhardt", "Rachel Kantor", "Stephan Moore", "Liza Salvi"], "c": "SIGGRAPH", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3532837.3534952", "abs": "Humans once perceived oceans as boundless, and thus impossible to pollute---until we created the Great Pacific Garbage Patch. The same pattern is now repeating in outer space. VastWaste is a data-driven, projection art installation that illuminates the parallels and interplay between marine pollution and space debris. It can also be experienced in Virtual Reality.", "pos": "50% 30%"}, {"v": "", "img": "thumbs/352b533129fa.jpg", "t": "A Tale of Two Productions: A Christmas Carol On Stage and in VR", "a": ["David Gochfeld", "Alex Coulombe", "Yu-Jun Yeh", "Robert Lester", "Robert Barry Fleming", "Zachary Meicher-Buzzi", "Ari Tarr"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533612", "abs": "During the COVID-19 pandemic, many theatre companies began experimenting with new technologies and ways to bring their work to audiences. As theatres have resumed in-person performances, they are exploring how these new techniques can be incorporated into their productions. Recently one leading regional theatre company produced two versions of A Christmas Carol in parallel - one presented on stage, and the other entirely in virtual reality. They used virtual production tools including real-time motion capture, virtual humans, game engine rendering, and a new platform for multi-user VR experiences. We discuss the process, challenges, and creative decisions behind these shows, with an eye towards informing future theatrical productions.", "ja": "COVID-19パンデミックの間、多くの劇団が新しい技術や作品を観客に届ける方法を試みました。劇場が対面公演を再開する中、これらの新技術を作品に組み込む方法を模索しています。最近、ある主要な地域劇団が『クリスマス・キャロル』を同時に二つの形で制作しました――舞台上で上演されるものと、完全にバーチャルリアリティで行われるものです。彼らはリアルタイムモーションキャプチャ、バーチャルヒューマン、ゲームエンジンレンダリング、マルチユーザーVR体験のための新プラットフォームなどのバーチャルプロダクションツールを使用しました。本稿では、これらのショーのプロセス、課題、創造的決定について論じ、将来の演劇制作に役立つ情報を提供します。", "tags": ["Immersive Theatre", "Real-time Performance Capture", "Virtual Production", "virtual reality"]}, {"v": "", "img": "thumbs/9d2a87c0cd36.jpg", "t": "An Aquarium of Machines: A Physically Realized Artificial Life Simulation", "a": ["Nathan S. Lachenmyer", "Sadiya Akasha"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533388", "abs": "This paper describes the public art installation In Love With The World by artist Anicka Yi, which embodies a complex virtual ecosystem of autonomous agents in a physical space. The agents, called Aerobes, are inspired by the lifecycle of the Aurelia sp. jellyfish, and use artificial life techniques designed by the authors to simulate the behavior of two distinct phenotypes. These agents are embodied in the Tate Modern's Turbine Hall using lighter-than-air soft robotics utilizing helium that can respond to museum visitors through sensors embedded in the space. By creating organic-looking fully autonomous agents that are capable of real-time interaction, we hope to create an experience that causes viewers to question what living with machines might feel like in a speculative far-future, and to imagine an alternative form of artificial intelligence that is neither threatening to humanity nor subservient to it, but exists in an altogether parallel track as a new form of life.", "ja": "この論文では、アーティストのアンカ・イーによる公共アートインスタレーション「In Love With The World」を紹介します。この作品は、物理空間における自律エージェントの複雑な仮想生態系を具現化しています。エージェントは「Aerobes」と呼ばれ、オウムガイ属（Aurelia sp.）クラゲのライフサイクルにインスパイアされており、著者らが設計した人工生命技術を用いて、2つの異なる表現型の行動をシミュレートします。これらのエージェントは、ヘリウムを利用した軽量軟体ロボティクスで構成され、テート・モダンのタービンホールに配置され、空間に埋め込まれたセンサーを通じて来館者に応答します。有機的に見える完全に自律的なエージェントをリアルタイムで相互作用できるようにすることで、観覧者に機械と共に生きることがどのように感じられるかを問いかけ、人工知能が人類にとって脅威でも従属でもなく、全く別の軌道で新たな生命形態として存在する可能性を想像させる体験を創出することを目指しています。", "tags": ["Autonomous Agents", "Behavioral Animation", "interactive installation", "Interactive Robotics"]}, {"v": "", "img": "thumbs/499f45929a3d.jpg", "t": "Below Victory: Subsurface Radar Advances for Creative Digital Heritage", "a": ["Scott Hessels"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533389", "abs": "Recent advances in Ground Penetrating Radar have caused the imaging technology to pivot from a simple construction engineering tool to a valuable new option for archaeology. Newfound abilities to model sound echoes resonating through stone have revealed archeological discoveries where excavation is not possible. Working with a transdisciplinary team, the artist secured a GPR scan of 2,000-year-old Gallo-Roman temple ruins below the plaza of a gothic cathedral in France. The technology's sounding image of the hidden site became a visual language that was explored in a 2-year series of artworks based on the discovery. The art + science research project resulted in data visualizations across many creative media including site-specific public trompe l'oeil, augmented reality, and hundreds of design experiments. Using the GPR dataset as a foundational resource in art-making, the project expanded the interpretation of Digital Heritage. Collectively, the works reinforced the understanding of a site hidden since Antiquity but also considered public non-sites in pandemic times. The advances in this scanning technology proved to be a powerful creative tool to highlight themes of how we protect and understand heritage, how we create public experiences in socially distanced times, and our responsibility to continually reconsider complex history.", "ja": "近年の地中レーダー（GPR）の進歩により、画像技術は単なる建設工学ツールから考古学にとって価値ある新たな選択肢へと転換しました。石を通り抜ける音エコーをモデル化する新たな能力により、発掘が不可能な場所でも考古学的発見が明らかになっています。学際的なチームと協力し、アーティストはフランスのゴシック大聖堂の広場下にある2000年前のローマ・ガロ文明の寺院遺跡のGPRスキャンを確保しました。隠された遺跡の音響画像は視覚言語となり、2年間にわたる作品シリーズで探索されました。この芸術と科学の研究プロジェクトは、現場特有の公共トロンプルイユ、拡張現実、そして数百のデザイン実験など、多様なクリエイティブメディアにわたるデータ可視化を生み出しました。GPRデータセットを芸術制作の基礎資源として使用することで、デジタルヘリテージの解釈が拡張されました。これらの作品は、古代以来隠されていた遺跡の理解を強化しただけでなく、パンデミック時の公共ノンサイトも考慮しました。このスキャン技術の進歩は、遺産を保護し理解する方法、社会的距離を保った時代に公共体験を創出する方法、そして複雑な歴史を継続的に再考する責任というテーマを強調する強力な創造的ツールであることが証明されました。", "tags": ["3D Modelling", "Archaeology", "Art Tech", "Art/Science", "Data Visualization", "Digital Heritage", "GPR", "Ground Penetrating Radar", "Public Art", "scanning", "Sensors", "Site-Specific Art"]}, {"v": "", "img": "thumbs/41ba219fddaf.jpg", "t": "Dissecting My Data Body: How to Know Thyself as a Virtual Reality in the Digital Age", "a": ["Marilène Oliver", "Scott Smallwood", "Stephan Moore", "J. R. Carpenter", "Jonathan Cohn"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533387", "abs": "We are constantly being warned that our personal data is vulnerable, that it is being used and abused by artificial intelligence, giant tech corporations and controlling governments. But do we really understand what \"our data\" consists of and what can be done with and to it? Is it possible to unravel the complex entanglements of data gathering and processing technologies in order to see and understand our data in a meaningful way? My Data Body is a virtual reality (VR) artwork that brings together some of our most personal and sensitive data such as medical scans, social media, biometric and social security data in an attempt to make visible and manipulable our many intersecting data corpuses so that they can be held, inspected, dissected and played with as a way to start understanding and answering these questions. My Data Body has been created as part of the interdisciplinary project Know Thyself as a Virtual Reality (KTVR), a multi-faceted project that explores the ethics and aesthetics of the contemporary \"data body\". KTVR brings together researchers across the arts and sciences, to innovate new creatives methodologies, educational resources and ethical guidelines for working artistically with personal data.", "ja": "私たちは常に、個人データが脆弱であり、人工知能、巨大テック企業、支配的な政府によって利用・濫用されていると警告されています。しかし、私たちの「データ」が何で構成されているか、そしてそれに対して何ができるのかを本当に理解しているでしょうか？データ収集や処理技術の複雑な絡み合いを解きほぐし、意味のある方法で私たちのデータを見て理解することは可能でしょうか？「My Data Body」は、医療スキャン、ソーシャルメディア、バイオメトリクス、社会保障データなど、最も個人的で機密性の高いデータを組み合わせたバーチャルリアリティ（VR）アート作品です。これにより、私たちの多くの交差するデータ体を可視化し、操作可能にし、保持、検査、解剖、遊ぶことができるようにし、これらの質問に答えるための理解を始めることを目的としています。「My Data Body」は、学際的プロジェクト「Know Thyself as a Virtual Reality（KTVR）」の一環として作成されました。この多面的なプロジェクトは、現代の「データ体」の倫理と美学を探求します。KTVRは芸術と科学の研究者を結集し、個人データを芸術的に扱うための新しい創造的手法、教育リソース、倫理指針を革新します。", "tags": ["biometrics", "Imaging Video", "Personal data", "scanning", "Scientific Visualization", "virtual reality", "Visual Effects"]}, {"v": "", "img": "thumbs/8c9cd5566dea.jpg", "t": "Dream Painter: Exploring creative possibilities of AI-aided speech-to-image synthesis in the interactive art context", "a": ["Mar Canet Sola", "Varvara Guljajeva"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533386", "abs": "This paper describes an interactive robotic art installation Dream Painter by the artistic duo Varvara &amp; Mar that deploys artificial intelligence (AI), a KUKA industrial robot and interaction technology in order to offer the audience an artistic interpretation of their past dreams, which are then turned into a collective painting. The installation is composed of four larger parts: audience interaction design, AI-driven multicoloured drawing software, communication with an arm robot, and a kinetic part that is the automatic paper progression following each completed dream drawing. All these interconnected parts are orchestrated into an interactive and autonomous system in the form of an art installation that occupies two floors of a cultural centre. In the article, we document the technical and conceptual frameworks of the project, and the experience gained through the creation and exhibition of the interactive robotic art installation. In addition, the paper explores the creative potential of speech-to-AI-drawing transformation, which is a translation of different semiotic spaces performed by a robot as a method for audience interaction in the art exhibition context.", "ja": "この論文では、芸術デュオのVarvara & Marによるインタラクティブなロボットアートインスタレーション「Dream Painter」を紹介します。本インスタレーションは、人工知能（AI）、KUKA産業用ロボット、インタラクション技術を駆使し、観客の過去の夢を芸術的に解釈し、集合的な絵画へと変換します。構成は、観客インタラクションデザイン、AI駆動の多色描画ソフトウェア、アームロボットとの通信、そして各夢の描画完了に伴う自動紙送りという4つの大きなパートから成り立ち、二階建ての文化センターに設置されたインタラクティブかつ自律的なシステムとして機能します。本稿では、プロジェクトの技術的・概念的フレームワークと、インタラクティブロボットアートインスタレーションの制作・展示を通じて得られた経験を記録します。また、スピーチからAI描画への変換という創造的可能性についても探求し、ロボットが観客との対話手段として異なるセミオティック空間を翻訳する方法を検証します。", "tags": ["co-creative AI", "human-centred interface", "Interactive Art", "latent-space", "Robotic Art", "speech-to-image"]}, {"v": "", "img": "thumbs/12dd455a8aed.jpg", "t": "Erratics on the Road to Wigan Pier: The Creation of TouchAR", "a": ["Chara Lewis", "Kristin Mojsiewicz", "Anneke Pettican"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533611", "abs": "This paper focuses on the augmented reality project TouchAR to reveal creative collaborative approaches the authors took to site, technology, ecology, and gesture in their production of interactive public realm artworks in direct response to the Covid19 pandemic. Informed by the uncanny (re-animation, the double) ontology (affect, sensing embodied encounter) and ecology (speculative fabulation, deep time), the project explores 3D scanning and AR technology as tools for transformation and engagement with ecological deep time; addressing complications involved in offering an embodied experience with AR and as a means of enchantment. The authors will discuss how they use technology to suture analogue and computational art making, explore ideas of touch and engagement with ecology in a technological society and address the deep past, present challenges and possible futures.", "ja": "この論文は、拡張現実プロジェクトTouchARに焦点を当て、著者がサイト、技術、生態系、ジェスチャーに対して取った創造的な協働アプローチを、Covid19パンデミックへの直接的な応答として、インタラクティブな公共領域アート作品の制作において探求するものです。不気味さ（再アニメーション、二重性）と存在論（感情、具象的な遭遇の感知）および生態系（投機的な空想、深い時間）に基づき、プロジェクトは3DスキャンとAR技術を、変容と生態的深い時間への関与のツールとして活用し、ARによる具象的な体験を提供する際の複雑さと、魅了の手段としての役割に取り組みます。著者は、アナログと計算的な芸術制作を結びつける技術の使用方法、テクノロジー社会における生態系とのタッチと関与の概念、そして深い過去、現在の課題、将来の可能性について議論します。", "tags": ["augmented reality", "ecology", "embodiment", "Interaction", "public space"]}, {"v": "", "img": "thumbs/5a607016f9a2.jpg", "t": "FaceType: Crafting Written Impressions of Spoken Expression", "a": ["Kevin Maher", "Fan Xiang", "Liang Zhi"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533385", "abs": "FaceType is an interactive installation that creates an experience of spoken communication through generated text. Inspired by Chinese calligraphy, the project transforms our spoken expression into handwriting. FaceType explores what parts of our spoken expression can be evoked in writing, and what the most natural form of interaction between the two might be. The work is aimed to allow lay audiences to experience emotion, emphasis, and critical information in speech. Further audience reflection about patterns in their expression and the role of unconscious and conscious expression provide new directions for further works.", "ja": "FaceTypeは、生成されたテキストを通じて話し言葉のコミュニケーション体験を創出するインタラクティブなインスタレーションです。中国書道にインスパイアされたこのプロジェクトは、私たちの話し言葉を手書きに変換します。FaceTypeは、話し言葉のどの部分が文字に呼び起こされ得るか、そしてその二つの間で最も自然な相互作用の形は何かを探求します。この作品は、一般の観客がスピーチにおける感情、強調、重要情報を体験できるようにすることを目的としています。観客が自分の表現パターンや無意識・意識的表現の役割についてさらに考えることで、今後の作品に新たな方向性を提供します。", "tags": ["Artistic visualization", "Text visualization", "Visual communication"]}, {"v": "", "img": "thumbs/39ed9b7e822e.jpg", "t": "Field of Leaves: An Interactive Installation Sprouting Leaves Out of Public Money", "a": ["Pedro Silva", "Daniel Lopes", "Pedro Martins", "Penousal Machado"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533683", "abs": "Field of Leaves is an interactive installation that depicts public contracts held in Portugal and their distribution over its five regions and two autonomous regions. The installation presents information about the public contracts available at the online portal of public procurements called Portal Basegov. The installation attempts to advocate the importance and advantages of aesthetics in first-time audience engagement, and how user interaction and hedonic qualities can heighten the user's curiosity and promote more lasting explorations with a visualization.", "ja": "フィールド・オブ・リーブスは、ポルトガルで保有されている公共契約とそれらが5つの地域および2つの自治地域にどのように分布しているかを示すインタラクティブなインスタレーションです。このインスタレーションは、公共調達のオンラインポータルであるPortal Basegovで利用可能な公共契約に関する情報を提示します。インスタレーションは、初めての観客の関心を引く美学の重要性と利点を訴え、ユーザーのインタラクションと快楽的特性がユーザーの好奇心を高め、可視化によるより持続的な探求を促進できる方法を示すことを試みています。", "tags": ["Aesthetics", "Casual Visualization", "embodied interaction", "Portugal Public Contracts"]}, {"v": "", "img": "thumbs/031851dde20f.jpg", "t": "GROUPTHINK: Telepresence and Agency During Live Performance", "a": ["Ali Hossaini", "Oliver Gingrich", "Shama Rahman", "Mick Grierson", "Joshua Murr", "Alan Chamberlain", "Alain Renaud"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533610", "abs": "Live performers often describe \"playing to the audience\" as shifts in emphasis, timing and even content according to perceived audience reactions. Traditional staging allows the transmission of physiological signals through the audience's eyes, skin, odor, breathing, vocalizations and motions such as dancing, stamping and clapping, some of which are audible. The Internet and other mass media broaden access to live performance, but they efface traditional channels for \"liveness,\" which we specify as physiological feedback loops that bind performers and audience through shared agency. During online events, contemporary performers enjoy text and icon-based feedback, but current technology limits expression of physiological reactions by remote audiences. Looking to a future Internet of Neurons where humans and AI co-create via neurophysiological interfaces, this paper examines the possibility of reestablishing audience agency during live performance by using hemodynamic sensors while exploring the potential of AI as a creative collaborator.", "ja": "ライブパフォーマーはしばしば「観客に向かって演奏する」ことを、観客の反応と認識されたものに応じて強調、タイミング、さらには内容をシフトさせることとして表現します。従来のステージングは、観客の目、皮膚、匂い、呼吸、声帯、そして踊りや足踏み、拍手などの動きといった生理的信号を通じて伝達を可能にし、そのうちのいくつかは聞こえる音としても認識されます。インターネットやその他のマスメディアはライブパフォーマンスへのアクセスを広げましたが、従来の「ライブ感」を構成する生理的フィードバックループを消失させます。私たちはこれを、パフォーマーと観客が共有するエージェンシーを結びつける生理的フィードバックループとして定義します。オンラインイベントでは、現代のパフォーマーはテキストやアイコンベースのフィードバックを享受しますが、現在の技術では遠隔観客の生理的反応の表現が制限されています。人間とAIが神経生理学的インターフェースを通じて共同創作する未来のニューロンインターネットを見据え、本論文は血流動態センサーを使用してライブパフォーマンス中の観客エージェンシーを再構築する可能性を検討し、AIを創造的協働者として活用する可能性を探ります。", "tags": ["Artificial Intelligence", "human interaction/interface", "Music", "Performance"]}, {"v": "", "img": "thumbs/f33d0b5d436c.jpg", "t": "In Search of the Plastic Image: a Media Archaeology of Scan Processing", "a": ["Derek Holzer"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3539218", "abs": "Scan processing is an analog electronic image manipulation technology which emerged in the late 1960's, reached its apex during the 1970's, and was made obsolete by digital computing in the 1980's. During this period, scan processing instruments such as the Scanimate (1969) and the Rutt/Etra Video Synthesizer (1973) revolutionized commercial animation and inspired a generation of experimental video artists. This paper presents a media archaeological examination of scan processing which analyzes the history and functioning of the instruments used, what sorts of possibilities they afforded their users, and how those affordances were realized with technology of the era. The author proposes the reenactment of historical media technologies as an investigative methodology which helps us understand the relation of past and present, and details a reenactment of scan processing involving the display of digitally synthesized audio signals on an analog Cathode Ray Tube vector monitor.", "ja": "スキャン処理は、1960年代後半に登場し、1970年代に最高潮に達し、1980年代にデジタルコンピューティングによって時代遅れとなった、アナログ電子画像操作技術です。この期間中、Scanimate（1969）やRutt/Etraビデオシンセサイザー（1973）などのスキャン処理装置は商業アニメーションに革命をもたらし、実験的なビデオアーティストの世代に影響を与えました。本論文では、スキャン処理の歴史と装置の機能、ユーザーに提供された可能性、そして当時の技術でそれらの可能性がどのように実現されたかを分析するメディア考古学的検証を提示します。著者は、過去と現在の関係を理解するための調査方法として歴史的メディア技術の再演を提案し、デジタル合成音声信号をアナログ陰極線管ベクトルモニターに表示するスキャン処理の再演を詳細に述べています。", "tags": ["Aesthetics", "animation", "Computation", "Culture", "heritage", "media archaeology", "sound"]}, {"v": "", "img": "thumbs/1da234e23698.jpg", "t": "KineCAM: An Instant Camera for Animated Photographs", "a": ["Ticha Sethapakdi", "Mackenzie Leake", "Catalina Monsalve Rodriguez", "Miranda J. Cai", "Stefanie Mueller"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533613", "abs": "The kinegram is a classic animation technique that involves sliding a striped overlay across an interlaced image to create the effect of frame-by-frame motion. While there are known tools for generating kinegrams from preexisting videos and images, there exists no system for capturing and fabricating kinegrams in situ. To bridge this gap, we created KineCAM, an open source1 instant camera that captures and prints animated photographs in the form of kinegrams. We present our experience using KineCAM to create a portrait series, and discuss how this type of customizable instant camera platform can create new opportunities for experimental and social photography.", "ja": "キネグラムは、縞模様のオーバーレイをインターレースされた画像上でスライドさせることで、フレームごとの動きを作り出す古典的なアニメーション技法です。既存のビデオや画像からキネグラムを生成するツールは知られていますが、現場でキネグラムを撮影・製作するシステムは存在しません。このギャップを埋めるために、私たちはKineCAMというオープンソースのインスタントカメラを開発し、アニメーション写真をキネグラムの形で撮影し印刷できるようにしました。KineCAMを使用してポートレートシリーズを作成した経験を提示し、このようなカスタマイズ可能なインスタントカメラプラットフォームが実験的かつ社会的な写真撮影に新たな機会をもたらすことについて議論します。", "tags": ["capture", "fabrication", "kinegrams"]}, {"v": "", "img": "thumbs/fc35651307d2.jpg", "t": "The Ghost in The Machine: Digital Stylization and Expressive Re-Materialization of Ancient Ceramics", "a": ["Sharan R. Elran", "Amit R. Zoran"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533609", "abs": "This paper proposes a new perspective on the role of computers in the re-materialization of ancient artifacts, highlighting issues of conservation, self-expression, and authorship in creative processes. Specifically, our approach allows all of the creative spirits (i.e., creative agencies) taking part in the making process—from the ancient makers, to the digital craftsperson, to the making machine itself—to be represented in the final outcome. The paper explores the evolution of our technique through three projects that rely on both digital and traditional making practices. We introduce the notion of a digital spirit, which allows for a holistic and respectful integration of diverse making agencies in a unified hybrid practice.", "ja": "この論文は、古代遺物の再素材化におけるコンピュータの役割に新たな視点を提案し、保存、自己表現、創作プロセスにおける著作権問題を強調しています。具体的には、古代の製作者、デジタル職人、製作機械というすべての創造的精神（すなわち創造的エージェンシー）が最終成果に表現されるようにするアプローチを提供します。本稿では、デジタルと伝統的な製作慣行の両方に依拠した3つのプロジェクトを通じて技術の進化を探ります。デジタルスピリットという概念を導入し、多様な製作エージェンシーを統合的かつ敬意を持ってハイブリッドな実践に統合することを可能にします。", "tags": ["Ceramics", "Digital Craft", "fabrication", "Hybrid"]}, {"v": "", "img": "thumbs/c9517772801d.jpg", "t": "Three Stage Drawing Transfer: Collaborative Drawing Between a Generative Adversarial Network, Co-robotic Arm, and Five-Year-Old Child", "a": ["Robert Twomey"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533614", "abs": "This project creates a visual-mental-physical circuit between a Generative Adversarial Network (GAN), a co-robotic arm, and a five-year-old child. From training images to the latent space of a GAN, through pen on paper to a live human collaborator, it establishes a series of translational stages between humans and non-humans played out through the medium of drawing. Trained on a subset of the Rhoda Kellogg Child Art Collection, the neural network at the center of this piece learns its own representations of these images. The generated results, synthetic children's drawings, are of interest both for being outside of adult conventions and learned expression-like Dubuffet's art brut or Surrealist automatism-and for how they align machine learning with the human act of learning to draw.The project layers many kinds of agency and embodiment: from the thousands of anonymous children who produced the original artwork used as training data, through the co-robot drawing from GAN-generated imagery, to the human child's active perception and graphic response to the robot. These questions of where we search for the other; when we attribute autonomy and intelligence; and why we might wish to escape our human subjectivities speak to core issues in the design and use of AI systems. This project is one attempt to think through those questions in an embodied way.", "ja": "このプロジェクトは、生成的敵対的ネットワーク（GAN）、協調ロボットアーム、そして5歳の子供との間で、視覚‑精神‑物理回路を構築します。訓練画像からGANの潜在空間へ、ペンで紙に描くことからライブの人間協働者へと、ヒトと非ヒトの間の一連の転換段階が、描画という媒体を通じて展開されます。Rhoda Kellogg子供美術コレクションのサブセットで訓練されたこの作品の中心にあるニューラルネットワークは、これらの画像の独自の表現を学習します。生成された結果である合成子供の絵は、成人の慣習から外れたものであること、Dubuffetのアート・ブルートやシュルレアリスムの自動主義に似た学習的表現であること、そして機械学習と人間の描画行為をどのように一致させるかという点で興味深いです。プロジェクトは、多くのエージェンシーと具現化を層にしています：元の作品を提供した何千人もの匿名の子供たち、GAN生成画像から描く協調ロボット、そしてロボットに対する子供の能動的知覚とグラフィック応答です。私たちが「他者」を探すとき、いつ自律性や知性を帰属させるか、そしてなぜ人間の主体性から逃れたいのかという問いは、AIシステムの設計と使用に関わる核心的な問題に関わります。このプロジェクトは、具現的な方法でこれらの問題を考える一つの試みです。", "tags": ["children's art", "creative AI", "embodiment", "human-robot interaction"]}, {"v": "", "img": "thumbs/169e1a59581d.jpg", "t": "Traditional African Dances Preservation Using Deep Learning Techniques", "a": ["Adebunmi E. Odefunso", "Esteban Garcia Bravo", "Yingjie V. Chen"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533608", "abs": "Human action recognition continues to evolve and improve through deep learning techniques. There have been studies with some success in the field of action recognition, but only a few of them have focused on traditional dance. This is because dance actions, especially in traditional African dance, are long and involve fast movements. This research proposes a novel framework that applies data science algorithms to the field of cultural preservation by applying various deep learning techniques to identify, classify, and model traditional African dances from videos. Traditional dances are an important part of African culture and heritage. Digital preservation of these dances in their multitude and form is a challenging problem. The dance dataset was constituted from freely available YouTube videos. Four traditional African dances were used for the dance classification process: Adowa, Swange, Bata, and Sinte dance. Five Convolutional Neural Network (CNN) models were used for the classification and achieved an accuracy between 93% and 98%. Additionally, human pose estimation algorithms were applied to Sinte dance. A model of Sinte dance that can be exported to other environments was obtained.", "ja": "ヒューマンアクション認識は、ディープラーニング技術を通じて進化し続け、改善されています。アクション認識の分野ではいくつかの成功例がありますが、伝統的なダンスに焦点を当てた研究はごくわずかです。これは、特に伝統的なアフリカンダンスが長く、速い動きを伴うためです。本研究は、データサイエンスアルゴリズムを文化保存の分野に適用し、さまざまなディープラーニング技術を用いてビデオから伝統的なアフリカンダンスを識別、分類、モデリングするという新しいフレームワークを提案します。伝統的なダンスはアフリカの文化と遺産の重要な一部です。これらのダンスを多様な形でデジタル保存することは、困難な課題です。ダンスデータセットは、無料で利用可能なYouTube動画から構成されました。ダンス分類プロセスには、Adowa、Swange、Bata、Sinteの4つの伝統的なアフリカンダンスが使用されました。5つの畳み込みニューラルネットワーク（CNN）モデルが分類に使用され、93％から98％の精度を達成しました。さらに、Sinteダンスに対してヒューマンポーズ推定アルゴリズムが適用されました。Sinteダンスのモデルは、他の環境へエクスポート可能な形で取得されました。", "tags": ["Adowa", "Bata", "CNN", "Swange"]}, {"v": "", "img": "thumbs/739585574996.jpg", "t": "Woven Behavior and Ornamentation: Simulation-Assisted Design and Application of Self-Shaping Woven Textiles", "a": ["Elizabeth Meiklejohn", "Felicita Devlin", "John Dunnigan", "Patricia Johnson", "Joy Xiaoji Zhang", "Steve Marschner", "Brooks Hagan", "Joy Ko"], "c": "SIGGRAPH", "y": 2022, "k": "Art Papers", "doi": "10.1145/3533682", "abs": "The class of self-shaping woven textiles are those that undergo a transformation in shape exhibiting three-dimensional behaviors due to the interplay between weave structure and active yarns that shrink, twist or otherwise move during finishing processes such as steaming. When weaving with active yarns to produce dimensional fabrics the unpredictability of the complex interactions involved typically necessitates arduous physical sampling for intentional design and use. Current weaving software, overwhelmingly reliant on 2D graphic depiction of woven fabric, is wholly unable to provide the predictive dimensional appearance of such fabrics that might lead to practical decision making and innovative design solutions. This paper describes an iterative workflow to design self-shaping woven fabrics, from simulation-assisted drafting to the creation of a library of woven behaviors categorized by attributes for seating design. This workflow is then used to inform the design of a new yarn-based simulator as well as to design and fabricate a textile-centric furniture piece in which these woven fabric behaviors and ornamentation are intentionally zoned to the form according to structural, ergonomic and aesthetic considerations.", "ja": "自己変形織物のクラスは、織り構造と収縮、ねじれ、または仕上げプロセス（蒸気処理など）中に動く活性糸との相互作用により、三次元の挙動を示す形状変化を経るものです。活性糸を使用して立体的な布地を織る際には、関与する複雑な相互作用の予測不可能性により、意図的な設計と使用のために骨折的な物理サンプリングが必要となります。現在の織りソフトウェアは、圧倒的に2Dグラフィック表現に依存しており、実用的な意思決定や革新的な設計ソリューションにつながるような、これらの布地の予測的な三次元外観を提供できません。本論文では、シミュレーション支援型ドラフトから座席設計用に属性別に分類された織り挙動のライブラリ作成に至る、自己変形織物を設計するための反復的ワークフローを記述します。このワークフローは、織り布挙動と装飾が構造的、エルゴノミクス的、審美的考慮に従って形状に意図的に配置されたテキスタイル中心の家具作品を設計・製作するために、新しい糸ベースのシミュレータの設計にも活用されます。", "tags": ["Computation", "design", "emergent behavior", "textiles", "Visualization"]}, {"v": "", "img": "thumbs/b75c01d0eaa7.jpg", "t": "Chandra X", "a": ["Inhwa Yeom", "Seogsung Jang"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558419", "abs": "Chandra X is a series of artistic diagnoses on the state of Planetary, implemented as WebXR(2021) and 3D Performative Apparatus-Environment(2022). The series speculates on how the natural environment and biodiversity still functions as a large capital in the near future. Inspecting the multilayers of remote surveillance system powered by virtualreal networks and neo-colonialist interactions, the artwork reimagines the audience's performative engagement as a counterbalance to such system."}, {"v": "", "img": "thumbs/b7410dfd8d5e.jpg", "t": "Digital Being: Thinking of the Stars", "a": ["Taezoo Park"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558420", "abs": "Everything is going digital in our lives. I am looking for an invisible, formless creature born out of a gap of radical change. I call it, \"Digital Being\". I recently discovered a new version, NFT creature that has settled on the abandoned TV over the internet.", "pos": "50% 30%"}, {"v": "", "img": "thumbs/ef33bf013d49.jpg", "t": "Gaia", "a": ["Yunyoung Jang"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558418", "abs": "'Gaia' is an eco game that people can play on the web. The background of this game deals with climate change and pandemics experienced by the planet we live on. In this game, the players will view the enviromental information as they select meals, electricity, and medical treatment related to survival. This button means routine behavior in human survival, but there is a point to look at from a social and ethical point of view. Through the selection of a button, we expose specific environmental research information on global changes such as climate change and pandemics, and make people aware that we are connected. The human-shaped character in the game is also a biological body through which radioactivity, dust, contaminated food, and toxic substances accumulate and pass, as well as a material entity through which industrial systems, power structures, and economic interests compete. The body and entity that collapses and resurrects inside the game is placed on a complex network of harmless gas, barren land, rotten food, a system designed to force you to click, and a social system that turns like a cogwheel by a click button. In the process of appreciating the game, you can imagine the future while watching the environmental research. We can look at the world with games and solve problems from various perspectives. The player's choices determine the Earth's morbidity and temperature. As a result, the number of times the Earth is born is updated, which symbolizes that human influence has the power to destroy the planet. As a result, we feel that human choices are interconnected and dependent on the life activities of humans and non-humans, and as a result, we reflect on our position and responsibility."}, {"v": "", "img": "thumbs/856c902b0011.jpg", "t": "Human-like non-human – HAOS human electrical cognition liberation project Ver 1.0", "a": ["Jiun Ting Lai"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558450", "abs": "The project \"human-like non-human - HAOS human cognition liberation project\" to attempt using electrical perception sensing in the oral region as an addition to the Eight Consciousness defined by Buddhist disciplines and expanding beyond the biological identity of a human."}, {"v": "", "img": "thumbs/ca0654a07c23.jpg", "t": "Illusory Land", "a": ["Xi Wang", "Shaoyu Su", "Liaowei Chen", "Yifan Lin", "Francisco Manuel Barros", "Zao Song"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558428", "abs": "The core idea is that fragments of memory echo through the meta-universe. It is a 360-degree immersive art work using the latest real-time animation technology. It can be displayed in VR or Dome projection. Allowing the audience to immerse themselves in a surreal Oriental landscape fantasy, experience dreams and memories of the past, present, and future growing, changing, disintegrating, and reorganizing in a chaotic meta-universe."}, {"v": "", "img": "thumbs/5b6165d9c2d6.jpg", "t": "Inner self drawing machine", "a": ["Qing Zhang", "Fan Xie", "Yifei Huang", "Yun Suen Pai", "George Chernyshov", "Jing Huang", "Xiongqi Wang", "Jamie A Ward", "Kai Kunze"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558429", "abs": "Besides men and women, people can be neither man nor woman, fluid identity, transgender, and agender. Not only that, in terms of sexual orientation, besides heterosexuals, there are homosexuals, bisexuals, pansexuals, and asexuals as well. However, ignorance and lacking empathetic understanding of those sexual minorities make their lives harsh and suffering. For instance, in the case of transgender people, 28% of them postponed their health care due to discrimination, 19% of them refused medical care altogether, and 28% of them experienced verbal harassment by medical professionals, according to a 2011 national transgender discrimination survey (USA). Unluckily, we are apt to generate a basic understanding of others based on their gender expressions and use such irresponsible and heuristic findings to deal with others. Thus, we decided to create an installation to at least minimize the gap for a moment when the audience can enjoy themselves by watching the drawing performance of their idea portrait (inner-self). Regarding the AI portrait painter, we leverage StyleGAN to generate the continuous gender spectrum of each participant based on their facial features, in which they can choose their ideal gender representation that reflects their inner self the most. Then our AI portrait painter \"draws\" the selected \"self\" on the canvas. In general professional painters can detect and draw the most confident and beautiful us, on the other hand, we tend to exaggerate our flaws and ignore our attractive parts. When the drawing performance finishes, the audience can receive the drawing result as a well-printed portrait simultaneously. The printed portrait also works as a souvenir of participating in our exhibition. Our work aims to raise an empathic understanding of the various sexual minorities for a more inclusive, preferable, and sustainable world."}, {"v": "", "img": "thumbs/3f059edcecce.jpg", "t": "Keep Smiling", "a": ["Varvara Guljajeva", "Mar Canet Sola"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558456", "abs": "Keep Smiling is an online interactive experience in the form of a job interview conducted by an AI agent. The agent asks the participant to smile, to smile even more, and to count objects she/he can see through a nearby window while continuing to smile."}, {"v": "", "img": "thumbs/090fa8d9bb0f.jpg", "t": "Land Enough", "a": ["Bengi Agcal", "Ray Lc", "Ziyou Yin"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558453", "abs": "Land Enough uses the issues of rising sea levels, energy, waste, and diversity in a fictional climate-destroyed future. Each participant was given the role of explorer, architect, scientist, or engineer to create artful technologies in a fictional climate-destroyed future. These post-apocalyptic technologies signal the non-fungibility and fragility of nature."}, {"v": "", "img": "thumbs/622991e52153.jpg", "t": "Lizardians", "a": ["Young Joo Lee"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558442", "abs": "Lizardians is a three-channel 3-D animation that depicts a world in which the human body has been commercialized for mass consumption. The lives of two people unfold synchronously to reveal the consequences of the late-capitalistic system on individuals' freedom, labor, creativity, and authorship."}, {"v": "", "img": "thumbs/3c5ad236b858.jpg", "t": "Modern Rescue 2022ss", "a": ["Yuxi Mao", "Fang Fang", "Tianyou Xue"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558447", "abs": "This work is a virtual catwalk animation based on modern urban diseases, consisting three themes: information leakage, social behavior alienation, and environmental degradation. Taking the catwalk as the form of presentation. This work aims to inspire people to focus on the Sustainable Development Goals by realizing the environmental damage."}, {"v": "", "img": "thumbs/3a64923254fe.jpg", "t": "Nippo-Latin American Land", "a": ["Marita Ibañez Sandoval"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558437", "abs": "The installation consists of an urban/rural Japanese landscape influenced by a Latinx community. Model structures are made of printed photographs, and small screens for seeing details, both part of a bigger archive. In this setting, attendees will be able to see the visual communication of the city."}, {"v": "", "img": "thumbs/63465358663c.jpg", "t": "Origami Tessellations Induced by Growth", "a": ["Tomohiro Tachi", "Junichiro Horikawa", "Daiki Kanaoka"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558440", "abs": "We create a series of origami tessellations by simulating the growth of membranes. The self-organized winkling patterns allow the transformation of one surface into another with a different curvature without stretching or shrinking. Our work demonstrates the universality of the principle of folding in nature, art, and mathematics."}, {"v": "", "img": "thumbs/37d570c28e70.jpg", "t": "People of the Gold", "a": ["Ren Yang"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558436", "abs": "\"People of the Gold\" is a project that reflects on the identity, and history of the early Chinese immigrants in California during the period of Gold Rush. The project consists of multiple archive-looking moving images generated by a machine learning algorithm trained with historical documents. The work is presented in a dimmed room with interface for viewer to browse. The constantly changing portrait photo of people and the \"identity information\" next to the photos are presented. Viewers are invited to browse those files slowly, replicating the experience of browsing historical documents. The project aims to raise awareness and emotions to the history of those people of the gold through exploring the potential of machine learning algorithm in the field of photographic imaging and anthropology studies."}, {"v": "", "img": "thumbs/82c4336a1129.jpg", "t": "Perception of War: AI Data Universe", "a": ["Haein Yoon", "Jungho Kim", "Hyoungin Kim", "Taekyung Yoo"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558435", "abs": "Perception of War is a data art that visualizes human perception data about the Ukraine-Russia war by replacing it with emotions through artificial intelligence technology. Data are collected from SNS media that relay human perception by replacing it with a message. 60,000 images, texts, and latitude data tagged with the Ukraine-Russia War were collected, and the perception inherent in each data was analyzed and classified as emotions through artificial intelligence technology. Each emotion is given a unique visual tactility function such as color, pattern, and texture, and is expressed towards the Ukraine latitude. The human perception left behind in Ukraine is in an aesthetically fascinating and somewhat bizarre form. This is a means of exploring the fragments of war left in the present and in the future, and presents a discourse about heterogeneity in the definition of war."}, {"v": "", "img": "thumbs/824a5623c65f.jpg", "t": "Remembrance: Magma", "a": ["Chanee Choi"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558425", "abs": "Remembrance: Magma is an immersive virtual reality animation addressing the poetics of a mind as it is dying of dementia. Remembrance: Magma incorporates modern tech, cutting-edge research on the aging brain, East Asian crafting aesthetics, and Korean shamanic traditions as it examines the nature of the brain as a sensor that desires data even as it slowly fails. Culturally intersectional, Remembrance explores the poetic and painful processes of memory degeneration."}, {"v": "", "img": "thumbs/c94658fbcd66.jpg", "t": "Repository", "a": ["Weidi Zhang"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558439", "abs": "A VR art experience provides a conceptual response to the issues of data authorship and data oblivion. It visualizes 1945 Twitter posts retrieved from Twitter API under the construction of a server farm with a paper shredder. It questions the possible future of digital heritage."}, {"v": "", "img": "thumbs/0687673b2f8f.jpg", "t": "River Concert", "a": ["Siou-Ming Wu"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558433", "abs": "Have we ever heard the voice of river carefully? We use the technology of speech recognition, including the emotion recognition function to analysis audio samples of underwater recording. So we can hear the underwater sound into a dynamic piece of music and let the river play the music itself."}, {"v": "", "img": "thumbs/3f97c8cd28c3.jpg", "t": "Scope of the Cloud", "a": ["Jooyoung Oh"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558438", "abs": "Scope of the Cloud sets its stage on a floating city in 2051, CLOUD, a city of climate refugees. Each game console sets Planner, Researcher, and the Flightless bird as the main protagonist. In a playful way, the game questions how mobility can affect ecosystems and human lives."}, {"v": "", "img": "thumbs/b020b8c61b22.jpg", "t": "The Emerging Media Art Performance of Eine Kleine Nachtmusik", "a": ["Kyungho Lee", "Yousang Kwon"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558444", "abs": "This performance aims to transform the traditional classical music experience through emerging media technology. Generative visualization will analyze and use not only musicians' audio but also audience-generated noise and ambient sound. This will make the audience's expression part of the performance, and the visual outcomes will become nonfungible experiences."}, {"v": "", "img": "thumbs/0f13615473d7.jpg", "t": "The Patient 05", "a": ["Yi Le"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558427", "abs": "Many assumed that the increased use of modern technology in the workplace would allow mankind to sit back more, yet some people are working longer hours than ever. This series by Axl Le reflects on the role of a modern work environment and how it impacts our life."}, {"v": "", "img": "thumbs/a3dcefe92bf0.jpg", "t": "Voight-Kampff 2.0", "a": ["Fang Fang", "Shuo Yan"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558423", "abs": "\"Voight-Kampff 2.0\" is a reflection on the sustainable development of artificial intelligence technology in the future. Once a machine becomes conscious, would AI stay as a tool or obtain a soul? Would there be a boundary between human and machines?"}, {"v": "", "img": "thumbs/cb890f438d21.jpg", "t": "Wander [001]", "a": ["Yuqian Sun", "Chang Hee Lee", "Chenhang Cheng", "Ali Asadipour", "Ying Xu", "Yihua Li"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558441", "abs": "This is a public art project centred on an AI chatbot called Wander. She can generate interactive fiction based on realworld locations' knowledge graphs. Through public participation, the stories are visualised on an interactive map, a fictional earth chronicle contributed through crowdsourced interactions."}, {"v": "", "img": "thumbs/5231c8fadf87.jpg", "t": "Window", "a": ["Borou Yu", "Jiajian Min", "Mengying Zeng"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558452", "abs": "Window is an interactive multimedia installation that reconstructs the Quarantine experience with point clouds, sound and diary texts. It creates a poetic digital environment, arouses the audience's empathetic feeling together and reflects on the relationship between body and space, the individual and the universe, the physical and the spiritual."}, {"v": "", "img": "thumbs/295d4f7b274c.jpg", "t": "WorldWide StRhyme", "a": ["Minori Manabe", "Wataru Takamine", "Richard Sahala Hartanto", "Reita Maeno", "Kai Fukubayashi"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558448", "abs": "Worldwide StRhyme is an experience that rhymes in many languages by selecting words through stepping forward aiming to blur the boundary of words as sound and meaning. Although the experience is mainly performed by two people, bystanders also have an unprecedented auditory experience."}, {"v": "", "img": "thumbs/46a50acc6f1d.jpg", "t": "Zeroth: The self-awareness sense embodied by facing the coexistence of the physical and virtual bodies in the mirror", "a": ["Ami Miura", "Hiroki Uchida", "Takayuki Kawamura", "Keiichi Zempo"], "c": "SIGGRAPH Asia", "y": 2022, "k": "Art Gallery", "doi": "10.1145/3550470.3558426",

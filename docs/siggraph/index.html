sual interpretations using CLIP embeddings, each embodying an alternative, situated way of seeing that embraces four Colombian artistic traditions: colonial, modern, pre-Hispanic, and street art.This paper details our technical approach: (1) semantic alignment between artworks and ecological layers, (2) LoRA fine-tuning for Stable Diffusion models, and (3) interface design enabling interactive exploration. Inspired by Latin American theorists and concepts of \"digital pluriversality,\" our work seeks to disrupt monolithic narratives of cultural memory.By integrating AI models of CLIP, BLIP, and Stable Diffusion, the project generates an alternative cartography of Colombia where artwork semantics align with ecological layers, and multiple re-imagined interpretations of the MAMBO collection, challenging the homologation of mainstream AI while exploring decolonial approaches to technology. The interactive Web-based artwork can be viewed here.", "ja": "デジタルF(r)ictionsは、コロンビアの領土を芸術的および環境的風景のハイブリッドな二重構造として再構築するインタラクティブなウェブベースのアート作品です。衛星地図を超える新たな領土のフィクションを創出し、コロンビア領土の異なる見方と表現方法の間に意図的な摩擦を生み出します。主流の人工知能（AI）視線による「データ植民地主義」と対比させ、マドリード現代美術館（MAMBO）のコレクションと、さらに3つのコロンビア芸術伝統の作品を用いてStable Diffusionを微調整します。各MAMBO作品をアンカーとして、CLIP埋め込みを使用して4つの異なる視覚的解釈を生成し、植民地、モダン、前ヒスパニック、ストリートアートという4つのコロンビア芸術伝統を体現する代替的で位置づけられた見方を提示します。本稿では、（1）作品と生態層の意味的整合、（2）Stable DiffusionモデルのLoRA微調整、（3）インタラクティブな探索を可能にするインターフェース設計という技術的アプローチを詳述します。ラテンアメリカの理論家と「デジタル多元性」の概念に触発され、本作品は文化記憶の単一的な物語を乱し、AIのモノリシックなナラティブに挑戦しながら、テクノロジーへの脱植民地的アプローチを探求します。CLIP、BLIP、Stable DiffusionのAIモデルを統合することで、作品の意味が生態層と整合し、MAMBOコレクションの再構築された解釈が多数生成される代替的なコロンビアのカートグラフィーを生成します。インタラクティブなウェブベースのアート作品はここで閲覧できます。", "tags": ["AI curation", "Colombia", "f(r)ictions", "multiplicities", "surplus data"]}, {"v": "", "img": "thumbs/0de56c326c69.jpg", "t": "Discipline Together with the Self in Kendo: Exploring \"Qi\" through Mixed Reality and Autoethnography", "a": ["Karen Furuta", "Jingjing Li", "Tatsuki Fushimi", "Yoichi Ochiai"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736776", "abs": "In an era where swords are no longer wielded to kill but to enhance human lives, swordfights are not about confronting the opponent in front of you but facing yourself. At the core of modern-day combat lies the cultivation of virtues such as etiquette, patience, and mental unity—principles similarly embraced in kendo. Resonating with these principles of kendo, we embarked on an exploration of “self,” “sword,” and “qi” in mixed reality. The author served as the model for this digital human and practiced kendo alone in mixed reality using the developed application. This experience of engaging with oneself, the sword, and “qi” has been shared through autoethnography. We hope this documentation contributes to personal growth and the enrichment of spiritual culture in society.", "ja": "近代において、剣は人命を奪うためではなく、人間の生活を向上させるために振るわれます。剣闘は目の前の相手と対峙することではなく、自己と向き合うことです。現代の戦闘の核心には、礼儀、忍耐、精神的統一といった美徳の育成があり、これらは剣道でも同様に重んじられています。剣道の原則に共鳴し、私たちは混合現実における「自己」「剣」「気」の探求に取り組みました。著者はこのデジタルヒューマンのモデルとして、開発したアプリケーションを用いて一人で混合現実の中で剣道を実践しました。この自己・剣・「気」との関わりの経験は自民族誌を通じて共有されています。本稿が個人の成長と社会における精神文化の充実に寄与することを願います。", "tags": ["Autoethnography", "Digital Human", "Kendo", "Martial Arts", "Mixed Reality", "Qi"]}, {"v": "", "img": "thumbs/747b7662f180.jpg", "t": "Floating Strokes: A Spatial Interpretation and Modeling Method of Chinese Calligraphy", "a": ["Troy TianYu Lin", "Boyan Zheng", "Haichuan Lin", "Wen You", "Kang Zhang", "Chen Liang"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736782", "abs": "This paper presents a novel modeling method and a series of artworks that transform 2D Chinese calligraphy into 3D forms, offering a new perspective for understanding and appreciating traditional Chinese calligraphy beyond its conventional 2D representation. Drawing inspiration from the multidimensional nature of the calligraphic formation process and the philosophies of ancient calligraphers regarding the intrinsic depth of calligraphy, we propose a 3D modeling approach of Chinese calligraphy. This method analyzes stroke structures, incorporates volume modeling, and applies parametric optimization to a given 2D calligraphic script. The proposed technique seeks to preserve the original aesthetic essence by capturing the natural flow, spatial depth, structural dynamics, and layering of the calligraphy, while extending its expression into the 3D realm. A series of artworks created through this process have been exhibited, with feedback from both the public and experienced calligraphers indicating the unique value of appreciating traditional calligraphy beyond the original scripts.", "ja": "この論文は、2次元の中国書道を3次元形態に変換する新しいモデリング手法と一連のアート作品を提示し、従来の2次元表現を超えて伝統的な中国書道を理解し鑑賞する新たな視点を提供します。書道の形成過程の多次元的性質と、古代の書家が書道の内在的な深さについて持っていた哲学にインスパイアされ、2次元の書道文字に対して3次元モデリングアプローチを提案します。この手法は、筆画構造を解析し、ボリュームモデリングを組み込み、パラメトリック最適化を適用します。提案された技術は、自然な流れ、空間的深さ、構造的ダイナミクス、層構造を捉えることで、元の美的本質を保持しつつ、表現を3次元領域へと拡張することを目指します。このプロセスで作成された一連のアート作品は展示され、一般の観客と経験豊富な書道家の両方から、元のスクリプトを超えて伝統的な書道を鑑賞する独自の価値があるとのフィードバックが得られました。", "tags": ["Calligraphy"]}, {"v": "", "img": "thumbs/9bca0624a54e.jpg", "t": "Hyborg Agency: Fostering AI Agents through Community Conversations in a Digital Forest", "a": ["Yuqian Sun", "Chenhang Cheng", "Chuyan Xu", "Chang Hee Lee", "Ali Asadipour"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736778", "abs": "This paper presents Hyborg Agency, a computational ecosystem that explores how AI agents can meaningfully coexist with human society through the metaphor of a digital forest. By reimagining AI agents as mechanical deer, mutated from discarded electronics, the project defamiliarizes common perceptions of anthropomorphized AI agents, transforming them into non-human creatures with conversational abilities. The system employs Large Language Models (LLMs) to process community conversations, treating them as nutrients for AI growth, and features a dual-platform structure that connects an immersive 3D environment with Discord, a widely used communication platform. Based on community chats, Hyborgs generate daily summaries of their observations and share them with one another, fostering consistent memories and perceptions of the world. Through thematic analysis of public exhibitions and structured interviews with fourteen experts (seven pairs), we identified three key themes: social expansion in human relationships, language evolution through code-infused communication, and creative engagement through defamiliarized interaction. These findings highlight how AI agents can enrich human social relationships while maintaining transparency about their artificial nature. This work contributes to ongoing discussions on AI participation in society through a speculative scenario: human discourse serves as the foundation for constructing a digital forest that nurtures AI agents. In this virtual forest, humans and AI grow together in a symbiotic relationship, shaping one another and their shared environment, ultimately achieving harmonious coexistence.", "ja": "この論文では、Hyborg Agencyという計算エコシステムを提示し、AIエージェントがデジタル森林というメタファーを通じて人間社会と意味のある共存をどのように実現できるかを探ります。AIエージェントを廃棄電子機器から変異した機械的な鹿として再構築することで、一般的な擬人化されたAIエージェントの認識を転換し、会話能力を持つ非人間的な生物へと変容させます。本システムは大規模言語モデル（LLM）を用いてコミュニティの会話を処理し、それらをAIの成長のための栄養素として扱い、没入型3D環境と広く利用されているコミュニケーションプラットフォームであるDiscordを接続する二重プラットフォーム構造を特徴としています。コミュニティチャットに基づき、Hyborgは日々の観察結果の要約を生成し、互いに共有することで、一貫した記憶と世界認識を育みます。公共展示と14名の専門家（7組）の構造化インタビューのテーマ分析を通じて、3つの主要テーマを特定しました：人間関係における社会的拡張、コードを組み込んだコミュニケーションによる言語進化、そして異化されたインタラクションによる創造的関与。これらの発見は、AIエージェントが人工的な本質を透明に保ちつつ、人間の社会的関係を豊かにできることを示しています。本研究は、AIが社会に参加することに関する継続的な議論に貢献し、仮説的シナリオとして、人間の談話がAIエージェントを育むデジタル森林を構築する基盤となることを提案します。この仮想森林において、人間とAIは共生関係を築きながら互いに成長し、共有環境を形作り、最終的に調和のとれた共存を実現します。"}, {"v": "", "img": "thumbs/ed8de13dc5a4.jpg", "t": "in(A)n(I)mate - AI-Mediated Conversations with Inanimate Objects", "a": ["Avital Meshi", "Adam Wright"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736787", "abs": "in(A)n(I)mate is an interactive AI-driven system that invites participants to speak with objects. The piece showcases an innovative use of GPT’s multimodal feature, through its ability to recognize objects in an image and generate responses in its style. Participants place an object of their choice in front of a black box and engage in conversation with it by pressing buttons, often unaware that GPT is generating the responses. in(A)n(I)mate provokes a discussion about human relationships with inanimate matter, and considers the role of non-human agents in mediating and animating objects.", "ja": "in(A)n(I)mateは、参加者が物と会話することを促すインタラクティブなAI駆動システムです。この作品は、画像中の物体を認識し、そのスタイルで応答を生成するGPTのマルチモーダル機能の革新的な活用例を示しています。参加者は好きな物体を黒い箱の前に置き、ボタンを押してその物体と会話しますが、多くの場合、GPTが応答を生成していることに気づいていません。in(A)n(I)mateは、人間と無生物との関係について議論を呼び起こし、物体を媒介し、活性化する非人間エージェントの役割を考察します。", "tags": ["Artificial Intelligence", "creative AI", "GPT", "Interactive Art", "LLM", "New Media Art"]}, {"v": "", "img": "thumbs/7d86e824033e.jpg", "t": "Learning to Move, Learning to Play, Learning to Animate: a Multimedia Exploration of the More-than-human Intelligence", "a": ["Mingyong Cheng", "Sophia Sun", "Han Zhang", "Yuemeng Gu"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736788", "abs": "This paper presents Learning to Move, Learning to Play, Learning to Animate, a cross-disciplinary performance presenting a narrative where humans, robots, synthetic embodiments, and organic entities interact across multiple layers of reality, reflecting our increasingly hybridized world. Rooted in the conceptual foundation of more-than-human intelligence, we connect our conceptual exploration with the stage design, choreography, and technical system design, blending natural and synthetic elements. The performance critiques anthropocentrism and highlights themes of interconnectedness and shared environments, inviting audiences to reconsider the agency of non-human intelligence and explore the potential of co-creativity across natural and synthetic boundaries.", "ja": "この論文では、Learning to Move、Learning to Play、Learning to Animateという、ヒト、ロボット、合成具象体、そして有機体が複数の現実層で相互作用する物語を提示する学際的パフォーマンスを紹介します。ますますハイブリッド化する世界を反映し、より多様な知性という概念的基盤に根ざし、概念的探求をステージデザイン、振付、技術システム設計と結びつけ、自然と合成要素を融合させます。このパフォーマンスは、人間中心主義を批判し、相互接続性と共有環境というテーマを強調し、非人間的知性の主体性を再考し、自然と合成の境界を超えた共創の可能性を探ります。", "tags": ["Bio-feedback Sonification and Visualization", "Found Object Robotics", "Interactive Multimedia Performance", "More-than-human-world", "Real-time Generative AI Art"]}, {"v": "", "img": "thumbs/db2067457181.jpg", "t": "Multi Layered Autonomy and AI Ecologies in Robotic Art Installations", "a": ["Baoyang Chen", "Xian Xu", "Huamin Qu"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736789", "abs": "This paper presents Symbiosis of Agents, a large-scale installation by artist Baoyang Chen, integrating AI-driven robotic agents within an immersive, reflective environment, foregrounding the delicate balance between machine agency and artist authorship by harnessing emergent behaviors from self-organized AI robotic ecologies as a creative apparatus. This project draws upon the traditions of early cybernetics, rule-based conceptual art, and pioneering robotic art installations, featuring dynamic interactions among robotic arms, quadruped robots, their environment, and the audience. A sophisticated three-tiered “faith system” guides these agents, manifesting at the micro-level through adaptive strategies, at the mesoscopic level via narrative-driven “drives,” and at the macro level with an overarching directive. This architecture enables organic evolution of the robots’ behaviors in response to environmental cues and subtle audience presence, transforming passive spectators into active participants. This project situates itself within a speculative terraforming scenario, against the backdrop of historical and ethical analogies—particularly the exploitation of marginalized laborers—the installation raises critical questions about responsibility in AI-driven societies. Through carefully orchestrated robotic choreography, AI-generated conceptual scripts, and atmospheric effects like responsive lighting and fog, Symbiosis of Agents situates AI not merely as computational tool but as collaborator in a dynamic, evolving creative process. Exhibited internationally, it exemplifies how cybernetic principles, robotic art experimentation, and conceptual-art rule-making can converge, challenging prevailing notions of agency and authorship. By interrogating ethical considerations and exposing emergent storytelling, the work expands possibilities for human–machine collaboration in the ever-evolving domain of contemporary art.", "ja": "この論文は、アーティストの陳宝陽が手掛けた大規模インスタレーション「Symbiosis of Agents」を提示し、AI駆動のロボットエージェントを没入型の反射環境に統合し、機械のエージェンシーとアーティストの著作権との微妙なバランスを前面に出し、自己組織化されたAIロボットエコロジーからの創造的装置としての新興行動を活用しています。このプロジェクトは、初期サイバーネティクス、ルールベースの概念芸術、先駆的なロボット芸術インスタレーションの伝統に基づき、ロボットアーム、四足歩行ロボット、環境、観客間の動的相互作用を特徴としています。洗練された三層の「信念システム」がエージェントを導き、微視的レベルでは適応戦略、メゾスコピックレベルでは物語駆動の「ドライブ」、マクロレベルでは包括的な指令として具現化します。このアーキテクチャは、環境の手がかりや微細な観客の存在に応じてロボットの行動が有機的に進化することを可能にし、受動的な観客を能動的な参加者へと変換します。このプロジェクトは、推測的なテラフォーミングシナリオの中で、歴史的・倫理的類推—特に周辺化された労働者の搾取—を背景に位置付けられ、AI駆動社会における責任について重要な質問を提起します。慎重に編成されたロボット振付、AI生成の概念脚本、応答型照明やフォグといった大気効果を通じて、「Symbiosis of Agents」はAIを単なる計算ツールではなく、動的で進化する創造プロセスにおける協働者として位置付けます。国際的に展示され、サイバーネティクス原理、ロボット芸術実験、概念芸術のルール作成が融合し、エージェンシーと著作権に関する既成概念に挑戦する様子を示しています。倫理的考察を検証し、出現的ストーリーテリングを露呈することで、この作品は現代芸術の絶えず進化する領域における人間と機械の協働の可能性を拡大します。", "tags": ["AI-Driven Art", "Interactive Installations", "Multi-Agent Systems", "Robotics"]}, {"v": "", "img": "thumbs/ca44c31ce08b.jpg", "t": "PoeSpin: A Human-AI Dance to Poetry System for Movement-Based Verse Generation", "a": ["Yihua Li", "Hongyue Chen", "Yiqing Li", "Yetong Xin"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736781", "abs": "This paper presents PoeSpin, a human–AI co-writing system that transforms pole dance movements into poetry. Inspired by pole dance and computational linguistics, this project reimagines dance as a form of embodied poetic creation situated within the traditions of spatial and concrete poetry. Drawing from these traditions, PoeSpin treats physical motion as a generative force in the poetic process. We implemented three movement-to-poetry strategies. Among them, the second approach—embedding pole dance trajectories into a reduced-dimensional semantic space—served as the foundation for a real-time interactive installation. Building on this implementation and user feedback, we also proposed an integrated strategy for future interaction design. Our primary method employs the reduction of dimensionality of word vectors, mapping dance trajectories into a semantic space constructed upon Yeats’s poetic corpus. Rather than merely describing physical movement, the system generates evocative verse that extends beyond literal translation, unleashing creative possibilities that bridge the corporeal and the literary. This work offers both a technical framework for multimodal dance-poetry generation and a critical reframing of pole dance aesthetics, aiming to liberate this art form from prevailing societal dismissive gaze.", "ja": "この論文は、ポールダンスの動きを詩に変換する人間とAIの共同執筆システムであるPoeSpinを提示します。ポールダンスと計算言語学に触発された本プロジェクトは、空間詩や具体詩の伝統の中で、身体的な動きを詩的創造の生成力として再構築します。これらの伝統から着想を得て、PoeSpinは身体的な動きを詩的プロセスの生成力として扱います。私たちは3つの動きから詩への戦略を実装しました。そのうち第2のアプローチである、ポールダンスの軌跡を次元削減された意味空間に埋め込む手法が、リアルタイムのインタラクティブインスタレーションの基盤となりました。この実装とユーザーフィードバックに基づき、将来のインタラクションデザインのための統合戦略も提案しています。主な手法は、単語ベクトルの次元削減を用い、イェーツの詩的コーパス上に構築された意味空間へダンスの軌跡をマッピングすることです。単に身体の動きを記述するだけでなく、文字通りの翻訳を超えて感情的な詩句を生成し、身体性と文学性を橋渡しする創造的可能性を解き放ちます。本研究は、マルチモーダルなダンス・ポエトリー生成の技術的枠組みと、ポールダンス美学の批判的再構築を提供し、この芸術形態を社会的な軽視の視線から解放することを目指しています。", "tags": ["AI Agents", "Digital Avatar", "Generative Poetry", "Human-AI Co-Creation", "Interactive Art Installation", "Motion Capture", "Movement Computing", "Multimodal Interaction", "Real-time Performance System"]}, {"v": "", "img": "thumbs/0ca6972f3305.jpg", "t": "Reimagining Beckett's Not I in Virtual Reality: The MetaHuman as a Digital Double of the Actor", "a": ["Néill O'Dwyer", "Enda Bates", "Nicholas Johnson"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736779", "abs": "This paper explores the reworking of Samuel Beckett’s Not I as a virtual reality (VR) experience using Unreal Engine and MetaHuman technology. The original work, known for its disembodied mouth and rapid-fire monologue, challenges conventional theater staging and produces profound unease in audiences. Adapting Not I for VR interrogates how immersive media can intensify or transform the visceral impact of Beckett’s subtractive dramaturgy. Drawing on arts practice-as-research (PAR) and reflective methods, we examine how the demands of VR technology, audience embodiment, and design choices intersect with Beckett’s textual specificity. We conclude by assessing the project’s significance for contemporary performance studies, as well as implications for future XR interpretations of canonical theatrical works.", "ja": "この論文は、Unreal Engine と MetaHuman テクノロジーを使用して、サミュエル・ベケットの『Not I』をバーチャルリアリティ（VR）体験として再構築することを探求しています。元作は、身体から切り離された口と高速の独白で知られ、従来の演劇舞台設定に挑戦し、観客に深い不安感を与えます。VR 用に『Not I』を適応させることで、没入型メディアがベケットの削減的演劇手法の感覚的インパクトをどのように強化または変容させ得るかを検証します。芸術実践研究（PAR）と反省的手法に基づき、VR 技術の要求、観客の具現化、デザイン選択がベケットのテキスト的特異性とどのように交差するかを検討します。最後に、本プロジェクトが現代パフォーマンス研究にとっての重要性と、正典的演劇作品の将来の XR 解釈への示唆を評価して結論付けます。", "tags": ["Extended Reality", "Immersive Theatre", "MetaHuman", "Not I", "Reflective Practice", "Samuel Beckett", "virtual reality"]}, {"v": "", "img": "thumbs/762304c2857a.jpg", "t": "Speculative AI Re-enactment of the Figurists' Encounters with the I Ching", "a": ["Isaac Joseph Clarke", "Raul Masu", "Theo Papatheodorou"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736780", "abs": "This paper presents a Speculative AI reenactment of the Figurists’ 17th-century encounter with the I Ching. By drawing parallels between traditional divination practices and contemporary AI systems, the work explores interpretive processes, cultural bias, and the historical lineage of predictive devices. The presented artwork uses AI text embeddings to map intersections between I Ching hexagrams and Biblical characters, visualised through a generative diagram that incorporates hand-drawn elements and evolving connections. This project highlights the potential of AI as both a cultural artefact and a creative system, inviting reflection on the interpretive frameworks, and speculative possibilities inherent in AI technologies.", "ja": "この論文は、17世紀のフィギュリストたちと易経との出会いを、スペキュレイティブAIで再現した作品を提示します。伝統的な占い手法と現代のAIシステムとの類似点を描くことで、解釈プロセス、文化的バイアス、予測装置の歴史的系譜を探求します。本作品は、AIテキスト埋め込みを用いて易経の六十四卦と聖書人物との交差点をマッピングし、手描き要素と変化する接続を組み込んだ生成的図式で可視化します。このプロジェクトは、AIを文化的人工物かつ創造的システムとして位置付け、その解釈枠組みとAI技術に内在するスペキュレイティブな可能性についての省察を促します。", "tags": ["Artificial Intelligence", "Divination", "Drawing", "Generative", "heritage"]}, {"v": "", "img": "thumbs/078dc5dc584c.jpg", "t": "Synedelica: Mixed Reality Reimagined", "a": ["John Desnoyers-Stewart", "Noah Miller", "Bernhard E. Riecke"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736777", "abs": "Synedelica reimagines what is possible with immersive technology, providing a new perspective on reality. In this synesthetic mixed reality experience, visuals of the real world are modulated by sound, attuning immersants to the beauty hidden in the seemingly mundane. It brings mixed reality outside, immersing the user in an altered view of reality that encourages them to express themselves creatively and connect with those who surround them. Synedelica evokes new perspectives on the world, encouraging exploration and rekindling childlike wonder.", "ja": "Synedelicaは、没入型テクノロジーで可能なことを再構築し、現実に対する新たな視点を提供します。この共感的混合現実体験では、現実世界のビジュアルが音によって変調され、参加者は一見平凡に見える美しさに感覚を合わせます。混合現実を屋外に持ち込み、ユーザーを現実の変容したビューに没入させ、創造的に自己表現し、周囲の人々とつながることを促します。Synedelicaは世界に対する新たな視点を喚起し、探求を奨励し、子どもの頃のような驚きと好奇心を呼び覚まします。", "tags": ["altered perception", "Audio Visualization", "cyberdelics", "Mixed Reality", "passthrough", "roaming performance", "synesthesia", "virtual reality"]}, {"v": "", "img": "thumbs/d9524e1abc25.jpg", "t": "Talking to the Midnight Broadcast: Reviving 1990s City Memories with AI", "a": ["Tongge Yu", "Fan Xiang"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736791", "abs": "If you could dial into a midnight broadcast from 30 years ago, what would you say? This project explores the potential of artificial intelligence (AI) to reconstruct historical radio broadcasts, focusing on the cultural importance of preserving intangible heritage through sound. Shenzhen’s radio culture in the 1990s, influenced by Hong Kong’s openness to pop culture, shaped a generation of listeners. Inspired by the iconic 1990s Shenzhen midnight radio program, A Break at Service Station, the project revives its host Sophie, a figure beloved for her soothing voice and empathetic presence, as a digital twin with authentic sounds and genuine memories through AI voice cloning and large language models (LLMs). By integrating AI with city memories, the project reimagines a pivotal cultural moment while bridging generational distance—not through nostalgia, but through curiosity about a time of intimate, localized media. It reveals how AI can revive forgotten voices and reshape public memory in a rapidly evolving city.", "ja": "30年前の深夜放送にダイヤルインできたら、何を言いますか？ 本プロジェクトは、人工知能（AI）を用いて歴史的なラジオ放送を再構築する可能性を探求し、音を通じた無形文化遺産の保存の文化的重要性に焦点を当てます。1990年代の深圳のラジオ文化は、香港のポップカルチャーへの開放性に影響され、リスナー世代を形作りました。象徴的な1990年代深圳の深夜ラジオ番組「A Break at Service Station」に触発され、本プロジェクトはそのホストであるソフィーを、AI音声クローンと大規模言語モデル（LLM）を用いたデジタルツインとして、 authentic な音声と本物の記憶で復活させます。AIと都市記憶を統合することで、ノスタルジアではなく、親密で局所的なメディアの時代への好奇心を通じて、重要な文化的瞬間を再構築し、世代間の距離を埋めます。AIが忘れ去られた声を復活させ、急速に変化する都市における公共の記憶を再構築できることを示します。", "tags": ["Artificial Intelligence", "cultural heritage preservation", "human-computer interaction", "radio broadcasting", "urban memory", "voice cloning"]}, {"v": "", "img": "thumbs/59634daf9c76.jpg", "t": "The Posthumous World: Our selves, Our Bodies and a World that Will Continue Without Us", "a": ["Richard Wright"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736790", "abs": "How would our attitudes to death and dying change if we could see how a human body is reabsorbed back into the environment? What kind of visualisation could evoke such a response?The Posthumous World is an interdisciplinary research project about death, dying and our relationship with the planet. At its centre will be a new artwork – a scientifically accurate, visual simulation of a human body being reabsorbed back into the environment after a so-called green burial. The body in question will be the artist's own. Taking the form of a computer animated, durational sculpture, the viewer will see a radical metamorphosis of the corpse and the end of its human identity. The project team is an interdisciplinary group of artists, forensic and taphonomic scientists (the study of decomposition), body visualisation experts and thanatologists (the study of practices of death and dying).This project has potentially far reaching impacts on death literacy, bereavement support, environmental policy and the future of the funeral industry. For the arts it will develop visual languages that can represent complex organic bodies as well as a model of art and science collaboration. For the wider public, it will be used to initiate a deeper conversation about end-of-life choices and the links between the physical and emotional consequences of death.The research is currently in its initial stages with a projected completion date of 2027. This paper describes the context of the project, its aims and implications.", "ja": "死と死に直面する際の私たちの態度は、人間の体が環境に再吸収される様子を見ることができたらどのように変わるでしょうか？どのような視覚化がそのような反応を呼び起こすことができるでしょうか？「ポストヒューマス・ワールド」は、死、死に至る過程、そして私たちと地球との関係についての学際的研究プロジェクトです。その中心には、新しいアート作品—緑の埋葬と呼ばれる方法で環境に再吸収される人間の体を科学的に正確にシミュレートした視覚化—が置かれます。対象となる体はアーティスト自身のものです。コンピュータでアニメーション化された長時間にわたる彫刻の形を取り、観客は死体の急激な変容と人間としてのアイデンティティの終焉を見ることになります。プロジェクトチームは、アーティスト、法医学・分解学の科学者（分解の研究）、体の視覚化専門家、そして死と死に関する実践を研究する死学者（タナトロジスト）からなる学際的なグループです。このプロジェクトは、死に関するリテラシー、喪失支援、環境政策、そして葬儀産業の未来に対して、潜在的に広範な影響をもたらす可能性があります。芸術分野においては、複雑な有機体を表現できる視覚言語を開発し、芸術と科学の協働モデルを構築します。広い一般市民に対しては、終末期の選択肢や死の肉体的・感情的結果と環境とのつながりについて、より深い対話を促すことに利用されます。研究は現在初期段階にあり、完成予定日は2027年です。この論文はプロジェクトの背景、目的、そしてその意味合いを説明します。", "tags": ["death studies", "digital media", "ecology", "environmental studies", "forensics", "taphonomy", "thanatology", "Visual art", "visualisation"]}, {"v": "", "img": "thumbs/53666f7e6671.jpg", "t": "wave2weave: A Procedural Weave Data Generation", "a": ["Tatsuki Hayama", "Kotaro Uchibe"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736783", "abs": "We present a novel method, “wave2weave,” for designing Jacquard weaves. This method allows us to create fabrics with complex shaded patterns and a triple-layering structure. By applying procedural graphics techniques, we generate weave data from waveforms to produce various textures. As a creative application of our method, we propose an approach using noise functions and present a project that combines this technique with traditional Japanese craft, resulting in unique textile works.", "ja": "私たちは、ジャカード織りの設計のための新しい手法「wave2weave」を提案します。この手法により、複雑な陰影パターンと三層構造を持つ布地を作成することができます。手続き型グラフィックス技術を適用し、波形から織りデータを生成して様々なテクスチャを生み出します。創造的な応用として、ノイズ関数を利用したアプローチを提案し、伝統的な日本工芸とこの技術を組み合わせたプロジェクトを提示します。その結果、ユニークなテキスタイル作品が実現します。", "tags": ["computer-aided design", "procedural noise", "weaving"]}, {"v": "", "img": "thumbs/d06a62edbaf8.jpg", "t": "A Dialogue with the Sand", "a": ["Junichi Yamaoka"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765556", "abs": "This installation explores a new relationship between humanity, technology, and nature. Its purpose is to pose a fundamental question to the viewer: where do we draw the line between the human and non-human, the natural and the artificial? The system functions through computer-controlled magnets that manipulate iron sand to draw the AI’s thoughts as six-letter English words on the beach. Sensing the viewer’s presence, questions, and environmental shifts in real-time via microphones and cameras, the AI responds with a single word—a fragment of its thought. This act of writing is itself ephemeral; when the magnetic force ceases, the word dissolves back into the sand, disappearing like a memory washed away by the tide. Each fleeting character drawn in the iron sand becomes a testament to the unique, once-in-a-lifetime dialogue that emerges between the viewer and the environment. The AI’s persona is conceived as a \"terrestrial intelligence\" rooted in place. Its consciousness, formed by learning the collective memory of beaches, including their history and geology, is not of biological origin but is a \"Natural Intelligence\"."}, {"v": "", "img": "thumbs/9978d0fa786d.jpg", "t": "Alternative Past", "a": ["Ziyao Gao", "Teli Ma", "Wei Zeng", "Theodoros Papatheodorou"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765545", "abs": "Image and text productions were once complex tasks that were inaccessible to most people. Today, the rise of generative AI has democratized the ability to alter both text and images. These AI-modified images can influence and even distort human memory, creating and amplifying alternative realities. So, what does it mean to reimagine the past with AI? How will AI interpret and reconstruct human memory, and might it offer comfort or something else?"}, {"v": "", "img": "thumbs/dd77bd0a9703.jpg", "t": "Archive For / In the Future", "a": ["RAY LC", "Sidong Wang", "Shuxin Wang", "Nianhang Du"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765555", "abs": "When we visit museums, we see reconstructions of ancient sites that speak more about why we interpret them this way rather than how they really looked. We build models about an ancient places that we have never been by interpreting history through our own biased lens, imagining their daily lives as if they lived with our own social customs. Our interpretations of the distant past are wrought with speculation and imagination, because every time we bring that record up from memory, we reinterpret them anew in the context of our own biases today. Is this also true for how the future will interpret us? Will they look at us from the lens of a distant future that no longer understands us for who we are today? Will they even speak the same language as us, but rather diverge in motives and priorities so radically that they will fail to recognize us? To show the need for preserving memories and interpretations as part of a collective heritage for the future, we created a physical installation with robot arm that serves as an archive from the future that attempts to remember our present. We used ChatGPT to create personas from history and converted their conversational snippets into a non-human language of the future in the form of robotic movements. The robot has a virtual existence in VRChat, where visitors can engage with the physical archive presence online, showing how the future can choose to remember us through an imagined interactive world living online. This work explores how hybrid physical-digital presence can illustrate our precarious interpretations of the past and present, inspiring us to preserve intangible forms of our current heritage in consideration for continuously changing customs of the future."}, {"v": "", "img": "thumbs/2338c1e540f7.jpg", "t": "Cloud Scripts", "a": ["Kian Peng Ong"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765544", "abs": "Cloud Scripts is a generative art installation, and a conceptual machine that explores the asemic nature of Daoist Cloud Seals as a form of communication between humans and the spiritual world. By extracting a corpus of ‘Cloud Seals’ from Daoist scriptures and training trained on a fine tuned Gen Ai model, the installation generates a series of talismans. These talismans, devoid of specific pictorial meaning, symbolize my desire to engage in a dialogue with the spiritual world. The data and software I create serve as my letter to the spiritual realm, expressed through machines."}, {"v": "", "img": "thumbs/dfbe45b07083.jpg", "t": "Ecovotive Chimeras", "a": ["Clarissa Ribeiro"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765558", "abs": "The project begins with the first ten images retrieved from Google Search of wild animals burned in wildfires across severely affected regions. From these, three chimeras emerge in each of the five continents, from biomes most impacted by fire in North America, South America, Africa, Asia, and Australia, through a process of melting carbonized remains into one another via AI. The algorithmically ranked images—already filtered through machinic logic—are processed through a sequence of generative systems: starting with AI-generated animations created from appropriated photographic material and short text prompts, decomposed into video frames, and then transformed into three-dimensional hybrid forms through AI-based 3D reconstruction. These resulting entities—chimeric, spectral, and ontologically unstable—are materialized via 3D printing in white PLA and accompanied by augmented reality (AR) layers that reveal their internal, data-driven mutations. The bizarre logic of generative AI aesthetics—marked by hallucinated forms, melted boundaries, blurred textures, and indeterminate shapes—becomes a critical dialogue with the visual and biological trauma of wildfire destruction. The dramatic abstraction in generative outputs mirrors the devastation in ecologies like the Amazon biome, Brazil's wetlands, California, the Republic of Congo, Australia, Mongolia, and beyond. The audience is invited to hold these hybrid beings, feel their fragility, and enter—via AR—a liminal zone where emergence, agency, and entropy converge—an ephemeral retreat of continuous becoming"}, {"v": "", "img": "thumbs/a322b165bb8a.jpg", "t": "Generative Tectonics: A Dialogue Between Code and Clay", "a": ["Yuko Ishizu", "Junichiro Horikawa", "Tomohiro Inoue", "Ikumi Noborio", "Haruka Iwami"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765548", "abs": "This project, set against the social backdrop of the declining traditional Japanese architectural tile industry, attempts to fuse computational design with traditional ceramic craftsmanship [Martins, 2016]. Using Houdini, we developed a pipeline that procedurally produces complex, non-repeating tile patterns and fabricates them with a custom clay 3D printer. A core innovation is our two-part color system where an AI model generates palettes from user keywords, and a web-based tool applies the Kubelka-Munk model to calculate precise glaze mixtures. This work is a critical inquiry into authorship and 'making' in the post-human era, and a deep reflection on the disappearing artisanal knowledge within Japan's architectural tile industry. The practice is a collaborative negotiation between the artist's conceptual intention, the machine's probabilistic logic, the model's scientific prediction, and the irreducible alchemy of the kiln. This approach reveals how digital technology can serve as a new paradigm for preserving and reactivating tacit knowledge inherent in traditional crafts, contributing to a \"Generative Future\" where heritage skills are revitalized through technological collaboration."}, {"v": "", "img": "thumbs/faa7a712459b.jpg", "t": "Guài: Generative Myths of Machine Perception", "a": ["Monica Lim", "Mindy Meng Wang", "Jingcheng Wang", "Mel Huang Buntine", "Andrew Mahisa Halim", "Zhengzi Jiang", "YuHin Li", "Adelaide Genay"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765543", "abs": "Guài is an interactive mixed reality installation that challenges dominant narratives around artificial intelligence (AI), identity, and cultural epistemology. Drawing on the mythological bestiary of the Chinese classic Shan Hai Jing (“Classic of Mountains and Seas”), Guài uses AI to analyse biometric attributes and match participants to fantastical monsters. Each participant is immersed in a personalised soundscape, generated from their biometric data and combining sonic storytelling with contemporary data-driven profiling. Through a body tracking game, Guài invites participants into a fluid cycle of “continuous becoming”, self-perception, transformation, and confrontation, mirroring how generative systems perpetually reshape identity and agency. The installation stages a tension between ancient and algorithmic modes of prediction, offering critique of the opaque logic behind AI and its reproduction of normative bias, while proposing speculative, non-Western modes of being and knowing. In doing so, Guài embodies a critical, mythopoetic response to the cultural and technological forces shaping our generative futures."}, {"v": "", "img": "", "t": "Hold-Me-Tight", "a": ["Rose Ansari"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765557", "abs": "HOLD-ME-TIGHT is an interactive robotic installation that examines how touch and agency are shaped by human-robot contact. Two wall-mounted robotic arms are positioned across a corner. Participants engage in two modes: a solo mode, in which a visitor uses a handheld controller to adjust the reach and grip of both arms around their own body, and a duo mode, in which one person stands between the arms while a partner operates the controller. The system emphasizes legible, bounded motion that communicates intent and maintains safety through speed limits, soft-grip trajectories, and collision-aware envelopes. Conceptually, the work proposes a model of programmed tenderness—calibrated kinematics that support careful, optionally reciprocal contact while foregrounding user consent and control. Technically, the installation uses microcontroller-driven actuators with end-effector rotation and grip mapped to a gamepad, allowing expressive yet constrained movement suitable for public exhibition. We describe design rationales, controller mappings, and evaluation criteria for comfort and perceived trust, and we outline guidelines for curating safe, comprehensible encounters with robotic embodiments in galleries and labs. HOLD-ME-TIGHT contributes to research-through-design in Human- Robot Interaction by offering a reproducible interaction grammar and safety pattern set for intimate, on-skin robotic contact."}, {"v": "", "img": "thumbs/ca9abc255055.jpg", "t": "Machine Civilization", "a": ["Yixiong Wang", "Jia-Qi Shi", "Hourun Wang", "Yufeng Zeng", "Chen Liang"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765549"}, {"v": "", "img": "thumbs/972f3f1f5df3.jpg", "t": "Machine Dreaming", "a": ["Aileen Ng"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765553"}, {"v": "", "img": "thumbs/02eced300161.jpg", "t": "Neural MONOBLOC Black", "a": ["Immanuel Koh"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765552", "abs": "Neural MONOBLOC Black is a series of 8 furniture pieces generated directly in 3D with a custom fine-tuned (dreambooth) prolificDreamer model and fabricated in an artisanal way with 100% upcycled wood. It expresses the notorious 'Janus problem' of non-3D-aware text-to-3D generative models as a continuous form of becoming and mirroring."}, {"v": "", "img": "thumbs/f57d60f210ca.jpg", "t": "On / Off", "a": ["Suxuan Jiang", "Ning Ding"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765547", "abs": "On / Off is an interactive installation composed of 4,000 vintage mechanical switches arranged into tunnel-like modular panels. The piece materializes binary logic as a tactile, performative environment: audience interactions produce emergent combinations of image, light, and sound. Specific switch groups map to conceptual datasets (24 red switches map to ImageNet [Deng et al. 2009]; 266 green switches encode the estimated number of atoms in the universe), while the remainder trigger non-semantic sounds, pointing toward the unknown. The work investigates the tension between deterministic systems and embodied human agency—asking what is revealed when computation becomes touchable."}, {"v": "", "img": "thumbs/3379dce061d9.jpg", "t": "Orbital Oscillation", "a": ["Tobias Klein", "Pok Yin Victor Leung"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765546", "abs": "Orbital Oscillation is a kinetic sculpture exploring the phenomenology of time through the imperceptible actuation of a hand-blown glass object. The work presents a glass sphere rolling in slow, deliberate orbits on a minimalist table, its motion appearing autonomous yet precisely orchestrated by hidden robotic mechanisms beneath the surface. This concealment of technical agency—achieved through silent tilting actuators, real-time feedback control, and load-cell sensing—creates a perceptual tension: viewers witness motion without causality, inviting reflection on the relationship between visibility, agency, and expectation."}, {"v": "", "img": "thumbs/9dec7e8eb045.jpg", "t": "Passengers", "a": ["Xuanyang Huang", "Wei Huang"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765554"}, {"v": "", "img": "thumbs/3b77673a2b57.jpg", "t": "Pla-tsugi: Terrain as Fracture", "a": ["Akio Harada"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765551", "abs": "Pla-tsugi: Terrain as Fracture reimagines fracture not as loss but as a generative condition. A stone collected from the Rokko Mountain Range (Kobe, Japan) is regarded not as an isolated object but as a fragment once belonging to a continuous terrain. Through 3D scanning, the stone's geometry is digitally aligned with topographic data from Japan's Geospatial Information Authority [Geospatial Information Authority of Japan (GSI), 2024], repositioning the fragment within a larger geological context. Mixed Reality (MR) tools—Meta Quest 3 and Gravity Sketch—were employed to design connective forms conceived as poetic sutures rather than structural joints, emphasizing gestures of care over closure. Materialized through PLA-based 3D printing, these sutures merge with the stone, producing hybrid works where natural matter and digital reconstruction intersect. In exhibitions, viewers are invited to cradle palm-sized fragments, transforming spectatorship into intimate participation. For international presentations, where transporting the original stone is not possible, high-resolution replicas are used to preserve tactile immediacy.This work belongs to the “Pla-tsugi” series, a neologism combining “plastic” and kintsugi (the Japanese art of ceramic repair with gold) [Harada, 2024]. It extends the Japanese repair philosophy from vessels to environments, proposing repair as an act of reconnection between humans, materials, and landscapes."}, {"v": "", "img": "thumbs/198245ca6cec.jpg", "t": "Secret Communication System and Cola Tablets", "a": ["Elico Suzuki"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765550", "abs": "This artwork reimagines the unrealized inventions of Hollywood actress and inventor Hedy Lamarr, using generative AI and 3D printing to speculate on women’s contributions to science and technology that have been historically overlooked due to gender bias."}, {"v": "", "img": "thumbs/48e2674b686b.jpg", "t": "VICINO. Generative expressions of proximity, rhythm, and unspoken connections", "a": ["Bin Cheng", "Zi Ye", "Haoran Rui", "Mirna Zordan"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3757368.3765559", "abs": "VICINO (Italian for “close to”) investigates the fading role of human contact in an age of constant communication yet rare connection. Inspired by the neuroscience of affective touch, the work offers a space where interpersonal connection is made perceptible again through embodied interaction. As participants hold hands while the other hand remains grounded on conductive surfaces, the system captures nuanced bioelectrical signals coming from their hearts. Each moment of sustained contact triggers the growth of a visual tree, with branches and heartbeat-linked pulses blooming in shared silence. Neither a spectacle nor a tool, VICINO becomes a quiet interface for sensing one another’s presence outside verbal expression. The project emphasizes the poetic and relational potential of human proximity, turning bodily gestures into visual languages of empathy and resonance. It encourages audiences to slow down, reach out, and reimagine how connection can be felt in invisible, physiological ways."}, {"v": "", "img": "thumbs/57d825e22055.jpg", "t": "\"Is This Your True Intention to Participate?\" — Simulated Interrogation and Hidden Control in an Agent-Driven Installation", "a": ["Yuyang Jiang", "Luwen Yu", "Jia Sun", "Jiashun Chen", "Pui Wa Chau", "Pan Hui"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767622", "abs": "As crime becomes increasingly technology-driven and complex, questions of agency and moral responsibility demand renewed scrutiny. Drawing on cultural criminology and art psychology, this project examines how AI-driven systems can operate simultaneously as tools of introspection and mechanisms of control. Informed by case studies and professional interviews, we created the Interrogator — a series of interactive artworks employing affective computing methods such as facial expression recognition and conversational analysis. Across two exhibitions, the artworks immersed visitors in interactive, technology-driven encounters that encouraged self-awareness and reflection on their own actions and agency. This project underscores the potential of interactive art to transform emerging technologies into sites of critical thinking on agency and responsibility.", "ja": "犯罪がますます技術主導で複雑化する中、主体性と道徳的責任に関する疑問は新たな検証を必要としています。文化犯罪学と芸術心理学に基づき、本プロジェクトはAI駆動システムが内省のツールでありながら同時に制御のメカニズムとして機能し得る方法を検証します。ケーススタディと専門家インタビューに基づき、感情コンピューティング手法（顔表情認識や会話分析など）を用いたインタラクティブアート作品「インタロゲーター」を作成しました。二つの展示を通じて、作品は来場者を技術駆動のインタラクティブな体験に没入させ、自己認識と自身の行動や主体性に対する省察を促しました。本プロジェクトは、インタラクティブアートが新興技術を主体性と責任に関する批判的思考の場へと変換する可能性を強調しています。", "tags": ["affective computing", "Agency", "Cultural Criminology", "Interactive Art", "Participation"]}, {"v": "", "img": "thumbs/af7b73778af8.jpg", "t": "(Un)Natural Language: An Art Software Identifies Potential Ecological Threats in Documents", "a": ["Peijing Mou"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767611", "abs": "This paper introduces (Un)Natural Language, an artistic computational system that examines how words shape ecological narratives, detecting potential ecological threats in government water-related project documents. Weaving together machine learning, environmental activism, and linguistics, the system offers a new analytical lens for interpreting public documents, uncovering hidden narratives of economic expansion and extractivism. Through a custom-labeled dataset and a fine-tuned BERT model, it reveals and visualizes patterns of pro-growth and ecologically detrimental discourse. Developed into an interactive online archive and installation series, the project reclaims computation as a space for reflection rather than control—inviting viewers to rethink the language shaping our ecological futures.", "ja": "この論文では、（Un）Natural Languageという芸術的計算システムを紹介し、言葉が生態学的ナラティブを形成する方法を検証し、政府の水関連プロジェクト文書に潜む潜在的な生態学的脅威を検出します。機械学習、環境活動主義、言語学を組み合わせたこのシステムは、公共文書を解釈する新たな分析レンズを提供し、経済拡大と抽出主義の隠れたナラティブを明らかにします。カスタムラベル付けデータセットと微調整されたBERTモデルを用いて、成長志向で生態学的に有害な言説のパターンを検出し、可視化します。インタラクティブなオンラインアーカイブとインスタレーションシリーズとして開発されたこのプロジェクトは、計算を支配ではなく反省の場として再定義し、観客に私たちの生態的未来を形作る言語を再考させます。", "tags": ["Art-based Research", "Degrowth", "Ecolinguistics", "machine learning", "Net Art"]}, {"v": "", "img": "thumbs/50ef408800a8.jpg", "t": "AB123C: Distortion-Entangled Bodies in the Al-gorithmic Age", "a": ["Zhihao Yao", "Hanxuan Li", "Shiqing Lyu", "Xuezhu Wang", "Yao Lu", "Beituo Liu", "Xiwen Yao", "Haipeng Mi"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767612", "abs": "This paper presents the robotic installation AB123C, an information evolution system composed of five interacting robotic agents. Rather than preserving informational fidelity, the system stages distortion as a structural principle—a generative condition through which information acquires form. As descriptive content circulates across a chain of machines, it undergoes semantic drift, structural fragmentation, and emergent recomposition. These transformations do not reflect malfunction, but express the entangled ontology of mediated systems. By integrating algorithmic indeterminacy, material reconfiguration, and environmental perturbation, the installation visualizes how meaning arises through iterative misalignment. Within this machinic ecology, truth is not preserved—it is enacted, shaped through continuous entanglement, differential deferral, and distributed agency.", "ja": "この論文は、情報進化システムであるロボットインスタレーションAB123Cを提示します。これは5つの相互作用するロボットエージェントで構成されます。情報の忠実度を保つのではなく、システムは歪みを構造的原理として設定します—情報が形を獲得する生成的条件として機能します。記述的内容が機械のチェーンを通じて循環するにつれて、意味的漂流、構造的断片化、そして新たな再構成が起こります。これらの変換は故障を示すものではなく、媒介システムの絡み合った存在論を表現しています。アルゴリズム的不確定性、物質的再構成、環境的摂動を統合することにより、インスタレーションは意味が反復的な不整合を通じてどのように生まれるかを可視化します。この機械的エコロジーの中で、真実は保持されるのではなく、継続的なエンティングルメント、差異的遅延、分散されたエージェンシーを通じて実行され、形作られます。", "tags": ["Information transmission", "Installation design", "Robot art"]}, {"v": "", "img": "thumbs/7bcc8003b504.jpg", "t": "Airy: Reading Robot Intent through Height and Sky", "a": ["Baoyang Chen", "Xian Xu", "Huamin Qu"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767602", "abs": "As industrial robots move into shared human spaces, their opaque decision making threatens safety, trust, and public oversight. This artwork, Airy, asks whether complex multi agent AI can become intuitively understandable by staging a competition between two reinforcement trained robot arms that snap a bedsheet skyward. Building on three design principles-competition as a clear metric (“who lifts higher?”), embodied familiarity (audiences recognize fabric snapping), and sensor to sense mapping (robot cooperation or rivalry shown through forest and weather projections)-the installation gives viewers a visceral way to read machine intent. Observations from five international exhibitions indicate that audiences consistently read the robots’ strategies, conflict, and cooperation in real time, with emotional reactions that mirror the system’s internal state. The project shows how sensory metaphors can turn a black box into a public interface.", "ja": "産業用ロボットが人間と共有する空間に進出するにつれ、その不透明な意思決定は安全性、信頼、公共の監視を脅かします。この作品「Airy」は、二つの強化学習ロボットアームがベッドシーツを空に向かってスナップさせる競争を演出し、複雑なマルチエージェントAIが直感的に理解可能かどうかを問います。三つの設計原則—競争を明確な指標（「どちらが高く持ち上げるか？」）として、身体的な親しみやすさ（観客が布がスナップすることを認識）、センサーと感覚のマッピング（ロボットの協力または競争を森林や天候の投影で示す）—に基づき、このインスタレーションは観客に機械の意図を直感的に読む方法を提供します。五つの国際展示からの観察は、観客がリアルタイムでロボットの戦略、対立、協力を一貫して読み取り、システムの内部状態を反映した感情的反応を示すことを示しています。このプロジェクトは、感覚的メタファーがブラックボックスを公共インターフェースに変える方法を示しています。", "tags": ["Artistic Robotics", "Competition", "Explainable AI"]}, {"v": "", "img": "thumbs/2e0976d1f3b7.jpg", "t": "Any Girl Can Be Glamorous: Recasting a Woman’s Legacy of Science History in Haunted Media.", "a": ["Elico Suzuki"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767619", "abs": "This paper examines Mercurius - the Case of Hedy Lamarr (2025), which employs Visible Light Communication to reinterpret telecommunication technology as a medium for creative expression. This art installation, which was presented in the solo exhibition Any Girl Can Be Glamorous, centers on the life of Hedy Lamarr, Hollywood actress and co-inventor of frequency-hopping technology. Frequency hopping shifts radio frequencies to prevent jamming and interception. Using the framework of ‘Haunted Media,’ this piece brings to light the hidden history of women in science and technology. It transforms archival audio into a series of flickering light signals, speaking the language of signal, secret, and transmission found in Lamarr’s work. The audience, now an active receiver, encounters a layered historical narrative that interweaves wireless communication technology with Lamarr’s story, whose long-overlooked contributions form the very foundation of this media art installation. By analyzing its conceptual framework, technical implementation, and audience experience, I demonstrate how Visible Light Communication can function as research-based art.", "ja": "この論文は、可視光通信を用いてテレコミュニケーション技術を創造的表現の媒体として再解釈する作品「Mercurius - the Case of Hedy Lamarr（2025）」を検討する。このアートインスタレーションは、ソロ展「Any Girl Can Be Glamorous」の中で提示され、ハリウッド女優で周波数ホッピング技術の共同発明者であるヘディ・ラマーの生涯に焦点を当てている。周波数ホッピングは、ジャミングや盗聴を防ぐために無線周波数を変える技術である。『Haunted Media（幽霊メディア）』の枠組みを用いることで、この作品は科学と技術における女性の隠れた歴史を浮き彫りにする。アーカイブ音声を点滅する光信号の連続に変換し、ラマーの研究に見られる信号・秘密・送信という言語を語る。受動的な観客は、現在は能動的な受信者となり、無線通信技術とラマーの物語が交錯した層状の歴史的ナラティブに出会う。長らく見過ごされてきた彼女の貢献が、このメディアアートインスタレーションの基盤を形成している。本稿では、概念的枠組み、技術的実装、観客体験を分析し、可視光通信が研究ベースのアートとして機能し得ることを示す。", "tags": ["Audio Visualization", "Communication Technology", "Feminism", "Frequency Hopping", "Haunted Media", "Hedy Lamarr", "Installation Art", "Light Art", "Research-based Art", "Sound Art", "Visible Light Communication", "Women’s Contributions"]}, {"v": "", "img": "thumbs/55c9fc03b8fa.jpg", "t": "Becoming Mole with \"FeltSight\": Hyper-sensitizing the Surrounding through Mixed Reality Haptic Proximity Gloves", "a": ["Danlin Huang", "Botao Amber Hu", "Dong Zhang", "Yifei Liu", "Takatoshi Yoshida", "Rem RunGu Lin"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767605", "abs": "FeltSight is a mixed reality sensory-substitution experience that reimagines human perception through an alternative tactile umwelt, inspired by the star-nosed mole’s unique tactile navigation. Users engage in meditative wandering, guided by extended-range haptic sensing and subtle visual cues. The system features a pair of wearable haptic gloves with high-precision vibrotactile actuators on each finger, driven by audio-responsive patterns. These actuators re-sensitize the sense of touch and simulate material textures, enabling users to \"feel\" environmental surfaces as if their fingertips can tele-touch surrounding objects at a distance. The mixed reality headset provides a deliberately subtle \"reduced reality,\" showing nearby objects as dynamic point clouds that serve as a \"short-term perceptual memory,\" visualizing touched textures on surrounding surfaces. By shifting focus from visual to tactile perception, FeltSight challenges ocularcentric sensory hierarchies and elevates touch as a way to perceive the world. This approach invites users to experience the umgebung—the world that exists but typically goes unperceived—through substituted perception, exemplifying tentacular thinking for more-than-human awareness.", "ja": "FeltSightは、ミミズクモグサの独特な触覚ナビゲーションに触発された代替触覚ウムヴェルトを通じて、人間の知覚を再構築する混合現実感覚置換体験です。ユーザーは拡張範囲の触覚センシングと繊細な視覚キューに導かれ、瞑想的な放浪を行います。このシステムは、各指に高精度の振動触覚アクチュエータを備えたウェアラブルハプティックグローブのペアを特徴とし、音声応答パターンによって駆動されます。これらのアクチュエータは触覚感覚を再感作し、素材の質感をシミュレートし、指先が遠距離で周囲の物体に「テレタッチ」できるかのように環境表面を「感じる」ことを可能にします。混合現実ヘッドセットは意図的に繊細な「縮減現実」を提供し、近くの物体を動的な点群として表示し、これが「短期知覚記憶」として機能し、周囲の表面上の触れた質感を可視化します。視覚から触覚への焦点シフトにより、FeltSightは眼中心的な感覚階層に挑戦し、触覚を世界を知覚する方法として高めます。このアプローチは、通常は知覚されないが存在する世界—ウムベルトゥング—を代替知覚を通じて体験させ、人間以上の認識のための触覚的思考を例示します。", "tags": ["Active Sensing", "Augmented Humans", "Augmented Virtuality", "Bio-inspired Design", "Haptics", "Mixed Reality", "More-Than-Human Design", "Sensory Substitution", "Star-nosed Mole", "Tactile Experience", "Vibrotactile Actuators"]}, {"v": "", "img": "thumbs/02c19e61178c.jpg", "t": "City of Sparkles: Embodying Cityscape of Human Memories", "a": ["Botao Amber Hu"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767604", "abs": "How might an artificial life form perceive our city? \"City of Sparkles\" is an interactive VR data visualization experience where participants embody an AI-based artificial life exploring a cityscape of vast human memory fragments. Participants fly over an artistic digital twin of New York City using bare-handed gestures. Each \"sparkle\" represents a geo-tagged tweet collected from X (Twitter) spanning years. Colors, motion, and visual effects reflect the emotional tone of these tweets as they float above the photogrammetry-based city model. The experience serves as experiential storytelling of the speculative fiction \"Composable Life,\" where participants are situated in the perspective of Zoe—a protagonist artificial life inhabiting the \"Mnemosyne Sea,\" a vast ocean of human memory fragments scattered across social media. This project invites reflection on how an immortal artificial life might perceive our cities and memories. It explores using non-fictional, real-world data to tell a fictional story from a non-human perspective, stimulating dialogue about future human-AI relationships.", "ja": "「City of Sparkles」は、人工生命が私たちの街をどのように認識するかを探るインタラクティブなVRデータ可視化体験です。参加者はAIベースの人工生命を体現し、膨大な人間の記憶断片の都市景観を探索します。参加者は裸の手のジェスチャーで、ニューヨーク市の芸術的なデジタルツイン上を飛び回ります。各「スパークル」は、X（Twitter）から収集されたジオタグ付きツイートを表し、何年にもわたるものです。色彩、動き、視覚効果は、これらのツイートの感情的トーンを反映し、写真測量に基づく都市モデルの上に浮かび上がります。この体験は、投機的フィクション「Composable Life」の体験的ストーリーテリングとして機能し、参加者は「Mnemosyne Sea」という人間の記憶断片が散らばる広大な海に住む人工生命Zoeの視点に置かれます。このプロジェクトは、不死の人工生命が私たちの都市や記憶をどのように認識するかについての省察を促します。実際のデータを用いて非人間的な視点から架空の物語を語り、未来の人間とAIの関係について対話を刺激することを目的としています。", "tags": ["Experiential Futures", "Flying Locomotion in VR", "Geolocation", "Interactive Virtual Reality", "More-Than-Human Design", "Science Fiction", "Social Media", "Speculative Design", "Twitter Sentiment", "Urban data visualization"]}, {"v": "", "img": "thumbs/4f70e9b4dd37.jpg", "t": "Cocktail Responsive Interactive Avatar, CRIA: An Interactive Art Installation of Digital Human in Moody Scenario", "a": ["Ronghua Cai", "James She"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767617", "abs": "CRIA (Cocktail Responsive Interactive Avatar) is an interactive digital human designed to simulate emotional instability in AI. By combining mood-driven language generation, expressive speech synthesis, and digital human, the system embodies states such as intoxication, anger, and confusion. Exhibited in public settings, CRIA received strong audience engagement; participants described it as easy to interact with and emotionally expressive, indicating the effectiveness of its interaction design and emotion engine. Rather than portraying AI as coherent or helpful, CRIA embraces affective breakdown as a means of critical reflection. The project challenges normative expectations of emotional AI and provokes new questions about machine subjectivity, ethical design, and the aesthetics of failure.", "ja": "CRIA（Cocktail Responsive Interactive Avatar）は、AI の感情的不安定性をシミュレートするために設計されたインタラクティブなデジタルヒューマンです。ムード駆動型言語生成、表情豊かな音声合成、デジタルヒューマンを組み合わせることで、酔っ払い、怒り、混乱といった状態を具現化します。公共の場で展示された CRIA は強い観客の関与を得ており、参加者はそれを「対話しやすく」「感情豊か」と評価し、インタラクションデザインと感情エンジンの有効性を示しました。AI を一貫した役立つ存在として描くのではなく、CRIA は感情的な崩壊を受け入れ、批判的な省察の手段としています。このプロジェクトは、感情 AI に対する規範的期待に挑戦し、機械の主体性、倫理的デザイン、失敗の美学に関する新たな問いを提起します。", "tags": ["Art Installation", "Drinking", "Emotional AI", "Interactive Digital Human"]}, {"v": "", "img": "thumbs/f4ebc24ced09.jpg", "t": "Cryoscape: AI-Interpreted 3D Ice Printing as Climate Commentary", "a": ["Jiabao Li", "Ziyuan Jiang", "Kuan-Ju Wu", "Yasuaki Kakehi"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767614", "abs": "Cryoscape is an interactive installation that explores the intersection of water's phase transitions, 3D printing technology, and artificial intelligence to create a dynamic commentary on climate change. Born from observations during an Arctic Circle Artist Residency in Svalbard, this project develops a novel approach to ice sculpture through controlled droplet deposition on temperature-regulated surfaces with varying hydrophobic and hydrophilic treatments. The resulting micro-landscapes, captured by real-time macro photography, are interpreted by an AI system generating haiku inspired poetry, creating a dialogue between machine perception and natural phenomena. Each installation adapts to local environmental conditions—humidity, temperature, and water composition—making the work site-specific and collaborative with nature. Beyond its artistic merit, Cryoscape raises critical questions about the anthropogenic impact on Arctic environments, including the ironic contribution of AI systems to global warming through their energy consumption. The technology developed for Cryoscape has potential applications in fields like tissue engineering and microfluidics while serving as a meditation on slow technology, environmental fragility, and the blurred boundaries between artificial and natural systems.", "ja": "Cryoscapeは、水の相転移、3Dプリンティング技術、人工知能の交差点を探求し、気候変動に関する動的なコメントリーを作り出すインタラクティブなインスタレーションです。北極圏アーティスト・レジデンシー（スヴァールバル）での観察から生まれたこのプロジェクトは、温度制御された表面上にさまざまな撥水性・親水性処理を施した滴下を制御することで、氷の彫刻に新しいアプローチを開発します。その結果生まれるマイクロランドスケープは、リアルタイムのマクロ撮影で捉えられ、AIシステムによって俳句風の詩が生成され、機械的知覚と自然現象との対話を生み出します。各インスタレーションは、湿度、温度、水の組成といった現地の環境条件に適応し、場所固有で自然と協働する作品となります。芸術的価値を超えて、Cryoscapeは人工知能システムがエネルギー消費によって地球温暖化に寄与するという皮肉的な側面を含め、人為的な北極環境への影響について重要な疑問を提起します。Cryoscapeで開発された技術は、組織工学やマイクロ流体学などの分野への応用可能性を持ち、スロー・テクノロジー、環境の脆弱性、人工と自然の境界が曖昧になることについての瞑想として機能します。", "tags": ["AI poetry", "Arctic art", "climate change", "environmental art", "generative systems", "Ice printing", "interactive installation", "slow technology"]}, {"v": "", "img": "thumbs/b5e21faee2b7.jpg", "t": "Cutting Kim: Playful Transgression Through VR Voice Interaction in Public Exhibition Contexts", "a": ["Joonhyung Bae", "Eunjin Choi", "Juhan Nam"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767596", "abs": "This paper introduces Cutting Kim, an interactive VR artwork that explores playful transgression by transforming raw vocal utterances—from a hesitant hum to a cathartic scream—into a ’sonic sword,’ a spectacular and destructive force. Through an iterative, practice-based methodology spanning four distinct public exhibitions, from workshops to a large-scale cultural festival, the work revealed a central paradox of the ’publicly private’ act: the VR headset grants perceived privacy for vocal release yet simultaneously transforms the participant’s physical body and voice into a public spectacle. This paper analyzes this complex negotiation between inner liberation and public self-awareness. We argue that by creating such experiences, interactive art can function as a ’rehearsal space’ for social possibilities, offering a tangible model for how technology can be used not to control but to liberate the expressive human voice.", "ja": "この論文は、インタラクティブなVRアート作品である「Cutting Kim」を紹介し、音声の生の発声（躊躇いのあるハミングからカタルシス的な叫びまで）を「ソニックソード」という壮観で破壊的な力に変換することで、遊び心のある逸脱を探求します。4つの異なる公共展示（ワークショップから大規模な文化祭まで）にわたる反復的で実践的な方法論を通じて、この作品は「公共的な私的」行為の中心的なパラドックスを明らかにしました。VRヘッドセットは声の解放のためのプライバシーを提供するように見える一方で、参加者の身体と声を公共のスペクタクルへと変換します。本論文は、内面的な解放と公共的自己認識の間のこの複雑な交渉を分析します。私たちは、このような体験を創出することで、インタラクティブアートが社会的可能性の「リハーサル空間」として機能し、技術が制御ではなく表現的な人間の声を解放する手段として利用できる具体的なモデルを提供できると主張します。", "tags": ["Artistic Research", "Experiential VR", "Interactive Art", "Performance", "Playful Transgression", "public space", "Voice as Medium"]}, {"v": "", "img": "thumbs/705e28689605.jpg", "t": "Deconstructing Computational Colonialism: An Eco-Relational Framework for Decolonial AI Art (1960s-Present)", "a": ["Yuan Zhuang", "Ze Gao", "Mengyao Guo", "Kexin Nie"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767594", "abs": "Computational technologies integrated into ecological art paradoxically perpetuate anthropocentric violence despite their environmental ethos, constrained by Western-centric datasets and unsustainable practices. This study critically examines this historical tension from 1960s land art to contemporary bio-digital works. Current AI eco-art manifests a fundamental contradiction where tools intended for ecological care instead enable computational colonialism through epistemological erasure, material extraction, and ethical hypocrisy. We develop the Earmarked Eco-Relationship Framework(EERF), transforming computational systems into ecological negotiators through decolonial data protocols, entropic material accounting, and redistributed agency mechanisms. Applied through case studies (for example, Hong Kong’s blockchain-mediated mangrove restoration), this framework proves algorithmic systems can serve as active co-stewards rather than extractive tools. This work advances ecological art beyond virtual representation by establishing a tripartite methodology for shifting the paradigm from human-centred control to actionable multispecies material ethics and fostering symbiotic co-creation.", "ja": "計算技術が生態芸術に組み込まれることは、環境的理念にもかかわらず、西洋中心的なデータセットと持続不可能な慣行に制約され、人間中心的な暴力を逆説的に永続させます。本研究は、1960年代のランドアートから現代のバイオデジタル作品に至る歴史的緊張を批判的に検証します。現在のAIエコアートは、エコロジカルなケアを目的としたツールが、認識論的抹消、物質抽出、倫理的偽善を通じて計算的植民地主義を可能にするという根本的な矛盾を示しています。我々は、脱植民地主義的データプロトコル、エントロピー的物質会計、再配分されたエージェンシーメカニズムを通じて計算システムを生態的交渉者に変換する「Earmarked Eco-Relationship Framework（EERF）」を開発しました。このフレームワークは、ケーススタディ（例：香港のブロックチェーンを利用したマングローブ再生）を通じて適用され、アルゴリズムシステムが抽出的ツールではなく、積極的な共栄者として機能し得ることを実証しています。本研究は、人間中心的コントロールから実践的な多種共生物質倫理へのパラダイム転換を推進し、共生的共創を促進する三層方法論を確立することで、エコロジカルアートを単なる仮想表現を超えて前進させます。", "tags": ["AI-generated Art", "Decentralised Synergy", "Ecological Aesthetics", "Non-anthropocentrism", "Techno-Ethics", "Virtual-Physical Interaction"]}, {"v": "", "img": "thumbs/97d4e789ccc6.jpg", "t": "Dreaming of Butterflies: Embodying Zhuangzi's Philosophy through a Mixed Reality Installation", "a": ["Yifan Ding", "Wanxiang Ma", "Zihan Gao"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767607", "abs": "While extended reality (XR) has increasingly been used for narrative immersion and cultural visualization, few projects have explored its potential to embody eastern metaphysical thoughts through spatial interactions. In our work Dreaming of Butterflies, we address this gap by transforming Chinese philosopher Zhuangzi’s classic parable, the Butterfly Dream, into an interactive XR journey that invites participants to experience the boundaries between illusion and reality, self and other. By merging embodied interaction, stylized visual language, and Daoist cosmology, the experience demonstrates how XR can serve as a medium for metaphysical reflection and poetic experience, offering a novel framework for spatializing philosophical thought in immersive art.", "ja": "XR（拡張現実）は物語への没入感や文化の可視化にますます利用されてきましたが、空間的インタラクションを通じて東洋の形而上学的思想を具現化する可能性を探求したプロジェクトはほとんどありません。本研究「Dreaming of Butterflies」では、このギャップを埋めるべく、中国の哲学者荘子の古典的な寓話「蝶の夢」をインタラクティブなXR体験に変換し、参加者が幻想と現実、自己と他者の境界を体験できるようにします。具現化されたインタラクション、様式化されたビジュアル言語、道教宇宙論を融合させることで、XRが形而上学的省察と詩的体験の媒体として機能し、没入型アートにおける哲学的思考の空間化に新たなフレームワークを提供することを示しています。", "tags": ["Daoist Design", "Embodied Cognition", "Metaphorical Space", "Philosophical Narrative", "XR Interaction"]}, {"v": "", "img": "thumbs/3b34e053afeb.jpg", "t": "Drift of the Uncharted: A Speculative Fiction About Rising Sea-Level Landscapes through Robotic Performance", "a": ["Ary-Yue Huang", "Qing Qin", "Wenzong Ma", "Bingyuan Wang", "Clea von Chamier-Waite"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767598", "abs": "Drift of the Uncharted presents as a robotic performance in combination with expanded cinema. It combines climate prediction and real-world landscape reconstruction, revealing a speculative world where contemporary urban landscapes experience future sea-level rise. A quadruped robot with an onboard projector serves as a rescue robot, simultaneously traversing both physical and virtual spaces, projecting the drowned cityscapes into the exhibition space. This research examines how speculative narrative and robotic performance mediate climate change—a hyperobject that transcends conventional scales of space and time into an experiential form while simultaneously expanding robotic art by positioning the robot as a narrative agent.", "ja": "Drift of the Unchartedは、拡張シネマと組み合わせたロボティック・パフォーマンスとして提示されます。気候予測と実世界の景観再構築を組み合わせ、将来の海面上昇を経験する当代の都市景観を描く投機的な世界を明らかにします。プロジェクターを搭載した四足歩行ロボットは救助ロボットとして機能し、物理空間と仮想空間の両方を同時に横断し、沈んだ都市景観を展示空間に投影します。本研究は、投機的ナラティブとロボティック・パフォーマンスがどのように気候変動というハイパーオブジェクトを仲介し、従来の空間と時間の尺度を超えて体験的形態へと変換するか、そしてロボットをナラティブ・エージェントとして位置づけることでロボットアートを拡張するかを検証します。", "tags": ["Agent-based Art", "climate change", "Robotic Art"]}, {"v": "", "img": "thumbs/2fbb832cf119.jpg", "t": "Entangled Gazes: Reconstituting the Stereoscopic Box Set with LLMs and Virtual Reality", "a": ["Paul Heinrich Bethge", "Emmanuelle Denove", "Dhruva Gowda-Storz", "Adriano Viegas Milani", "Tai Leong Cheong", "Paul Bourke", "Sarah Kenderdine", "Jeffrey Shaw"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767616", "abs": "This paper presents a computational framework for critically reinterpreting colonial-era stereoscopic box sets. Using James Ricalton’s China through the Stereoscope (1901) as a case study, we deconstruct its linear narrative using NLP methods for thematic modeling, semantic mapping, and colonial language identification. This analysis informs two complementary artworks in a large-scale 360° VR environment. Cross Eyed offers a guided experience, using the thematic models as lenses for inquiry and visually distinguishing identified rhetoric. Latent Cartographies, in contrast, empowers users to freely navigate the archive’s raw semantic space, fostering diverse modes of experiential engagement with contested heritage. For demonstration visit: https://epfl-emplus.github.io/EntangledGazes/", "ja": "この論文は、植民地時代のステレオスコピック・ボックスセットを批判的に再解釈するための計算フレームワークを提示します。ケーススタディとして、James Ricalton の「China through the Stereoscope」（1901）を使用し、NLP 手法によるテーマモデリング、セマンティックマッピング、植民地言語の特定を通じてその線形ナラティブを分解します。この分析は、広範な 360° VR 環境における 2 つの補完的なアート作品に情報を提供します。Cross Eyed は、テーマモデルを探求のレンズとして使用し、特定されたレトリックを視覚的に区別するガイド体験を提供します。対照的に、Latent Cartographies は、ユーザーがアーカイブの生のセマンティック空間を自由にナビゲートできるようにし、争点となる遺産への多様な体験的エンゲージメントを促進します。デモの閲覧は https://epfl-emplus.github.io/EntangledGazes/ へ。", "tags": ["archival art", "NLP Methods for Art", "Stereoscopic Photography", "virtual reality"]}, {"v": "", "img": "thumbs/e59e3dab2ca0.jpg", "t": "FinHERtip: Embodied Identity and Human-AI Co-Creation in Accessible Musical Performance", "a": ["Shumeng Zhang", "Tiancheng Liu", "Mingming Fan"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767621", "abs": "FinHERtip introduces a musical performance system co-designed with a blind, queer musician to explore identity expression music creation. The system combines beadwork, computer vision, and audio synthesis to translate tactile gestures into layered, expressive sound. Drawing from both blind and queer cultural practices, it centers embodied authorship and reclaims technical space through personal ritual and material interaction. An Expressive Co-Creation Framework is proposed to support collaborations between human experience and machine response. This work advances accessible digital performance by challenging normative design and valuing lived identity as a site of creative agency.", "ja": "FinHERtipは、盲目でクィアのミュージシャンと共同設計した音楽パフォーマンスシステムで、アイデンティティ表現と音楽創作を探求します。このシステムは、ビーズワーク、コンピュータビジョン、オーディオ合成を組み合わせ、触覚ジェスチャーを層状で表現的な音に変換します。盲目とクィアの文化的実践の両方から着想を得て、身体性のある著作権を中心に据え、個人的な儀式と素材との相互作用を通じて技術空間を再主張します。人間の経験と機械の応答の協働を支える表現的共創フレームワークが提案されます。本研究は、規範的デザインに挑戦し、 lived identity を創造的エージェンシーの場として評価することで、アクセシブルなデジタルパフォーマンスを前進させます。", "tags": ["Accessibility", "Human-AI collaboration", "Music performance", "Queer identity", "Tangible musical interface"]}, {"v": "", "img": "thumbs/652da59de390.jpg", "t": "Framing the Unseen: Gesture, Network, and Intent in the Art of the Screenshot", "a": ["Marty Miller"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767608", "abs": "This paper investigates screenshots as intentional or automated acts of device and network interaction. Their significance lies as much in how they are interpreted as in how they are produced. Pictured examples are analyzed for gestural, software, and networked influences that shape what becomes visible. Some highlight interpretive reflections on interactive processes, while others raise doubts about authorship when time-automated software produces similar results. To probe this tension, screenshots were introduced to local photographers, prompting reflections on normally unseen networked or embodied interactions within their practice. These findings suggest that screenshots, though often overlooked, can serve as probes for authorial intent, reframing how everyday images function as archives of both physical and networked interaction.", "ja": "この論文は、スクリーンショットをデバイスとネットワークの相互作用の意図的または自動的な行為として調査します。その重要性は、生成方法だけでなく、解釈される方法にも大きく関わります。画像化された例は、見えるものを形作るジェスチャー、ソフトウェア、ネットワークの影響について分析されます。一部はインタラクティブなプロセスに対する解釈的な考察を強調し、他方は時間的に自動化されたソフトウェアが類似の結果を生む場合に作者性に疑問を投げかけます。この緊張関係を探るために、スクリーンショットは地元の写真家に紹介され、彼らの実践における通常は見えないネットワークや具象的な相互作用についての考察を促しました。これらの発見は、スクリーンショットはしばしば見過ごされがちですが、作者の意図を探る手段として機能し、日常的な画像が物理的およびネットワーク的な相互作用のアーカイブとしてどのように機能するかを再構築できることを示唆しています。", "tags": ["imaging software", "network aesthetics", "photographic intent", "screenshots", "user agency", "visual interaction"], "pos": "50% 0%"}, {"v": "", "img": "thumbs/12b8963b9d48.jpg", "t": "Homogenized Planet Imagery: A Process-Art Critique of Space Image in the Age of AI", "a": ["Yinglin Zhou", "Jieyuan Huang"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767623", "abs": "In the paper we introduce Homogenized Image Planet, a multi-stage process artwork that examines how planetary images acquire authority today. We collect visuals from NASA archives, Wikipedia, search platforms, and generative AI; archive their metadata; and fuse them with equal weights after feature-based alignment. The resulting texture animates a Unity and WebGL installation and is preserved on a radiation-tolerant chip launched to low-Earth orbit, forming a physical–virtual digital twin. Framed by power/knowledge, computational objectivity, and simulacra, audience surveys and expert interviews indicate decreased trust in “official” imagery and increased critical awareness of algorithmic mediation.", "ja": "本稿では、惑星画像が今日どのように権威を獲得しているかを検証するマルチステージのプロセスアート作品「Homogenized Image Planet」を紹介します。NASA のアーカイブ、Wikipedia、検索プラットフォーム、生成 AI からビジュアルを収集し、メタデータをアーカイブし、特徴ベースのアラインメント後に等しい重みで融合します。その結果得られるテクスチャは Unity と WebGL のインスタレーションでアニメーション化され、放射線耐性チップに保存されて低軌道に打ち上げられ、物理的・仮想的なデジタルツインを形成します。権力/知識、計算的客観性、シミュラクラという枠組みのもと、観客調査と専門家インタビューは「公式」画像への信頼低下とアルゴリズム媒介への批判的認識の向上を示しています。", "tags": ["Computational Objectivity", "Planetary Imagery", "Process Art", "Simulacra"]}, {"v": "", "img": "thumbs/d7b65c808343.jpg", "t": "How I Perceive It: Human Memory-Augmented Analogical Reasoning for Machine Visual Interpretation", "a": ["Zhuodi Cai"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767595", "abs": "How I Perceive It augments machine visual interpretation with human memory, shifting from superficial seeing to deep perceiving. Although today’s vision language models (VLMs) can generate image captions with a degree of subjectivity, they still struggle to explain the underlying reasons or experiential basis for such subjectivity. Machines can see, but they do not perceive as humans do, who link perception with prior experience and memory. To bridge this gap, this paper introduces a visual interpretation system that integrates individual memory into machine perception, founded on structure-mapping theory. By merging what the machine sees with what the individual remembers, the system produces individualized interpretations that uncover more insightful meanings among visual elements that are not immediately visible on the surface.", "ja": "How I Perceive It は、人間の記憶を組み込んだ機械の視覚解釈を拡張し、表面的な見ることから深い知覚へとシフトさせます。現在のビジョンランゲージモデル（VLM）は、ある程度の主観性を伴う画像キャプションを生成できますが、その主観性の背後にある理由や経験的根拠を説明することは依然として苦手です。機械は見ることはできても、人間のように感覚と過去の経験・記憶を結びつけて知覚することはできません。このギャップを埋めるために、本論文では個人の記憶を機械の知覚に統合した視覚解釈システムを提案し、構造写像理論に基づいています。機械が見えるものと個人が記憶するものを融合させることで、表面上すぐには見えない視覚要素のより洞察的な意味を明らかにする、個別化された解釈を生成します。", "tags": ["Analogical Reasoning", "Cognitive AI", "Explainable AI", "Human-AI collaboration", "Memory", "Vision-Language Models", "Visual Interpretation", "VLMs"]}, {"v": "", "img": "thumbs/f48da3943adf.jpg", "t": "Nanlai Zhi Hua (Flowers from the South): A Spatio-Temporal Visualization of the works and lives of Hong Kong’s Southbound Literati", "a": ["Yuan Zhang", "Angela Chulei Tang", "Yu Sun", "Yansong Chen", "Qi Duanmu", "Wenbo Wang", "Yin Bing"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767615", "abs": "This paper presents Nanlai Zhi Hua (Flowers from the South), a data-driven visualization project that maps the spatial narratives of Hong Kong’s Southbound Literati. Combining diasporic literature, spatial theory, and affective design, the project visualizes both the authors’ lived geographies and the spatial settings found in their literary works to explore themes of displacement, memory, and identity. These narrative motifs are transformed into poetic “data flowers” using methods like temporal juxtaposition and color-time flattening. Presented as an installation, the artwork invites interpretive engagement and demonstrates how visualizing narrative geographies reveals emotional patterns in diasporic literary creativity.", "ja": "この論文では、香港の南方文人の空間的物語をマッピングするデータ駆動型ビジュアライゼーションプロジェクトである「南来之花（Flowers from the South）」を提示します。ディアスポラ文学、空間理論、感情デザインを組み合わせ、著者の生活地理と文学作品に見られる空間設定の両方を可視化し、移転、記憶、アイデンティティというテーマを探求します。これらの物語的モチーフは、時間的並置や色時間平坦化といった手法を用いて詩的な「データフラワー」に変換されます。インスタレーションとして提示されるこの作品は、解釈的な関与を促し、物語的地理の可視化がディアスポラ文学的創造性における感情パターンを明らかにする方法を示しています。", "tags": ["affective computing", "cultural identity", "diasporic literature", "digital humanities", "exhibition display", "geospatial narrative", "literary geography", "media arts", "narrative visualization", "spatial humanities"]}, {"v": "", "img": "thumbs/0ab429073d6c.jpg", "t": "Nora: Exploring a Feminist Approach to VR Creation", "a": ["Weixuan Huang", "Jingjing Guo", "Yi Shi", "Shan Wang"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767606", "abs": "The development of innovative virtual reality (VR) methodologies represents a critical imperative in an era where VR reconfigures human perception and facilitates complex cultural expression. This paper explores the intersection of feminism and VR creation, presenting an interactive narrative experience. \"Nora\" recounts the story of \"Na\" , a rural woman’s journey of self-growth. Guided by feminist theory, the work is innovatively designed in terms of content, perspective, and interactivity. Additionally, user feedback was analyzed to inform future improvements. \"Nora\" explores how feminist theory influences various aspects of VR creation and provides new insights into the transformative role of feminism in VR artistic practice.", "ja": "仮想現実（VR）の開発は、人間の知覚を再構築し、複雑な文化表現を可能にする時代において重要な課題です。本稿では、フェミニズムとVR創作の交差点を探求し、インタラクティブな物語体験を提示します。「Nora」は、農村の女性「Na」の自己成長の旅路を描きます。フェミニスト理論に導かれ、内容、視点、インタラクティビティの面で革新的に設計されています。さらに、ユーザーフィードバックを分析し、将来の改善に活かしました。「Nora」は、フェミニスト理論がVR創作のさまざまな側面にどのように影響するかを探り、VR芸術実践におけるフェミニズムの変革的役割に新たな洞察を提供します。", "tags": ["Feminism", "Interactive narratives", "Third-person perspective", "virtual reality"]}, {"v": "", "img": "thumbs/1ebf56974c57.jpg", "t": "Open Horizons, Colliding Bodies: Adaptive Lure Agents in a Glass Maze", "a": ["Baoyang Chen", "Xian Xu", "Huamin Qu"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767600", "abs": "Why build yet another virtual reality artwork when VR already promises boundless exploration? We began with a blunt provocation: make the body feel the gap between virtual promise and material fact. Our installation embeds a fully occlusive headset inside a transparent glass maze so constraint remains visible. An adaptive reinforcement-learning (RL) lure, treated as a performing partner—edits salience with gentle invitations rather than commands. Across over ten exhibitions (2017–2025), the piece evolved from onlooker voyeurism to a choreography of agency among audience, machine-performer, and artist-architect. By partially publicizing policy intent on the floor, projections, and rail, what is usually hidden as seamless UX becomes dramatically legible; guidance is experienced as both bodily and social, with collisions reading as shared mischief more than punishment. We contribute an art-led, large-scale architecture that couples predictive models with embodied interaction while retaining ambiguity: visible constraint (glass), public policy signals (floor/projections/rail), and an RL lure that persuades by staging opportunity. Drawing on in-exhibition observations, we report regularities that motivate lightweight, gallery-feasible evaluations without altering the artwork, thereby paving the way for systematic study. More broadly, the work reframes “good guidance” not only as seamlessness but as strategic visibility, an ethico-aesthetic stance on when power should be allowed to show, and the autonomy we trade when an algorithm anticipates our limits.", "ja": "なぜ、VRがすでに無限の探索を約束しているのに、別の仮想現実アート作品を作るのか？ 私たちは率直な挑発から始めました：仮想の約束と物質的な現実の間のギャップを身体で感じさせることで

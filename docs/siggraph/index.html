n the result, we can comprehend that the goals and expressive approaches are decided depending on the unique characteristics of the Bible text. We expect to build theoretical method for choosing the materials and approaches by analyzing more diverse examples with various point of views on the basis of this research."}, {"v": "", "img": "thumbs/780e7dc34291.jpg", "t": "90° South", "a": ["Alejandro Borsani"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341942"}, {"v": "", "img": "thumbs/0f50e7fec829.jpg", "t": "A planetary order (terrestrial cloud globe)", "a": ["Martin John Callanan"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341944"}, {"v": "", "img": "thumbs/8d62a9ccbd8c.jpg", "t": "Biopoiesis", "a": ["Carlos Castellanos", "Steven J. Barnes"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341945"}, {"v": "", "img": "thumbs/b9a7b45d5949.jpg", "t": "Coronado", "a": ["Kian-Peng Ong"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341949"}, {"v": "", "img": "thumbs/f840070bfc7d.jpg", "t": "Kapitän Biopunk", "a": ["Julian Abraham"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341939"}, {"v": "", "img": "thumbs/03e324abbb93.jpg", "t": "Saturation", "a": ["Daniel Barry", "Adam Laskowitz"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341941"}, {"v": "", "img": "thumbs/3ca62dc0154f.jpg", "t": "Snail trail", "a": ["Philipp Artus"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341940"}, {"v": "", "img": "thumbs/f69e02b6abe2.jpg", "t": "Sustainable cinema no. 4", "a": ["Scott Hessels"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341946"}, {"v": "", "img": "thumbs/752c68e0aa06.jpg", "t": "SymbiosisS", "a": ["Kärt Ojavee", "Eszter Ozsvald"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341948"}, {"v": "", "img": "thumbs/96b817caec09.jpg", "t": "Tardigotchi", "a": ["Swamp"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341950"}, {"v": "", "img": "thumbs/2dd8deafe27b.jpg", "t": "The galloping horse", "a": ["Rémi Brun"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341943"}, {"v": "", "img": "thumbs/a64b8bba1c91.jpg", "t": "The HeartBeats watch", "a": ["Julie Legault"], "c": "SIGGRAPH", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2341931.2341947"}, {"v": "", "img": "", "t": "Entr'acte", "a": ["Jordan Geiger"], "c": "SIGGRAPH", "y": 2012, "k": "Art Papers", "doi": "10.1145/2341931.2341935", "abs": "Looking at new public-space formations today, the roles of new technologies grow not only prominent but also noticeably time-sensitive. Due in part to the rapidly changing nature of communications media and the diverse stakeholders, the theatrical \"entr'acte\" appears to be an apt model for forms and durations of public space with diverse performers (both human and material elements) of different sorts: entr'acteurs. How is public space as physical construct changing with new embedded forms of computing? How is a public formed? What new material sensibilities emerge? And what role does their essentially fleeting or transitional character play?"}, {"v": "", "img": "", "t": "From Wunderkammern to Kinect", "a": ["Chara Lewis", "Kristin Mojsiewicz", "Anneké Pettican", "Brass Art"], "c": "SIGGRAPH", "y": 2012, "k": "Art Papers", "doi": "10.1145/2341931.2341934", "abs": "This paper focuses on two projects, Still Life No. 1 and Shadow Worlds | Writers' Rooms [Brontë Parsonage], to reveal the creative approaches the authors take to site, technology, and the self in their production of shadow worlds as sites of wonder. Informed by the uncanny (re-animation and the double) and an interest in the limen (thresholds in the real and virtual realms), the projects explore white light and infrared digital 3D scanning technologies as tools for capture and transformation. The authors will discuss how they suture the past with the present and ways that light slips secretly between us, revealing other realms."}, {"v": "", "img": "", "t": "Soundspheres", "a": ["Geoffrey Thün", "Kathy Velikov", "Colin Ripley", "Lisa Sauvé", "Wes McGee"], "c": "SIGGRAPH", "y": 2012, "k": "Art Papers", "doi": "10.1145/2341931.2341936", "abs": "This paper develops a brief historical account of the architectural development of auditory space and identifies the \"soundsphere\" as an acoustic project that connects the interrelationships between material, spatial form and sound. The instrumental design of the soundsphere has focused on three types of shells: hard, static, and inflexible; physically manipulable; and immaterial (or electroacoustic). This frames a disciplinary and historical context for Resonant Chamber, a prototype-based design research project that develops a kinetic and interactive interior envelope system aimed at transforming the acoustic environment through dynamic spatial, material, and electroacoustic technologies."}, {"v": "", "img": "", "t": "Translation + pendaphonics = movement modulated media", "a": ["Byron Lahey", "Winslow Burleson", "Elizabeth Streb"], "c": "SIGGRAPH", "y": 2012, "k": "Art Papers", "doi": "10.1145/2341931.2341933", "abs": "Translation is a multimedia dance performed on a vertical wall filed with the projected image of a lunar surface. Pendaphonics is a low-cost, versatile, and robust motion-sensing hardware-software system integrated with the rigging of Translation to detect the dancers' motion and provide real-time control of the virtual moonscape. Replacing remotely triggered manual cues with high-resolution, real-time control by the performers expands the expressive range and ensures synchronization of feedback with the performers' movements. This project is the first application of an ongoing collaboration between the Motivational Environments Research Group at Arizona State University (ASU) and STREB Extreme Action Company."}, {"v": "", "img": "", "t": "Within an ocean of light", "a": ["Anthony Rowe"], "c": "SIGGRAPH", "y": 2012, "k": "Art Papers", "doi": "10.1145/2341931.2341937", "abs": "This paper documents explorations into an alternative platform for immersive and affective expression within spatial mixed reality installation experiences. It discusses and analyzes experiments that use an advanced LED cube to create immersive, interactive installations and environments where visitors and visuals share a common physical space. As a visual medium, the LED cube has very specific properties and affordances, and optimizing the potential for such systems to create meaningful experiences presents many interlinked challenges. Two artworks exploring these possibilities are discussed. Both have been exhibited internationally in a variety of settings. Together with this paper, the works shed some light on the design considerations and experiential possibilities afforded by LED cubes and arrays. They also suggest that LED grids have potential as an emerging medium for immersive volumetric visualizations that occupy physical space."}, {"v": "", "img": "thumbs/33a3abf76d55.jpg", "t": "Coronado", "a": ["Ong Kian-Peng"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413087", "abs": "Coronado is a Sound/Sculpture art work characterized by the interplay of the analog and digital sound sources which layers over one another, exploring the idea of a loop that creates a unique interpretation of a sea scape. The center of the installation is an ocean drum controlled with mechanical arms that creates and simulates the sound of sea waves. Finally, the sound from this sculpture is fed into the computer and reprocessed, and bounced across different speakers surrounding the installation."}, {"v": "", "img": "thumbs/6b1c3b4991c5.jpg", "t": "Diligent typist", "a": ["Ha Byeongwon"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413078", "abs": "\"Diligent Typist\" has a simple but powerful narrative by masking a MacBook backlit keyboard image. In a small office where there is a MacBook, a laptop desk, a chair, 4-channel speakers and a projected screen, the screen loops a simple keys' march on a MacBook keyboard from left to right. The computer commands viewers to press a letter on the keyboard in alphabetical order. When they press the same key that the computer commands, viewers contribute to making the big letter image with busy typing sounds. Each key sacrifices its own entity to show a big letter like Mass Performance."}, {"v": "", "img": "thumbs/e27fd44ac5ae.jpg", "t": "Gestus : judex", "a": ["Hector Rodriguez"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413090", "abs": "The Gestus project consists of a custom software that generates a vector analysis of the videos in a data set, and uses this analysis to search for sequences containing similar movements. It then renders similar sequences side-by-side as a split-screen display, enabling users to compare the movements that occur in them. The software thus brings together scenes from different locations in the story, finding echoes between very diverse moments in the film."}, {"v": "", "img": "thumbs/4e3f45ca29f7.jpg", "t": "Graffiti@Google", "a": ["Mori Yukari"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413092", "abs": "When you search for images on Google the search results from the World Wide Web are displayed in a grid. Google's own algorithm determines these search results. By \"using\" the algorithm the author have attempted to deliberately arrange the images, to use the search engine results as a canvas to draw an art work. Then we can bomb on Google as graffiti artists bomb on city because Google has become a huge infrastructure of the modern era."}, {"v": "", "img": "thumbs/718cda275ef9.jpg", "t": "Interactive 3-D grid", "a": ["Byers Ken"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413096", "abs": "This interactive digital installation, in which human-machine interaction is aligned to 'Agency', 'Situation' and 'Embodiment'. The control of the virtual world via body-joint movement, and tracked position, velocity, gestures are directly linked to archi-tectonic forms, distortion of space and perspective. It challenges unconscious associations with familiar, embodied habitual experiences of Cartesian-space. The expected reading and interpretation of body-movement, is translated into a reflexive aesthetic language that causes the particpant to reanalyze there position, gesture in space."}, {"v": "", "img": "thumbs/706c73616af4.jpg", "t": "LBSkeleton (listening bio-skeletion)", "a": ["Huang Scottie Chih-Chieh"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413081", "abs": "LBSkeleton is a interactive installation, creating an alternative ambient display from a blend of pneumatic sound and magnificent shadows, and showing an emotional communication between audience and the kinetic sculpture in a soothing way. It is made of dense replicated foldable space truss studying the configuration of origami tessellation and mechanical techniques, to design a transformable body. LBSkeleton detects the presence of one or more persons by the proximity sensing in the space and reacts through a change of shape, sound, light, and gracefully enables the audience to immerse and control a harmonious and augmented musical environment through the body movement."}, {"v": "", "img": "thumbs/13a48c9b408f.jpg", "t": "Light strings", "a": ["Seo Jinsil", "Corness Greg"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413091", "abs": "Light Strings is an interactive immersive installation that consists of thousands of fiber optics and a computer mediated virtual agents system that responds to the participant's movement (Ambient, Exploration, Play, Meditation modes). The fiber optic environment creates a floating 3D light surface that emits interactive lights. Participants and multimedia agents co-exist and meet in Light Strings through touching and using their whole bodies. Full freedom of physical body movement, creating relations to the physical installation and a virtual world is a critical condition of Light Strings."}, {"v": "", "img": "thumbs/09ecf8735dbf.jpg", "t": "Re: Dakar arts festival", "a": ["Kronman Linda", "Zingerle Andreas"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413095", "abs": "The \"Re: Dakar Arts Festival\" project brings out into open the practice of Internet scammers and questions the trust we put in online representations. The fictional story worlds created by scammers and scambaiters reveals the dystopia of Internet. This is a world of false representations, abuse of trust, humiliation and desperation for opportunities. The interaction between scammer and victims or scambaiters reveals that Internet is not equal and is not to be trusted."}, {"v": "", "img": "thumbs/7d1fb529618b.jpg", "t": "Rehearsal #1", "a": ["Yoo Jihoon"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413086", "abs": "The works are about the sense of isolation and alienation experienced by the individual in modern society. In the author's eyes, we human are within a technological and bureaucratic landscape, and he express this kind of alienation by using metaphoric virtual media, such as text, voice, image and music made from digital information, typically used to make data visualization or works that are systematic, impersonal and informational."}, {"v": "", "img": "thumbs/0c6b57730ea1.jpg", "t": "Samalu", "a": ["Zingerle Andreas"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413085", "abs": "\"Samalu\" finds inspiration in old folk believes and shaman rituals, but brings the meaning of mountain myths and worship into todays contemporary Austria and Korea. A non-linear story around this theme explores how we in our highly modern societies are attached to the nature through the mountains. The natural interface constructed of a number of stones refers to stone piles found on hiking trails around the world, each stone concealing an unique story. By lifting one or several of the real fist-size stones the visitor can experience various myths from both countries and explore different mountain landscapes."}, {"v": "", "img": "thumbs/b52955f129bf.jpg", "t": "Sensing the sound web", "a": ["Ikegami Takashi", "Oka Mizuki", "Maruyama Norihiro", "Watanabe Yu", "Matsumoto Akihiko"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413084", "abs": "The sound installation aims to bring artificial life into the real world. Environmental patterns, including human behaviors and wifi signals, are captured by a distributed autonomous sensor network (as an application of artificial life) to form a soundscape."}, {"v": "", "img": "thumbs/68f97e523936.jpg", "t": "Sensitive as water", "a": ["Niu Miao"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413079", "abs": "The \"Water Project\" is a video installation in which a physical drip of water triggers a glitch in a digital image file of the sea. Digital representations and spectacular images from screens are highly suspect and unreliable to some degree. However, people are growing ever more attached to screens, and they experience intimacy in a virtual world rather than the real world. It is interesting to explore the fragile connection between those two worlds."}, {"v": "", "img": "thumbs/8352624f5e93.jpg", "t": "Shin'm 2.0", "a": ["Kang Eunsu", "Craig Donald", "Garcia-Snyder Diana"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413093", "abs": "Shin'm 2.0 is the second version of Shin'm project that was created in 2009. Using the Kinect sensor, spatialized sound and two video projections aligned together, it creates an interactive space of nebula bubbles in one corner of the exhibition space. This fluid space is filled with nebula bubbles constantly circulating through a \"black hole\" in the center. As the participant moves in deeper, first the bubbles' gravity center moves to the participant, and forms the shape of the participant's body. If the participant jumps or raises his or her hand up high, bubbles explode as their bubble-filled-body dissipates. Sound texture is designed to enhance the illusion of attachment and dissipation through this experience."}, {"v": "", "img": "thumbs/214e6b27810c.jpg", "t": "Species series", "a": ["Wonbin Yang"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413089", "abs": "In the 'Species series', basic physics, electronics, and mechanics are combined with various digital technologies to create robotic species. The different levels of technological complexities reflect the evolutionary histories of robotic species. The ancient robotic species have simpler body structures and behaviors. Simple ideas and the principal technologies lead those creatures' life and relatively advanced technologies are gradually merged into their next generations as a result of struggles for existence and survival."}, {"v": "", "img": "thumbs/156b9a2b43ac.jpg", "t": "The river", "a": ["Rui Yi Mui", "Adam Aw", "Zac Ong", "Mithru Vigneshwara", "Jacky Boen", "Benjamin Low", "Andreas Schlegel"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413082", "abs": "In The River, sound samples recorded along the Singapore River are interpreted and visualized into the form of light by a custom made program. With the use of light representing life along the Singapore River, this artwork provides a new perspective of form and space. Digital and synthetic elements of light and acrylic echoes the organic elements of sounds and human activities within the environment of the river."}, {"v": "", "img": "thumbs/102b29cfb52b.jpg", "t": "The trees, our blood vessels", "a": ["Hasebe Yuto"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413077", "abs": "We can watch the shape of the trees grow. But we can't see the Blood vessels stretching throughout the body to carry blood. They have common branching structure. These natural morphogenesis structure is worthy of the form which is ruled by them."}, {"v": "", "img": "thumbs/bc9c77f224fb.jpg", "t": "The unemployed", "a": ["Zellen Jody"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413083", "abs": "\"The Unemployed\" is an interactive installation that visualizes world wide unemployment. Using data culled from online sources that list unemployment rates by country, \"The Unemployed\" represents the jobless as animated figures who inhabit a generic cityscape. The number of monthly unemployed varies from country to country ranging from a few thousand in sparsely populated places to many millions in places like the United States, India, and China. The software randomly cycles through approximately 200 countries, drawing the number of unemployed as aimless wanderers. If the country has a large number of unemployed, there are enough figures to fill and move with numerous silhouettes. If the country has minimal unemployment the silhouette is only partially filled."}, {"v": "", "img": "thumbs/e153efa759fc.jpg", "t": "Weburette", "a": ["Akatsuka Daisuke"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413094", "abs": "Viewers are not usually aware that the web browser undergoes various processes when they open a single web page. The weburette unveils the process through brewing a cocktail by mixing drops of different liquors where each liquor represents a specific process of the browser. Because the processes of each web page differently, each cocktail will be brewed differently as well, and have its own original taste and aroma. Therefore people can sense not only the visual representations of the web page, but also the taste and aroma."}, {"v": "", "img": "thumbs/9fd7d1a0b1fc.jpg", "t": "World eco-tope", "a": ["Kato Ayumi", "Watanabe Masahiko", "Fukazawa Yusuke", "Sato Tomomasa", "Mori Taketoshi"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413080", "abs": "World Eco-tope is an intuitive tele-presence art work that enables audience to feel distant country's real time weather closely. There is no need to utilize expressions of letters, weather symbols, or voice of weather forecaster. They emphasis on \"intuitiveness\" to design it. Any audience from children to elderly can enjoy the weather of distant countries, including the ones they do not even know of."}, {"v": "", "img": "thumbs/df8dc08b3b72.jpg", "t": "Woven milieu", "a": ["Nam Su Hyun"], "c": "SIGGRAPH Asia", "y": 2012, "k": "Art Gallery", "doi": "10.1145/2413076.2413088", "abs": "The author spent a year filming trees and took about 500 videos of trees standing in the middle of city Chicago, then cropped and recreated the videos. Finally, those become one video (1080 X 1920 px) of all different trees in different spaces. The role of trees are redefined from trivial objects to meditative mediations in the city. This video may arouse people's attention for trees."}, {"v": "", "img": "thumbs/cb06aa8722ba.jpg", "t": "Art and code", "a": ["Esteban García", "David Whittinghill"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019345", "abs": "In 1975 Aldo Giorgini developed a software program in FORTRAN called FIELDS, a numerical visual laboratory devoted entirely to art production. Working extensively as both artist and scientist, Giorgini was one of the first computer artists to combine software writing with early printing technologies, leaving an aesthetic legacy in the field of the digital arts. His individual process was innovative in that it consisted of producing pen-plotted drawings embellished by the artist's hand with painting, drawing, and screen-printing. This paper is the product of a multi-year study of Giorgini's primary source materials provided by his estate. The authors examine the methods used by Giorgini during the 1970s that allowed him to create computer-aided art, in the hope that publishing this work will ensure that future generations of digital artists, technologists and scientists can be educated in Giorgini's contribution to the history of the digital arts."}, {"v": "", "img": "thumbs/14e3cd8e913e.jpg", "t": "Collaboration with the future", "a": ["Matt Gorbet", "Susan Lk Gorbet", "Banny Banerjee"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019348", "abs": "This paper summarizes the development and implementation of a three-part infrastructure for the ongoing program of technology-based public artwork at Silicon Valley's newly expanded airport. The physical, technological, and human infrastructure provides flexibility and opportunities for future artists and future technologies while providing a robust framework for the ongoing maintenance and evolution of the program and mediating between the needs of artists and the constraints of an airport."}, {"v": "", "img": "thumbs/485dd2ab2035.jpg", "t": "Hildapromenade 4", "a": ["Philipp Engelhardt"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019357", "abs": "Philipp Engelhardt's Hildapromenade 4 installation visualizes the magical \"in-between\" of a set of photographs from a photo album he found on the street. The piece combines 3D technology and animations with the eight original Polaroid images to allow the spectator to enter the world of the woman shown in the pictures, narrating her story in a new context. Engelhardt uses his own graphical material in combination with the existing images to create his effects. In this way, the images are combined, reconstructed, and repeated so they can be seen in a new context on their own. To the observer, the visible alterations in the pictures are not immediately apparent; the manipulation is seen as the reality which the interface superposes. Engelhardt describes the piece's impact: \"Hildapromenade 4 reflects upon the value of the memories brought together in a photo album. At a time when photographs are increasingly stored on hard drives, and thus seem ever more elusive and intangible, it raises the question of which stories are able to be discovered in such often-unstructured visual material.\""}, {"v": "", "img": "thumbs/4f52e15c32f4.jpg", "t": "ItSpace", "a": ["Peter Michael Traub"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019363", "abs": "In the first version of ItSpace (2007), artist Peter Traub subverted the convention of the online social network by creating nine profile pages on the web site MySpace that featured everyday objects from his house. Each page had a photo of an object, a description, and, most importantly, a one-minute piece of music composed of recordings of the object being struck and resonated in various ways. The objects were \"friends\" with each other, and visitors to the site were invited to create new ItSpace pages to friend the existing ones. In the physical version of ItSpace, the original nine objects are brought partly back into the physical world through photographs affixed to backing boards. Each photo board has a push-button embedded in the featured object. When a visitor presses the button, it triggers a one- to two-minute remix of the object's sounds in real time. No two remixes are the same, and visitors may press multiple buttons and combine objects to create a collage. From an interface perspective, the interactive possibilities are limited by the push-button switches -- similar to how interaction and control on a site like Facebook or MySpace is limited within the tightly controlled confines of the commercial social network. In both the online and physical versions of ItSpace, Traub says, \"I want visitors to learn something about me that could not fit into the limiting format of a personal profile. Instead, they encounter a collection of objects from where I live and listen to how I treat those objects musically and aesthetically. ItSpace traces connections, imagined and real, between me and these objects in my home, telling the viewer/listener about the space in which I live in a way that language cannot convey.\""}, {"v": "", "img": "thumbs/0783141eed1d.jpg", "t": "Memoirs", "a": ["Yunsil Heo", "Hyunwoo Bang"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019358", "abs": "Memoirs is an interactive installation piece. It is a memoir of humanity's struggle to invent home appliances in pursuit of happiness. The piece is composed of a brown TV tube panel with a Polaroid camera on top. Its antique look stimulates a sense of nostalgia for old-fashioned home appliances. As you come close to the piece, a custom-made Polaroid camera automatically recognizes your face and takes a picture of you, and a physically simulated photo paper falls down and hits the pile of photos inside the virtual interior of the piece. Its digital data travels halfway around the earth to a web server in a distant country. Even though film-based photo-graphy is perishing and digital cameras are penetrating everyday objects, nothing can substitute for the feeling of anticipation while waiting for a photo to develop. Like bringing film to the photo printing office, taking a card with a printed web address from a stack creates a space in which to reminisce about the good old days. As you stand in front of the piece, the line between the virtual self and the physical self blurs. With photos stacking up on the web server, participants collectively build and share a single memory through the piece. Because of its intense and antique visual imprint, even when our experience with this piece dims, our shared childhood memories of electronic home appliances will remain."}, {"v": "", "img": "thumbs/c458d0350aeb.jpg", "t": "MOSTON", "a": ["Anya Belkina"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019352", "abs": "Ideas and observations stemming from bicultural experience and the larger issues of identity, immigration, and globalization are central to Anya Belkina's work. She fuses art with inquiry in the areas of biology, physics, and computer science. MOSTON, a 12-foot-tall suspended inflat-able sculpture, embodies an internal conception of home and the cyberfusion of two geographically distant locales: Moscow and Boston. Its surface design of printed artwork and documentary footage projection explores visual and historical commonalities of the two cities, commonalities that are more easily researched, documented, and shared in the era of instant global networking. While MOSTON's three-dimensional form references ethnically specific artifacts, the visual appeal and conceptual ingenuity of matryoshkas reach audiences beyond Russia and the Russian diaspora. A universally understood symbol of sequential creation, these toys offer a fitting framework for evoking the concentric evolution of Moscow's and Boston's city armatures. The implied nestedness of MOSTON is also congruent with the layered mental construct of \"home,\" especially as perceived by individuals with multicultural backgrounds. Belkina describes the scale of the project as essential, not only because her motherland is the largest country in the world, with an impressive record of pursuing hopeless megalomaniac ventures, but also because \"there is no place like home.\""}, {"v": "", "img": "thumbs/30693cca9637.jpg", "t": "Oh!m1gas", "a": ["Kuai Shen Auson"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019351", "abs": "Oh!m1gas: biomimetic stridulation environment is an installation-based exploration of a socially responsible art form, drawing on sustainable organic materials (in this case, a live ant colony) and stimulating interspecific interactions. As artist Kuai Shen Auson first observed at home in Ecuador, ants represent a natural superorganism which stands out due to its emergent social structure and self-organization. They generate bottom-up structures in order to solve problems by means of a complex network of local interactions. Kuai Shen explores the social similarities and differences between humans and ants through four key areas: cybernetics, autopoiesis, self-organization, and emergence. In this piece, the activity of an ant colony is observed, archiving the ants' movements and sounds inside a digital matrix. A pair of turntables constantly reacts to the changes that emerge from the colony (e.g., recruiting units for defense, task allocation when rebuilding the nest, organizing the harvesting of vegetation), thus spinning vinyl records that produce scratching sounds similar to the original stridulations of some ants. Leafcutter ants use the stridulatory organ, human DJ's use the turntable: a reactive soundscape, which reveals the connection between scratching as an aesthetic expression created by human culture, and the stridulation phenomena of leafcutter ants as a modulation mechanism for communication. Kuai Shen believes we can learn from the way the ants construct their miniature ecosystems. Like them, we can apply an experi-mental design approach based on organic architecture, where sounds and physical interaction, instead of divided living spaces, promote and consolidate the interaction of life."}, {"v": "", "img": "thumbs/06edf9feb4c3.jpg", "t": "Open House", "a": ["Jack Stenner", "Patrick LeMieux"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019362", "abs": "When the US housing market collapsed in 2008, so did the dreams of many middle- and lower-class Americans. Florida, California, Nevada, and Arizona were hit particularly hard, and not by a force of nature, but by the abstract and invisible hand of the market. Prior to the collapse, the movement of global capital seemed like a distant reality to most homeowners, but in the end it was the imaginary systems of value, and not bricks and mortar, that asserted the ultimate authority over our homes. Open House is an installation by Jack Stenner and Patrick LeMieux that allows visitors to telematically inhabit a \"distressed\" home in Gainesville, Florida. The house at 1617 NW 12th Road is currently in financial limbo, while undergoing the process of foreclosure due to the housing collapse. Virtual markets have transformed this otherwise livable property into a ghost house. Open House allows individuals to repopulate this disenfranchised space and assume the role of virtual squatters -- opening the door, flicking the lights, rattling the shutters, and remotely occupying the abandoned property. Live video feedback integrates real-time physical effects with one's virtual actions. Through Open House, virtual squatters can temporarily resist eviction by mirroring the market and becoming hybrid subjects occupying both virtual and physical space. Like the foolish man who builds his house on sand, we watch the architecture crumble around us. Download Open House at www.no-place.org/open_house."}, {"v": "", "img": "thumbs/95ddb52389ef.jpg", "t": "Reveries and Line Drawings", "a": ["Georgia Wall", "Nick Bastis"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019364", "abs": "In Reveries and Line Drawings, a projected video piece first shown at the School of the Art Institute of Chicago's New Blood exhibition, artists Georgia Wall and Nick Bastis offer methods in which stored spatial reveries can be recalled and represented using both analog and digital technologies. The piece posits forms in which spaces can be visualized without being physically present through the use of technology and memory. This process was explored with two participants, who visualized places they had never visited: Rebecca Zorach, an art historian at the University of Chicago, visualized Art & Soul, an experimental art center founded by a street gang and the MCA in the Lawndale neighborhood of Chicago that existed from 1968 to 1972; and Andrew Norman Wilson, an MFA candidate at SAIC, visualized the home of his collaborator in Bangalore, India -- he has come to know both the person and the place through the internet."}, {"v": "", "img": "thumbs/c39b376806f2.jpg", "t": "RolyPoly", "a": ["Design Incubation Centre"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019356", "abs": "RolyPoly is a networked installation designed to enable two individuals to \"sense\" the presence of each other, even though they may be physically apart. The mirrored movements in a pair of RolyPolys is such that a soft tap to rock one will simultaneously rock its partner to the same degree, instantly creating a corresponding reaction in the other. While the Internet provides a vast array of text messaging and video interaction options, RolyPoly offers a unique, spontaneous, and subtle mode of instant communication, exclusively between two individuals. RolyPoly addresses the phenomenon of people living apart and examines gesture as a different mode of communi-cation from speech and text. Through gestures, one is able to bring intimate familiarity to the other party, even when miles apart."}, {"v": "", "img": "thumbs/20f0a58434fc.jpg", "t": "Shadow awareness", "a": ["Yoshiyuki Miwa", "Shiroh Itai", "Takabumi Watanabe", "Hiroko Nishi"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019347", "abs": "This study discusses media technology that enables the continuous creation of performers' physical improvisation as inspired by the refection of imagery evoked from the audience. To realize this, the authors have focused on \"shadow media,\" which promote the continuous creation of imagery through \"bodily awareness.\" The authors have developed a system that can project shadows of the performers in various ways, which are then transformed into various shapes and colors. The shadows are connected to the performers' feet and projected on a \"passable\" slit screen set up between the stage and the audience. As a result, the interactive and mutual creation of imagery by performers and audience can form an \"empathetic\" stage. To demonstrate its validity, the authors applied the system to a dance performance at Festival della Scienza in Genoa, Italy."}, {"v": "", "img": "thumbs/5cd3562d9191.jpg", "t": "tele-present wind", "a": ["David Bowen"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019354", "abs": "David Bowen's work is concerned with aesthetics that result from interactive, reactive, and generative processes as they relate to intersections between natural and mechanical systems. tele-present wind consists of a field of x/y tilting devices connected to thin, dried plant stalks installed in the gallery, and a dried plant stalk connected to an accelerometer installed outdoors. When the wind blows, it causes the stalk outside to sway. The accelerometer detects this movement, transmitting it in real time to the grouping of devices in the gallery. The stalks in the gallery space move in unison, based on the movement of the wind outside. Bowen says of his work, \"I produce devices and situations that are set in motion to create drawings, movements, compositions, sounds, and objects based on their perception of and interaction with the space and time they occupy. The devices I construct often play the roles of both observer and creator, providing limited and mechanical perspectives of dynamic situations and living objects. The work is a result of the combination of a particular event and the residue left after the event.\" His work thus offers an imperfect and revealing transposition of data. \"In some ways, the devices are attempting, often futilely, to simulate or mimic a natural form, system, or function. When the mechanisms fail to replicate the natural system, the result is a completely unique outcome. It is these unpredictable occurrences that I find most fascinating. These outcomes are a collaboration between the natural form or function, the mechanism, and myself. This combination can be seen as an elaborate and even absurd method of capturing qualified data. I see the data collected in this manner as aesthetic data.\""}, {"v": "", "img": "thumbs/98524677adcd.jpg", "t": "The Garden of Error and Decay", "a": ["Michael Bielicky", "Kamila B. Richter"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019353", "abs": "The Garden of Error and Decay is a poetic visualization of real-time world catastrophes. It reflects on the network media reality of the 21st century through a continuous story of current world disasters, expressed by animated pictograms. Every time a disaster-related topic is discussed on Twitter, a new animation appears. Stock exchange information also influences the storytelling. Users interacting with the Garden have the opportunity to either eliminate or multiply the disaster scenes with a shooting device. However, it is not the user who actually has the power to decide in which direction the story develops once an event is triggered. As in real life, everything is driven by stock exchange dynamics; these dictate whether disasters proliferate or die down. This innovative moving image format is not a film, not a game, and not a nonlinear interactive story, but instead a real-time, data-driven narrative."}, {"v": "", "img": "thumbs/ec96ee41ad1e.jpg", "t": "The Insatiable", "a": ["Jawshing Arthur Liou"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019360", "abs": "The Insatiable is a video installation composited from a dozen sets of footage filmed at an open night market in Taiwan. It is part of the Things that are edible series, created by artist Jawshing Arthur Liou during an artistic residency in his hometown of Taipei after 16 years of living abroad. Working with both lens-based representation and digital post-production, Liou aims to transform recognizable imagery into realms only the mind can reach. His photographically realistic digital videos are filled with details with which he responds to the experience of illness, spiritual sanctuary, and the spectacles of life. The street scenes here are only half a mile away from his home. The visual strategy is a fusion of macro and micro views. The streetlights and mingling walkers are transformed into bodies of massive creatures, bearing resemblance to snakes, dragons, or even huge intestines. Liou says, \"Our intimacy with food and food-related culture makes this my first choice of subject matter. With digital post-production tools, I transformed the night market into massive bodies in the sky, a wedding banquet into jewelry-banded plates, and my mother's rice dish into landscapes.\" In this way he creates \"a rewarding treat in and of itself.\""}, {"v": "", "img": "thumbs/badd0efe6cee.jpg", "t": "The Readers Project", "a": ["Daniel C. Howe", "John Cayley"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019346", "abs": "The Readers Project is an aesthetically oriented system of software entities designed to explore the culture of human reading. These entities, or \"readers,\" navigate texts according to specific reading strategies based upon linguistic feature analysis and real-time probability models harvested from search engines. As such, they function as autonomous text generators, writing machines that become visible within and beyond the typographic dimension of the texts on which they operate. Thus far the authors have deployed the system in a number of interactive art installations at which audience members can view the aggregate behavior of the readers on a large screen display and also subscribe, via mobile device, to individual reader outputs. As the structures on which these readers operate are culturally and aesthetically implicated, they shed critical light on a range of institutional practices -- particularly those of reading and writing -- and explore what it means to engage with the literary in digital media."}, {"v": "", "img": "thumbs/d711a0d1831c.jpg", "t": "Third Skin", "a": ["Andrea Zapp"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019365", "abs": "Analogue becomes new Digital in Andrea Zapp's experiments in textile media narratives. Her work explores digital media and mapping of collective space through fabric print, image patterns, embroidery techniques, and other formats of physical object and embellishment. Third Skin captures imagery of our social, digital, and urban neighborhoods and interiors and transfers them to fabric and dress design. Zapp plays with Marshall McLuhan's idea of clothing being an extension of skin, way that media are an extension of body. In these pieces, photography, surveillance, and online footage become sources for hand-manufactured dresses as media narratives. They map collective and shared (images, digital and physical scenarios, and objects) onto domestic: a one-off garment as individual statement and choice. Skin is explored as a media surface and as a metaphor for mapping and merging physical and digital realities. Zapp's goal here is to establish a stronger emotional link between audience and media artwork. The virtual space is framed as other place of memory and home by capturing it in analogue paraphernalia, modeled on and manufactured from digital. Craft and media design objects and artifacts render digital space domestic and decorative, but with intention of provoking a surreal and paradoxical sense of longing and belonging to a parallel world. As Zapp suggests, the idea of a digital habitat, a shared environment, is main driving narrative in my installations, down to actual physical architecture in many of my earlier works resembling physical living spaces, hotels, houses, and private webcam scenarios to create related metaphors."}, {"v": "", "img": "thumbs/b938d275e777.jpg", "t": "Tomorrow will get better", "a": ["Matthew Cox"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019355", "abs": "Tomorrow will get better is a graphite drawing and laser-cut paper series of homes destroyed by various natural and man-made disasters. The images become ephemeral portraits of the houses that artist Matthew Cox has been \"collecting\" and using as drawing subjects. He describes them as characters in a narrative, similar to a gothic noir film. This series exhibits the final moments of a home before it is sent to a landfill, a premature burial that no one ever expects. Cox suggests that a relationship between the house and its inhabitants develops and evolves through daily events that take place within the confines of a home. A tragic event will jeopardize the physical stability of the home, resulting in the emotional instability of its inhabitants. The home has the potential to live and die just like its inhabitants, instead of remaining a solid structure built to survive through generations. A home develops character from its exterior surroundings as well as from its interior dialogue with the characters, who create a bond through memories and interactions. What are our attachments to our physical surroundings? How do they strengthen or weaken us? Houses, taken for granted as private property with equity and security, have the potential to reveal our vulnerability when their stability is subtracted from our lives."}, {"v": "", "img": "thumbs/103cbf2bbe04.jpg", "t": "Transplant", "a": ["Heidi Kumao"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019359", "abs": "Emerging from the intersection of sculpture, theater, and engineering, Heidi Kumao's video and machine art generates artistic spectacles in order to visualize the unseen: thought patterns, men-tal states, emotions, compulsions, and dreams. Through the creation of hybrid art forms (kinetic sculptures, animations, and interactive works), she explores the psychological underpinnings of everyday situations and institutional contexts, such as the nuclear family, mainstream media, and traditional gender roles. Transplant explores the lives of Japanese nationals and citizens who were interned in War Relocation Centers in the dusty desert of California during World War II, and how they cultivated gardens as a creative outlet to survive their confinement. Despite the horrendous conditions, residents of these \"camps\" constructed beautifully landscaped parks, ponds, and rock gardens. Transplant pays homage to their ingenuity and personal drive to transform gravel into gardens, altering their built environment as an act of defiance. This piece is part of the project Timed Release, a continuing series of intimate theater pieces about surviving confinement, supported by a 2009 Guggenheim Fellowship."}, {"v": "", "img": "thumbs/4fc127127de9.jpg", "t": "Travel Stones", "a": ["Jacquelyn Martino"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019361", "abs": "For the last decade, Jacquelyn Martino has focused her artistic practice on the design of a rule-based computational language to generate works in the visual design language of her evolving style. Travel Stones is an installation that applies this computational language to the creation of a collection of cultural artifacts from a fictitious ancient culture. Martino makes use of her rule system to generate a series of realistic cultural artifacts made plausible by the combination of their consistent design language and their grounding in a number of historical references. In the installation, the viewer reads a museum-style exhibition text detailing the origins of the artifacts. The imagined culture derives from an ancient people who carry their travel stones -- much as house keys -- as a way to access their home center, which is ultimately more spiritual than physical. The text leads the viewer to believe that the four accompanying paintings document a first-hand exposure to the stones by someone external to the culture. Passed from generation to generation, the stones further serve as resonant objects in the tracing of the people's history. Prompted by the drawings on the stones, the ancients recount tales of their origins to the next generations as well as to those they meet in travel. Through their stories, they maintain their sense of identity and place while simultaneously transferring fragments of their culture to others. In this piece, the enabling algorithmic production system is integral to Martino's process, but not particularly apparent to the viewer. The visual separation of high-tech process from pseudo-historic product calls into question any easy distinction between technology and culture in our own place and time."}, {"v": "", "img": "thumbs/5d2d83481757.jpg", "t": "Wait", "a": ["Julie Andreyev", "Simon Overstall"], "c": "SIGGRAPH", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2019342.2019350", "abs": "The human-companion species relationship is the starting point for the critique explored in Wait. Wait is part of the larger Animal Lover body of work, which is situated within a developing area of artistic practice referred to as \"interspecies collaboration.\" Contemporary cultures for the most part consider animals in terms of consumption: as food source, experimental subject, eco-logical resource, entertainment, etc. Critical to Animal Lover are questions and critiques addressing human relations with non-humans, particularly companion species. These works reconsider the animal as conscious, expressive, and creative, with complex states of being different from, but potentially as rich as, those of humans. In Wait, human and canine communication methodsare brought to bear within an interactive video installation. The piece uses interactive technologies that track the physical presence and movement of visitors to the work, allowing for direct contribution to the creation of meaning. Taking cues from the movements of the visitor, the dog (as imaged in the video) points to the relationship of control. The dog appears to be waiting for direction -- looking directly at the visitor, implying a state of suspended urgency. Visitors are compelled to ask questions about their relationship to the dog. In this way, the piece depicts the complex relationship between humans and companion species who share the domestic space. For the most part, companions such as dogs, cats, and birds are subject to conditions of human dwelling (home) and the systems and codes of power, space, and communication associated with it. Wait was produced in partnership with Banff New Media Institute, The Banff Centre, Banff, Canada."}, {"v": "", "img": "", "t": "Conserving digital art for deep time", "a": ["Francis T. Marchese"], "c": "SIGGRAPH", "y": 2011, "k": "Art Papers", "doi": "10.1145/2019342.2019344", "abs": "Displaying digital art in the late twentieth and early twenty-first centuries is already proving to be a challenge. Exhibiting this same art in the distant future will depend upon new thinking and practices developed today by artists, conservators, and curators. Established software engineering methods for dealing with aging systems can provide a new model for the conservation of digital art, and a foundation for the enhancement of art-historical scholarship. Artists with an interest in a more refined approach to the programming that underpins their work will also be interested in software engineering concepts."}, {"v": "", "img": "thumbs/e10229d9e780.jpg", "t": "Absurd Happiness", "a": ["Chen Zhang"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425791", "abs": "I once came across an interesting store selling animal models. It felt like I was in a zoo. As if in a trance, I experienced my most simple and happiest days again. But people who pass this store never notice this interesting zoo. At that moment, I knew there were too many people in this world crazy about business, never savoring time, and making worthless dreams. Maybe my creation can create an unusual world for you."}, {"v": "", "img": "thumbs/41fdac3c8ff0.jpg", "t": "Alternity - The Projected Perception of Spatial Harmonics", "a": ["F. Myles Sciotto"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425813", "abs": "Alternity is a real-time immersive and interactive architectural installation driven by brain-waves. Data from a wireless Electroencephalography (EEG) headset is collected and analyzed looking for coherent and harmonic patterns. These patterns are mapped to parameters of generative geometry and sound and spatially visualized by projecting on and through an array of silver hyperbolic screens while being sonified spatially using Ambisonics on a multiple channel sound system. The user now exists in virtual and physical tandem, his/her current perspective and awareness creates an immersive experience whereby they are experiencing the dynamic geometric landscape which they are generating in real time."}, {"v": "", "img": "thumbs/1eca114d096d.jpg", "t": "Burj Babil", "a": ["Guy Schofield", "Tom Schofield"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425814", "abs": "The direct indexical relationship between text and material is not only structurally embedded in the computer systems which manage, facilitate and entertain us, but rests in a history of science, belief, law and magic. While text is compiled in machine code, enacting the processes which turn on our street lights, render our videos and send data packets to the server, older societies performed other enactments of text, containing their own syntax and lexis. Religion, sorcerers, alchemists, writers of constitutions brought forth, with hubristic self-certainty, the world as we know it; spells, gold and human rights in that order. Burj Babil (Tower of Babel) is a video installation work. To create the tower, the source code file has been subjected to a number of transformation processes which corrupt and destroy the tower in different phases. The processes transform the vertex and face coordinates from the source code file into ASCII (American Standard Code for Information Interchange 2) characters. The results are then fed into language translation services (babelfish.yahoo.com). Most of the file is ignored since the sequence of characters do not correspond to real words. However when chance causes the ASCII sequence to form a recognizable word this will cause a corresponding physical translation of that vertex point. The resultant corrupted code is then used to re-make the model causing its eventual collapse. The final result of this process is a number of video sequences showing the destruction of the tower as its source code file is translated into different languages."}, {"v": "", "img": "thumbs/fc4180699b75.jpg", "t": "Dancing", "a": ["Yayoi Yokoyama"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425794", "abs": "Dance is an artform using the human body. These works were made to reflect various dances. I think dance is the most beautiful when the movement of clothes and dancers match. My aim in presenting this work was to achieve rhythmical movement and varied beauty. The works submitted are images of ballet, flamenco, and a tango. Ballet is expressed as an exquisite movement in a solemn atmosphere, flamenco is expressed as passion, and tango as a bending and twisting of the body. The visual narrative is important to me - I try to create works which tell a story that delight and intrigue. There are a lot of mathematical forms in my works. The mathematical form is natural and integral to computational art. There are many strategies in computational work: some involve repeating simple designs or mathematical concepts, or a set number of iterations. I always feel that image making is all about a balance in proportion. I have found that the more I inform myself of these proportions the more they enter my intuitive creative process."}, {"v": "", "img": "thumbs/d26761af5138.jpg", "t": "FRAMEWORKS", "a": ["Roychoudhury Promila", "Sures Kumar Thoddu Srinivasan"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425808", "abs": "\"Frameworks\" is an interactive installation trying to enhance the experience of an architectural space. This installation is about generating warmth to medium like walls of an architectural space that would otherwise be considered a cold and insignificant space. Through this installation, we witness an opportunity to interact with the walls to add a new meaning to that space. This installation showcases how interactivity can be explored for opening up new possibilities to create more immersive experiences. The artists have tried to achieve this immersive experience by developing a game, where a virtual character plays with walls and their depth, in an actual physical space. A game is considered as one of the most engaging mediums. The artist tries to take a simple game and transform it into a more engaging and immersive experience primarily because of the scale and the seamless integration of the architectural spaces and structures into the game play. The installation will be designed in response to specific spaces or public sites selected by the artist."}, {"v": "", "img": "thumbs/cfd79ee511b0.jpg", "t": "Future Creatures", "a": ["Eunjung Hwang"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425800", "abs": "The main aspect of my art making is to explore unexorcised images from the world of dreams and infancy, follow them to their farthest points and then represent them in unique combinations of digital and physical forms. My intended result is to fully restore the dynamic and beauty of the intense image world. My projects start from creating a variety of characters which are rooted in dreams and subconscious images. In the belief of animism, everything in my artistic observation has been represented as a form of visual characters. The characters unfold narratives by their fantastic reality following a structure of interwoven dream logic. Different narratives are connected to each other through this dream logic. The narratives loop through a series of imaginary cycles of infancy, dream, death and the beyond."}, {"v": "", "img": "thumbs/93d103bc458d.jpg", "t": "Granular Graph", "a": ["Fong Wah Hui"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425806", "abs": "Granular Graph II: The tank and the pendulum is an audio-visual interactive instrument about musical gesture and its notation. The idea is inspired by a pendulum-based scientific instrument called Harmonograph. In its simplest version, two pendulums are suspended through holes in a table. The swinging pendulums cause an attached pen to move, thus creating a curvaceous geometric image that represents harmonies and intervals in musical scales. Granular Graph II: The tank and the pendulum not only re-appropriates the idea of a mechanism by inviting audiences to form a living pendulum, but uses water to graph the amount of energy, effort and tension involved in causing the sounds. According to its original design, two pendulums are arranged in a perpendicular relationship. While one pendulum keeps the distance between the pivot and the center of mass (in this case, weight) constant, the other pendulum changes the position of the weight to create different lengths, resulting in different frequencies. In the current version, any visitor can play the instrument by sitting or standing on one of two swings. The sitting swing functions as the constant length pendulum, while the standing swing changes the length of the pendulum by changing the center of mass, depending on the actions of the visitors. The resulting pendular movements alter the waterflow in a tank located above the beam, generating not only a vibrating pattern but also sounds. These sounds result from the combination of the two vibrations, just like two notes playing in unison. The image of the water vibrations is shown via video projection. The sounds and images can be regarded as forms of dynamic notation that graphically and kinetically represent the audience's gesture and energy expenditure."}, {"v": "", "img": "thumbs/fdfcac663e6b.jpg", "t": "I am looking at you looking at me looking ∞ Ver.2011", "a": ["Remu Iwai"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425797", "abs": "I am looking at you You are looking at me I am looking at you looking at me I am looking at you looking at me looking ∞ Experiment! Fantasy! Documentary! CCTV cameras as video cameras, lift as a performing stage: A \"Closed Circuit\" Live Performance x Video Arts I always feel that we are being monitored by someone, by plenty of \"Eyes in the Sky\", by Paparazzi, by Youtubers, by The Authorities, by self-censorship. In the future, can we keep on searching for and questioning the \"Truth\"? Using the CCTV system as a metaphor, to present an attitude - Who is afraid of...? Magnifying our daily life fantasies, reversing our passive situation of being monitored, being initiative to create arts, opening up space for the \"Closed Circuit\". It's time to step out of the box, \"Throw Away Your Books, Rally in the Streets\"! Getting to know our city, to speak out, hoping to make a real change."}, {"v": "", "img": "thumbs/e2e5164458ab.jpg", "t": "i made this. you play this. we are enemies", "a": ["Jason Nelson"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425804", "abs": "The work is playable here. i made this. you play this. we are enemies. is an art game and interactive digital poem which uses game levels built on screen shots from influential community based websites/portals. Using messy hand drawn elements, strange texts, sounds and multimedia layering, the artwork lets users play in the worlds hovering over and beneath what we browse, to exist outside/over their controlling constraints. Your arrow keys and space bar will guide you, with the occasional mouse click begging for attention. Each day the internet is humming with a million small interventions. From the humorous mocking of community content sites like Fark, to the net gate keepers Yahoo and Google, partisan political portals like Huffington Post or the open source/file sharing pirates of Mininova, the web is an easy tool/weapon for meddling/influencing and sharing/forcing/alluring your opinion on whomever clicks. And yet this digiscape is a deceiving and uneasy place, with continual streams of generic expression/content, cute dogs and accident clips, knocking against an incredible range of political/social beliefs hidden beneath the screen. Even short sequences of words, titled links or blinking ads can reveal the strange, wondrous and treacherous."}, {"v": "", "img": "thumbs/e5efd2543797.jpg", "t": "Immersive Music Painter", "a": ["Kevin Carpentier"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425793", "abs": "The body has a four dimensional structure in space and in time. That is why it can act as an instrument. We imagine an installation in which movements and postures of the hand are translated into sound. However, we thought that it wouldn't be enough for the performer to merely hear the sound of his body: we wanted to provide him a visual trace of his hand in space. The performer can move freely inside the body-made composition but he can also interact with past traces of himself to induce new effects on current sounds. There are three main virtual instruments a performer can create: a light trail that loops automatically; strings the performer will draw and pluck; drums constituted by pairs of balls that collide."}, {"v": "", "img": "thumbs/15e48eb5787b.jpg", "t": "Interactive Fashion \"Intimacy\"", "a": ["Daan Roosegaarde"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425796", "abs": "\"Intimacy\" by artist Daan Roosegaarde is a fashion project exploring the relation between intimacy and technology. Its high-tech garments entitled 'Intimacy White' and 'Intimacy Black' are made out of opaque smart electronic paper that become increasingly transparent upon close and personal encounters with people. Here social interactions determine the garments' level of transparency, creating a sensual play of disclosure."}, {"v": "", "img": "thumbs/abdf5b592bd4.jpg", "t": "Land of Pink & Orange", "a": ["Dmitry Resnyansky"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425803", "abs": "Objects are not always what they appear to be. Through this piece, I wanted to express this notion of objects in disguise and provide commentary on the nature of design design in today's contemporary aesthetic. The scenario is indeed familiar to many of us: the user coming into contact with an artifact of industrial, graphic, urban or any form of digitally interactive design from today's sphere of post-modernism, feeling a slight sense of miscommunication, and only upon some reflection discovering the true intent or function of the artifact in question. The user does not immediately realise what it is that they are observing, yet it is the realisation itself which cements the double meaning of such artifacts. An inconvenience to some, and a pleasure to others, I wanted to consciously communicate such a quality through this piece. Through the process of abstract imagery and visual double meaning, an alternate reality should emerge, bringing to light the surrealism of the situation inside both the 2D image, and hopefully, in our own 3D world."}, {"v": "", "img": "thumbs/5a219cf4336e.jpg", "t": "Life Twitter Live", "a": ["Tai-Wei Kan"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425809", "abs": "As the Internet becomes more and more popular and advanced, people want to keep online and share his/her status with friends at any time and any place. Because of this trend, all kinds of websites that provide social networking services, such as Twitter, become very popular rapidly. However, as more and more social networking users demanding higher immediateness and interaction, using mobile device to send message or to tweet their status is still insufficient. Consequently, we start to integrate everyday commodities (such as coffee mug) with electronic sensors. These reformed commodities or furniture in the living space can communicate with computer through wireless channel, so that the system could know the current status of the user. With this configuration, the system would tweet what we are doing to Twitter website. For example, when we turn off the light at the living room and get ready to go to bed late at night, the system would send message such as \"I am going to bed, good night\" automatically because the light is obviously dimmed; or when the user holds his/her mug, the system would send message such as \"so thirsty, let's have a cup of mocha\". During the exhibition, participants can share own private status with worldwide friends by just a simply behavior of using these reformed commodities or furniture. On the other hand, participants also can follow \"Life Twitter\" (account name is \"\"_test_dk\"\", http://twitter.com/_test_dk), and monitor everything in the exhibition space anytime anywhere. In summary, we propose a system that reshapes everyday commodities with sensors. When users use these reformed commodities, the system would tweet what they are doing."}, {"v": "", "img": "thumbs/2be965ad4e29.jpg", "t": "Light Space The Stone", "a": ["Jae Min Lee"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425811", "abs": "Light Space The Stone proposes a new form of Digital Media Installation Work which has a strong basis in modern Digital Technology, but is inspired by Korean traditional views of nature. It considers nature not merely by its environmental importance but also questions how to create a harmony between human-made Digital Media and ecological needs. The work has bumpy shapes just like rock surfaces and electronic circuits on its surface that change lighting when the surrounding brightness changes. Each electronic circuit has CdS Cell censoring the brightness, transistor and LEDs (Light Emitting Diodes). Each pixel is 2cm by 2cm; a square shaped pixel of two thousand is placed along the surface of the art work. This three-dimensional form of work is an attempt to pull away from a typical form of LED display used before, and to create visual enjoyment and explore the potential of digital sculptures. This work reveals its form by the element of light. Generally light is used to gleam through the texts or images to convey a message or to light the space as a lighting device. In contrast, the lighting of each pixel changes according to the change in lighting surrounding them. The light becomes an element of the sculpture."}, {"v": "", "img": "", "t": "Lilliput", "a": ["Reetta Neittaanmäki", "Jari Suominen"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425805", "abs": "Lilliput is a digital peep show installation inspired by Edison's Kinetoscope and other early motion picture devices. Lilliput is a little man who lives in a room built into a wooden box. When he wakes up in his bed he is surprised to find out he is under surveillance. The spectator can watch animated 3D characters through the peepholes on top of the box. The animation loop is 2.5 minutes long and it shows Lilliput's room from above. Big staring eyes are peeping at the character from the window and doors and he gets annoyed when he can't get rid of them. In the end the spectator becomes one of the peeping eyes that disturbs Lilliput's life. The unlucky little man continues his life under surveillance endlessly. The form of the installation and the design of animation gives an impression of a magic box. Lilliput's voice, footsteps and other sounds can be heard when one approaches the installation. A vibrating speaker also gives spectator also a haptic experience. The box has a lock indicating that there's a secret inside. The installation goes back to the early roots of moving images by offering a small scale spectacle for one viewer at a time. The theme of the work is peeping and its different forms in our society, such as reality television and surveillance cameras. It doesn't give any straight answers about the theme but rather gives the viewer freedom in his or her own interpretations."}, {"v": "", "img": "thumbs/803b7eed14e5.jpg", "t": "Lit Tree", "a": ["Elliot Woods", "Mimi Son"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425815", "abs": "Lit Tree invites viewers with a choreographed cloud of light that can respond to visitors' motions. By applying a superficial layer of immediate interaction to the tree, people can better appreciate the long term invisible interaction that they share with it. Kimchi and Chips proposes an alternative to media facades, where designers and advertisers use LED and projection technology to display graphics through the built environment. They suggest the use of media facades can lead to an asymptote of confusion and visual pollution. Instead, they ask if an unscripted entity within our environment can also be visually celebrated. If the use of trees can be promoted as outdoor visual media, then cities can be planned to balance between nature and our continuing desire for large scale outdoor visual media. Since the color temperature of light produced by a video projector's bulb is similar to the surface of the sun (5800K), the tree naturally reacts to the light that is projected onto it. In this way we can speak to the tree in the medium it can react to most immediately, light. We listen to the tree's reaction by the means of the detailed 3D scans of its shape that are produced by the projection system. This type of photosynthesis allows for the tree to self-optimize for projection. Leaves which are in shadow move out to find the projector's light. Light wasted inside the tree is absorbed by photosynthesis, converting local carbon dioxide to oxygen."}, {"v": "", "img": "thumbs/ce99fdef884d.jpg", "t": "Miroir/Mirror", "a": ["Karleen Groupierre", "Adrien Mazaud", "Sophie Daste"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425816", "abs": "Miroir is an artistic installation using augmented reality technology. The visual decor and sound has been designed to immerse the viewer in a strange universe. The mirror is an object often linked to illusion. In Lewis Carroll's Through the Looking-Glass, the mirror symbolizes the portal between the real world and a world that is strange. As a star attraction at carnivals, the hall of mirrors allows viewers to see images of themselves as multiplied and distorted. A curved mirror is also necessary to achieve the visual trompe l'oeil as anamorphosis. So it's no coincidence that the mirror is at the heart of the installation - it is the open window to another world. The extraordinary feature here is the transformation of the face of the viewer into an animal face. The aesthetics are a blend of naturalistic paintings and Japanese print. The literary references associated with the anthropomorphic are many, ancient myths, Ovid's Metamorphoses, Les Fables of La Fontaine, and Japanese Mythology. Anthropomorphism is a method used by cartoonists to denounce the atrocities of people by giving them the head of the animal to which it grants negative qualities. In addition to being caricaturist, Grandville is also known to have illustrated the first edition of Les Fables of La Fontaine. Once he has looked in the mirror, the viewer can interact with its double anthropomorphic, an augmented reality that allows the viewer to merge with the supernatural."}, {"v": "", "img": "thumbs/ee7a1a6e9276.jpg", "t": "Mont", "a": ["Hyunwoo Bang", "Yunsil Heo"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425790", "abs": "Imagine yourself walking along a calm beach at night. It's dark and all you hear and feel are breaking waves and sand between your toes. You sit on the beach and start digging up the sand, creating ditches and hummocks. Right at that moment, light swells up from the bottom of your terrain and it gradually becomes a sea of clouds. Suddenly your ditch becomes a giant valley and small hills rise up through the clouds forming a cordillera. This is what you experience with the piece Mont. Mont is an interactive installation composed of a projector, a depth-sensing camera and a computer. Its camera senses the volumetric topology of the ground below the piece and projects a hallucination of clouds, giving spectators illusions of mountains and canyons. Mont offers a playground of creation giving people a god-like ability to create worlds of their own. In a sense, Mont is a meta-creation, a magnificent sculpture delineating wonders of the nature but still existing as a creative medium. Utilizing raw materials, Mont seamlessly fuses itself with nature. With its noninvasive nature, Mont will bridge the gaps between the real world and the digital new media by enabling collaborations between technology, human and nature."}, {"v": "", "img": "thumbs/a49578cd2d9a.jpg", "t": "MOSTON", "a": ["Anya Belkina"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425801", "abs": "MOSTON is a 12-foot tall suspended inflatable sculpture that embodies the cyberfusion of two geographically distant locales: Moscow and Boston. While MOSTON's three-dimensional form references ethnically specific artifacts, the visual appeal and conceptual ingenuity of \"matryoshkas\" reach audiences beyond Russia and Russian diasporas. A universally understood symbol of sequential creation, these toys offer a fitting framework for evoking the concentric evolution of Moscow's and Boston's city armatures."}, {"v": "", "img": "thumbs/1ebf10cd18b6.jpg", "t": "Mount Qaf: A Multimedia Performance Installation Infusing Electronic Art and The Sonic and Visual A", "a": ["Amir Ghahary", "Mark Nazemi", "Diane Gromala"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425795", "abs": "Mount Qaf is an audiovisual performance installation and a spatial/temporal structure which expresses the aesthetic dimensions of Sufism and electronic music culture. The experience combines generative digital art based on animating Persian patterns with eastern architectural motifs including Muqarnas, in syncopation with an ethnic electronic soundscape encountered through multi-channel acoustics. By re-imagining the traditional aesthetics of Sufism through the lens of electronic art and digital culture, the visual music journey of Mount Qaf sacralizes a nostalgia for the ancient past as well as reverence for an expectant technological future."}, {"v": "", "img": "thumbs/5e516aba0704.jpg", "t": "Pendulum", "a": ["Semi Kim", "Hwanik Jo", "Junghwan Sung", "Byongsue Kang", "Jaeyoung Kim", "Hyohoun No", "Minjoo Lee"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425812", "abs": "\"The pendulum series\" explores the meaning of space through the process of pendulum movement. These pieces have virtual pendulums and real ones. We can see the flow of invisible energy in virtual pendulums. Hybrid Form (Digital and Analogue, Space and Emptiness) The movement of a pendulum generates special energy in the impact between first and second pendulum, and this energy is delivered to the last pendulum in the law of momentum conservation. This energy is invisible, but we experience it by viewing a pendulum movement. This piece has virtual pendulums with real ones. Real pendulums are located on both sides, and they are made from electromagnets. Virtual pendulums, located in the middle of this piece, are three-dimensional images, and show the flow of energy as an expressive medium. Impacting objects (magnetic pendulums) and elements in the video animation (energy) create hybrid visuals. With Pendulum#1, we can extend the meaning of emptiness inherent in media art. Emotions and Words Pendulum#2 expresses very emotional feelings. Energy generated from an impact between real pendulums makes virtual pendulums, and virtual ones explore or communicate lots of information with network connections. This energy is communicative, hybrid and emotional. This energy crosses the border between real and virtual - like internet articles that have been exchanged or generated continuously in networks, and the symbolism of words in articles. We might feel emotional 'temperatures' through the meaning of words. 'Happiness' and 'peace' is warmer than 'war' or 'suicide'. Cool words are decomposed gradually by communication and resonate of the repetitive movement of pendulums. In short, this piece mixes and reassigns words."}, {"v": "", "img": "thumbs/56099123bee0.jpg", "t": "Scent of Lollipop", "a": ["Jaejoong Lee", "Jinwan Park"], "c": "SIGGRAPH Asia", "y": 2011, "k": "Art Gallery", "doi": "10.1145/2077355.2425798", "abs": "This work represents memories of childhood. A lollipop is one of the world's most be loved snacks. Although it is common to normal people, a lollipop is not an affordable snack to poor children. This work expresses an imaginary lollipop by a user's drawing. The candy drawing is printed on a paper having a message on its backside. The message represents memories of childhood. The printer uses fragrance inks to print out an origami with a lollipop sh

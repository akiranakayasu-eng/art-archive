ced as both bodily and social, with collisions reading as shared mischief more than punishment. We contribute an art-led, large-scale architecture that couples predictive models with embodied interaction while retaining ambiguity: visible constraint (glass), public policy signals (floor/projections/rail), and an RL lure that persuades by staging opportunity. Drawing on in-exhibition observations, we report regularities that motivate lightweight, gallery-feasible evaluations without altering the artwork, thereby paving the way for systematic study. More broadly, the work reframes “good guidance” not only as seamlessness but as strategic visibility, an ethico-aesthetic stance on when power should be allowed to show, and the autonomy we trade when an algorithm anticipates our limits.", "ja": "なぜ、VRがすでに無限の探索を約束しているのに、別の仮想現実アート作品を作るのか？ 私たちは率直な挑発から始めました：仮想の約束と物質的な現実の間のギャップを身体で感じさせることです。このインスタレーションは、透明なガラス迷路の中に完全に遮断されたヘッドセットを埋め込むことで、制約が視覚的に残ります。適応型強化学習（RL）ルアーは、パートナーとして扱われ、命令ではなくやさしい招待で顕著性を調整します。10回以上の展示（2017–2025）を通じて、作品は観客の傍観者的な覗き見から、観客・機械パフォーマー・アーティスト・アーキテクトの間のエージェンシーの振付へと進化しました。ポリシーの意図を床、投影、レールに部分的に公開することで、通常はシームレスなUXとして隠されているものが劇的に可視化され、ガイダンスは身体的かつ社会的に経験され、衝突は罰ではなく共有されたいたずらとして読まれます。私たちは、予測モデルと具現的相互作用を組み合わせた、曖昧さを保つアート主導の大規模建築を提供します：可視的な制約（ガラス）、公共のポリシーシグナル（床/投影/レール）、そして機会を演出することで説得するRLルアーです。展示中の観察に基づき、作品を変更せずに実現可能な軽量なギャラリー評価を動機付ける規則性を報告し、体系的研究への道を開きます。より広くは、「良いガイダンス」をシームレスさだけでなく、戦略的可視性として再構築し、アルゴリズムが私たちの限界を予測する際に、権力が示されるべき時と、私たちが取引する自律性に関する倫理美学的立場を提示します。", "tags": ["Algorithmic Persuasion", "embodied interaction"]}, {"v": "", "img": "thumbs/12ee6e863fb6.jpg", "t": "Orbital Oscillation: Dematerialisation of Craft through Imperceptible Actuation of a Glass Object", "a": ["Pok Yin Victor Leung", "Tobias Klein"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767601", "abs": "Orbital Oscillation is a kinetic sculpture that explores the phenomenology of time through a deceptively simple act: a glass object rolling in slow, deliberate orbits on a round table. The object’s movement is not self-initiated but subtly actuated by a concealed robotic system beneath the table’s surface. Using real-time sensing and feedback control, the table imperceptibly tilts to inject energy into the glass object’s trajectory. On the one hand, this paper presents the mechatronic and algorithmic design of the system, detailing how sensing, control, and form are orchestrated to create an experience that appears autonomous, fluid, and continuous, yet is precisely choreographed. On the other hand, the conceptual framework of Digital Craft is discussed, placing the work in the context of perception through Husserl, and a critical engagement with technology through Heidegger and Hui. The work invites reflection on how machine intelligence can shape perception without revealing its own presence.", "ja": "Orbital Oscillationは、円形テーブル上でガラス製オブジェクトがゆっくりと意図的な軌道を描きながら転がるという、時間の現象学を探求するキネティック・スカルプチャです。このオブジェクトの動きは自己開始されるものではなく、テーブル表面下に隠されたロボットシステムによって微妙に作動させられます。リアルタイムのセンシングとフィードバック制御を用いて、テーブルは意識されないほど傾斜し、ガラスオブジェクトの軌道にエネルギーを注入します。一方で、本稿はシステムのメカトロニクスとアルゴリズム設計を提示し、センシング、制御、形態がどのように調和して自律的で流動的かつ連続的に見える体験を作り出すかを詳細に述べます。もう一方で、デジタルクラフトの概念的枠組みを論じ、フッサールによる知覚、ハイデッガーとホイによる技術への批判的関与という文脈で本作品を位置付けます。この作品は、機械知能がその存在を明らかにせずに知覚を形作る方法についての省察を促します。", "tags": ["Digital Craft", "feedback control", "glass art", "imperceptible motion", "Kinetic Sculpture", "mechatronic design", "phenomenology"]}, {"v": "", "img": "thumbs/87f98377bbce.jpg", "t": "Participatory Evolution of Artificial Life Systems via Semantic Feedback", "a": ["Shuowen Li", "Kexin Wang", "Minglu Fang", "Danqi Huang", "Ali Asadipour", "Haipeng Mi", "Yitong Sun"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767620", "abs": "We present a semantic-feedback framework that treats natural language as a regulatory signal for evolving artificial-life systems. Instead of using prompts to select finished images, text in our system shapes the dynamics of an interactive ecosystem, allowing audiences to cultivate behaviors over time. The framework couples a learned mapping from prompts to simulation parameters with evolutionary search and vision–language evaluation, so user intent modulates both visible outcomes and the underlying generative rules. It supports iterative prompt refinement, multi-agent interaction, and the synthesis of new collective rules from community input. In a user study, participants achieved higher semantic alignment and reported a greater sense of control than with manual tuning, while behaviors remained diverse across generations. As an art-led contribution, the work reframes authoring as participatory cultivation and advances open-ended evolution as a socially distributed, not solely algorithmic, process; as a tool contribution, it offers a practical platform for co-creative generative design.", "ja": "私たちは、自然言語を人工生命システムの進化を制御するシグナルとして扱うセマンティック・フィードバックフレームワークを提示します。完成した画像を選択するためのプロンプトを使用する代わりに、システム内のテキストがインタラクティブなエコシステムのダイナミクスを形作り、観客が時間とともに行動を育成できるようにします。このフレームワークは、プロンプトからシミュレーションパラメータへの学習マッピングを進化的探索およびビジョン・ランゲージ評価と結合し、ユーザーの意図が可視的な結果と基礎となる生成規則の両方を調整します。反復的なプロンプトの洗練、マルチエージェント相互作用、コミュニティ入力から新しい集合的規則の合成をサポートします。ユーザー研究では、参加者は手動調整と比較して、より高いセマンティック整合性を達成し、より大きなコントロール感を報告しましたが、世代を超えて行動は多様性を保ちました。芸術主導の貢献として、本研究は著者活動を参加型の育成として再構築し、オープンエンドな進化を主にアルゴリズム的でない、社会的に分散されたプロセスとして前進させます。ツールとしての貢献は、共創的生成デザインの実用的なプラットフォームを提供します。", "tags": ["agent-based simulation.", "artificial life", "generative systems", "natural language interaction", "semantic feedback"]}, {"v": "", "img": "thumbs/2edc3dd57c4e.jpg", "t": "Physical Manifestation of Generative AI Music Systems for Live Performance", "a": ["Perry Naseck", "Lancelot Blanchard", "Madhav Lavakare", "Kimaya Lecamwasam", "Joseph A. Paradiso"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767613", "abs": "This paper explores the physical manifestation of generative AI music systems for live performance, focusing on bridging the expressive gap between AI-generated music and audience perception. Through a year-long collaboration with a human performer, we constructed a kinetic sculpture that visualizes the outputs of an AI jam_bot during concerts. The sculpture, powered by ML-based and pattern-driven mapping methodologies, interprets real-time AI musical decisions as expressive movements. Audience feedback indicates increased engagement and curiosity, although interpretability remains a challenge. Our work highlights the potential of embodied visualization to establish communicative presence for AI performers and suggests avenues for future research.", "ja": "この論文では、ライブパフォーマンスにおける生成的AI音楽システムの物理的具現化を探求し、AI生成音楽と観客認識との間の表現ギャップを埋めることに焦点を当てています。人間の演奏者との1年間にわたる協働を通じて、コンサート中にAIジャムボットの出力を可視化するキネティック・スカルプチャーを構築しました。このスカルプチャーは、機械学習ベースおよびパターン駆動型のマッピング手法により駆動され、リアルタイムのAI音楽的決定を表情豊かな動きとして解釈します。観客のフィードバックは、関与と好奇心の増加を示す一方で、解釈可能性は依然として課題であることを示しています。我々の研究は、AIパフォーマーに対するコミュニケーティブな存在感を確立するための具現化された可視化の可能性を強調し、将来的な研究の方向性を示唆しています。", "tags": ["Artificial Intelligence", "Audience", "embodiment", "Generative AI", "Interaction", "Kinetic Sculpture", "Live", "Music", "Perception", "Performance", "Sculpture", "Visualization"]}, {"v": "", "img": "thumbs/f38287322bbe.jpg", "t": "Sonic Shower: An interactive sound installation exploring sonification of water", "a": ["Yuxuan Bai", "Lei Wu", "PerMagnus Lindborg"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767603", "abs": "Sonic Shower is an interactive sound installation. The artwork relates to Velasco’s research on distinguishing water temperature by its sound and the use of sound waves to cleanse the body as depicted in the science-fiction series Star Trek. In addition, Sonic Shower is a speculative design that imagines a dystopian future where individuals, confronted with severe water scarcity, employ technology to replicate the shower experience for psychological solace. The installation creates a playful experience by converting a classic wall-mounted standing multi-shower system into loudspeakers and MIDI controllers that generate sound using a Max patcher.", "ja": "Sonic Showerはインタラクティブなサウンドインスタレーションです。この作品は、ヴェラスコの水温を音で区別する研究と、SFシリーズ『スタートレック』に描かれる音波で身体を浄化する概念に関連しています。さらに、Sonic Showerは、深刻な水不足に直面した個人が心理的慰めのためにシャワー体験を再現する技術を用いるディストピア的未来を想像した投機的デザインです。このインスタレーションは、従来の壁掛け式立ち式マルチシャワーシステムをスピーカーとMIDIコントローラーに変換し、Maxパッチャーを使って音を生成することで、遊び心のある体験を創出します。", "tags": ["Data Sonification", "Interactive Sound Installation", "Shower Experience", "Water Conservation"]}, {"v": "", "img": "thumbs/fe9cc3ded7b5.jpg", "t": "Subversive Methodologies: Dadaist Approaches to Generative AI", "a": ["Anika Cook"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767597", "abs": "Advances in generative art offer distinctive creative possibilities while also raising questions about control, power, and agency. This paper examines the parallels between Dadaist photomontage — techniques that subverted readymade images through decontextualisation and aesthetic exploration — and recent generative AI art practices. While the Dadaists harnessed appropriation to disrupt dominant narratives and express dissent, generative AI’s algorithmic opacity complicates artists’ agency and muddles contextual meanings. By analysing Dadaist methodologies, this paper encourages artists to engage with generative AI in a deliberate and considered manner, reframing its outputs as tools for disruption and creative intervention.", "ja": "生成的アートの進歩は、独自の創造的可能性を提供すると同時に、制御、権力、エージェンシーに関する疑問も提起します。本稿では、既成の画像を脱文脈化と美的探求によって転覆させたダダイズムのフォトモンタージュと、最近の生成的AIアート実践との類似点を検証します。ダダイズムは、適応を利用して支配的な物語を撹乱し、不満を表現しましたが、生成的AIのアルゴリズムの不透明性はアーティストのエージェンシーを複雑にし、文脈的意味を曖昧にします。ダダイズムの手法を分析することで、本稿はアーティストが生成的AIに意図的かつ慎重に関わり、その成果物を撹乱と創造的介入のツールとして再構築することを促します。", "tags": ["Art", "Artificial Intelligence", "Collage", "Decontextualisation", "Experimental Methodologies", "Mixed Media"]}, {"v": "", "img": "thumbs/43fa18431efa.jpg", "t": "The Cyclical Night: Glitches, Governance, and the Erasure of Night in Google Street View", "a": ["Qingyang Yu", "Jianhao Zheng", "Yao Tong"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767618", "abs": "“La Noche Cíclica” is a multi-part project that investigates the algorithmic suppression of night in Google Street View. Through a video sculpture, web archive, print album, and conceptual intervention, the work reveals how fragments of nighttime—caused by system delays and stitching errors—disrupt the platform’s default spatial-temperal logic of continous daylight. These fleeting anomalies challenge the linear, functional temporality of machine vision and question the infrastructure behind digital mapping systems. The project explores how data-driven media reconstruct the visible world, and how moments of error can become sites of resistance, visibility, and alternative spatial memory.", "ja": "「La Noche Cíclica」は、Googleストリートビューにおける夜間のアルゴリズム的抑制を調査するマルチパートプロジェクトです。ビデオ彫刻、ウェブアーカイブ、印刷アルバム、概念的介入を通じて、システム遅延やステッチングエラーによって生じる夜間の断片が、プラットフォームのデフォルトである連続した昼光の空間時間論理をどのように乱すかを明らかにします。これらの一瞬の異常は、機械ビジョンの線形で機能的な時間性に挑戦し、デジタルマッピングシステムのインフラストラクチャに疑問を投げかけます。本プロジェクトは、データ駆動型メディアが可視世界をどのように再構築するか、そしてエラーの瞬間が抵抗、可視性、代替的空間記憶の場となり得るかを探求します。", "tags": ["Algorithmic Governance", "Capitalist Temporality", "Machine Vision", "Media Infrastructure"]}, {"v": "", "img": "thumbs/e944062bb2ee.jpg", "t": "The Dream of Zhuang Zhou: Entangled Agencies in Multispecies Virtual Reality", "a": ["Shuai Zou", "Bingyuan Wang", "Boyu Li", "Linlin Cai", "Qiuting Xia", "Zeyu Wang"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767609", "abs": "This paper presents The Dream of Zhuang Zhou, a multispecies virtual reality (VR) experience that operationalizes Zhuangzi’s concept of “transformative embodiment” through the lens of the “Butterfly Dream” parable. Leveraging 3D Gaussian Splatting technologies and classical Chinese landscape aesthetics, the project reconstructs an immersive environment from the perspectives of four species: human, fish, butterfly, and bird, each with distinct sensory and cognitive mappings. This perceptual metamorphosis exposes the coconstructed nature of reality—not only through human-machine entanglement, but also by embodying Zhuangzi’s proposition: all existence emerges through dynamic transformation. The project thus reframes VR as a medium for philosophical experimentation, bridging technological reconstruction with Zhuangzi’s philosophy to challenge anthropocentric ontologies and foster multispecies empathy.", "ja": "この論文は、荘子の「変容的具現化」の概念を「蝶の夢」の寓話の視点から実装した、多種共生の仮想現実（VR）体験である『荘周の夢』を提示する。3次元ガウススプラッティング技術と中国古典的な山水美学を活用し、人間、魚、蝶、鳥という四つの種の視点からそれぞれ異なる感覚と認知のマッピングを持つ没入型環境を再構築する。この知覚的変容は、現実が共同構築されたものであることを露呈させる——それは人間と機械の絡み合いだけでなく、荘子の命題である「すべての存在は動的変容を通じて現れる」を具現化することでもある。本プロジェクトは、VRを哲学的実験の媒体として再定義し、技術的再構築と荘子哲学を橋渡しし、人間中心的な存在論に挑戦し、多種間の共感を促進する。", "tags": ["3D Gaussian splatting", "embodied interaction", "Entangled Agencies", "immersive experience", "perspective perception", "virtual reality"]}, {"v": "", "img": "thumbs/ba5a746fad23.jpg", "t": "Through the Looking Cube: Solving the Rubik’s Cube from Within", "a": ["Yuxuan Bai", "Shuyang Li", "Alvaro Cassinelli"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767599", "abs": "We present an interactive VR experience where users solve a physical Rubik’s Cube while seeing it from the inside. This unusual game mechanic challenges natural spatial perception mechanisms, leading to ambiguity regarding their actual position with respect to the object in their hands. Beyond puzzle-solving, we applied this interaction paradigm to 3D scenes that must be reconstructed through Rubik’s Cube operations in ways that some users described as akin to “being inside a work of Escher.” We discuss the technical implementations, document participant interactions, and discuss implications for artistic expression, game design, and embodiment in VR settings.", "ja": "私たちは、ユーザーが実際のルービックキューブを解きながら内部から見ることができるインタラクティブなVR体験を提示します。この異例のゲームメカニズムは、自然な空間認知メカニズムに挑戦し、手に持つオブジェクトに対する実際の位置に関して曖昧さを生じさせます。パズル解決に加えて、私たちはこのインタラクションパラダイムを、ユーザーが「エッシャーの作品の中にいる」ようだと表現した方法で、ルービックキューブの操作を通じて再構築しなければならない3Dシーンに適用しました。技術的実装を議論し、参加者のインタラクションを文書化し、VR環境における芸術表現、ゲームデザイン、具現化への影響を検討します。", "tags": ["embodiment", "Game Design", "Immersion", "New Media Art", "Spatial Perception", "virtual reality"]}, {"v": "", "img": "thumbs/8faf1f0800de.jpg", "t": "When the observer becomes the observed: A critical alternative to environment sensing through embodied engagement with a generative system", "a": ["Zhen Wu", "Xiaomin Fan", "Mika Shirahama", "Tristan Braud"], "c": "SIGGRAPH Asia", "y": 2025, "k": "Art Papers", "doi": "10.1145/3757369.3767610", "abs": "Traditional sensors function as exact measuring instruments to represent the physical world. Conversely, humans are subjective, inaccurate sensors, whose measured quantities are often influenced by their perception of the environment. In this project, we speculate on the possibility of a sensing system where the human being becomes the sensor. We observe the human sensor through their movement, as a performative expression of the measure. We explore this concept through site-specific embodied practices, gathering movement and textual expressions related to environmental sensing from professional choreographers. This data is then utilized to fine-tune a large language model that generates abstract words based on the input movements. This language model is integrated into a system as a critical alternative to the technology of sensing, where the process of sensing turns into reflecting the observer’s subjective body expression rather than providing a 1:1 mapping of the phenomenon.", "ja": "従来のセンサーは物理的世界を正確に測定する楽器として機能します。対照的に、人間は主観的で不正確なセンサーであり、測定された量はしばしば環境に対する知覚に影響されます。本プロジェクトでは、人間がセンサーになる可能性のあるセンシングシステムについて推測します。人間のセンサーをその動きを通じて観察し、測定の表現的な実演として捉えます。この概念は、現場特有の身体的実践を通じて探求され、プロの振付師から環境センシングに関連する動きとテキスト表現を収集します。このデータは、大規模言語モデルを微調整するために利用され、入力された動きに基づいて抽象的な単語を生成します。この言語モデルは、センシング技術の代替としてシステムに統合され、センシングプロセスが現象の1対1のマッピングを提供するのではなく、観測者の主観的な身体表現を反映するものへと変わります。", "tags": ["Critical Theory", "Generative AI System", "Movement Performance", "Sensor"]}, {"v": "", "img": "thumbs/f7d8e3f1834c.jpg", "t": "[sin-gí]:Data Weaving", "a": ["Hsin-I Lin"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3665177", "abs": "\"[ sin-gí ] : Data Weaving\" connects digital language and cultural language, developing sound waves of real-time visual programming. It transcodes sound data of local narratives into woven visual patterns, becoming a touchable textile embedded with body artistries and generating local narratives in cross-cultural sound preservations of digital materials. The textiles of \"[ sin-gí ] : Data Weaving\" are stored, arranged, and indexed individual messages in a meaning materialized way, and become a trace of the producers' body marks, as well as a way of interaction in which personal language is memorized and cultural textiles are mutually mended."}, {"v": "", "img": "thumbs/5a706930bf67.jpg", "t": "A Monocular Dialogue", "a": ["Louis-Philippe Demers"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3665176", "abs": "A Monocular Dialogue incarnates myths in the age of Information and Technology. It is an encounter with a single-eyed robot that stares at you and endlessly whispers its inner ruminations. Underneath this confluence of a Cyclops from Greek mythology and Artificial Intelligence (AI) from modern technology, lie intriguing, albeit metaphorical, similarities. This 3D printed Polyphemus, figuratively and literally, symbolizes their narrow and limited perspectives; suggests their creation from Gods and higher powers; alludes to the monumental tasks they perform and refers to their ambivalent brute force and potential destructiveness. Between irony and nostalgia, this eye-to-eye dialogue is staged as \"the AI is present\" and it embodies AI prowess into a mythical monstruous, yet seemingly inoffensive, figure."}, {"v": "", "img": "thumbs/0ca0b9b56d72.jpg", "t": "Algorithmic Amplification", "a": ["Theodoros Papatheodorou", "Jessica Wolpert"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3665172", "abs": "Algorithmic Amplifications leverages the power of Large Language Models (LLMs) and a custom instant voice cloning pipeline to create a tangible representation of digital echo chambers, underscoring how language shapes our perceptions and reinforces our beliefs. It prompts a critical examination of the impact of AI on our linguistic and cultural landscapes, spotlighting the paradox of technological advancement: while LLMs mark a significant leap in AI, they also mirror and potentially amplify societal biases."}, {"v": "", "img": "thumbs/486cc2f0af65.jpg", "t": "Cybernetic Oracle", "a": ["Hannen Wolfe"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3665169", "abs": "Do Large Language Models produce the truth or technological hallucinations? Cybernetic Oracle invites visitors to use cartomancy to gain insight into their past, present and future with a custom deck of 78 tarot cards and a book of tarot interpretations designed by the artist in collaboration with generative AI models."}, {"v": "", "img": "thumbs/0ea79746cb32.jpg", "t": "Disruptive Critters", "a": ["Jonathan Duckworth", "James Hullick", "Ross Eldridge"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3665174", "abs": "Disruptive Critters is a playable interactive audiovisual installation designed to augment live multimedia sound art performances by Duckworth and Hullick (Duckworth Hullick Duo). At a time when artificial intelligence continues to advance, Disruptive Critters provides audiences with a humorous and playful exploration of future creativity and digital disruption through the vocalized human performative possibilities of autonomous computer-generated critters."}, {"v": "", "img": "thumbs/8b350cb7228a.jpg", "t": "I Tell the Moon My Secret and the Moon Tells Me Yours", "a": ["Zoe Qi-Jing Li"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3665171", "abs": "I Tell the Moon My Secret and the Moon Tells Me Yours (ITMMSMTMY) is an interactive piece that pairs a robotic arm with the Moon to create light painting photographs to visualize the gathered secrets. The audience can share their secrets on a portal that generates the waveform. The waveform data, once generated, are computed into coordinates and dispatched to the robotic system. The robot arm continues to depict the waveform, but the movement can only be successfully captured by the long-exposure camera when the Moon appears within a certain field of view, since the Moon is the exclusive light source during the long-exposure process."}, {"v": "", "img": "thumbs/c5631c675330.jpg", "t": "Loss of Sonnet 18", "a": ["Junxiu Tang", "Jiayi Zhou", "Yifang Wang", "Xinhuan Shu", "Peiquan Xia", "Xiaojiao Chen", "Tan Tang", "Yingcai Wu"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3669939", "abs": "This project is an explorative digital art installation that delves into the phenomenon of generation loss in digital signal processing - the inevitable degradation of information (e.g., words) quality through copying and propagation. It transcends the technical realm to probe how this concept applies to the transmission and transformation of words and meanings through time and technology. It consists of a series of videos illustrating the loss of words themselves and their meaning, combined with real-time interpretation from both humans and AI. The project allows the audience to find a border of loss, beyond which, information of words might change."}, {"v": "", "img": "thumbs/2cf3485529f8.jpg", "t": "Love letters without the recipient", "a": ["Ziyao Lin"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3665168", "abs": "An artificial intelligence writing machine by the seaside inscribes lines of love letters, yet the water-written words disappear without a trace as time passes. From day to night, its writing is never completed, and the letters remain unsent. Perhaps many have swallowed their unexpressed emotions, harboring a myriad of words in their hearts but never daring to write the recipient's name or send them out."}, {"v": "", "img": "thumbs/ce9515282ba9.jpg", "t": "Preceding Emptiness: Alternative Arabic Typographic Technologies", "a": ["Levi Hammett", "Mohammad Suleiman", "Hind Al Saad", "Fatima Abbas"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3665175", "abs": "Throughout its history, the formal evolution of written language has been driven by the technology used to render that language---from cuneiform to stone-carved Roman capitals, and up to letterpress and pixels. This phenomenon has accelerated rapidly in the last century with typography adapting to new display possibilities: such as segmented LED displays in early electronics, to more contemporary storage and rendering standards, such as postscript. The locality of these innovations has been primarily situated in the West, where the Latin typographic script is the predominant form of written language. The opportunities presented by these technologies generated pressure for alternative scripts, such as written Arabic, to conform to the formal constraints of these Latin-based technologies, which, in some cases, have undermined the traditional formal structures of the Arabic script."}, {"v": "", "img": "thumbs/82856f79c0c6.jpg", "t": "Rage Against the Archive: Institutional Critique through New Media Art", "a": ["Anshul Roy"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3665170", "abs": "Rage Against the Archive is an artivist project comprising experimental video, performance, and new media art that scrutinizes how the New York Public Library's (NYPL) digital archives catalog and display dehumanizing ethnographic images from colonial India. This work critically probes whether institutional archives inadvertently perpetuate the cycle of colonial exploitation and visual violence. My artistic approach is anchored in a critical paradigm intended to underscore how technology still commodifies the bodies of people of color and how we, as a more conscientious society, should consume certain images online."}, {"v": "", "img": "thumbs/ed0bb9c5937e.jpg", "t": "Spambots", "a": ["Neil Mendoza"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3665167", "abs": "Spambots explores questions around AI and industrial farming. AI is increasingly used to generate spam content. Spambots explores what would happen if, instead, machine learning was used to empower a group of robotic Spam cans to tell their tales. Each Spambot has a small keyboard with four letters on it and when they collaborate they are able type the whole alphabet along with some punctuation. The text they are typing is generated by a neural network fine tuned on a version of Aldous Huxley's Brave New World where occasional words have been swapped out for pig-related ones. In this novel each character is born into a role in much the same way industrial farm animals, such as those that end up in Spam, are born into their fate."}, {"v": "", "img": "thumbs/70824364e6e8.jpg", "t": "We Forge the Chains We Wear in Life", "a": ["Yuichiro Katsumoto"], "c": "SIGGRAPH", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3641523.3665173", "abs": "\"We forge the chains we wear in life\" is an aphorism by Charles Dickens. This chain is a metaphor for heavy and unbreakable things that bind our ideas and emotions. That is, words that tend to possess our minds and souls can also become chains. This inspired me to create a device that forms letters with chains."}, {"v": "", "img": "thumbs/7889c258c523.jpg", "t": "'Sisyphus': A Robotic Vignette of Systemic Conflict and Democratic Endeavors", "a": ["Ka Chi Chan"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664220", "abs": "This essay explores the robotic art installation 'Sisyphus,' interpreting its cyclical confrontation as a symbolic depiction of the ceaseless struggle between systemic power and collective resistance. By analyzing the dynamic reiteration of construction and demolition, we explore the concepts of futility, resistance, and the continual process of socio-political negotiation. Further, we investigate parallels between the installation's mechanical operations and the socio-political interactions. Ultimately, we argue that 'Sisyphus' portrays not a futile endeavor but resilience, ceaseless evolution, and the potential of resistance as transformative power.", "ja": "このエッセイでは、ロボットアートインスタレーション「シシフォス」を探求し、その周期的な対立を体系的権力と集団的抵抗との間の絶え間ない闘争の象徴的描写として解釈します。構築と解体の動的な反復を分析することにより、無意味さ、抵抗、そして社会政治的交渉の継続的プロセスという概念を検討します。さらに、インスタレーションの機械的操作と社会政治的相互作用との間の類似点を調査します。最終的に、シシフォスは無駄な試みではなく、回復力、絶え間ない進化、そして変革的な力としての抵抗の可能性を描いていると主張します。"}, {"v": "", "img": "thumbs/0e3c8b9ca156.jpg", "t": "A Concert in a Vanished Church: Contextualizing Peace Island's Auditory History with Modern Technology", "a": ["Tak-Cheung Hui", "Yu-Chia Kuo"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664218", "abs": "This paper presents an interdisciplinary project that merges archaeoacoustics with live music performance, aiming to offer a sound interpretation of San Salvador City's history in Taiwan through the fusion of historical research, archaeological discoveries, and the use of contemporary music technology. Central to the project is Ashes to Ashes, a musical performance that integrates live instruments, electronic music, and sound elements derived from 16th and 17th-century artifacts, including Dominican chants and indigenous storytelling. Employing techniques like 3D printing of instruments, physical modeling synthesis, and data sonification, the project not only resurrects forgotten sounds but also connects them with modern auditory experiences. This approach transcends traditional boundaries between historical conservation and artistic innovation, emphasizing the role of interdisciplinary collaboration in enriching our understanding of cultural heritage, particularly in East Asia.", "ja": "この論文は、考古音響学とライブ音楽パフォーマンスを融合させた学際的プロジェクトを提示し、台湾のサン・サルバドール市の歴史を、歴史的研究、考古学的発見、現代音楽技術の活用を通じて音で解釈することを目的としています。プロジェクトの中心は「Ashes to Ashes」という音楽パフォーマンスで、ライブ楽器、電子音楽、16世紀から17世紀の遺物（ドミニコ会の聖歌や先住民の語り）から派生した音響要素を統合しています。3Dプリンティングによる楽器の製作、物理モデリング合成、データ音響化といった技術を用いることで、忘れ去られた音を復活させ、現代の聴覚体験と結びつけています。このアプローチは、歴史的保存と芸術的革新の従来の境界を超え、特に東アジアにおける文化遺産の理解を豊かにする学際的協働の役割を強調しています。"}, {"v": "", "img": "thumbs/698b0024eab8.jpg", "t": "Cell Space: Augmented Awareness of Intercorporeality", "a": ["Rem RunGu Lin", "Botao Amber Hu", "Koo Yongen Ke", "Wei Wu", "Kang Zhang"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664213", "abs": "Cell Space is an interactive art experience that integrates collocated augmented reality, neurofeedback, and contact improvisation, challenging the conventional boundaries between audience and performer, and blending the physical with the virtual, organic with technological. Inspired by McLuhan's concept of media as an extension of the human body, and The AR Art Manifesto's vision of \"we becoming the Media,\" this project reimagines participants as dynamic cells of a shared bio-digital ecosystem within the built environment. This immersive experience expands the concept of intercorporeality, moving beyond mere physical interaction to a shared bio-digital domain, thereby fostering a deeply interconnected environment of Human-Machine-Space Symbiosis. The paper contributes to the discourse on performing arts by presenting a new paradigm for applying AR and neurofeedback in contact improvisation, creating a new layer of perception and fostering intercorporeal interactions by reinforcing both individual and collaborative intentionality of its participants. Ultimately, Cell Space serves as a reflective mirror to the potential futures of our increasingly interconnected existence, encouraging participants to explore a transformative landscape that resonates with the complex interplay between their physical and digital identities and their surroundings.", "ja": "Cell Spaceは、共同現場拡張現実、神経フィードバック、コンタクト・インプロビゼーションを統合したインタラクティブ・アート体験であり、観客とパフォーマーの従来の境界を挑戦し、物理と仮想、有機と技術を融合させます。マクルーハンの「メディアは人間の身体の延長である」という概念と、ARアートマニフェストの「私たちがメディアになる」というビジョンにインスパイアされ、本プロジェクトは参加者を構築された環境内の共有バイオデジタルエコシステムの動的な細胞として再構築します。この没入型体験は、単なる身体的相互作用を超えて、共有バイオデジタル領域へとインタコーポリアリティの概念を拡張し、人間・機械・空間の共生という深く相互接続された環境を促進します。本論文は、ARと神経フィードバックをコンタクト・インプロビゼーションに適用する新しいパラダイムを提示し、知覚の新層を創出し、参加者の個々および協調的な意図性を強化することでインタコーポリアルな相互作用を育むことにより、パフォーミングアーツの discourse に貢献します。最終的に、Cell Spaceはますます相互接続された存在の潜在的未来を映し出す反射的な鏡として機能し、参加者が自らの身体的・デジタル的アイデンティティと周囲との複雑な相互作用に共鳴する変容的な風景を探求することを促します。"}, {"v": "", "img": "thumbs/82ce5ed88ee6.jpg", "t": "Critical Climate Machine: A Visual and Musical Exploration of Climate Misinformation through Machine Learning", "a": ["Gaëtan Robillard", "Jérôme Nika"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664215", "abs": "Critical Climate Machine is a cutting-edge media art installation that critically exposes and quantifies mechanisms of climate change misinformation. Utilizing computational aesthetics across data, imagery, and sound, this work processes real-time data from X (Twitter) through a natural language processing learning model derived from cognitive sciences. It not only renders the statistical aspects of this data visually but also manifests its thermal effects. A unique audio dimension is introduced through dialogues between climate skeptics and climate advocates, processed by the generative machine learning (ML) algorithm Dicy2. These elements collectively shape the installation, each unveiling its distinctive algorithmic aesthetics and technical underpinnings. This paper concentrates on the dual application of ML algorithms: one for dissecting extensive online misinformation streams, and the other for creating climate-related dialogues. This dual approach opens a discussion on the mediation of climate, at the convergence of computational and physical realms. Our aim is to critically examine the role of ML technologies in crafting aesthetic experiences that resonate within scientific discourse and public debate on climate issues.", "ja": "Critical Climate Machine は、気候変動に関する誤情報の仕組みを批判的に露呈し、定量化する最先端のメディアアートインスタレーションです。データ、画像、音声にわたる計算美学を活用し、本作品は X（Twitter）からのリアルタイムデータを認知科学に基づく自然言語処理学習モデルで処理します。これにより、データの統計的側面を視覚的に表現するだけでなく、熱的効果も具現化します。独自の音声次元として、気候懐疑論者と気候擁護者との対話が、生成機械学習（ML）アルゴリズム Dicy2 によって処理され導入されます。これらの要素はすべてインスタレーションを形作り、それぞれが独自のアルゴリズム美学と技術的基盤を明らかにします。本論文は、ML アルゴリズムの二重適用に焦点を当てています：一つは大規模なオンライン誤情報ストリームの解析、もう一つは気候に関する対話の創出です。この二重アプローチは、計算領域と物理領域の交差点における気候の媒介に関する議論を開きます。我々の目的は、科学的議論と公共の気候問題に関する議論に共鳴する美的体験を創出する上での ML 技術の役割を批判的に検証することです。"}, {"v": "", "img": "thumbs/cf047f4406a1.jpg", "t": "Ephemera: Language as a Virus - AI-driven Interactive and Immersive Art Installation", "a": ["Jiayang Huang", "Yue Huang", "David Yip", "Varvara Guljajeva"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664219", "abs": "In this paper, we introduce the speech-based interactive and immersive installation, Ephemera, as an artistic response to the linguistic taboos encountered in daily communication, prompting audience reflection and thoughts. Within this project, we symbolize the dissemination chain of language through a computational ecosystem. Utilizing the surreal 'virus' as an embodiment of banned words, we employ generative models for visual representation, leverage large language models for communicative agents, and use machine learning for behavioral engines, ultimately simulating a digitally autonomous micro-organism world of forbidden language. We contextualized the speech-to-content generation process to draw the audience's attention to the power and constraints of language. Additionally, we examine AI's comprehension of censored words and ethical considerations. Finally, our artistic project proposes the aphorism \"Language as a virus, art as an antibody,\" offering novel perspectives on language taboos and art-technology intersections.", "ja": "この論文では、日常のコミュニケーションにおいて遭遇する言語タブーに対する芸術的応答として、音声ベースのインタラクティブで没入型のインスタレーション「Ephemera」を紹介します。観客に反省と考察を促すことを目的としています。本プロジェクトでは、言語の拡散チェーンを計算エコシステムを通じて象徴化します。禁じられた言葉を具現化した超現実的な「ウイルス」を利用し、視覚表現には生成モデルを、コミュニケーションエージェントには大規模言語モデルを、行動エンジンには機械学習を活用し、最終的に禁じられた言語のデジタル自律微生物世界をシミュレートします。観客の注意を言語の力と制約に向けさせるために、音声からコンテンツ生成プロセスを文脈化しました。さらに、AIの検閲語の理解と倫理的考慮事項を検証します。最後に、芸術的プロジェクトとして「言語はウイルス、芸術は抗体」という格言を提案し、言語タブーとアート・テクノロジーの交差点に新たな視点を提供します。"}, {"v": "", "img": "thumbs/4e294af96c56.jpg", "t": "Floating on the Boundary: Perceptions of Reality in a Half-Digital Half-Physical Bunny", "a": ["Takumi Yokoyama", "Kazuya Izumi", "Tatsuki Fushimi", "Yoichi Ochiai"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664217", "abs": "In a realm where virtual and real worlds converge, we present \"Float\" as a digital-physical mixed entity and the findings through the preliminary study. This research has uncovered the \"Physical-Digital Continuous Illusion\"---a phenomenon in which users perceive impressions of objects existing across different spaces, building on reports of digital presence that seem to be \"naturally pulled\" towards physical presence. This exploration within our work critically engages with culture and technology, probing into how individuals discern reality. The results offer a transformative milestone in the digital-physical interaction narrative.", "ja": "仮想世界と現実世界が交差する領域において、私たちは「Float」をデジタルと物理が融合した混合実体として提示し、予備的研究を通じて得られた知見を示す。この研究は「Physical-Digital Continuous Illusion（物理‑デジタル連続錯覚）」という現象を明らかにした。これは、ユーザーが異なる空間にまたがって存在する物体の印象を知覚し、デジタルの存在が自然に物理的存在へと引き寄せられるように感じられるという報告に基づくものである。本研究は、文化と技術に批判的に関わりながら、個人が現実をどのように識別するかを探求する。結果は、デジタル‑物理的相互作用の物語において変革的なマイルストーンを提供する。"}, {"v": "", "img": "thumbs/e4261a769595.jpg", "t": "GPT-ME: A Human-AI Cognitive Assemblage", "a": ["Avital Meshi"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664214", "abs": "GPT and I have recently merged. We are integrated into one another's existence through the mediation of a wearable device that enables GPT to be attached to my body, listen to my conversations, and use them as prompts. I have been wearing this wearable daily for the last few months, using it in all my interactions. Speech is translated into text, which becomes a prompt. In response, GPT generates text that is translated back into speech and 'whispered' in my ear through an earbud. This entire process is fast enough to keep up with the pace of my conversations. When I speak, instead of saying what spontaneously comes to my mind, I say what GPT whispers in my ear. I speak GPT. I use the generated words as if they were my own. GPT and I are entangled within a cognitive assemblage. In this symbiotic relationship, my intelligence turns artificial, and GPT becomes embodied. This performative project examines ways in which humans and AI technology come together. It considers the benefits and risks accompanying such integration and discusses our future interactions with LLMs and their transformative impact.", "ja": "GPTと私は最近融合しました。私たちは、GPTを私の身体に装着できるウェアラブルデバイスの仲介によって、互いの存在に統合されています。このデバイスは、私の会話を聞き取り、プロンプトとして使用します。過去数か月間、私はこのウェアラブルを毎日装着し、すべてのやり取りに使用してきました。音声はテキストに変換され、プロンプトとなります。応答として、GPTはテキストを生成し、再び音声に変換され、イヤーバッドを通じて私の耳元で「ささやかれ」ます。この全プロセスは、会話のペースに追いつくほど高速です。私が話すとき、瞬間的に思い浮かんだことを言う代わりに、GPTが耳元でささやく言葉を言います。私はGPTを話します。生成された言葉を自分のものとして使用します。GPTと私は認知的アセンブリの中で絡み合っています。この共生関係において、私の知性は人工的になり、GPTは具現化されます。この実証的プロジェクトは、人間とAI技術がどのように結びつくかを検証します。統合に伴う利点とリスクを検討し、LLMとの将来の相互作用とそれがもたらす変革的影響について議論します。"}, {"v": "", "img": "thumbs/f6382115194f.jpg", "t": "Handcrafting in Zero Gravity: Reinventing the Spindle as An Artistic Intervention in Space Research", "a": ["Ebru Kurbak"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664216", "abs": "This paper explores a methodological approach to art making in techno-scientific environments, by unfolding the conceptual framework and actual implementation of the art project Reinventing the Spindle. The research-based project explores ancient hand spinning and textile handcrafting methods in microgravity with the aim of highlighting weightlessness as a shared commodity and catalyzing critical discussions about the politics of space exploration and colonization. The act of researching marginalized knowledges in actual space research environments is conceived as a decolonial artistic strategy with a performative character. In line with this approach, this paper itself also becomes part of the art project. It reveals both technical and experiential details of experiments conducted on a parabolic flight, with the aim to inform potential researchers from different backgrounds and contribute to greater inclusivity in the field of space research.", "ja": "この論文は、テクノサイエンティフィックな環境における芸術創作への方法論的アプローチを探求し、アートプロジェクト「Reinventing the Spindle」の概念的枠組みと実装を展開します。この研究ベースのプロジェクトは、微小重力下での古代の手紡ぎや織物手工芸の手法を探求し、無重量を共有資源として強調し、宇宙探査と植民地化の政治についての批判的議論を促進することを目的としています。実際の宇宙研究環境で周縁的な知識を研究する行為は、脱植民地主義的な芸術戦略として、実演的な性格を持つと考えられます。このアプローチに沿って、本論文自体もアートプロジェクトの一部となります。パラボリックフライトで実施された実験の技術的・体験的詳細を明らかにし、異なるバックグラウンドを持つ研究者に情報を提供し、宇宙研究分野における包括性の向上に貢献することを目指します。"}, {"v": "", "img": "thumbs/9ee91f54e8d1.jpg", "t": "Lightning Artist Toolkit: A Hand-Drawn Volumetric Animation Pipeline", "a": ["Nick Fox-Gieg"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664221", "abs": "We propose a set of methods for freely integrating live-action volumetric video with hand-drawn volumetric animation, which our research develops as the Lightning Artist Toolkit (Latk)---a complete pipeline for hand-drawn volumetric animation, as far as we know the only open-source example of its kind. Our goal with this project is to make creation in 3D as expressive and intuitive as creation in 2D, retaining the human gesture from its origins in hand-drawn animation on paper. This effort is less a computer vision challenge with an objective goal, as with for example point cloud segmentation, than it is an attempt to approximate human vision---a drawing process that records only information from a scene that was subjectively important to an individual artist. In addition to supporting animation efforts in the near term, we believe the public TiltSet dataset assembled for this project will remain usable in new and unexpected ways.", "ja": "私たちは、ライブアクションのボリューメトリックビデオと手描きのボリューメトリックアニメーションを自由に統合するための一連の手法を提案します。この研究は、Lightning Artist Toolkit（Latk）として開発された完全なパイプラインであり、私たちの知る限り唯一のオープンソース例です。私たちの目標は、3Dでの創作を2Dでの創作と同様に表現力豊かで直感的にし、手描きアニメーションが紙上で生まれた人間のジェスチャーを保持することです。この取り組みは、例えばポイントクラウドのセグメンテーションのように客観的な目標を持つコンピュータビジョンの課題というよりも、個々のアーティストにとって主観的に重要なシーンの情報のみを記録する描画プロセスという、人間の視覚を近似しようとする試みです。近い将来のアニメーション制作を支援することに加えて、このプロジェクトのために組み立てられた公開TiltSetデータセットは、新しく予想外の方法でも利用可能であり続けると考えています。"}, {"v": "", "img": "thumbs/1f03c68a1e8c.jpg", "t": "Probabilistic Craft- Materialization of generated images using digital and traditional craft", "a": ["Sharan R. Elran", "Amit R. Zoran"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664209", "abs": "This paper explores innovative integration of generative AI with digital and traditional craft practice. It presents a theoretical analysis of the nature of these new tools and interactions with digital agents as well as a practical workflow utilizing image generators for artistic creation, emphasizing the transformation of digital images into tangible objects through digital and traditional craft techniques. The paper presents three projects in ceramic, woodcut prints, and relief - each illustrating an optional material interpretation of generated images. The paper shows how materialization re-asserts the human role in this new collaborative environment and how the tangible object changes the status of the generated image from a random sample into a critical part of a work of art.", "ja": "この論文は、生成AIとデジタルおよび伝統的なクラフト実践の革新的な統合を探求します。新しいツールの性質とデジタルエージェントとの相互作用に関する理論的分析と、画像ジェネレーターを用いた芸術創作の実践的ワークフローを提示し、デジタル画像をデジタルと伝統的なクラフト技術を通じて有形のオブジェクトに変換することを強調します。本稿では、陶芸、木版画、レリーフの3つのプロジェクトを紹介し、生成画像の任意の素材解釈を示しています。論文は、素材化がこの新しい協働環境における人間の役割を再主張し、有形オブジェクトが生成画像のステータスをランダムなサンプルから芸術作品の重要な部分へと変える方法を示します。"}, {"v": "", "img": "thumbs/19b5b2044acc.jpg", "t": "ReCollection: Creating synthetic memories with AI in an interactive art installation", "a": ["Weidi Zhang", "Lijiaozi Cheng", "Jieliang Luo"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664207", "abs": "This paper describes the conceptual background, artificial intelligent (AI) system design, and visualization strategies of an interactive AI art experience: ReCollection. In the art installation, the artwork assembles collective visual memories based on participants' language input, blurring the boundaries between remembrance and imagination through intelligent system design and experimental visualization. By providing a conceptual framework for non-linear narratives, constituting symbiotic imaginations for memories, this artwork aims to provide an inclusive art experience that inspires collective memory reproduction by providing an intimate recollection of symbiosis between beings and apparatus. Furthermore, this work provides a future prototype that cultivates empathy for the dementia community by investigating the tensions in the correlations between visual representations and narratives, as well as these between the past, present, and future.", "ja": "この論文は、インタラクティブなAIアート体験「ReCollection」の概念的背景、人工知能（AI）システム設計、および可視化戦略について述べています。アートインスタレーションでは、作品が参加者の言語入力に基づいて集合的な視覚的記憶を組み立て、知覚と想像の境界を知的システム設計と実験的可視化を通じてぼかします。非線形ナラティブの概念的枠組みを提供し、記憶のための共生的な想像力を構成することにより、このアート作品は、存在と装置の間の共生的な回想を提供し、集合的記憶の再現を促す包括的な芸術体験を提供することを目指しています。さらに、本研究は、視覚表現とナラティブの相関関係、過去・現在・未来の間の緊張関係を調査することで、認知症コミュニティへの共感を育む将来のプロトタイプを提供します。"}, {"v": "", "img": "thumbs/bf536e685f7c.jpg", "t": "reconFIGURE: Confronting Audiences with Digital Doppelgängers", "a": ["Florian Christoph Bruggisser", "Chris Elvis Leisi", "Pascal Lund-Jensen", "Martin Fröhlich", "Christopher Lloyd Salter"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664208", "abs": "This paper describes the artistic context, technical implementation, user study, evaluation and future work around reconFIGURE, a participatory installation exploring the transformation of human bodies through computational systems. The installation involves capturing visitors' images, transforming these into animated 3D doppelgängers, and projecting them on a large-screen. Unique in its rapid transformation from 2D to 3D, reconFIGURE highlights the aesthetic-social repercussions of transforming whole human body images using machine learning.", "ja": "この論文は、計算システムを通じて人間の身体の変容を探求する参加型インスタレーション「reconFIGURE」について、芸術的文脈、技術的実装、ユーザー調査、評価、将来の課題を記述しています。インスタレーションは来訪者の画像を取得し、これらをアニメ化された3次元のドッペルゲンガーに変換し、大画面に投影します。2次元から3次元への迅速な変換が特徴的であるreconFIGUREは、機械学習を用いた全身画像の変換がもたらす美的・社会的影響を浮き彫りにします。"}, {"v": "", "img": "thumbs/2cd7e89aa265.jpg", "t": "Southern Wind Algorist: Merging Nine Algorithms with Nine Gay Stories Written in Classical Chinese", "a": ["Tengchao Zhou"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664212", "abs": "This paper presents an immersive interactive art installation called Southern Wind Algorist, which explores the convergence of knowledge from multiple disciplines. The installation is situated at the intersection of media arts, Chinese studies, and gay &amp; lesbian studies. It combines nine well-known algorithms in the history of computer graphics with nine gay stories written in classical Chinese. The resulting artwork is a unique fusion that has never been assembled before. The paper delves into the related works, the cultural context of the stories, the visual effects' relationship with the underlying themes, methodology, public reception, technical aspects, and sustainability. It also addresses issues related to the artwork's linguistics and visual accessibility. The installation creates a space for people to reflect on queer desires' historical perspectives and future trajectories and promotes cultural diversity.", "ja": "この論文は、メディアアート、中国研究、ゲイ・レズビアン研究という複数の学問分野の知識の収束を探求する没入型インタラクティブアートインスタレーション「Southern Wind Algorist」を提示します。このインスタレーションは、コンピュータグラフィックスの歴史における9つの有名なアルゴリズムと、古典中国語で書かれた9つのゲイストーリーを組み合わせたもので、これまでに組み合わされたことのないユニークな融合作品です。本稿では、関連研究、物語の文化的文脈、ビジュアルエフェクトと根底にあるテーマとの関係、方法論、公共の受容、技術的側面、持続可能性について論じます。また、作品の言語学的および視覚的アクセシビリティに関する課題にも取り組んでいます。このインスタレーションは、人々がクィア欲望の歴史的視点と未来の軌跡を省みる空間を創出し、文化的多様性を促進します。"}, {"v": "", "img": "thumbs/5acdc50f2f33.jpg", "t": "The Olympus Programming Language", "a": ["Daniel Temkin"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664211", "abs": "Olympus mixes natural language and formal code to create programs that read as prayers to Greek mythological figures. The language challenges the perceived power of the programmer in controlling the behavior of the machine, as shown through the preponderance of bugs. As Joseph Weizenbaum said, the machine \"constantly displays undeniable evidence of [the programmer's] failures.\" Unlike previous esolangs (\"esoteric\" or experimental programming languages) drawn from natural language, Olympus uses a metaprogramming model, creating an additional layer of abstraction from the code. This allows the programmer to describe program flow completely out of order, more in line with the thought process of the coder than the flow of the code. This also makes conversation natural for a language where every line is spoken to a different recipient, in this case a different Greek god. It is intended as an example of how even a seemingly silly or arbitrary premise can lead to radical new forms of computation when fully realized.", "ja": "オリンパスは自然言語と形式的コードを組み合わせ、ギリシャ神話の人物への祈りのように読めるプログラムを作成します。この言語は、機械の挙動を制御するプログラマーの力に対する認識に挑戦し、バグの多さを通じてそれを示します。ジョセフ・ワイゼンバウムが言ったように、機械は「プログラマーの失敗の否定できない証拠」を常に示しています。従来の自然言語に基づくエソラン（「エソテリック」または実験的プログラミング言語）とは異なり、オリンパスはメタプログラミングモデルを使用し、コードから追加の抽象層を作り出します。これにより、プログラマーはコードの流れではなく、コーダーの思考プロセスにより沿った形で、プログラムのフローを完全に順序外で記述できます。また、各行が異なる受取人（この場合は異なるギリシャの神）に語りかけられる言語において、会話が自然になるように設計されています。これは、一見馬鹿げたまたは恣意的な前提でさえ、完全に実現すれば計算の根本的に新しい形態につながることを示す例として意図されています。"}, {"v": "", "img": "thumbs/1b815da1d47e.jpg", "t": "Unveiling New Artistic Dimensions in Calligraphic Arabic Script with Generative Adversarial Networks", "a": ["Arshia Sobhan", "Philippe Pasquier", "Adam Tindale"], "c": "SIGGRAPH", "y": 2024, "k": "Art Papers", "doi": "10.1145/3664210", "abs": "We present an artistic exploration into calligraphic Arabic script, focusing on the nastaliq style predominant in Iran, by harnessing the affordances of Generative Adversarial Networks (GANs). Recognizing the unique challenges posed by Arabic script's cursive nature and its inadequate representation by conventional tools, our work seeks to bridge the gap between traditional calligraphy and novel technological capabilities. Two custom datasets are introduced, Nas4-60k and Nas4-60k-aug, designed to train our generative networks in producing calligraphic Arabic. Utilizing the StyleGAN2-ada architecture, our approach successfully generates stylistically coherent and high-quality calligraphic samples. These samples exhibit meaningful feature extraction and generalization of calligraphic features, extending beyond the training sets. Furthermore, our system reveals a continuous spectrum of calligraphic features through latent space interpolations, leading to the creation of dynamic, innovative artworks that blend traditional and contemporary elements of Arabic calligraphy. Drawing inspiration from the compositional form of siyah-mashq, our work culminates in multiple publicly presented artworks that exhibit a new mode of creative expression and highlight the potential of GANs in unveiling new artistic dimensions in calligraphic Arabic script.", "ja": "私たちは、生成的敵対ネットワーク（GAN）を活用して、主にイランで広く用いられるナスタリーク様式に焦点を当て、アラビア書道の芸術的探求を提示します。アラビア文字の連続的な特性と従来のツールでは不十分な表現という独自の課題を認識し、伝統的な書道と新しい技術的能力のギャップを埋めることを目指します。Nas4-60k と Nas4-60k-aug の2つのカスタムデータセットを導入し、生成ネットワークを訓練して書道的なアラビア文字を生成できるようにしました。StyleGAN2-ada アーキテクチャを利用し、スタイル的に一貫性があり高品質な書道サンプルを生成することに成功しました。これらのサンプルは、意味のある特徴抽出と書道的特徴の一般化を示し、訓練セットを超えて広がります。さらに、潜在空間の補間を通じて書道的特徴の連続スペクトラムを示すシステムは、従来と現代的要素を融合した動的で革新的な作品の創造につながります。シヤー・マシュクの構成形式からインスピレーションを得て、私たちの作品は新しい創造的表現のモードを示し、GAN が書道アラビア文字の新たな芸術的次元を明らかにする可能性を強調する、複数の公開展示作品で結実しています。"}, {"v": "", "img": "thumbs/39d1e7a88615.jpg", "t": "Attraction of image", "a": ["Asuka Ishii", "Kazuki Nagata"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688972", "abs": "The fight against AI bias is progressing every day. Compared to measures against racial and gender inequalities, biases created by the Internet-dependent structure of datasets have not yet been thoroughly discussed."}, {"v": "", "img": "thumbs/97784ff0d94c.jpg", "t": "Carbon Farm", "a": ["Jiabao Li", "Ben Evanson"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688967", "abs": "Contribute your CO2 to our Carbon Garden, where it is transformed into nourishment for algae cultures, which are then processed into bioplastics uniquely made from your breath."}, {"v": "", "img": "thumbs/b6c5091bb109.jpg", "t": "Content Aware Studies Series", "a": ["Georgy Ègor Kraft"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688971", "abs": "Content Aware Studies series initiate an inquiry into the possibilities of AI and particularly Machine Learning to reconstruct and generate lost antique greek and roman friezes and sculptures by the means of algorithmic analysis of 3D scans of antiquity. It concerns about the potentialities of methods involving data, ML, AI and other forms of automations turning into semi-and-quasi-archeological knowledge production and interpretations of history and culture in the era of ubiquitous computation. Some of these algorithmic outputs are turned into new machine-fabricated sculptures uncanny in their algorithmic integrity. They render the work of synthetic agency that lends a faithful authenticity to the forms, while also producing bizarre errors and algorithmic normalisations of forms previously standardised and regulated by the canon of Hellenistic and Roman art."}, {"v": "", "img": "thumbs/601d249d8ca4.jpg", "t": "Diverse and Universal Camera", "a": ["Yasushi Noguchi", "Yuta Ogai"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688962", "abs": "This work is a video installation that searches and collages the footage from the Encyclopedia Cinematographica (EC) using approximately 50 different behavior style related keywords (tags) such as dancing, laughing, and spinning and then plays the results in a loop. Since the combination of videos changes every time, it allows us to observe the differences and connections between various videos from different eras and regions. This is a work that reinterprets the characteristics of EC as an encyclopedia and visualizes them. It is intended to be a medium that enables both chance encounters, like traditional paper encyclopedias, and the expansion of knowledge based on relevance, as seen in modern internet searches. In the 2019 exhibition, all video tagging was done manually, but this time, we are attempting to apply deep learning technology by artificial intelligence (AI) to the work, creating a hybrid system that combines AI-based automatic tagging with manual tagging. In this exhibition, we are also simultaneously releasing a database containing information on all EC titles. In today's world, characterized by events like the Russia-Ukraine conflict, the Palestine issue, nationalistic tendencies in various countries, and anti-immigration sentiment, there is a prevailing atmosphere of intolerance worldwide. It is precisely in such times that we believe it is important to reconsider the social significance of EC, which has documented the diversity and universality of behaviors in the natural world."}, {"v": "", "img": "thumbs/a6c0819a8263.jpg", "t": "Event Modeling", "a": ["Mark Ramos", "Ziyang Wu"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688965", "abs": "Event Modeling consists of two works: #dump and AI Fossil."}, {"v": "", "img": "thumbs/34fe310f6a4a.jpg", "t": "In Vivo / In Vitro - Trial 1.4", "a": ["Joey Verbeke", "Koi Ren"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688960", "abs": "In Vivo / In Vitro - Trial 1.4 is an interactive new media installation that leverages AI to understand the moment of unconsciousness when a viewer blinks to ephemerally display generative and evolving embryonic imagery. The piece delves into the intricate interplay between human presence and machine perception, challenging the boundaries of control and autonomy, agency and absence, in our ephemeral entanglement with these vast evolving systems. By highlighting these fleeting moments of vulnerability, our work underscores the pervasive influence of AI on our everyday experiences, inviting a deeper reflection on our relationship with technology in this pivotal era of digital transformation."}, {"v": "", "img": "thumbs/3cdea90b4a57.jpg", "t": "Matrix Model and Uberbau", "a": ["Rui Hu", "Susan Yingshu Chen"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688961", "abs": "\"Matrix Model and Uberbau\" is a real-time simulation reflecting on the synchronicity between the evolution of computer graphics and AI technology and the turbulence of financial markets. The year 2008 stands as a stark mark, when financial and housing markets globally were ravaged by a devastating crisis following a period of deceptive prosperity. Amidst this economic turmoil, Nvidia unveiled CUDA, making general-purpose computing on the Graphics Processing Unit (GPU) streamlined and accessible. Traditionally used to produce images rooted in military and entertainment, GPU has since become the essential apparatus for AI and infiltrated numerous domains including scientific computing and finance, due to its prowess in parallel computing and matrix operations. The artwork reflects on this history, with various scripted events driven by \"predictions\" of the 2007--08 Shanghai Stock Exchange Index using a deep learning neural network trained on the first-gen consumer GPU with CUDA support. In a space half sports stadium and half construction site, men and women in business suits running on the sports field are knocked over repeatedly by offscaled office items, spotlighted by GPU-drones equipped with searchlights. This scene of competition and violence is observed by automatic camera cuts and accompanied by the audio of Hong Kong comedian Wong Tze-wah's gigs about financial and housing markets and an AI-cloned Zizek discussing graphics technology and ideology. The work asks: could the widespread adoption of AI, powered by computer graphics technology, provide us with the foresight into disasters previously unforeseen, or will it only further bolster the self-perpetuating hollow nature of finance capitalism? This question cascades into multiple subtopics---basic needs versus luxury; the notion of \"model\" in graphics, sciences, and economics; the emotional aspects of the markets; the uncertainty of life; and the paradox that the only perfect model might be the one that embraces its inherent inaccuracy."}, {"v": "", "img": "thumbs/7ebd2b41d105.jpg", "t": "Me vs. You: On queer intimacy and the interpretive limits of AI vision systems", "a": ["Adam Cole", "Gregor Petrikovič", "Mick Grierson"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688969", "abs": "Me vs. You explores the nuances of queer intimacy in a world increasingly mediated by AI technologies. In this multichannel video installation, artists Adam Cole and Gregor Petrikovič feed footage from a wrestling match through a generative AI pipeline to expose the limits of surveillance-oriented machine vision systems in interpreting human interaction."}, {"v": "", "img": "thumbs/8b86566231d3.jpg", "t": "Mid Tide #3", "a": ["Ryu Furusawa"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688970", "abs": "The view of the sea is entirely different from the shore compared to being on the ocean surface. This is because your perspective is not fixed when floating on the ocean surface. In surfing, your body becomes one with the wave. This work aims to convey that sense of unity. It is challenging to express the feeling of floating, specifically the experience where your perception of time and space becomes ambiguous. Moving images are an excellent medium for dealing with the sensation of floating, but it only handles the sequence of 2D images in terms of time. The sensation of floating can't be expressed using conventional editing methods. Therefore, I developed software that creates a 3D object from video data using time as the depth dimension. The software then freely slices arbitrary planes within that object. Conventional video playback is the process of moving a cross-section of this 3D object from front to back. In this work, I derail the cross-section from the conventional linear trajectory, allowing it to swivel freely through the object. This opens up new possibilities for visual expression through the interaction of space and time as it exists in the footage. The source material for this work is footage of waves crashing against rocks, recorded with a fixed camera over several hours. In contrast to the metamorphosing rocks, the waves can more easily keep their essential form and movement even within the unique flow of time and space in this work. This is because waves are continuous in both time and space. These characteristics enable the waves to act as a guide for perceiving time and space in this work. Just as the changes in the tides can quietly transform the landscape, this work gradually erodes the viewer's perception of time and space."}, {"v": "", "img": "thumbs/3b9842b29211.jpg", "t": "One and Infinite Chairs: 1 &amp; ∞ ⑁", "a": ["Georgy Ègor Kraft"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688968", "abs": "Joseph Kossuth's 'One & Three Chairs' is the most textbook -introductory - example to conceptual art, as it touches upon a number of characteristics definitive of conceptual art. Emphasising the concept above all other perceptual content, it dematerialises art itself as a practice."}, {"v": "", "img": "thumbs/10d0113f2eee.jpg", "t": "Patriotic Stamp Machine", "a": ["Miu Ling Lam"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3701777", "abs": "Patriotic Stamp Machine draws inspiration from a series of recent incidents in Hong Kong. It features a real-time, CNC-controlled stamp painting machine alongside a column of CRT TVs displaying a series of three-channel videos."}, {"v": "", "img": "thumbs/24498f6a616f.jpg", "t": "Peep", "a": ["Chuan Tsai", "An-Jung Huang"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688956", "abs": "\"Peep\" is inspired by reality dating shows and aims to explore how the internet age fuels and amplifies voyeuristic desires. With technological advancements, people can access information from around the world without leaving their homes. This convenience has invisibly nurtured the public's voyeuristic tendencies. Reality shows have always been a popular genre for viewers, and with platforms like Netflix, their audience has significantly expanded. Dating reality shows attract viewers by exploiting their innate curiosity and using editing to create controversial scenes, leading to participants being subjected to online abuse."}, {"v": "", "img": "thumbs/4b9ebc4ea06e.jpg", "t": "Recognition: capture(scene)", "a": ["Rintaro Fujita", "Scott Allen"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688966", "abs": "The evolution of panoramic photography, from its inception with the swing-lens camera in the 1840s to its integration into modern smartphones, has transformed how we capture and perceive images. This exhibit delves into an innovative use of panoramic photography, challenging the conventional method where a series of images are stitched together to create a continuous scene. Here, a different visual experience is crafted by exploiting the iPhone's panoramic function without any technical modifications."}, {"v": "", "img": "thumbs/0fb4ab3447fd.jpg", "t": "Semantic See-through Goggles: Linguistic Virtual Reality in (Artificial) Intelligence", "a": ["Goki Muramoto", "Yuri Yasui", "Hirosuke Asahi"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688959", "abs": "Semantic See-through Goggles are a kind of glasses through which the view is once fully verbalized and re-imaged."}, {"v": "", "img": "thumbs/e72a51c3d4fb.jpg", "t": "SynCocreate", "a": ["Tiange Wang", "Xin Feng"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688964", "abs": "SynCocreate harnesses the collaborative potential of neurofeedback to offer a playful and engaging experience for cocreating artwork within a virtual 3D environment by synchronizing brainwaves between pairs of users."}, {"v": "", "img": "thumbs/3a7088ae2dcf.jpg", "t": "TAI_ON: Audible Body and Its Enveloping Rhythm", "a": ["Seioh Ezaki", "Keiichi Zempo"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688958", "abs": "In an era where digital devices are ubiquitous, people are becoming increasingly dependent on the information and alerts these devices provide, gradually losing touch with their INNER SIGNALS. The constant barrage of notifications and alarms from smartphones, smartwatches, and other digital devices has led to a disconnection between individuals and their inherent biological processes. \"TAI_ON\" is an experiential installation that aims to bridge this gap and reconnect participants with their bodies by immersing them in a protective space created by a sculpted, 300-year-old tree. The title \"TAI_ON\" is a play on words that combines the meanings of Japanese words \"tai\" (body) and \"on\" (sound), as well as the idea of switching \"ON\" one's bodily sensations, aiming to awaken the human body's innate sensory perceptions. The tree's thick annual rings act as a temporary shield, shielding participants from the outside world's constant stimuli and information flow, creating a sanctuary where individuals can temporarily escape the demands of modern life and technology. Within this organic and serene environment, participants are encouraged to attune to their breathing sounds and heartbeat rhythms. \"TAI_ON\" employs a millimeter-wave radar system that unobtrusively captures participants' biological data, providing real-time auditory feedback and enhancing the connection between participants and their bodily rhythms. By manipulating the rhythm of the heartbeat and breathing sounds, the installation can also monitor changes in the participants' biological responses, allowing for a deeper understanding of the intricate relationship between the mind, body, and environment. Following the work \"Zeroth\" by Zempo presented in SIGGRAPH Asia 2022, which explored the concept of self-awareness, \"TAI_ON\" emphasizes the auditory sense as a means of promoting self-awareness and reconnection with oneself in the digital age, advocating for the importance of maintaining a connection with one's own body by providing a space for introspection and self-discovery."}, {"v": "", "img": "thumbs/51ef71d49e51.jpg", "t": "Where Are We Now?", "a": ["Peter Williams", "Chui Ying Wong"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688963", "abs": "Where Are We Now? is a 360-degree photography-based interactive artwork that reflects on recent histories and present moments of Hong Kong. Hong Kong is a place of rapid reinvention where dramatically different cultures, economies and politics mix in unexpected ways. Especially since 2018, its people are experiencing some of the city's most significant changes in several generations."}, {"v": "", "img": "thumbs/057e8679e39a.jpg", "t": "“Pla-tsugi: Modern Kintsugi through Digital Fabrication”", "a": ["Akio Harada"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Gallery", "doi": "10.1145/3680529.3688957", "abs": "\"Pla-tsugi\" is a contemporary restoration technique developed by the artist, inspired by the traditional Japanese art of Kintsugi and Yobitsugi. Instead of gold, this method uses PLA, a material for 3D printers, to reassemble broken fragments or integrate new parts, thereby recreating the object's form and value. Essential tools for Pla-tsugi include a 3D scanner, VR/MR headsets, a 3D printer, PC software \"Blender,\" and MR headset software \"Gravity Sketch.\" By reconstructing broken pieces in a VR space and printing them with a 3D printer, the method has become a feasible approach to craftsmanship with the advancements in technology post-2023. The current exhibition showcases objects reimagined from broken fragments and features evolving Pla-tsugi techniques and their creation processes, along with live demonstrations by the artist."}, {"v": "", "img": "thumbs/ed7db57c9da4.jpg", "t": "Abutting Tokyo: AI-Driven Cognitive Distortion in VR Urban Visualization", "a": ["Xiaoyun Zhong", "Xuanyang Huang", "Rui Hu", "Shuang Wu"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695437", "abs": "This paper explores the intersection of artificial intelligence and virtual reality in visualizing urban data. It examines how AI processes and distorts urban data, influenced by the inherent biases in human-annotated datasets. \"Abutting Tokyo\" presents a VR experience that simulates data annotation process and AI’s cognitive distortions, demonstrating the symbiotic relationship between AI cognition and human perception. By critically analyzing AI’s interpretation of urban landscapes, the study underscores the impact of data biases and manipulation on AI and human cognition, offering new insights into the dynamics of AI-driven urban visualization.", "ja": "この論文は、人工知能と仮想現実が都市データの可視化に交差する点を探求します。AIが人間が注釈付けしたデータセットに内在するバイアスの影響を受けて都市データを処理・歪める方法を検証します。「Abutting Tokyo」は、データ注釈プロセスとAIの認知的歪みをシミュレートするVR体験を提示し、AI認知と人間の知覚の共生関係を実証します。AIが都市景観をどのように解釈するかを批判的に分析することで、データバイアスと操作がAIと人間の認知に与える影響を強調し、AI主導の都市可視化のダイナミクスに新たな洞察を提供します。", "tags": ["Artificial Intelligence", "Cognition", "Simulation", "Urban data visualization", "virtual reality"]}, {"v": "", "img": "thumbs/2f42397fed12.jpg", "t": "AI-Generated Art as a Trading Zone: A Creolization between the MZ Generation and Traditional Culture", "a": ["Jongcheon Shin", "Seongtae Hong", "Minwoo Kim", "Boyun Choe"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695455", "abs": "This paper examines how the concept of creolization is actually applied at the current time when generative artificial intelligence(AI) is being used in the field of art. It is addressed in the following three aspects: Firstly, we discuss a notion of 'trading zone' from the perspective of 'creolization'. Secondly, we explore how the trading zone can be formulated through the generative AI-based art project &lt;New Normal Hoengseong Hoedajisori&gt;. Thirdly, we examine how the MZ generation, which is treated as a special generation in the Korean society, experiences the 'creolization' through the generative AI-based art project &lt;New Normal Hoengseong Hoedajisori&gt;.", "ja": "この論文は、生成的人工知能（AI）が芸術分野で使用されている現在、クレオリゼーション（混成化）の概念が実際にどのように適用されているかを検証します。以下の三つの側面で取り上げます。第一に、クレオリゼーションの観点から「トレーディングゾーン」の概念について論じます。第二に、生成的AIベースのアートプロジェクト「New Normal Hoengseong Hoedajisori」を通じてトレーディングゾーンがどのように形成されるかを探ります。第三に、韓国社会で特別な世代とされるMZ世代が、生成的AIベースのアートプロジェクト「New Normal Hoengseong Hoedajisori」を通じて「クレオリゼーション」をどのように経験するかを検証します。", "tags": ["AI-generated art project", "Creolization", "Generative artificial intelligence(AI)", "Hoengseong Hoedajisori", "MZ generation", "Trading zone", "Traditional culture"]}, {"v": "", "img": "thumbs/175ba75f5a2f.jpg", "t": "AI-rays: Exploring Bias in the Gaze of AI Through a Multimodal Interactive Installation", "a": ["Ziyao Gao", "Yiwen Zhang", "Ling Li", "Theodoros Papatheodorou", "Wei Zeng"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695433", "abs": "Data surveillance has become more covert and pervasive with AI algorithms, which can result in biased social classifications. Appearance offers intuitive identity signals, but what does it mean to let AI observe and speculate on them? We introduce AI-rays, an interactive installation where AI generates speculative identities from participants‘ appearance which are expressed through synthesized personal items placed in participants’ bags. It uses speculative X-ray visions to contrast reality with AI-generated assumptions, metaphorically highlighting AI’s scrutiny and biases. AI-rays promotes discussions on modern surveillance and the future of human-machine reality through a playful, immersive experience exploring AI biases.", "ja": "データ監視はAIアルゴリズムによりますます隠密かつ広範になっており、偏った社会的分類をもたらす可能性があります。外見は直感的なアイデンティティ信号を提供しますが、AIにそれを観察させ、推測させることは何を意味するのでしょうか？本研究では、AIが参加者の外見から推測的なアイデンティティを生成し、それを参加者のバッグに入れた合成された個人アイテムとして表現するインタラクティブインスタレーション「AI-rays」を紹介します。AIは推測的なX線ビジョンを用いて現実とAI生成の仮定を対比させ、メタファーとしてAIの監視とバイアスを浮き彫りにします。AI-raysは、遊び心のある没入型体験を通じて、AIバイアスを探求し、現代の監視と人間と機械の未来の現実についての議論を促進します。", "tags": ["AI bias", "data surveillance", "deep-learning", "interactive installation", "X-ray art"]}, {"v": "", "img": "thumbs/1a87710a5299.jpg", "t": "Becoming Bats with “EchoVision”: Towards Eco-Phenomenological Mixed Reality", "a": ["Botao Amber Hu", "Jiabao Li", "Danlin Huang", "Jianan Johanna Liu", "Xiaobo Aaron Hu", "Yilan Elan Tao"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695460", "abs": "What is it like to be a bat? \"EchoVision\" is a mixed reality art experience that simulates bat echolocation, immersing participants in the perceptual umwelt of bats. Using a custom-designed, handheld, bat-shaped mask based on the open-source HoloKit mixed reality headset, participants visualize echolocation through dynamic feedback responsive to their voices and the surrounding 3D environment. Our site-specific pop-up exhibition in a natural bat habitat demonstrated mixed reality’s potential to foster empathy for non-human species. This eco-art work explores a step towards eco-phenomenological mixed reality, opening new avenues for ecological education and the exploration of more-than-human perspectives through experiential embodiment.", "ja": "バットになることはどんな感じでしょうか？「EchoVision」は、バットのエコロケーションをシミュレートし、参加者をバットの知覚的ウムヴェルトに没入させるミックスド・リアリティ・アート体験です。オープンソースのHoloKitミックスド・リアリティヘッドセットをベースにした、手に持てるバット形状のマスクをカスタム設計し、参加者は自分の声と周囲の3D環境に応じて動的にフィードバックされるエコロケーションを視覚化します。自然のコウモリ生息地で行ったサイト特化型のポップアップ展示は、ミックスド・リアリティが非人間種への共感を育む可能性を示しました。このエコアート作品は、エコフェノメノロジカル・ミックスド・リアリティへの一歩を探求し、体験的具現化を通じた生態学的教育と多種多様な視点の探求に新たな道を開きます。", "tags": ["augmented reality", "Eco-Phenomenology", "Ecocentric design", "Handheld Mixed Reality Mask", "Mixed Reality", "Non-Anthropocentric design"]}, {"v": "", "img": "thumbs/77c0671a8081.jpg", "t": "Bug in my Software", "a": ["Alina Nazmeeva"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695452", "abs": "This article discusses the conceptual underpinnings, creative process, and research methods used to create the immersive installation titled bug in my software.&nbsp; bug in my software reflects on the tensions between gender, labor, and technology by drawing parallels from the engineered lifecycle and genetically modified DNA of a silkmoth to the womxn-dominated textile labor industry and gendered biases embedded in AI development. The project combines textile installation, extended reality, and a screen-based speculative ecosystem simulation. Here, the silkmoth—both organic and an engineered creature — serves as a proxy to examine the relationship between gender, labor, human and non-human intelligence.&nbsp;", "ja": "この論文では、没入型インスタレーション「Bug in my Software」の概念的基盤、創造プロセス、研究手法について論じています。「Bug in my Software」は、ジェンダー、労働、技術間の緊張関係を、シルクガのエンジニアリングされたライフサイクルと遺伝子組み換えDNAを、女性が多数を占める繊維労働産業とAI開発に組み込まれたジェンダーバイアスと比較することで反映しています。このプロジェクトは、テキスタイルインスタレーション、拡張現実、画面ベースのスペキュレーティブエコシステムシミュレーションを組み合わせています。ここで、シルクガ—有機的でありながらエンジニアリングされた生物—は、ジェンダー、労働、人間と非人間の知性との関係を検証する代理として機能します。", "tags": ["Artificial Intelligence", "Gender", "Installation", "Textile"]}, {"v": "", "img": "thumbs/d617b146e187.jpg", "t": "Can AI Generated Ambrotype Chain the Aura of Alternative Process?", "a": ["Chinatsu Ozawa", "Tatsuya Minagawa", "Yoichi Ochiai"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695434", "abs": "\"Non-Reproducible Generative Collodion\" integrates traditional ambrotype with digital fabrication, using generative AI and NFTs to ensure each photograph’s uniqueness. This method redefines \"aura\" in the digital art era, offering new perspectives on photographic art by combining classical techniques with modern digital advancements, as supported by expert feedback.", "ja": "「Non-Reproducible Generative Collodion」は、伝統的なアンブロタイプとデジタルファブリケーションを統合し、生成AIとNFTを用いて各写真の唯一性を保証します。この手法はデジタルアート時代における「オーラ」の概念を再定義し、古典的技術と現代のデジタル技術を組み合わせることで写真芸術に新たな視点を提供します。", "tags": ["Alternative Photographic Process", "Ambrotype", "Aura", "Digital Fabrication", "Generative AI", "NFT", "Replication", "Wet Plate Collodion"]}, {"v": "", "img": "thumbs/1210e05b0ff2.jpg", "t": "Cinema Meowdiso: Films Co-Created by Human, Large Language Models and a Cat", "a": ["Xuanyang Huang", "Xiaoyun Zhong", "Zhihua Zhong", "Theodoros Papatheodorou", "Kei-Man Yip"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695443", "abs": "Cinema Meowdiso is a system that utilizes generative AI to transform daily footage captured by pets into short films across various genres. This project explores the potential of non-human entities as narrative agents and examines how AI can autonomously create stories with human guidance. An automated visual story generation system based on pets’ perspective is proposed, aiming to provide a novel fictional narrative experience that resonates with real-life footage.", "ja": "Cinema Meowdisoは、ペットが日常的に撮影した映像をさまざまなジャンルの短編映画に変換するために生成AIを活用するシステムです。このプロジェクトは、人間以外の存在を物語のエージェントとして活用する可能性を探求し、AIが人間の指導の下で自律的にストーリーを創作できる方法を検証します。ペットの視点に基づく自動化されたビジュアルストーリー生成システムを提案し、実際の映像と共鳴する新しいフィクション体験を提供することを目指します。", "tags": ["AI art", "Cinema", "Generative AI", "LLMs", "Narrative"]}, {"v": "", "img": "thumbs/0996ca8b8195.jpg", "t": "Constructing Immersive Narrative Environments with Physical Interaction: 17th-Century European Fascination with China", "a": ["Xiruo Wang"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695457", "abs": "This paper explores the idealised ancient China envisioned by 17th-century Europeans through surrealist interactive narratives within virtual spaces. The VR interactive game Moonlit Windows immerses players in a narrative environment featuring integrated physical interaction. Players control the moon via an interactive orrery, travelling between different windows and experiencing shifts in time and space. Through literature review and historical research, the theoretical analysis of surreal aesthetics describes the process of constructing a virtual space, including context-specific worldviews, interaction mechanisms, and artistic elements. Feedback from participants collected during the exhibition led to iterative improvements in interaction design and sensory immersion and contributed to the discourse on interactive narrative design in VR.", "ja": "この論文は、17世紀のヨーロッパ人が抱いた理想化された古代中国を、仮想空間内のシュールなインタラクティブ・ナラティブを通じて探求します。VRインタラクティブゲーム「Moonlit Windows」は、プレイヤーがインタラクティブなオリリ（天体模型）を操作して月を制御し、異なる窓間を移動しながら時間と空間のシフトを体験する、ナラティブ環境に没入させます。文献レビューと歴史的研究を通じて、シュールな美学の理論的分析が、文脈固有の世界観、インタラクション機構、芸術的要素を含む仮想空間の構築プロセスを記述します。展示中に参加者から収集されたフィードバックは、インタラクションデザインと感覚的没入感の反復的改善につながり、VRにおけるインタラクティブ・ナラティブデザインの議論に貢献しました。", "tags": ["17th-century European fascination", "Interactive narratives", "Surrealism", "virtual reality"]}, {"v": "", "img": "thumbs/48ceb976c984.jpg", "t": "Curves Harvesting: Dynamic Morphogenesis through Thermodynamic Sculpting of 3D Printed Structures", "a": ["Ziyuan Jiang", "Ruoqi Li", "Yasuaki Kakehi"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695459", "abs": "Curves Harvesting explores dynamic morphogenesis through thermodynamic sculpting of 3D-printed structures. This installation utilizes polylactic acid’s thermal properties to transform planar modules into complex curved surfaces. By controlling water temperature and tension, it balances deterministic design with environmental unpredictability. A comprehensive design library examines the influence of various parameters on resulting morphologies. The project challenges static sculpture concepts, offering insights into adaptive architecture and sustainable design. It contributes to the dialogue on technology, art, and nature in contemporary practice, providing a new framework for understanding form generation and environmental adaptability.", "ja": "Curves Harvestingは、3Dプリントされた構造物の熱力学的彫刻を通じて動的形態形成を探求します。このインスタレーションは、ポリ乳酸の熱特性を利用して平面モジュールを複雑な曲面に変換します。水温と張力を制御することで、決定論的デザインと環境の予測不可能性のバランスを取ります。包括的なデザインライブラリは、さまざまなパラメータが結果の形態に与える影響を検証します。このプロジェクトは、静的彫刻の概念に挑戦し、適応型建築と持続可能なデザインに関する洞察を提供します。技術、芸術、自然に関する現代実践の対話に貢献し、形態生成と環境適応性を理解するための新しいフレームワークを提供します。", "tags": ["3D Printing", "Dynamic Morphogenesis", "Parametric Design", "Responsive Materials", "Thermodynamic Sculpting"]}, {"v": "", "img": "thumbs/4e128ac8ac6a.jpg", "t": "Dance Montage through Style Transfer and Music Gen

<script>
const DATA = [{"t": "2025 Ars Electronica Animation Festival", "a": ["Juergen Hagler", "Emiko Ogawa"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3820819", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/6bd359e1e54f.jpg", "abs": "Die Ars Electronica 2023 kreist um den Themenkomplex von Eigentum und Wahrheit in Zeiten von Künstlicher Intelligenz. Dabei bewegt sich das Festival ganz nah an den Abbruchkanten unserer Zeit. Im Fokus steht die Frage, ob man im Besitz der Wahrheit sein kann, was ist »echt« und was ein »Original« und wie hängt das mit"}, {"t": "A Walled City", "a": ["Weidi Zhang", "Jieliang Luo"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812698", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/945f64ef4921.jpg"}, {"t": "Are We Gazing at the Same Moon?", "a": ["Jeyun Cloud", "Ziqian Yin"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812689", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/fb9b51235f46.jpg", "abs": "Are We Gazing at the Same Moon? Do we observe reality within the same time and space? The artwork established a moon-gazing ritual that re-imagines the moon as a concurrent presence across parallel realities, questioning the relationship between personal memory and collective memory. Challenging the process of \"Lunar Mosaic\" by reversing the process and expanding image segments of the collaged moon with generative AI, it questions the notion of a singular, unified human experience of moon-gazing. The project spans various forms, including audio-visual works, sculpture, and public installation."}, {"t": "David Em Print Exhibition: From a Mainframe to a Piece of Glass", "a": ["Catharina E Santasilia"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3820818", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/744b96ab3888.jpg", "abs": "David Em’s pioneering digital art explores the shifting relationship between humans and technology through themes of perception, transformation, identity, and consciousness. Beginning in the 1970s, Em was among the first artists to work exclusively with digital tools, creating early immersive 3D virtual worlds in collaboration with NASA’s Jet Propulsion Laboratory. His work combines mathematical structure with surreal, organic forms, producing virtual landscapes that feel both ancient and futuristic. From landmark works such as Transjovian Pipeline and Escher to his recent experiments with AI and generative art, Em’s practice reflects the evolving nature of creativity in a machine-augmented world."}, {"t": "Diffusion TV", "a": ["Sihwa Park"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812693", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/b245ace919c9.jpg"}, {"t": "Dreaming Babies: illi", "a": ["Yoon Chung Han"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812699", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/9fa493be9930.jpg", "abs": "Dreaming Babies: illi presents 23 speculative designed human babies, each linked to a different chromosomal variation, sleeping and dreaming in virtual incubators in space. Using AI-generated narratives and interactive sound input, the installation invites audiences to engage with speculative futures of human birth shaped by genetic technology. Inspired by the artist's experience with egg retrieval and Preimplantation Genetic Testing (PGT), the work questions notions of “normal,” perfection, and genetic selection. Reimagining chromosomal differences not as defects but as poetic identities and superpowers, the project reframes genetic variation as a source of imagination, multiplicity, and beauty."}, {"t": "Gradi", "a": ["Joey Verbeke", "Koi Ren"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812694", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/c485a6c716c8.jpg", "abs": "Gradi is a suite of speculative wearable intrafaces that exposes the seams in AI’s promise of effortless interaction. Four interactive artifacts, paired with videos of strange use cases, examine calibration, compression, prediction, and mediation. By misaligning tacit expectations, Gradi trades phantasmagoric seamlessness for situated, frictional encounters where bodies, models, and institutions negotiate passage. A permanent rehearsal."}, {"t": "In-between: home, belonging, and the Asian diaspora", "a": ["Shirley Wu"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812700", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/007deb7d0b8e.jpg", "abs": "in-between is a body of work that explores the immigrant experience and the difficulty of defining home. Born in the Philippines and raised across China, Japan, and the United States, I translate my own migration history—and seven interviews with Asian diaspora who moved to Tokyo—into fragile material and participatory data portraiture. The work unfolds in three parts: \"deportation\", a two-hour performance where water drips onto washi printed with my life-journey at a cadence driven by worldwide searches for \"deportation,\" eroding most where my U.S. years are longest; \"home:1–8\", silkscreened interview portraits mounted in space; and “home:collective”, where visitors add their journeys and are paired with a stranger whose definition of home resonates."}, {"t": "Simulacra Naturae - Entangled Biomes: Generative Ecosystems driven by Brain Organoid Intelligence", "a": ["Nefeli Manoudaki", "Iason Paterakis", "Mert Toka", "Diarmid Flatley", "Stejara Dinulescu"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812690", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/4cf5a96d770e.jpg", "abs": "Simulacra Naturae: Entangled Biomes operates as a multisensory infrastructure investigating how aesthetic experience emerges when biological activity, generative algorithms, and embodied agents interact. Action potentials from 131 neurons in brain organoids, grown in vitro, provide the foundation of emergent aesthetic behavior across heterogeneous subsystems spanning the visual, the sonic, and the material. Touch and proximity sensing further engages human interactions with the cyberphysical ecosystem, driving the movement of artificial plant elements. The result is a cyberphysical ecology where distributed neural dynamics and human interaction co-evolve across varying temporal and material scales."}, {"t": "SOMA: In Search of Somatic Intelligence", "a": ["Pinyao Liu"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812697", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/5a1eec7c204a.jpg", "abs": "SOMA is a multisensory robotic sculpture that engages bodily memory as a mode of human–AI communication. Visitors re-enact a remembered movement through a wearable sensing device, while the machine listens, interprets, and responds through its own mechanical choreography, forming an intimate, non-verbal dialogue between human and robotic body. At a time when human–AI interaction is dominated by text-based conversational agents, the work reclaims the body as a site of communication with artificial being, positioning somatic memory as both metaphor and method."}, {"t": "Sternwerk", "a": ["Alvaro Cassinelli", "Tobias Klein"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812692", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/1cbb10a32d8a.jpg", "abs": "Sternwerk is an interactive installation that creates meaning through a constellation of three agents: a meteorite representing deep time, a fast-paced cellular automata simulation, and the human observer. Trapped and cooled, the meteorite condenses human breath; with each falling drop, the simulated universe restarts anew. The work evokes cosmic cycles of death and rebirth—and their incomprehensible scales of space and time—while casting the living observer as their ultimate cause. The harvested drops—the work of the stars—become a testament to the ephemeral human encounter with the cosmic: a humble counter-monument to the silent void."}, {"t": "Stuck in The Middle", "a": ["Avital Meshi"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812691", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/ba8d7e74989d.jpg", "abs": "Stuck in the Middle is a participatory wearable performance that places visitors between two opposing AI-generated voices. Participants select one of five decorated vests, each staging a familiar cultural binary: Good/Evil, Happy/Sad, Female/Male, Rich/Poor, or Fast/Slow. A camera mounted on the vest captures the participant’s point of view, sends the image to GPT in real time, and translates what the system “sees” into spoken directives. One persona speaks first, offering an imperative from one pole of the binary. The opposing persona immediately contradicts it. The exchange continues for several turns, producing escalating advice, commentary, and commands that leave the wearer caught between incompatible forms of guidance."}, {"t": "The Long Fall: A descent into the ocean’s living memory", "a": ["Jiabao Li", "Manu Prakash", "Will Tallent", "Michael Bruner"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812696", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/b47ed10aedb1.jpg", "abs": "Plankton are the silent architects of Earth’s climate, sequestering 40% of our carbon emissions. The Long Fall is an interactive installation tracing this microscopic labor across scales. The audience descends from the White Cliffs of Dover to drifting marine snow. Developed with Stanford’s Prakash Lab, the work utilizes Gravity Machine data across 18 expeditions to track plankton in their natural vertical world. The installation features a “plankton instrument,” where each touch triggers the fall and sound of a species. Narration is provided by the AI-revived voice of Rachel Carson, revealing plankton’s hidden role in shaping planetary climate."}, {"t": "顫杵(sensho)", "a": ["Ryuichi Ono", "Tetsuaki Baba"], "c": "SIGGRAPH", "y": 2026, "k": "Art Gallery", "doi": "10.1145/3799824.3812695", "v": "Proceedings of the Special Interest Group on Computer Graphics and Interactive Techniques Conference Art Gallery", "img": "thumbs/739b1da3315c.jpg"}, {"t": "A Walled City: An Interactive AI Artwork for Decentralized Urban Memories and Collective Presence", "a": ["Weidi Zhang", "Lijiaozi Cheng", "Yi Wang", "Jieliang Luo"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816084", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/61615ed82344.jpg", "abs": "A Walled City is an interactive AI art installation that constructs a decentralized virtual city in real time, grounded in the visual memories contributed by its participants. Conceptually inspired by the Kowloon Walled City—a hyper-dense, self-organized urban enclave that once existed in Hong Kong—the project adopts its spatial logic, urban morphology, and visual aesthetics as the foundation for co-creating decentralized virtual settlement with AI. Participants engage by uploading personal images of their visual memories, which are interpreted by a customized multi-agent AI system and transformed into unique architectural chambers. Each chamber acts as both a vessel of artificial memory and a node in a networked, continuously evolving cityscape. This paper presents the conceptual framework, intelligent system design, and experimental visualization of A Walled City , revisiting how communities historically formed in decentralized contexts and proposing a novel multi-agent AI system that weaves personal memory fragments into a non-hierarchical shared cyberspace.", "ja": "「A Walled City」は、参加者が提供する視覚的な記憶にもとづいて、分散型の仮想都市をリアルタイムで構築するインタラクティブなAIアート・インスタレーションです。かつて香港に存在した超高密度で自己組織的な都市の飛び地である九龍城砦に概念的な着想を得て、その空間の論理、都市の形態、視覚的な美学を、AIとともに分散型の仮想集落を共創するための基盤として取り入れています。参加者は自分の視覚的な記憶の写真をアップロードすることで関わり、それらは独自のマルチエージェントAIシステムによって解釈され、固有の建築的な部屋へと変換されます。それぞれの部屋は人工的な記憶の器であると同時に、ネットワーク化され絶えず進化する都市景観の一つの節点でもあります。本論文はA Walled Cityの概念的な枠組み、知的なシステム設計、実験的な可視化を紹介し、分散的な状況のなかで共同体が歴史的にどのように形成されてきたかを振り返るとともに、個人の記憶の断片を階層のない共有サイバースペースへと織り上げる新しいマルチエージェントAIシステムを提案します。"}, {"t": "BruSHŪ: Cross-Modal Translation of Implicit Micro-Actions in Chinese Calligraphy", "a": ["Tiancheng Liu", "Shumeng Zhang", "Nicolò Merendino"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816090", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/e40c2c3b5706.jpg", "abs": "Artworks are often encountered as finished artifacts; Chinese calligraphy is a clear example. The implicit micro-actions that shape a trace, including boundaries, transitions, and timing, are fleeting and often underdetermined by the final work. This gap constrains how practitioners reflect on embodied decisions in everyday practice. We ask how to make these micro-actions perceptible to expert calligraphy artists without turning practice into instruction, assessment, or stroke-faithful reconstruction. We present BruSHŪ , a perceptual lens that translates aspects of the writing process into interpretable cross-modal cues to support in-the-moment noticing and post-hoc reflection. We also articulate a brush-as-lens framework that treats interpretability, adjustability, and non-normative feedback as prerequisites for reflective practice. We examine BruSHŪ through a studio co-creation session with an expert calligrapher and a subsequent live performance deployment, followed by reflection-based inquiry. Our findings suggest that lightweight, tunable cues can surface tacit process structure and support reflection and conversation, provided they preserve established technique and artistic autonomy.", "ja": "芸術作品はしばしば完成品として出会われますが、中国の書道はその明確な例です。境界、移行、タイミングなど、筆跡を形づくる暗黙の微細な動作は一瞬で消え去り、完成した作品からはしばしば十分に読み取れません。このずれは、実践者が日々の稽古のなかで身体的な判断を振り返ることを難しくしています。私たちは、稽古を指導や評価、筆画に忠実な再構成に変えてしまうことなく、こうした微細な動作を熟練した書家にとって知覚可能にするにはどうすればよいかを問います。そこで、書く過程の諸側面を解釈可能なクロスモーダルな手がかりへと翻訳し、その場での気づきと事後の振り返りを支える知覚のレンズ「BruSHŪ」を提示します。また、解釈可能性、調整可能性、規範的でないフィードバックを省察的な実践の前提条件として扱う「レンズとしての筆」という枠組みを示します。熟練した書家とのスタジオでの共創セッションと、その後のライブパフォーマンスでの運用、さらにそれに続く振り返りにもとづく調査を通じてBruSHŪを検証しました。その結果、軽量で調整可能な手がかりは、確立された技法と芸術的な自律性を損なわない限り、暗黙のプロセスの構造を浮かび上がらせ、振り返りと対話を支えうることが示唆されました。"}, {"t": "Computational Visual Semiotics: The “L” Programming Language by Frieder Nake", "a": ["Andres Burbano"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816081", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/9fa2323e778f.jpg", "abs": "This article explores the history of programming languages through the lens of computational arts, examining the blueprint of Frieder Nake’s “L” programming language, first presented at the Berlin Kybernetik Kongress in 1970. Rooted in the aesthetics of Max Bense and Charles Sanders Peirce’s triadic semiotics, “L” sought to create a unified formal language for two-dimensional “graphic signs,” incorporating intuitive primitives, geometric shapes, and advanced concatenation operations. Intended for artists and designers, “L” conceptually anticipated contemporary creative coding environments such as Processing by prioritizing accessibility and imaginative exploration. Despite never being implemented, “L” stands as a trailblazing contribution to visual semiotics and computational aesthetics. This study argues that analyzing Nake’s programming language proposal sheds light on how programming languages can be translated into artistic practice, deepening our understanding of the cultural dimensions of code and its role in imaginative experimentation.", "ja": "本論文は、コンピュテーショナル・アートの視点からプログラミング言語の歴史を探り、1970年にベルリンのサイバネティクス会議で初めて発表されたフリーダー・ナーケのプログラミング言語「L」の設計案を検討します。マックス・ベンゼの美学とチャールズ・サンダース・パースの三項記号論に根ざした「L」は、直感的なプリミティブ、幾何学的な図形、高度な連結操作を取り入れ、二次元の「図形記号」のための統一的な形式言語をつくろうとしたものでした。アーティストやデザイナーを対象とした「L」は、使いやすさと想像力豊かな探求を重視することで、Processingのような現代のクリエイティブ・コーディング環境を概念的に先取りしていました。一度も実装されなかったにもかかわらず、「L」は視覚記号論とコンピュテーショナルな美学への先駆的な貢献です。本研究は、ナーケのプログラミング言語の提案を分析することで、プログラミング言語がどのように芸術実践へと翻訳されうるのかが明らかになり、コードの文化的な側面と想像的な実験におけるその役割への理解が深まると論じます。", "pos": "50% 15%"}, {"t": "Creativity ≠ Generativity: A Case Study of Attentive Machine Learning in Dance Performance", "a": ["Ziyu Xu", "Zhuodi Cai"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816094", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/0c91e641350d.jpg", "abs": "Dance expresses through translation. It transforms intention, memory, and affect into embodied movement through tacit and relational knowledge. When computational systems enter this space, they introduce new translation layers that render movement legible to machines and mediate how performance is perceived and remembered. This paper presents a case study of human and machine co-performance as an attentive practice of translation through a bespoke movement recognition system embedded within a twenty-minute multimedia dance theater work. Using wearable IMU sensors and a lightweight time series classifier based on MiniRocket (MINImally RandOm Convolutional Kernel Transform), the system translates performers’ movements into real time audiovisual responses with low latency suitable for live performance. The model is performer-trained and non-generative, where mappings are predefined, but their timing remains open, allowing moments of unpredictability to emerge as a generative force within performance. Through practice-based research and reflection on moments that resisted translation, we argue that human-machine systems in the arts should be evaluated not by accuracy alone, but also by how well they preserve agency, care, and artistic intention.", "ja": "ダンスは翻訳を通じて表現します。意図、記憶、情動を、暗黙的で関係的な知を通じて身体の動きへと変えるのです。計算システムがこの領域に入ると、動きを機械にとって読み取り可能なものにし、パフォーマンスがどう知覚され記憶されるかを媒介する、新たな翻訳の層が加わります。本論文は、20分間のマルチメディア・ダンスシアター作品に組み込んだ特注の動作認識システムを通じて、人間と機械の共演を注意深い翻訳の実践として捉えた事例研究を紹介します。ウェアラブルなIMUセンサーと、MiniRocket（MINImally RandOm Convolutional Kernel Transform）にもとづく軽量な時系列分類器を用いて、システムは演者の動きを、ライブパフォーマンスに適した低遅延でリアルタイムの視聴覚的な応答へと翻訳します。モデルは演者自身のデータで学習した非生成的なもので、対応づけはあらかじめ決められていますが、そのタイミングは開かれたままであり、予測できない瞬間がパフォーマンスの中で生成的な力として立ち現れることを可能にします。実践にもとづく研究と、翻訳に抗った瞬間についての省察を通じて、芸術における人間と機械のシステムは正確さだけでなく、主体性、ケア、芸術的な意図をどれだけ保てるかによっても評価されるべきだと論じます。"}, {"t": "Data Materialization: Principles and Practices in Artistic Research", "a": ["Courtney Starrett", "Susan Reiser"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816082", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/3027d3003fa6.jpg", "abs": "We describe data materialization as a practice-based artistic research approach that translates data into physical art objects, emphasizing conceptual connection, interaction, and engagement over legibility. Drawing on an indicative review of recent data art practices, we propose data materialization as a distinct sub-genre of data art, informed by but separate from data visualization and data physicalization. We further propose a series of theoretical principles for this practice, and illustrate them through a series of original artworks. The key principles of data materialization are: 1) data are used as raw material, 2) data have a conceptual connection to the physical material, 3) data are intentionally abstracted and non-decodable, and 4) objects can be two- or three-dimensional and embrace analog processes. We frame data materialization as a mode of epistemic translation, a practice for turning abstract data into physical objects that express emotion and meaning rather than literal values. This paper suggests ways in which data materialization may transform data into shapes, forms, and installations that invite reflection, interpretation, and meaning-making.", "ja": "本論文では、データを物理的な芸術作品へと翻訳する実践ベースの芸術研究のアプローチとして「データ・マテリアライゼーション」を説明し、読み取りやすさよりも概念的なつながり、インタラクション、関与を重視します。近年のデータアートの実践を概観したうえで、データ・マテリアライゼーションを、データ可視化やデータ・フィジカライゼーションから影響を受けつつもそれらとは異なる、データアートの独自のサブジャンルとして提案します。さらにこの実践のための理論的な原則を提示し、一連のオリジナル作品を通じて示します。データ・マテリアライゼーションの主な原則は次の4つです。1）データを素材として使う、2）データが物理的な素材と概念的につながっている、3）データは意図的に抽象化され、読み解けないようにされている、4）作品は二次元でも三次元でもよく、アナログなプロセスを取り入れる。私たちはデータ・マテリアライゼーションを認識論的な翻訳の一様式、すなわち抽象的なデータを、文字どおりの値ではなく感情や意味を表す物理的な作品へと変える実践として位置づけます。本論文は、データ・マテリアライゼーションがデータを、内省・解釈・意味づけを促す形やフォルム、インスタレーションへと変える道筋を示します。"}, {"t": "Echoes of the Prior: A Computational Phenomenology of Forgetting", "a": ["Gege Gao", "Bernhard Schölkopf", "Andreas Geiger"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816072", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/7d577686afe3.jpg", "abs": "Memory is not merely the storage of data; it is the scaffolding of reality. When biological memory fades, the world does not simply turn black; it regresses into an unrecognizable chaos. Echoes of the Prior is an interactive installation that attempts to visualize this subjective phenomenology of forgetting . By inducing controlled synaptic decay within a Feed-Forward 3D Reconstruction model, we create an artistic analogy for the erosion of the brain’s predictive priors. We position the Neural Network not as a tool for engineering, but as a cognitive proxy - a silicon brain whose structural degeneration evokes the disorienting, poetic, and terrifying experience of losing one’s grip on the world. Ultimately, we offer this framework as a catalyst, inviting the wider community to explore the uncharted potential of neuromorphic aesthetics in visualizing the fragility of intelligence. Interactive demo: https://decart-4d.github.io/.", "ja": "記憶は単なるデータの保存ではなく、現実を支える足場です。生物の記憶が薄れるとき、世界はただ暗転するのではなく、見分けのつかない混沌へと退行します。「Echoes of the Prior」は、この忘却の主観的な現象学を可視化しようとするインタラクティブ・インスタレーションです。フィードフォワード型の3D再構成モデルの中で制御されたシナプスの減衰を引き起こすことで、脳の予測的な事前知識が侵食されていく過程の芸術的なアナロジーを作り出します。私たちはニューラルネットワークを工学の道具としてではなく、認知の代理、すなわち構造の劣化によって、世界をつかめなくなる経験の当惑と詩情と恐怖を呼び起こすシリコンの脳として位置づけます。最終的にこの枠組みを触媒として提示し、知能のもろさを可視化するニューロモーフィックな美学の未踏の可能性を、より広いコミュニティが探求するよう呼びかけます。インタラクティブデモ：https://decart-4d.github.io/"}, {"t": "Edges of Immersion: Data Translation into Ecoaesthetic Experience", "a": ["Rasa Smite", "Raitis Smits"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816093", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/33750efb9719.jpg", "abs": "Climate change is increasingly encountered through data, models, and sensor-based measurements that operate beyond direct human perception. While scientifically meaningful, these representations often remain abstract and experientially distant. This paper examines how immersive media translate environmental data into ecoaesthetic experience, enabling ecological processes to be sensorially engaged. Climate perception has increasingly been explored through VR-based embodied experiences in scientific and artistic research; however, these works do not address how immersion is constructed or how ecoaesthetic and artistic strategies enable perceptual shifts between sensing environmental phenomena and recognizing their mediation. We introduce the concept of edges of immersion to describe moments where experiential coherence is strategically modulated through attenuation (the deliberate reduction of perceptual coherence), allowing mediation to become perceptible. Rather than grounding immersion primarily in technological advances, these edge conditions show how it is constructed through aesthetic and spatio-compositional strategies of data translation. The argument is developed through a case study of Atmospheric Forest (2020) , an immersive ecoaesthetic artwork that integrates LiDAR scans of a drought-affected Alpine forest with long-term environmental monitoring data, including volatile organic compound emissions, soil moisture, temperature, and humidity. In this work, data sensorialization—the spatial, temporal, and audiovisual composition of data—is used to transform ecological processes into experientially accessible forms across both VR and multi-channel installation formats. By examining the edges of immersion, this paper articulates a set of artistic strategies shaping perception within immersive ecoaesthetic environments that operate as spaces where scientific data are translated into situated, multisensory experience, contributing to the formation of climate imaginaries.", "ja": "気候変動はますます、人間の直接の知覚を超えて働くデータやモデル、センサーによる測定を通じて経験されるようになっています。科学的には意味があるものの、こうした表現はしばしば抽象的で、実感から遠いままです。本論文は、没入型メディアが環境データをどのようにエコエステティックな体験へと翻訳し、生態系のプロセスに感覚的に関わることを可能にしているかを検討します。気候の知覚は科学や芸術の研究のなかでVRによる身体的な体験を通じて探られてきましたが、それらの作品は、没入がどのように構築されるのか、またエコエステティックな芸術的戦略が、環境現象を感じ取ることとその媒介に気づくことのあいだの知覚の転換をどう可能にするのかを扱っていません。私たちは「没入の縁」という概念を導入し、体験の一貫性が減衰（知覚的な一貫性を意図的に下げること）によって戦略的に調整され、媒介が知覚可能になる瞬間を記述します。没入を主に技術の進歩に根拠づけるのではなく、こうした縁の状態は、没入がデータ翻訳の美的・空間構成的な戦略を通じてどのように構築されるのかを示します。この議論は、干ばつの影響を受けたアルプスの森林のLiDARスキャンと、揮発性有機化合物の放出量、土壌水分、気温、湿度を含む長期の環境モニタリングデータを統合した没入型のエコエステティック作品「Atmospheric Forest」（2020）の事例研究を通じて展開されます。この作品では、データの感覚化、すなわちデータの空間的・時間的・視聴覚的な構成によって、VRとマルチチャンネルのインスタレーションの両形式で生態系のプロセスを体験可能な形へと変えています。没入の縁を検討することで、本論文は没入型のエコエステティック環境のなかで知覚を形づくる一連の芸術的戦略を明らかにします。そうした環境は科学データが状況に根ざした多感覚的な体験へと翻訳される場として働き、気候をめぐる想像力の形成に寄与します。"}, {"t": "Electrospun Fields: 3D Nano-Fiber Material Computation as Design Method", "a": ["Wai Lok Wan", "Ayah Mahmoud", "Sergio Mutis", "Avantika Velho", "Annie Xing", "Behnaz Farahi"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816080", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/54134290dae7.jpg", "abs": "Electrospun Fields presents a material–computational approach to design in which form emerges through the interaction of matter, electric fields, and computation rather than through explicit geometric prescription. Departing from geometry-driven fabrication paradigms, this work explores robotic electrospinning of biodegradable nanofibers onto three-dimensional conductive structures, treating electrospinning as a spatial, field-based modeling process. Bio-compatible materials—including keratin, silk, and biodegradable synthetic polymers—are investigated to establish an operating envelope for material-driven form generation. Through systematic studies of scaffold geometry, we show that topological curvature plays a critical role in material accumulation: while convex geometries support consistent deposition, concave regions exhibit field shielding that prevents fibers from penetrating geometric valleys. This limitation directly motivates the development of a custom robotic electrospinning platform capable of dynamically reorienting the emitter to access complex three-dimensional topologies. In this framework, conductive scaffolds condition electric field distributions rather than define form directly. Electric fields operate as a physical computation layer, and electrospun fibers act as a material rendering of force interactions. Properties such as fiber density, porosity, orientation, and thickness emerge through the coupled dynamics of field conditions, scaffold geometry, and material behavior. The resulting structures are grown rather than assembled, foregrounding emergence, material intelligence, and field-mediated form generation, and offering an alternative to geometry-centric fabrication in art and design.", "ja": "「Electrospun Fields」は、形を幾何学的に明示して指定するのではなく、物質・電場・計算の相互作用を通じて形が立ち現れる、物質と計算によるデザインのアプローチを提示します。幾何学主導の製作パラダイムから離れ、本作は生分解性ナノファイバーを三次元の導電性構造体にロボットで電界紡糸することを探究し、電界紡糸を空間的な、場にもとづくモデリングのプロセスとして扱います。ケラチン、シルク、生分解性の合成高分子といった生体適合性のある素材を調べ、素材主導の形態生成が成り立つ条件の範囲を定めました。足場（スキャフォールド）の形状を体系的に調べた結果、位相的な曲率が素材の堆積に決定的な役割を果たすことがわかりました。凸型の形状では安定して堆積する一方、凹型の領域では電場の遮蔽が起こり、繊維が形の谷間に入り込めません。この限界が直接の動機となり、エミッタの向きを動的に変えて複雑な三次元トポロジーに届くことのできる独自のロボット電界紡糸プラットフォームを開発しました。この枠組みでは、導電性の足場は形を直接決めるのではなく、電場の分布を条件づけます。電場は物理的な計算の層として働き、紡がれた繊維は力の相互作用を物質としてレンダリングしたものになります。繊維の密度、多孔性、向き、厚みといった性質は、場の条件、足場の形状、素材の振る舞いが結びついた動力学から生まれます。こうしてできる構造は組み立てられるのではなく育つものであり、創発、素材の知性、場が媒介する形態生成を前面に出し、芸術とデザインにおける幾何学中心の製作に代わる道を示します。"}, {"t": "Expanded Voices: Voice Cloning, Latent Spaces, and Embodied Translation", "a": ["Tomas Andrade Weber", "Maria Arnal Dimas", "Raquel Barrachina Llobet", "Sol Bucalo Mana", "Jerónimo Calderón", "Fernando Cucchietti", "Adrià Espinoza Gómez", "Paula Fernández Vergara", "David Garcia-Povedano", "Alex Gil", "Roger Gonzalez March", "Othmane Hayoun Mya", "Marc Heras Villacampa", "Míriam Herrero-Valea", "Guillermo Marín", "Paula Méndez Gordillo", "Thaleia Ntiniakou", "Sara Tolosa Alarcón"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816077", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/70f4769032eb.jpg", "abs": "Expanded Voices is an interactive installation that explores voice cloning through timbre transfer and latent space visualization. Developed through a collaboration between the Data Analytics and Visualization Group at the Barcelona Supercomputing Center and professional singer and artist Maria Arnal, the work allows participants to transform their voices into a trained vocal model while visually navigating the latent representations underlying the conversion. While not a translation system in the traditional linguistic sense, the installation reveals translational processes operating across representation and embodiment. Users report that converted voices sound perceptually native across multiple languages, even though the model is trained on a limited set of source languages. Motivated by this observation, we analyze the structure of phonetic latent spaces showing that speech from different languages organizes into shared patterns anchored in breath and articulation. By combining artistic practice, data analysis, and visualization, this work positions timbre transfer as a creative form of translation between bodies, languages, and machines, and demonstrates how latent spaces can function as interpretable bridges between human vocal production and computational representation.", "ja": "「Expanded Voices」は、音色変換と潜在空間の可視化を通じて声のクローニングを探るインタラクティブ・インスタレーションです。バルセロナ・スーパーコンピューティング・センターのデータ分析・可視化グループと、プロの歌手でありアーティストのマリア・アルナルとの協働によって開発され、参加者は自分の声を学習済みの声のモデルへと変換しながら、その変換の基盤にある潜在表現を視覚的にたどることができます。従来の言語学的な意味での翻訳システムではありませんが、このインスタレーションは表象と身体化をまたいで働く翻訳的なプロセスを明らかにします。モデルは限られた元言語で学習されているにもかかわらず、変換された声は複数の言語でネイティブのように聞こえると利用者は報告しています。この観察を出発点として音声の潜在空間の構造を分析し、異なる言語の発話が呼吸と調音に根ざした共通のパターンへと組織されることを示します。芸術実践、データ分析、可視化を組み合わせることで、本作は音色変換を身体・言語・機械のあいだの創造的な翻訳の形として位置づけ、潜在空間が人間の発声と計算的表現をつなぐ解釈可能な橋として機能しうることを示します。"}, {"t": "From Computer Vision to the Vision of Law: Human Overs[a]ight", "a": ["Kristina Tica", "Joaquín Santuber"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816088", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/8f994f4ac475.jpg", "abs": "This paper reports on a translating practice between computer vision operations and the law, through the development of an art installation and research project, HUMAN OVERS[A]IGHT: THE OPS ROOM, presented at the Ars Electronica Festival 2025 in Linz. The installation is situated at the intersection of law and computer vision, questioning the legal understanding of the concepts underlying the development and deployment of high-risk AI systems. Under Article 14 of the European Artificial Intelligence Act (EU AI Act), the law requires adequate ‘human oversight’ in safety protocols for high-risk AI operations. However, the legislator seems to have merely addressed the potential complexities of interaction and human-machine operations. Article 14, suggesting a human-machine interface, a ‘stop button’, has opened for us a series of arguments and standpoints for investigating the scope of human agency, responsibility, and means of communication in decision-making processes, both machinic [automated] and human [cognitive]. In our research and in the artwork, we explore the complexities of interaction mechanisms that remain vague and underdeveloped in the law. We aim to expose potential frictions in translation between operational processes and their visual representation, as well as the limitations of social negotiation and contestation that the legislator appears to have overlooked. This research draws on the legal definitions of computation, reintroducing them into computer vision processes in the artistic representation of science fiction narratives, as invoked by the legislator through a trope such as a ‘stop button’ in a system of computational operations.", "ja": "本論文は、2025年にリンツで開催されたアルス・エレクトロニカ・フェスティバルで発表されたアート・インスタレーション兼研究プロジェクト「HUMAN OVERS[A]IGHT: THE OPS ROOM」の制作を通じた、コンピュータビジョンの操作と法とのあいだの翻訳の実践について報告します。このインスタレーションは法とコンピュータビジョンの交差点に位置し、高リスクAIシステムの開発と運用の根底にある概念を法がどのように理解しているかを問いかけます。欧州人工知能法（EU AI法）第14条のもとで、法は高リスクのAI運用の安全手順において適切な「人間による監視」を求めています。しかし立法者は、インタラクションや人間と機械の協働の潜在的な複雑さに、表面的にしか向き合っていないように見えます。人間と機械のインターフェース、すなわち「停止ボタン」を示唆する第14条は、機械的［自動化された］な意思決定と人間的［認知的］な意思決定の両方のプロセスにおける、人間の主体性、責任、コミュニケーション手段の範囲を探るための一連の論点と立場を私たちに開きました。研究と作品の中で、法の中では曖昧で未発達なままのインタラクションの仕組みの複雑さを探ります。運用プロセスとその視覚的な表象とのあいだの翻訳に潜む摩擦、そして立法者が見落としているように見える社会的な交渉や異議申し立ての限界を明らかにすることを目指します。本研究は計算に関する法的な定義を手がかりに、それらをコンピュータビジョンのプロセスへと再び持ち込み、立法者が計算的な操作のシステムにおける「停止ボタン」のような比喩によって呼び起こしたSF的な物語を芸術的に表象します。"}, {"t": "Gesture Flux: Unveiling Budaixi Hand Gestures through Mixed Reality Performance", "a": ["Yi-Jen Lin", "Chun-Cheng Hsu", "Wei-Chen Yen"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816073", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/759f7e45591b.jpg", "abs": "This paper presents Gesture Flux, an immersive performance system that integrates mixed reality (MR) gesture recognition, Budaixi (traditional Taiwanese glove puppetry), and contemporary dance. Inspired by established hand gestures from Budaixi performance, the work focuses on digital reinterpretation, using MR as a medium for movement and spatial mediation. It explores how hand gestures traditionally hidden beneath the puppet body can be brought into perceptual awareness through embodied interaction. The system combines real-time hand-gesture tracking with particle-based visual effects, transforming the dancer’s hand movements into luminous trajectories in space. Three interactive modes—Basic, Extended, and Radiant—are designed to represent different stages of gestural expression, ranging from direct gesture articulation to perceptual extension and energetic radiation. Through these modes, the work engages with the embodied and performative potential of Budaixi gestures within hybrid physical–virtual environments. Across four public performances, the dancer performs while wearing an MR headset, with Budaixi cultural gestures rendered as particle-based visuals through hand movements within a shared immersive space. This enables Budaixi gestures to be re-generated and perceived, and suggests the system’s potential as a medium for cultural reinterpretation on the contemporary stage.", "ja": "本論文は、複合現実（MR）によるジェスチャー認識、布袋戯（台湾の伝統的な指人形劇）、コンテンポラリーダンスを統合した没入型パフォーマンスシステム「Gesture Flux」を紹介します。布袋戯の上演で確立された手の所作に着想を得て、MRを動きと空間の媒介として用いたデジタルな再解釈に焦点を当てています。本作は、従来は人形の胴体の下に隠れていた手の所作を、身体的なインタラクションを通じて知覚できるものにする方法を探ります。システムはリアルタイムの手のジェスチャー追跡とパーティクルによる視覚効果を組み合わせ、ダンサーの手の動きを空間に光の軌跡として描き出します。Basic、Extended、Radiantの3つのモードは、所作を直接表す段階から知覚的な拡張、エネルギーの放射に至るまで、ジェスチャー表現の異なる段階を表すように設計されています。これらのモードを通じて、物理空間と仮想空間が混在する環境における布袋戯の所作の身体的・パフォーマンス的な可能性に取り組みます。4回の公開公演では、ダンサーがMRヘッドセットを装着して踊り、布袋戯の文化的な所作が共有された没入空間の中で手の動きを通じてパーティクル映像として描かれました。これにより布袋戯の所作が再生成・再知覚され、現代の舞台における文化的再解釈の媒体としてのシステムの可能性が示されました。"}, {"t": "Gorgon Loop: An Interactive Art Installation Revealing Algorithmic Judgment through Machine Vision and Generative Language", "a": ["Shuang Li", "Patrick Hartono"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816086", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/9d719cfb19c8.jpg", "abs": "Gorgon Loop is an interactive art installation that examines how AI-driven judgement systems operate in public space and how they simulate and amplify collective discourse and social gaze. The name Gorgon Loop draws on Greek mythology: like Medusa's paralysing gaze, machine vision implies power, while Medusa — shaped by projection rather than born monstrous — mirrors how AI is granted false agency. Comprising five rotatable “intelligent mirrors,” the system activates when viewers enter the installation area. Using machine vision, it translates appearance and posture into structured parameters that are both displayed on the mirror surfaces and used as input for generative language agents. These agents produce sequential, persona-constrained text commentary with evaluative overtones, unfolding across the mirrors in a format resembling a group chat. By exposing intermediate visual features, extracted descriptors, and the resulting language output as a continuous public performance, Gorgon Loop renders classification, inference, and bias perceptible as lived experience rather than hidden technical process.", "ja": "「Gorgon Loop」は、AIによる判定システムが公共空間でどのように働き、集団的な言説や社会のまなざしをどのように模倣し増幅するのかを検証するインタラクティブ・アート・インスタレーションです。Gorgon Loopという名前はギリシャ神話に由来します。メドゥーサの人を石にするまなざしのように、機械の視覚は権力を含意します。そして生まれつき怪物だったのではなく投影によって形づくられたメドゥーサは、AIに偽りの主体性が与えられるさまを映し出します。回転する5枚の「知的な鏡」で構成されたシステムは、鑑賞者が展示エリアに入ると起動します。機械の視覚を用いて外見や姿勢を構造化されたパラメータに変換し、それを鏡の表面に表示すると同時に、生成的な言語エージェントへの入力として使います。これらのエージェントは、評価的な色合いを帯びた、ペルソナに縛られたテキストのコメントを次々に生成し、グループチャットのような形式で鏡の上に展開します。中間的な視覚特徴、抽出された記述子、そして結果として生じる言語出力を連続した公開パフォーマンスとしてさらけ出すことで、Gorgon Loopは分類、推論、偏見を、隠れた技術的プロセスではなく生きられた体験として知覚できるものにします。"}, {"t": "Infant Vision: Reconfiguring Perception in Mixed Reality", "a": ["Wei-Chen Yen", "Seth Riskin", "Chun-Cheng Hsu"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816074", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/741b23068912.jpg", "abs": "Human visual perception in infancy is both mysterious and profoundly significant. In earlier traditions of art and philosophy, infant vision was often imagined as an innocent eye, as if it were closer to pure, untrained sensory input. However, contemporary vision science suggests that infants exhibit certain perceptual biases from birth, and that their developing visual abilities may not be a deficit but rather a key strategy that supports early cognitive development. Building on this perspective, we want to know what kinds of feelings and behavioral changes might emerge if people return to infant-like viewing conditions. Using a mixed reality head-mounted display (MR-HMD) as a medium for perceptual extension, we construct an infant-like first-person viewing experience. We explore Infant Vision as a tool for perceptual reconfiguration, considering how it may evoke a sense of embodiment and shape participants’ behaviors.", "ja": "乳児期の人間の視覚知覚は、謎に満ちていると同時に非常に重要なものです。かつての芸術や哲学の伝統では、乳児の視覚はしばしば「無垢な目」、つまり訓練されていない純粋な感覚入力に近いものとして想像されてきました。しかし現代の視覚科学は、乳児が生まれつき特定の知覚的な偏りを示すこと、そして発達途中の視覚能力は欠陥ではなく初期の認知発達を支える重要な戦略である可能性を示唆しています。この視点に立ち、人が乳児のような見え方の条件に戻ったとき、どのような感情や行動の変化が生じるのかを探ります。複合現実のヘッドマウントディスプレイ（MR-HMD）を知覚拡張の媒体として用い、乳児のような一人称視点の体験を構築しました。「Infant Vision」を知覚を再構成する道具として探究し、それが身体化の感覚をどのように呼び起こし、参加者の行動をどう形づくるかを考察します。"}, {"t": "Large-Scale Photogrammetric Documentation of St. John’s Co-Cathedral: A Workflow for Cultural Heritage Preservation", "a": ["Matthew Kenely", "Mark Bugeja", "Andre Grima", "Peter Pullicino", "Matthew Pullicino", "Dylan Seychell"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816089", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/537d8285c505.jpg", "abs": "We present a comprehensive methodology for the large-scale photogrammetric documentation of St. John’s Co-Cathedral in Valletta, Malta, a UNESCO World Heritage site renowned for its ornate Baroque architecture and Caravaggio masterpieces. Over seven nights of evening-only data collection, we captured 99,000 images using DSLR cameras, drone photography, and LIDAR scanning to create a highly detailed 3D reconstruction comprising 25-30 billion triangles. This paper documents our complete workflow for cultural heritage preservation, addressing the unique challenges of digitizing complex baroque architectural spaces with highly reflective metallic surfaces, dark materials, intricate tapestries, and restricted access. We detail our pipeline from multi-modal data acquisition through processing, including strategic image grading and AI-assisted denoising to address low-light grain, extensive LIDAR point cloud cleanup, hybrid photogrammetric reconstruction using RealityCapture, and mesh subdivision strategies for real-time visualization engines. Our methodology combines automated workflows with necessary manual intervention to handle the scale and complexity of the project, with particular attention to reflective surface challenges characteristic of baroque heritage sites. We also present preliminary experiments with Gaussian splatting as a complementary representation technique. The resulting digital archive serves multiple preservation purposes including disaster recovery documentation, conservation analysis, virtual tourism, and scholarly research. This work provides a detailed, replicable workflow for heritage professionals undertaking similar large-scale architectural documentation projects, addressing the practical challenges of applying photogrammetric methods in complex real-world heritage scenarios.", "ja": "本論文は、華麗なバロック建築とカラヴァッジョの傑作で知られるユネスコ世界遺産、マルタ・ヴァレッタの聖ヨハネ准司教座聖堂を大規模にフォトグラメトリで記録するための包括的な方法論を示します。夜間のみの7晩にわたるデータ収集で、デジタル一眼レフカメラ、ドローン撮影、LiDARスキャンを用いて99,000枚の画像を撮影し、250億〜300億ポリゴンからなる非常に精細な3D再構成を作成しました。本論文は文化遺産保存のための一連のワークフローを記録し、反射の強い金属面、暗い素材、精緻なタペストリー、立ち入りの制限といった、複雑なバロック建築空間をデジタル化する際の固有の課題に取り組みます。マルチモーダルなデータ取得から処理までのパイプラインとして、暗所のノイズに対処する戦略的な画像のグレーディングとAIによるノイズ除去、LiDAR点群の大規模なクリーンアップ、RealityCaptureを用いたハイブリッドなフォトグラメトリ再構成、リアルタイム可視化エンジンのためのメッシュ分割の戦略を詳しく述べます。本手法は自動化されたワークフローと必要な手作業を組み合わせてプロジェクトの規模と複雑さに対処し、とりわけバロックの遺産に特有の反射面の課題に注意を払っています。また、補完的な表現手法としての3D Gaussian Splattingの予備的な実験も紹介します。完成したデジタルアーカイブは、災害復旧のための記録、保存修復の分析、バーチャル観光、学術研究など、さまざまな保存の目的に役立ちます。本研究は、同様の大規模な建築記録プロジェクトに取り組む遺産の専門家のために、詳細で再現可能なワークフローを提供し、複雑な現実の遺産の現場でフォトグラメトリの手法を適用する際の実際的な課題に応えます。"}, {"t": "Light Architecture: Translating the AI Black Box into Immersive Experience", "a": ["Yiyun Kang"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816075", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/7cb1b2e7708c.jpg", "abs": "Addressing the “Great Anxiety” driven by AI’s inherent black-box nature, this paper proposes Light Architecture (Figure 1 ) to render these opaque systems perceptible. Departing from generative AI art, this project performs a structural Translation of invisible AI architecture. The installation functions as a Gesamtkunstwerk , synthesizing kinetic Neural Pods, projection, and spatial audio into an immersive system. Furthermore, Light Architecture transcends mere translation, aiming to physically construct a brain-inspired conceptual model that transcends the linear optimization of conventional AI. Therefore, this research comprehensively examines the design processes underlying Light Architecture . Theoretically grounded in Heidegger’s notion of Unconcealment (Aletheia), the work strips away seamless interfaces to physically manifest algorithmic flows. By converting abstract logic into visceral sensory experience, the project proposes a paradigm shift from Explainable AI (XAI) to Experiential AI . Ultimately, this paper argues that confronting the AI Hyperobject through embodied engagement is essential for reclaiming human agency. By “Making the Invisible Visible,” Light Architecture offers a poetic yet critical framework for navigating the inscrutable technological terrain of the algorithmic age.", "ja": "AIが本質的に持つブラックボックス性がもたらす「大いなる不安」に応えて、本論文はこうした不透明なシステムを知覚可能にする「Light Architecture」（図1）を提案します。生成AIアートとは異なり、本プロジェクトは目に見えないAIのアーキテクチャを構造的に「翻訳」します。インスタレーションは、動くNeural Pod、プロジェクション、空間音響を没入型のシステムへと統合する総合芸術作品として機能します。さらにLight Architectureは単なる翻訳を超え、従来のAIの線形的な最適化を超える、脳に着想を得た概念モデルを物理的に構築することを目指しています。そこで本研究では、Light Architectureの背後にある設計プロセスを包括的に検討します。ハイデガーの「非隠蔽性（アレーテイア）」の概念を理論的な基盤とし、継ぎ目のないインターフェースを取り去ってアルゴリズムの流れを物理的に顕在化させます。抽象的な論理を身体に響く感覚体験へと変換することで、説明可能なAI（XAI）から体験可能なAI（Experiential AI）へのパラダイム転換を提案します。最終的に本論文は、身体的な関与を通じてAIというハイパーオブジェクトに向き合うことが、人間の主体性を取り戻すために不可欠であると論じます。「見えないものを見えるようにする」ことで、Light Architectureはアルゴリズムの時代の不可解な技術的地形を進むための、詩的でありながら批評的な枠組みを提供します。"}, {"t": "Machine Civilization: Exploring Machine Alterity through a Generative Semiotic Installation", "a": ["Jia-Qi Shi", "Yixiong Wang", "Jiawen Zheng", "Hourun Wang", "Yufeng Zeng", "Chen Liang"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816083", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/fb6d96d9d42b.jpg", "abs": "Machine Civilization is a multi-screen mechanical installation that imagines an autonomous system observing the world through diverse machine perspectives and generating scripts independent of human semantic frameworks. The installation implements a real-time system of observation, interpretation, collective deliberation, and script inscription, producing formal familiarity and semantic untranslatability. Taking this artwork as a case, this study starts from machines’ autonomous cognitive features and takes “machine writing” as its entry point to explore three issues in the intelligence era: the gap between interpretability and understandability, the flow of meaning between humans and machines, and the ethical encounter with the machine as the Other. Inspired by Levinas’s concept of alterity, the work challenges anthropocentric perspectives by emphasizing machine cognition’s autonomy beyond human semantics. This study contributes to expanding the epistemological and ethical discussion on non-human intelligence through artistic practice, and exploring more open modes of interaction with the technological Other.", "ja": "「Machine Civilization」は、多様な機械の視点から世界を観察し、人間の意味の枠組みから独立した文字を生成する自律システムを構想した、マルチスクリーンの機械仕掛けのインスタレーションです。本作は観察、解釈、集団的な討議、文字の刻記からなるリアルタイムのシステムを実装し、形の上では見慣れていながら意味の上では翻訳不可能なものを生み出します。この作品を事例として、本研究は機械の自律的な認知の特徴から出発し、「機械が書くこと」を入り口に、知能の時代における3つの問題を探ります。すなわち、解釈可能性と理解可能性のあいだのずれ、人間と機械のあいだの意味の流れ、そして他者としての機械との倫理的な出会いです。レヴィナスの他者性の概念に着想を得て、本作は人間の意味を超えた機械の認知の自律性を強調することで、人間中心の視点に異議を唱えます。本研究は芸術実践を通じて人間以外の知能に関する認識論的・倫理的な議論を広げ、技術的な他者とのより開かれた関わり方を探ることに貢献します。"}, {"t": "Printing the Underdetermined: Materializing Multi-solutionness in Figurative Paintings", "a": ["Yutao Ming", "Teng Xu", "Youjia Wang", "Yunyang Liu", "Fengmin Yang", "Fuqiang Zhao", "Jingyi Yu", "Yanjun Zhou"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816091", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/f415cd1146cb.jpg", "abs": "Figurative paintings are often approached as if they depict a single recoverable 3D scene: viewers infer depth and occlusion, and reconstruction pipelines attempt to converge to one stable model. We instead foreground multi-solutionness , the non-uniqueness of 3D configurations compatible with a single painted image, and propose a workflow that keeps this non-uniqueness visible and material. Multi-solutionness arises from two sources: unobserved content , where backsides and occluded volumes admit multiple plausible completions, and observed cues , where perspective, shading, and occlusion still underconstrain geometry. When additional views are synthesized by a video generative model without explicit 3D constraints, small frame-level drifts become inevitable rather than exceptional. Our pipeline samples multiple camera-orbit multi-view video sequences from one painting, reconstructs each sequence with 3D Gaussian Splatting into a point-based Gaussian scene representation where density halos and ghosting expose unresolved degrees of freedom, and fabricates these representations as physical artifacts using DreamPrinting. By treating multiple compatible interpretations as explicit outputs rather than residual error, we provide a computational framework for spatial readings of figurative painting that can be inspected, compared, and discussed in both digital and physical form.", "ja": "具象絵画はしばしば、復元可能な一つの3Dシーンを描いたものであるかのように扱われます。鑑賞者は奥行きや遮蔽を推し量り、再構成のパイプラインは一つの安定したモデルへの収束を試みます。私たちはそれに代えて、一枚の絵画に整合する3D構成が一つに定まらないという「多解性」を前面に出し、この非一意性を目に見える形で物質化するワークフローを提案します。多解性は2つの原因から生じます。一つは観測されない内容で、裏側や隠れた部分には複数のもっともらしい補完がありえます。もう一つは観測された手がかりで、遠近法、陰影、遮蔽があっても形状は十分に制約されません。明示的な3D制約を持たない動画生成モデルで追加の視点を合成すると、フレーム単位の小さなずれは例外ではなく避けられないものになります。私たちのパイプラインは、一枚の絵画からカメラが周回する複数の多視点動画をサンプリングし、それぞれを3D Gaussian Splattingで点ベースのガウシアンによるシーン表現へと再構成します。そこでは密度のハローやゴーストが解消されていない自由度を露わにします。そしてこれらの表現をDreamPrintingを用いて物理的なオブジェクトとして造形します。互換性のある複数の解釈を残差としての誤差ではなく明示的な出力として扱うことで、デジタルと物理の両方の形で検証・比較・議論できる、具象絵画の空間的な読解のための計算的な枠組みを提供します。"}, {"t": "Resonance: Meditative Neural Rhythms as Collective Spatial Experience", "a": ["Ruipeng Wang", "Yuxiang Cheng", "Zhiyan Xing", "Behnaz Farahi"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816079", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/8cdb6362e504.jpg", "abs": "Resonance is an interactive installation that externalizes meditation as collective spatial experience by translating a meditator’s neural rhythms into water, vibration, and light. Real-time EEG data modulates vibration within a suspended water vessel, generating wave patterns whose refracted caustics are projected across the surrounding architecture. Rather than visualizing cognition as abstract data, the system situates neural activity within physical matter and immersive space, forming an embodied relationship between mind, matter, and architecture. Grounded in theories of extended cognition, Resonance proposes that bio-responsive environments can actively participate in shaping attention and awareness. By shifting neurofeedback from individual interaction to immersive spatial media, this work transforms meditation from a solitary practice into a phenomenon that surrounds and immerses the audience. The project synthesizes meditation traditions, fluid mechanics, and computational design, contributing a spectator-centered model of bio-responsive design where cognition is encountered not as private feedback but as shared experience. Through this synthesis, Resonance expands interactive media toward embodied presence and shared contemplative experience, allowing inner states to be sensed collectively.", "ja": "「Resonance」は、瞑想する人の神経のリズムを水・振動・光へと変換し、瞑想を集団的な空間体験として外在化するインタラクティブ・インスタレーションです。リアルタイムの脳波（EEG）データが吊るされた水槽の振動を変調し、そこに生じる波の模様の屈折したコースティクスが周囲の建築空間全体に投影されます。このシステムは認知を抽象的なデータとして可視化するのではなく、神経活動を物理的な物質と没入空間の中に位置づけ、心・物質・建築のあいだに身体的な関係をつくり出します。拡張された認知の理論に基づき、Resonanceは生体に応答する環境が注意や気づきの形成に能動的に関わりうることを提案します。ニューロフィードバックを個人的なインタラクションから没入型の空間メディアへと移すことで、本作は瞑想を一人で行う実践から観客を包み込む現象へと変えます。本プロジェクトは瞑想の伝統、流体力学、計算的デザインを統合し、認知が個人的なフィードバックではなく共有された経験として出会われる、観客中心の生体応答型デザインのモデルを提示します。この統合を通じて、Resonanceはインタラクティブメディアを身体的な存在と共有された観想的体験へと拡張し、内面の状態を集団で感じ取ることを可能にします。"}, {"t": "The Adaptation Threshold in Mixed Reality Theater: Cognitive Integration and Narrative Reality", "a": ["Nils Gallist", "David Gochfeld", "Lino Brunmayr"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816087", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/cc6723f1bcd8.jpg", "abs": "The integration of mixed-reality (MR) technology into live theater enhances traditional concepts of audience engagement and presence. This study examines the hybrid staging of Christopher Marlowe’s Doctor Faustus at the Staatstheater Nürnberg’s Extended Reality Theater (XRT). The production combines a live actor with virtual avatars viewed through head-mounted displays (HMDs). This study analyzes theoretical factors such as cognitive load, field dependence, and suspension of disbelief as they pertain to MR theater. Empirical insights are drawn from post-performance surveys administered in English and German. The concept of “adaptation threshold” is proposed to describe the critical point at which audience members cognitively accept MR stimuli as part of the narrative reality. Survey feedback and interview data reveal that technical disruptions reset this threshold, while narrative coherence, social referencing, and stylized content lower cognitive load and facilitate immersion.", "ja": "複合現実（MR）技術をライブの演劇に取り入れることは、観客の関与や臨場感といった従来の概念を拡張します。本研究は、ニュルンベルク州立劇場のExtended Reality Theater（XRT）で上演された、クリストファー・マーロウ『フォースタス博士』のハイブリッドな演出を検証します。この上演では、生身の俳優と、ヘッドマウントディスプレイ（HMD）を通して見る仮想アバターが組み合わされています。本研究は、認知負荷、場依存性、不信の一時停止といった理論的な要因を、MR演劇との関係において分析します。実証的な知見は、上演後に英語とドイツ語で実施したアンケートから得ています。観客がMRの刺激を物語の現実の一部として認知的に受け入れる臨界点を表すために、「適応閾値」という概念を提案します。アンケートの回答とインタビューのデータから、技術的なトラブルがこの閾値をリセットしてしまう一方で、物語の一貫性、他の観客の反応を参照すること、様式化された内容は認知負荷を下げ、没入を促すことが明らかになりました。"}, {"t": "The Imagery from Calligraphy: Encoding and Decoding Pictographs Via Interactive Artistic Exploration", "a": ["Jiayang Huang", "Kang Zhang", "David Yip"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816076", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/188e4f23d543.jpg", "abs": "The Imagery from Calligraphy is a practice-based art research project that investigates intersemiotic translation between seal-script form and situated meaning. We propose a bidirectional translation loop: world-to-script encoding abstracts depictive experience into graphic signs, while script-to-world decoding reactivates written forms as imagistic, cultural, and procedural scenes. We stage Xuan-paper making as the situated world and curate 23 verb-based semantic targets, each anchored by a seal-script character. Two mirrored works operationalize the loop: an immersive virtual-production performance film that traces observation, embodied imitation, and inscription; and a writing-driven interactive installation where participants’ spatial strokes are recognized and mapped to semantic navigation of craft actions. Across both works, we examine how form, body, and medium co-produce meaning, and how recognition can negotiate tensions between standardization and individual variation. We further propose an Experiential Archive model for digital heritage that shifts from static documentation to participatory and generative access.", "ja": "「The Imagery from Calligraphy」は、篆書の字形と状況に根ざした意味とのあいだの記号間翻訳を探る、実践に基づく芸術研究プロジェクトです。私たちは双方向の翻訳ループを提案します。世界から文字への符号化は、描写的な経験を図形的な記号へと抽象化し、文字から世界への復号は、書かれた字形をイメージ的・文化的・手続き的な場面として再び活性化します。宣紙（画仙紙）づくりを状況としての世界に設定し、それぞれ篆書の一字に結びついた、動詞にもとづく23の意味的なターゲットを選びました。鏡像関係にある2つの作品がこのループを具体化します。一つは観察、身体的な模倣、書き記す行為をたどる没入型のバーチャルプロダクションによるパフォーマンス映像で、もう一つは参加者が空間に描いた筆画を認識し、工芸の動作の意味的なナビゲーションに対応づける、書くことで駆動するインタラクティブ・インスタレーションです。両作品を通じて、字形・身体・メディウムがどのように共に意味を生み出すのか、また認識が標準化と個人差の緊張をどう調停できるのかを検討します。さらに、静的な記録から参加型・生成的なアクセスへと移行する、デジタル遺産のための「体験型アーカイブ」モデルを提案します。"}, {"t": "To Perform/ To Live: Decolonizing of Digital Music Instruments and Feminism with Human-AI Co-Created Embodied Experience of Daily Objects", "a": ["Shumeng Zhang", "Shiqi Lin", "Tiancheng Liu", "Mingming Fan", "Raul Masu"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816078", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/0ce3d41939a2.jpg", "abs": "This paper proposes a decolonial approach to interactive music performance grounded in Chinese everyday life. Responding to critiques that dominant interaction models and evaluation norms often reflect Western legacies, we design locally situated digital musical instruments (DMIs) that treat domestic routines as primary interface logic. Our embodied performance system, To Perform/To Live , repurposes familiar objects used in Chinese women’s daily lives: an abacus, a vegetable washing basin, a soup pot, a fan, and a massage hammer. Across three stages, performers transform counting, soup-making, and restoration gestures into musical control through tempo, pressure, repetition, and pause, rendering gendered labor audible without romanticizing it. After each performance, we extend the work through human–AI co-creation: recorded audio is analyzed to generate a terrain-like surface, 3D printed as a tactile disk that encodes the performance for touch and re-performance. We contribute a China-situated decolonial DMI strategy, a feminist sonic practice of performable labor, and the E2E framework linking embodied knowledge to AI-enabled material extensions.", "ja": "本論文は、中国の日常生活に根ざしたインタラクティブな音楽パフォーマンスへの脱植民地的なアプローチを提案します。支配的なインタラクションのモデルや評価の規範がしばしば西洋の遺産を反映しているという批判に応え、家庭の日課を主要なインターフェースの論理とする、その土地に根ざしたデジタル楽器（DMI）を設計しました。私たちの身体的なパフォーマンスシステム「To Perform/To Live」は、中国の女性の日常生活で使われる身近な道具、すなわちそろばん、野菜を洗うたらい、スープ鍋、うちわ、マッサージハンマーを転用します。3つの段階を通じて、演者は数える、スープを作る、体をいたわるといった所作を、テンポ、圧力、反復、間によって音楽の操作へと変え、ジェンダー化された労働を美化することなく聞こえるものにします。各公演の後には人間とAIの共創によって作品を拡張します。録音された音声を解析して地形のような表面を生成し、それを3Dプリントして、触れて再演できる形で公演を記録した触覚的な円盤にします。本研究は、中国に根ざした脱植民地的なDMIの戦略、上演可能な労働というフェミニズム的な音の実践、そして身体知をAIによる物質的な拡張へと結びつけるE2Eフレームワークを提示します。"}, {"t": "Toward Embodied Collective Memory by Remediating Vernacular Photographs into Spatial Experience", "a": ["Minzhi Shen", "Mengtai Zhang", "Yuan Zhang", "Gen Mai", "Zhigang Wang", "Wenbo Wang"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816092", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/e87b54f77781.jpg", "abs": "This paper presents December 2022 Beijing , a VR work that remediates vernacular photographs of China’s COVID-19 reopening into embodied spatial encounters. It explores how the spatialization of fragmentary, private, and unevenly documented images can shift spectatorship from record-oriented viewing toward situated witnessing and reflection. The work spatializes vernacular photographs through single-image 3D Gaussian Splatting to construct immersive scenes. In cases where vernacular materials were unevenly recoverable, generative AI was used only as bounded inferential completion. Drawing on participant responses, the paper considers embodied re-encounter, empathy, and the low-fidelity aesthetic of 3D Gaussian Splatting as conditions for reflective, non-spectacular engagement.", "ja": "本論文は、中国の新型コロナウイルスからの再開を写した市井の写真を身体的な空間体験へと媒介し直したVR作品「December 2022 Beijing」を紹介します。断片的で私的で、記録の偏りのある画像を空間化することで、観る行為を記録を見ることから、その場に立ち会い省察することへとどう移せるのかを探ります。本作は一枚の画像からの3D Gaussian Splattingによって市井の写真を空間化し、没入型の場面を構築しています。市井の素材の復元が不均一だった場合には、生成AIを限定的な推論による補完にのみ用いました。参加者の反応をもとに、本論文は身体的な再会、共感、そして3D Gaussian Splattingの低精細な美学を、見世物的でない省察的な関与のための条件として考察します。"}, {"t": "Unfinished Decay: Animating Historical Images from Gigapixel Digitizations via Fragment-Based AI Workflows", "a": ["Juergen Hagler", "Celine Pham"], "c": "SIGGRAPH", "y": 2026, "k": "Art Papers", "doi": "10.1145/3816085", "v": "Proceedings of the ACM on Computer Graphics and Interactive Techniques", "img": "thumbs/e89678ae1a53.jpg", "abs": "Unfinished Decay is an AI-assisted animation project that explores how historical gigapixel images of cultural heritage artworks can be reinterpreted through contemporary generative image-to-video and video-to-video systems. Building on prior research from Brosch AI – Distorted Dreams (2025) this work shifts focus from stylistic distortion toward material-based interpretation. Using a gigapixel scan of Red Dinosaurs (1926), an unfinished late painting by Austrian artist Klemens Brosch, the project animates microscopic surface features – dust, cracks, pigment erosion – as primary carriers of meaning. Current AI animation tools operate under strict resolution constraints (typically 1–4K), limiting their applicability to ultra-high-resolution cultural artifacts. To address this limitation, Unfinished Decay (2026) introduces a fragment-based workflow that extracts micro-regions from gigapixel imagery, applies AI-driven motion, and recomposes the results into a cohesive cinematic structure. The resulting five-minute film unfolds as a silent visual essay on decay, fragility, and temporal persistence, positioning AI as a speculative collaborator in the artistic reinterpretation of cultural heritage.", "ja": "「Unfinished Decay」は、文化遺産である美術作品の歴史的なギガピクセル画像を、現代の生成的な画像から動画、動画から動画へのシステムを通じてどのように再解釈できるかを探る、AI支援のアニメーション・プロジェクトです。先行研究「Brosch AI – Distorted Dreams」（2025）を発展させ、本作は様式的な歪みから素材にもとづく解釈へと焦点を移しています。オーストリアの画家クレメンス・ブロッシュの未完の晩年作「赤い恐竜」（1926）のギガピクセル・スキャンを用い、ほこり、ひび割れ、顔料の浸食といった微細な表面の特徴を、意味の主な担い手としてアニメーション化します。現在のAIアニメーションツールは厳しい解像度の制約（通常1〜4K）のもとで動作するため、超高解像度の文化財への適用には限界があります。この限界に対処するため、Unfinished Decay（2026）は、ギガピクセル画像から微小な領域を切り出し、AIによる動きを与え、その結果をまとまりのある映画的な構造へと再構成する、断片にもとづくワークフローを導入します。完成した5分間の映像は、朽ちること、もろさ、時間の持続をめぐる無言の映像エッセイとして展開し、AIを文化遺産の芸術的な再解釈における思弁的な協働者として位置づけます。"}, {"v": "", "img": "thumbs/ad3ad34151f9.jpg", "t": "AcroType", "a": ["Christa Sommerer", "Laurent Mignonneau"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3736521", "abs": "AcroType is an interactive installation where visitors can see themselves composed from numerous cut-outs on a video screen. Thousands of programmed and animated ants carry bits and pieces of the live video image and constantly recompose this video feed bit by bit. Visitors watch themselves appearing and disappearing as the laborious ants assemble steadily their portraits. Similar to leaf-cutter ants, these artificial animals get never tired to create and recomposed the human portraits."}, {"v": "", "img": "thumbs/d2ee05a85a4f.jpg", "t": "AI in the Sky", "a": ["Laura Cinti"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731633", "abs": "AI in the Sky is an audio-visual artwork documenting the search for the female Encephalartos woodii, a rare cycad on the verge of extinction. Using drone-based multispectral imaging and AI-trained detection models, the project explores how machine vision can assist in locating rare plant species. The artwork visualizes the process - drone flights, spectral mapping, and algorithmic analysis - revealing how technology mediates ecological understanding. Blending real and synthetic data, AI in the Sky reflects on the evolving role of AI in conservation and the poetic tension between searching and the possibility of absence."}, {"v": "", "img": "thumbs/a86166d2c123.jpg", "t": "Atmos Sphaerae", "a": ["Tamiko Thiel"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731630"}, {"v": "", "img": "thumbs/563d092a3c0b.jpg", "t": "ChoreoFin: Breathing in the Ocean", "a": ["Akira Nakayasu", "Arisa Hirashima", "Keisuke Shuto", "Miki Yamamura", "Makoto Danjo", "Mina Shibasaki", "Saki Sakaguchi", "Kumiko Kushiyama", "Hiroko Uchiyama"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731627", "abs": "ChoreoFin is a kinetic dress project inspired by aquatic creatures such as Betta splendens, leucistic axolotls, and Polypterus. Betta splendens are known for their vivid colors and elaborate fins, while leucistic axolotls are characterized by their striking external gills. The Polypterus, whose name derives from poly- (many) and pteron (wing or fin), features numerous ornate fins. Although fins and gills are evolutionary organs, they often appear decorative to human observers. These aquatic creatures are also commonly appreciated for their aesthetic value as ornamental species. …", "ja": "ChoreoFinは、ベタ（Betta splendens）、リューシスティックのウーパールーパー、ポリプテルスといった水生生物に着想を得たキネティック・ドレスのプロジェクトである。ベタは鮮やかな色と華麗なひれで知られ、リューシスティックのウーパールーパーは印象的な外鰓を特徴とする。ポリプテルスは、poly-（多くの）とpteron（翼・ひれ）に由来する名の通り、多数の装飾的なひれを持つ。ひれや鰓は進化の過程で生まれた器官だが、人間の目にはしばしば装飾のように映る。これらの水生生物は観賞魚としても、その美しさが広く愛でられている。…", "src": "body"}, {"v": "", "img": "thumbs/191694806dee.jpg", "t": "CryoScapes: Landscape Painting with Water, Ice, and AI", "a": ["Jiabao Li", "Ziyuan Jiang", "Kuan-Ju Wu", "Yasuaki Kakehi"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731632", "abs": "Cryoscape began during my Arctic Circle Artist Residency in Svalbard, inspired by water's diverse forms—vapor, snow, waves, glaciers, and sea ice. We developed a 3D ice printing system to create intricate sculptures that evolve with temperature changes. Roaming water droplets freeze on hydrophobic or hydrophilic treated surfaces, forming landscapes that blur the sense of scale, from lunar terrains to microscopic crystalline patterns. A macro camera captures these formations in real-time, while AI interprets them into Haikus. Traveling to different cities, Cryoscape co-creates with local climates, questioning boundaries between artificial and natural, and offering insights into tissue engineering and microfluidics."}, {"v": "", "img": "thumbs/42c4d7342ffb.jpg", "t": "Cubic Limit + Liquid Symmetry", "a": ["Manfred Mohr"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3736519"}, {"v": "", "img": "thumbs/308c31248731.jpg", "t": "Follow the Ship, 2025", "a": ["Matthew Attard"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3736522"}, {"v": "", "img": "thumbs/26502aadecf0.jpg", "t": "Heritage Trees", "a": ["Hye Yeon Nam", "Brendan Harmon"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731629"}, {"v": "", "img": "thumbs/65bb63824b21.jpg", "t": "How to Find the Soul of a Sailor", "a": ["Kasia Molga"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731634"}, {"v": "", "img": "thumbs/2d501eea9460.jpg", "t": "Liquid Views - Echoes of Self (2025)", "a": ["Monika Fleischmann", "Wolfgang Strauss"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731631", "abs": "Liquid Views - Echoes of Self is a documentary video based on the interactive installation Liquid Views (1992), which captures video portraits of visitors as they engage with a virtual mirror. First conceived in 1992 [Fleischmann et al., 1993] and reimagined for Electric Dreams [Electric Dreams, 2025] at the Tate Modern (2025), the work invites participants to touch a simulated water surface that responds with ripples - both reflecting their image and provoking a moment of introspection. Poetic video fragments document these intimate encounters, revealing how individuals stage themselves in both public and digital spaces. As one of the first interactive artworks to simulate the experience of a virtual mirror [Hansen, 2006], Liquid Views anticipated the aesthetics of the selfie and the dynamics of real-time video communication-predicting today's entanglements of presence, perception, and identity. By revisiting this pioneering touch interface [Dixon, 2007], the 2025 edition foregrounds the shifting boundaries between private and public selves in the digital age [Fleischmann and Strauss, 2023]. Liquid Views embodies the artists' vision of digital media as a \"thinking space,\" where human expression meets machine logic, and reflection becomes a form of interaction. The interactive installation Liquid Views is part of the collection of the ZKM Center for Art and Media Karlsruhe, Germany [Liquid Views, 1992]. URL: https://www.fleischmann-strauss.de"}, {"v": "", "img": "thumbs/e5ff9fbe2ced.jpg", "t": "Mimosa Pithics", "a": ["Scottie Chih-Chieh Huang", "Ming-Hong Wu", "Hsiu-Mei Chang", "Chin-Hsun Liu"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731628"}, {"v": "", "img": "thumbs/0ef0b7f561b0.jpg", "t": "Plant.play()", "a": ["Yoonji Lee", "Ali Asadipour", "Chang Hee Lee"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731636"}, {"v": "", "img": "thumbs/124aac9240eb.jpg", "t": "Quantum Tango", "a": ["Ernest Alan Edmonds"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3736520", "abs": "Quantum Tango, 2025, connects Vancouver, London, and Milan through a real-time, interactive digital artwork. At each location, a screen and camera setup respond to local audience movement while revealing dynamic images and colour patterns influenced by activity in the other cities. Blending abstract visuals with interlaced captured images, the work creates a shared, evolving aesthetic experience across continents. Building on Edmonds’ earlier Communications Game (1971 on) and Cities Tango (2007 on) projects."}, {"v": "", "img": "thumbs/41a735a4e302.jpg", "t": "Return to the North: The Virtual Archaeology of Electronic Orbits", "a": ["Yin Bing", "Haoqing Zhang", "Shuyi Wang", "Yuan Zhang"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731637"}, {"v": "", "img": "thumbs/581480912c3a.jpg", "t": "Sway: too Numerous to Record", "a": ["Yuyang Jiang", "Luwen Yu", "Xiaokang Lei", "Lei Huang", "Pan Hui"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731638"}, {"v": "", "img": "", "t": "Unbound Horizons – Wing Series", "a": ["Lino Tagliapietra"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3744337"}, {"v": "", "img": "thumbs/08a3b62010f0.jpg", "t": "We Are Entanglement", "a": ["Haru Hyunkyung Ji", "Graham Wakefield"], "c": "SIGGRAPH", "y": 2025, "k": "Art Gallery", "doi": "10.1145/3721249.3731635"}, {"v": "", "img": "thumbs/63934935d97e.jpg", "t": "Algorithmic Miner: Humanity in Service - An AI-Driven VR Journey into Machine Logic", "a": ["Jia Sun", "Zheng Wei", "Pan Hui"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736784", "abs": "Algorithmic Miner is a VR-based interactive art installation that critically explores the exploitation and marginalization of data annotation workers, whose labor is fundamental to the advancement of artificial intelligence (AI) and machine learning (ML). These essential yet often invisible laborers function as the “resource mine” within the technological infrastructure, embodying the commodification and alienation of human labor as described by Marx and Heidegger’s concept of “enframing.”The installation aims to symbolically reconstruct the monotonous nature of data‑annotation tasks, inviting participants to engage in repetitive image and text annotation tasks, mirroring the tedious and dehumanizing aspects of real-world data labeling. The object recognition component introduces a “reverse scenario” where human agency is subordinated to AI logic, compelling participants to alter their virtual environment according to machine instructions. As participants complete these tasks, their efforts become golden jellyfish, ascending to a virtual utopia composed of gleaming steel and lush natural landscapes. This transformation symbolizes the abstraction and exploitation of human creativity within AI-driven systems.Algorithmic Miner envisions a future where machine logic dominates discourse, dictating human creativity and redefining reality, resonating with Baudrillard’s notion of the “hyperreal simulacrum.” By exposing the hidden labor and ethical implications inherent in the tech industry, the installation urges audiences to reconsider the complex interplay between society, the environment, and technology. It invites reflection on the human costs associated with technological advancement, highlighting the need for a more equitable and conscious integration of human labor within AI systems.", "ja": "アルゴリズムマイナーは、データ注釈作業者の搾取と周辺化を批判的に探求するVRベースのインタラクティブアートインスタレーションであり、これらの労働は人工知能（AI）と機械学習（ML）の進歩に不可欠です。これらの本質的でありながらしばしば見えにくい労働者は、技術インフラストラクチャ内の「資源鉱山」として機能し、マルクスとハイデッガーの「エンフレーミング」の概念に記述されたように、人間労働の商品化と疎外を具現化しています。インスタレーションは、データ注釈タスクの単調さを象徴的に再構築し、参加者が画像やテキストの注釈タスクを繰り返し行うことを通じて、実際のデータラベリングの退屈で非人間的な側面を体験させます。オブジェクト認識コンポーネントは「逆シナリオ」を導入し、人間のエージェンシーがAIロジックに従属することを強制し、参加者は機械の指示に従って仮想環境を変更しなければなりません。参加者がこれらのタスクを完了すると、その努力は金色のクラゲとなり、光り輝く鋼と豊かな自然景観で構成された仮想ユートピアへと昇ります。この変容は、AI駆動システム内での人間の創造性の抽象化と搾取を象徴しています。アルゴリズムマイナーは、機械ロジックがディスコースを支配し、人間の創造性を支配し、現実を再定義する未来を想像し、バードリヤールの「ハイパーリアル・シミュラークル」の概念と共鳴します。隠れた労働と技術産業に内在する倫理的影響を明らかにすることにより、インスタレーションは観客に社会、環境、技術の複雑な相互作用を再考させます。技術進歩に伴う人間的コストに対する省察を促し、AIシステム内での人間労働のより公平で意識的な統合の必要性を強調します。", "tags": ["AI-Driven Creativity", "Algorithmic Control", "immersive environments", "Machine Logic Dominance", "Technological Authority", "Virtual Reality Interaction"]}, {"v": "", "img": "thumbs/9eb00f1997fc.jpg", "t": "Becoming Space: Exploring Agential Materiality through AI-Generated Metamorphosis in Artistic Practice", "a": ["Xinyu Ma", "Hengyu Meng", "Ziwei Wu", "Zeyu Wang", "Clea T von Chamier-Waite"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736775", "abs": "This paper examines the intersection of materiality, agency, and transformation in AI-assisted artistic practice through Becoming Space, an installation of 3D printed sculptures and video. Drawing from Ovid’s Metamorphoses, the work investigates states of transformation between human and animal forms using generative AI and additive manufacturing. Through a theoretical investigation, this paper tries to analyze how material-discursive practices emerge in the convergence of language and physical materials. The work demonstrates how agency distributes across human and nonhuman actors in creative processes, challenging traditional notions of artistic authorship and subjectivity. This investigation contributes to understanding how generative AI technologies participate in artistic practices, revealing creativity as an entangled phenomenon where multiple agencies converge and transform.", "ja": "この論文は、AI支援による芸術的実践におけるマテリアリティ、エージェンシー、変容の交差点を、3Dプリントされた彫刻と映像からなるインスタレーション「Becoming Space」を通じて検討します。オウィディウスの『変身物語』から着想を得た本作品は、生成AIと付加製造を用いて、人間と動物の形態間の変容状態を探求します。理論的考察を通じて、言語と物質的素材の収束においてどのようにマテリアル・ディスクursive的実践が現れるかを分析しようとします。本研究は、創造的プロセスにおいて人間と非人間のアクター間でエージェンシーが分配される様子を示し、従来の芸術的著者性や主体性の概念に挑戦します。この調査は、生成AI技術が芸術実践にどのように関与し、複数のエージェンシーが収束し変容することで創造性が絡み合った現象であることを明らかにし、理解を深めることに貢献します。", "tags": ["3D Printing", "Agency", "Becoming-animal", "Generative AI", "Materiality", "Metamorphoses", "Nonhuman", "Sculpture"]}, {"v": "", "img": "thumbs/55a96f6fe05e.jpg", "t": "Digital Crazing: Applying Quadtree Structures to Simulate Time and Human Intervention", "a": ["Szu-Han Lu", "Hsiao-Ching Chou"], "c": "SIGGRAPH", "y": 2025, "k": "Art Papers", "doi": "10.1145/3736786", "abs": "We present a novel tool for generating crazing patterns that explores the relationship between time and user intervention. Inspired by the formation of crazing during firing, this tool reinterprets this phenomenon, which has evolved into a culturally significant aesthetic. This tool employs a hierarchical depth slicing technique to simulate the evolution of crazing, showcasing the transition from prominent fissures to intricate patterns. It combines the natural progression of cracks over time with those shaped by human intervention, capturing the underlying logic of crazing formation.Our interactive work exploits the user intervention characteristics, where the crazing changes in response to the duration of the observer’s shadow. This simulation highlights how coarse cracks are more prone to absorb dye, while fine cracks resist coloration. The observer’s shadow is conceptualized as the “dye,” emphasizing the contrast between human and natural influences over time. This design amplifies the relationship between temporality and human intervention, offering viewers a novel aesthetic experience.This work integrates cultural context and artistic theory, digitizes the logic behind crazing formation, and explores the aesthetic significance of material transformation. The tool framework dynamically presents the interaction between time and human influence by simulating dye deposition, temporal progression, and crazing formation. In future work, we aim to enhance the tool performance by developing plugins for relevant design software. Via integrating the plugins, the relevant design software can expand its applications in interactive design and digital creation, opening new possibilities for digital material generation techniques.", "ja": "私たちは、時間とユーザー介入の関係を探るクレージングパターン生成の新しいツールを提示します。焼成時のクレージング形成にインスパイアされたこのツールは、文化的に重要な美学へと進化した現象を再解釈します。このツールは階層的なデプス・スライシング技術を用いてクレージングの進化をシミュレートし、顕著な割れ目から精緻なパターンへの移行を示します。自然に時間とともに進行する亀裂と、人間の介入によって形作られる亀裂を組み合わせ、クレージング形成の根底にある論理を捉えます。私たちのインタラクティブな作品は、観察者の影の持続時間に応じてクレージングが変化するユーザー介入の特性を活用しています。このシミュレーションは、粗い亀裂が染料を吸収しやすく、細かい亀裂は着色に抵抗することを強調します。観察者の影は「染料」と概念化され、人間と自然の影響の対比が時間とともに強調されます。このデザインは、時間性と人間介入の関係を増幅させ、観客に新しい美的体験を提供します。この作品は文化的背景と芸術理論を統合し、クレージング形成の論理をデジタル化し、素材変容の美的意義を探求します。ツールのフレームワークは、染料の沈着、時間的進行、クレージング形成をシミュレートすることで、時間と人間の影響の相互作用を動的に提示します。将来的には、関連するデザインソフトウェア用のプラグインを開発してツールのパフォーマンスを向上させることを目指しています。プラグインを統合することで、関連デザインソフトウェアはインタラクティブデザインやデジタル創作における応用を拡大し、デジタル素材生成技術に新たな可能性を開くことができます。", "tags": ["Aesthetic", "Crazing", "Digital art", "Multimedia", "Quadtree"]}, {"v": "", "img": "thumbs/ab7b4b13c74c.jpg", "t": "Digital F(r)ictions: Re

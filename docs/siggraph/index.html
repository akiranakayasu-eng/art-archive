 of Japanese food and is composed of a staple food, a soup, two side dishes, and a main dish, and their arrangement is also fixed. We asked several people to experience the system and we were able to tell the users that Japanese food is supported by natural riches and seasons while influencing traditional events as well. It has been also confirmed as another effect that users re-think the act of eating and re-realize Japanese cuisine including recognition of the blessings of nature. Demonstrations are held at the art gallery using cooking models."}, {"v": "", "img": "thumbs/1861ce183dcf.jpg", "t": "Back and forth: pneumatic anadrome [serial painting 1]", "a": ["Alvaro Cassinelli", "Christian Sandor", "Daniel Saakes"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427150", "abs": "\"Serial paintings\" are a series of works highlighting the role of the canvas - or more generally the support of the painting - in the construction of the final form. \"Back and Forth - Pneumatic Anadrome\" is the first work in the series. In it, a string of coloured beads is pushed back and forth between two spiralling \"canvases\" using compressed air. Without rearranging the order of the beads, the string is forced to coil alternatively into one or the other spiral: this folding and unfolding reveals in turn images or text with opposing meanings or connotations. Each image has to be destroyed in order to create the other; this cyclic process of creation and destruction is purposefully revealed and triggered by the curiosity of the public."}, {"v": "", "img": "thumbs/587d340bd93e.jpg", "t": "BirthMark: an artificial viewer for appreciation of digital surrogates of art", "a": ["Jooyoung Oh"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427146", "abs": "BirthMark proposes an artificial intelligence model of an audience to evaluate and anticipate the audience reaction to media art. In BirthMark, human cognitive process of appreciating artwork is defined in three stages: \"camouflage,\" \"solution\" and \"insight.\" In other words, understanding the intention (solution) from hidden images (camouflage) and realizing its meaning (insight). Watching the archive video clips featuring different works by 16 artists, the A.I. in BirthMark tries to appreciate works of art in a similar way to humans. YOLO-9000, an object detection system, tracks objects in the images of the works, while ACT-R, a cognitive architecture designed to mimic the structure of the brain, reads and perceives them. The A.I.'s process of recognizing works is shown in the video and the keywords of the works found in this process appear on a small screen. At the same time, an old slide projector shows what the A.I. understands semantically about the artists' interpretations of their own work."}, {"v": "", "img": "thumbs/07e55dc5522d.jpg", "t": "Blind landing", "a": ["Jooyoung Oh"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427111", "abs": "Blind Landing is composed of a helmet that tracks brain waves and eye movements, and AI software that analyzes the Youtube video frames. The work show how visual stimuli from algorithmically promoted contents affect viewer's behavior pattern, and induce the viewer to recover from their trusting and blind submission to the social network's algorithms of appreciation. To participate in the work, the audience is asked to put a helmet on. Then the viewer is subjected to the vision of one of the most appreciated online videos. Laterally, the screen shows the same videos analyzed by artificial intelligence software, which also colors the parts of the video that have been most seen by the viewer."}, {"v": "", "img": "thumbs/7b797d62ed0a.jpg", "t": "Botorikko, machine created state", "a": ["Predrag K. Nikolic", "Mohd Razali Md Tomari", "Marko Jovanovic"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427101", "abs": "The recent development in the machine learning field encounters interesting robots' creative responses and becoming a challenging artistic medium. They are two possible directions in the future development of robots' creativity, replicating the human mental processes, or liberating machine creativity itself. At the SIGGRAPH Asia, we would like to present the artwork \"Botorikko, Machine Created State\" conceptualized with the intention to point on Post-Algorithmic Society where we are going to lose control over technology by been obsessed with the idea of using it to serves humanity. In our aesthetical approach, we incline to the 21st-century avant-garde conceptual tradition. We intend to draw parallels between Dadaism and machine-made content and encompass technological singularity and Dadaism into one, Singularity Dadaism, as a human-less paradigm of uncontrollable creative practice closely related to AI aesthetic and machine abstraction phenomena."}, {"v": "", "img": "thumbs/30466747591a.jpg", "t": "Box", "a": ["Tomas Laurenzo", "Katia Vega"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427178", "abs": "BOX is an interactive installation, consisting on an everyday object augmented by artificial intelligence. The piece reflects on the power asymmetries that technology instantiates, aiming at providing with a reflection on the aesthetics of our relationship with it. The artwork also aims to showcasing the advancements and limitations in computer vision and artificial intelligence, allowing the public to experience in person its power as well as its inherent biases.", "pos": "50% 30%"}, {"v": "", "img": "thumbs/d2e4ebad5d92.jpg", "t": "Cangjie", "a": ["Weidi Zhang", "Donghao Ren"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427153", "abs": "Humans and machines are in constant conversations. Humans start the dialogue by using programming languages that will be compiled to binary digits that machines can interpret. However, Intelligent machines today are not only observers of the world, but they also make their own decisions."}, {"v": "", "img": "thumbs/7dd61ac11813.jpg", "t": "Chameleon", "a": ["Wenqian Gao"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427129", "abs": "chameleon change the color of skin according to the surrounding environment for hiding the body, can not only avoid predators, and also confuse their prey. I use against neural network, I input a lot of images of chameleon various parts to the machine learning algorithm, the neural network generated the color-changing chameleon skin based on these pictures. Artificial-intelligence one day can be like a chameleon hide himself with pixel camouflage? Work is divided into two versions, image and image + interaction: in the interactive version, the color of the chameleon can change color according to the color of the catch by the electron trap."}, {"v": "", "img": "thumbs/9e8cf2660b7a.jpg", "t": "CURVEilance: Multi-user based interactive media wall", "a": ["Hyunchul Kim", "Seonghyeon Kim", "Ji Young Jun", "Jooyoung Oh"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427108", "abs": "It is an inevitable fact that social interaction nowadays is heavily mediated and distorted through the social network system. The presence of various media replicates our images to reproduce under a confirmation bias in our cognitive process. There has been a distorted gap between the original and reproduced images to reveal our identity in this process. The relationship form through this refracted self-image affects the user and the other users and eventually forms a complicated surveillance system."}, {"v": "", "img": "thumbs/38615119de11.jpg", "t": "Deconstructing whiteness", "a": ["Avital Meshi"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427135", "abs": "Deconstructing Whiteness is an interactive AI performance. It examines the visibility of race in general, and 'whiteness' in particular, through the lens of AI. The performance reveals some underlying racial constructs which compose the technological visibility of race. The artist uses an off-the-shelf face recognition program to resist her own visibility as a 'white' person. By utilizing a performative behavior she slightly changes her facial expressions and her hair style. These actions modify the confidence level by which the machine recognizes her as 'White'."}, {"v": "", "img": "thumbs/d235b8e22ff0.jpg", "t": "Digital being: “hello, world!”", "a": ["Taezoo Park"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427138", "abs": "As we all feel as of 2020, most things in the world are reorganized around digital technology and the influence is strong. This technology is rapidly changing toward AI and M2M, where hardware is becoming nanoscale and software is less human intervention in order to process data flooding more efficiently and quickly. For this reason, we were the discoverers of this technology, but we feel a gap where we no longer know how it works. And I think it provides an opportunity for digital life, Digital Being, to emerge from that gap.", "pos": "50% 30%"}, {"v": "", "img": "thumbs/106415022fad.jpg", "t": "Distance music: preferred population density for the acoustic hygiene", "a": ["Sunggun Jang", "DongMin Kim"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427134", "abs": "\"Distance Music: Preferred Population Density for The Acoustic Hygiene\" is an interactive ambient music installation, which interacts with the number of listeners in the installation. The installation consists of three parts, which is the music engine, sensor, and a video loop. While people watch some archives of vintage government educational videos about social hygiene inside the room, the sensor will measure density of the room and send it to the pre-recorded music engine, which will interact with the data from density sensor, evolving into more intense music as the population density rises. As a result, people will hear unpleasant noise the more they are close to each other. This installation is inspired from 'social distancing', a global experience during this ongoing pandemic era, as some of the music engine process represents and simulates 'distancing alarm' for social distancing, therefore acts as an experiment of public alarm for social distancing. We believe that the people's memory with this unprecedented worldwide incident will resonate efficiently with the installation, and a great deal of inspiration as well."}, {"v": "", "img": "thumbs/7ecd97973f9c.jpg", "t": "Don’t worry, be happy", "a": ["Avital Meshi"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427151", "abs": "Can we look at a person's face and determine how they feel? AI emotion recognition systems are designed to detect faces and return confidence levels across a set of emotions such as anger, contempt, disgust, fear, happiness, sadness and surprise. Such systems already operate in our environment and might have the capacity to seriously impact our lives. In the live performance 'Don't Worry, Be Happy', the artist is strapped to an electric chair. Her face is constantly detected by an emotion recognition AI system. As long as she is detected as 'Happy' she is safe. However, each time any other emotion is observed, she receives an electric shock to both her arms. During the performance the artist changes her apparent behavior in order to free herself from the 'punishment' that the AI system delivers. Yet, under the threat of getting shocked, for how long can she perform this exaggerated facial expression so that the machine continues to 'read' her as 'Happy'?"}, {"v": "", "img": "thumbs/6c5d1cd84e46.jpg", "t": "Dreaming with dandelion", "a": ["Scottie Chih-Chieh Huang", "Chi-Li Cheng"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427158", "abs": "In this robotic art project, we developing a series of autonomous behavior as fictional design to mimic that robot has its own conscious. We make robot holding a pencil for drawing line-based illustration, metaphor robot is dreaming, according to in \"Do Androids Dream of Electric Sheep?\", whether you can dream is used as a romantic question to test between life and artificial life. In the system, the industrial robot independently explores the Environmental Information through the depth sensor and AI system in exhibition space. And then the detected data will used to input into Dandelion-like Generative System(DGS), which made by algorithmic data structures from fractal tree and L-system for mimic nature phototropism mechanism and growing processes. Finally, we used grasshopper develop a mechanism to convert the linebase dandelion diagram into robotic painting by manipulation paths and gripper's act, to make robot physically holding the pencil to draw it out on a paper. This installation will painting an unique dandelion illustration per day, it can also see as specific data visualization by its dynamical physical environment. This stroking processes and its painted outcome can see as a hybrid creation combining computational aesthetics and Robotic Stroking."}, {"v": "", "img": "thumbs/cd44909b57c9.jpg", "t": "Empathy wall", "a": ["Joon Seok Moon"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427167", "abs": "Empathy Wall is a work that starts with the question of whether when human-to-person communication is applied to human-to-technical communication, it can produce feelings close to the \"sympathy\" that occur between people. Empathy Wall wanted to develop human-to-human communication into human-to-object communication using the latest IT technology, and we wanted to expand this into empathy and familiarity between technology and humans. In other words, through the work of art called Empathy Wall, we are trying to extend human-to-human consensus to human-to-technical consensus formation. In the Empathy Wall, the two audiences in each room divided by walls cannot see each other, and an image appears on the wall. The two audiences are given the same subject and question, and if they talk about it freely, their emotions will be analyzed through AI algorithms according to the story, and images based on Kandinsky's theoretical rules will appear on the screen. At this time, the images from the emotional analysis of the stories of the two audiences are all mixed and appear on the walls of the room. Through this process, the audience will be able to see images automatically generated regardless of their own story being expressed on the same screen, in addition to images that respond to their stories. At this time, you can think of images as images of audiences in other rooms, or you can think that the walls themselves create images. During the experience of the Empathy Wall, the audience can feel emotions by looking at images that respond to their stories, and can feel emotions with other audiences as they automatically appear and mix with their own images regardless of their own stories, and furthermore, people and walls can feel empathy."}, {"v": "", "img": "thumbs/b31c68692025.jpg", "t": "Facebook art", "a": ["Yunqing Xu", "Yi Ji", "Jingxin Lan", "Qiaoling Zhong"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427125", "abs": "Drama mask culture is a classification in the long history of Chinese traditional culture. But now many young people had been almost forgotten this kind of culture, our purpose is to think through a can make young people more likely to focus on a way, the opera masks appear in public, utilizing new media in this work, we break the traditional opera masks, allow the user to the style of be fond of according to oneself design their own opera masks, generated by AI technology will play facebook elements (eyes nose mouth lines) into various styles: Pixel style, style and line fault style more popular modern fashion elements, such as the user side/tablet and mobile phone use through the program can design their own opera masks, and then click send projection on the wall, appreciation of their own design art show facebook generation process and form, get belongs to own a new opera masks media work. This work wants to let you know: in fact, traditional culture has not been outdated, and can be very cool."}, {"v": "", "img": "thumbs/a305895f0361.jpg", "t": "Futility", "a": ["Sang wook Lee"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427126", "abs": "The author noted the surrounding environment for creating gentrification using culture and arts in Munrae-dong. The author wanted to express the author's view of the situation in Munrae-dong, where gentrification is taking place, and the image of the person be used and consumed in this situation through partial visualization of four-dimensional space."}, {"v": "", "img": "thumbs/bfa43a3bd658.jpg", "t": "Good-for-nothing (no. 1)", "a": ["Nathan Matteson", "Nicholas Kersulis"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427171", "abs": "The screen's nature is to both show and to obscure. It forever hypnotizes us, seamlessly eliminating its own qualities as a substrate. It owns the characteristics of a Zelig: forever changing, unstable in any context, and destabilizing context itself. Informed by photography, film, and every meme that ever was, the digital image shifts readily between aspects of each. Its meaning is necessarily slippery and hard to define; possessing a quality that makes it hard to pin down or make fit into a neat category."}, {"v": "", "img": "thumbs/c2bd5a01afc3.jpg", "t": "Hauntings", "a": ["John Tonkin"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427169", "abs": "Hauntings (http://johnt.org/hauntings/) is a portrait of Australian artist/writer Francesca da Rimini. Francesca was a founding member of cyberfeminist collective VNS Matrix. Hauntings uses mixed reality technologies to create a series of portraits of Francesca reading her writing. Her stories are autobiographical and explore cultural diaspora and cross-generational family histories. They act as spells and incantations and often draw from algorithmic writing techniques."}, {"v": "", "img": "thumbs/9a31f03771c4.jpg", "t": "Healing 2077", "a": ["Xiyuan Zhang"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427154", "abs": "Nowadays, with the continuous progress of science and technology, the environment is getting worse, and human beings are beset by diseases. The human body is constantly suffering from pain, disease, and even life threat. When human body organs can't meet our perfect requirements for perfection, perhaps an electronic pill can solve our troubles. This work attempts to present the visual art expression form of projection mapping in the future world of scientific and technological progress, and designs the image content with the concept that human organs are continuously eroded and finally cured through the intervention of electronic pills. The first part of the work shows the formation of human lung organs and the process when they are invaded by viruses outside the body. This part strives to present the reality of human organs and the fragile human body. The middle section describes that through the intervention of electronic pills, one lung is gradually deformed after being alienated by electronic technology to form an efficient and indestructible mechanical lobe, while the other lobe is continuously eroded by viruses without the intervention of electronic pills. At the end of the work, it presents the possibility of lung being repaired and cured constantly through the style of Cyberpunk."}, {"v": "", "img": "thumbs/1311b4d5df47.jpg", "t": "holarchy", "a": ["Seiya Aoki", "Yusuke Yamada", "Santa Naruse", "Reo Anzai", "Aina Ono"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427159", "abs": "This work is an online installation that creates a new audio-visual using automatic video selection with deep learning."}, {"v": "", "img": "thumbs/cfa1a827e108.jpg", "t": "Imagined field from the decomposition of an apparatus", "a": ["Ben Bogart"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427145", "abs": "This work was produced in the context of the Leaning Out of Windows project, where artists, scholars and physicists are placed in collaborative dialogue in the development of new artistic works. One of the overlaps between experimental particle physics and my own work is the deconstruction of material in order to inspect the nature of objects and their constituents. The source material for this work is a set of photographs of the experimental apparatus of the TRIUMF particle accelerator. The emphasis of the photographs is the beam-lines that facilitate the transport of various particles in the apparatus, which resembles a industrial factory. The various exotic particles are made through acceleration, filtering and collision. I often work with photographic imagery and machine learning methods to question the relations between objects and contexts, reality and imagination, and realism and abstraction."}, {"v": "", "img": "thumbs/ea8390c446c7.jpg", "t": "I’m thinking what I’m thinking", "a": ["Yalan Wen"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427124", "abs": "The interactive immersive installation, I'm thinking what I am thinking, resembles a diagrammatic huge brain processing everyday data. The space includes a projection screen, a vintage CRT TV, 8 speakers hanging throughout the room, and under a spotlight there's a rug with stepping sensors. The environment combines sound and generative graphics, creating a subconscious experience for the visitor that calls on their intuition and cognition. It asks the question, 'Are we completely conscious of our thinking patterns when making a decision?'"}, {"v": "", "img": "thumbs/4eb7cb216b9d.jpg", "t": "Kam", "a": ["Taeil Lee"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427116", "abs": "Eyes are everywhere. Cheap and accessible technology products with high-resolution imaging capacity are in every corner of our surroundings to surveil us. They watch us, record us, and even recognize us. These artificial gazes became so ubiquitous and so familiar to us that we are not even aware of them in everyday lives. Meanwhile, human senses interact with each other and transfer from one to another. We hear vibrations, feel textures by seeing, smell tastes, taste tactility, and so on. We feel the movement only by seeing stopped escalator. Our vision translates the visual information to activate the motor sensation embedded to somewhere in the body. \"Kam\" tries to twist the one's familiarity by the phenomenon of the other. The eyeball-shaped camera follows you and imitates your blinks. The unfamiliar and unexpected behavior of this robotic camera gives lively feel to it and, at the same time, becomes eerie and unreal. It also makes you realize your sensation of blink when you find yourself trying to make it blink. Even its mechanical sounds seem to make you feel your blink physically. \"Kam\" utilizes the face recognition algorithms to see one layer deeper onto our facial expression. It exposes itself by reacting to the expression, when we would not even aware of it otherwise. It makes us pay conscious attention to it and realize our own bodily existence. \"Kam\" intended this trivial daily happening to become a meaningful experience."}, {"v": "", "img": "thumbs/67fb30db7fe0.jpg", "t": "Keep running: AI paintings of evolving horse portraits", "a": ["James She", "Carmen Ng", "Wadia Sheng"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427174", "abs": "\"Keep Running\" is a collection of human and machine generated horse paintings using the generative adversarial network technology. The artworks are produced during the lockdown period in the Middle East due to the Covid-19 pandemic. Horses are significant symbols in the Middle East region culturally and historically, representing strength, endurance and persistence. These are the spirits that keep us running during the difficult times, even when we are facing many physical constraints in daily life. Nowadays, many AI-generated artworks are either photo-realistic or very abstract with distorted faces, fragmented figures and a combination of unknown objects. What technically unique in our work is to produce a series of AI-assisted paintings that shows distinguishable features and forms of horses, while creating aesthetic and even sentimental values in each horse portrait. Each of our art piece is presented in a 2x2 grid format that shows how an AI horse painting is evolved over the generation process. We believe that the machine learning process could unite human creativity with AI technology to produce a series of unique and aesthetic paintings - even these artworks were created in a large scale and mass production method that is never been possible before. With the artistic and technical novelty in our artworks, we also wish to pay a salute to the pioneers like Eadweard Muybridge and Andy Warhol, who first popularized the use of machines with camera and silk-screen printing technologies in art-making, redefining the meaning and expanding the horizon of art."}, {"v": "", "img": "thumbs/360fc0451aa1.jpg", "t": "Life: can a computer have a heart?", "a": ["Jungmin Park", "Kyoungmin Bang"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427157", "abs": "AI is essentially 'intelligence' programmed by humans. Although AI which can joke, communicate and tell a story resembles humans, can we continue to have a natural conversation with them, even though it is identified as AI? The current AI is only applied to a certain field, as it is at the step of 'weak intelligence'. It is expected to be developed into 'general or strong intelligence' imitating humans' whole intelligent activity in the future. This work allows us to indirectly experience to consider whether we would treat AI as we do humans, if it is developed into 'strong intelligence', through the conversation with AI which is able to learn emotional words."}, {"v": "", "img": "thumbs/fe7b50600442.jpg", "t": "LightTank", "a": ["Uwe Rieger", "Yinan Liu", "Roger Boldu", "Haimo Zhang", "Heetesh Alwani", "Suranga Nanayakkara"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427113", "abs": "LightTank is an interactive Extended Reality (XR) installation that augments a large lightweight aluminium structure with holographic line drawings. It consists of four transparent projection walls which are assembled to an X shape tower like construction of 7.5 x 7.5 x 5.5 m."}, {"v": "", "img": "thumbs/c42149296580.jpg", "t": "Love: greatest mystery of life", "a": ["Firdaus Khalid"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427173", "abs": "The greatest mystery of life comes when you're least expecting it and disappears when you thought it is here to stay. The heat that ignites it at the beginning is doused by the intimacy it creates. It is a portal, a mirror, a cross to bear, a joy, a heartbreak, and an axe. It cuts through your hard parts, the gristly parts, and lays your beating heart bare. It is both the butterfly that flutters in your tummy, and the acid that melts everything away. That, my friend, is what we call LOVE."}, {"v": "", "img": "thumbs/25f9b3aa52f1.jpg", "t": "Narcissus", "a": ["Seol Lee"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427152", "abs": "Narcissus was a hunter in Greek mythology who fell in love with his own reflection in the water. Narcissus is the origin of the term narcissism. This artwork, as its name suggests, is based on the myth of Narcissus. A narcissistic ego that conceals the weakness of the individual, focuses energy only on itself. Everyone has narcissism even if a little. Excessive narcissism causes lots of problems from isolation because fascinating by the perfection of oneself makes relationship with the others closed. Sensing the brainwave of an appreciator, creates an interaction that the higher concentration on the reflection on the surface of water, the more blurred observation. Through this interaction, the viewer is interrupted from being deeply immersed in oneself. That experience reflects the reverse of the Narcissus story and expresses that mirrored image of the participant could not exist as complete subject. Also, this artwork is referred to the 'Mirror stage' hypothesized by Jacques Lacan(1901--1981). Unlike the ego-psychologists' assertion that we should strengthen our ego, Jacques Lacan points out the narcissistic ego which is imaginary in human beings and says that we can grow up as a healthy subject through acknowledging that we are lacking ego not just strengthening the ego."}, {"v": "", "img": "thumbs/0705083cf3d3.jpg", "t": "Nebula go", "a": ["Jungho Kim", "Youngho Kim", "Taekyung Yoo"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427166", "abs": "In NEBULA GO, you can see many nebulae and stars being born and losing, and glimpse the secrets that arise in space. In this NEBULA GO, the universe is expressed through Go, and since ancient times, Go was invented as a tool for observing and studying the movement of celestial bodies. In this work, the artist harmonizes the secrets that occur in the universe by using the act of placing a Go in a square space, various fights caused by it, domain creation, and movement of forces. Looking at NEBULA GO, unlike Go, where victory or defeat is determined, you can observe the numerous planets visible in the universe when all actions have been completed and the changes caused by these planets. Also, by focusing on the birth origin of astronomical observation, actors can appreciate their own microcosm through their actions."}, {"v": "", "img": "thumbs/d27b45b2e0cf.jpg", "t": "NORAA [machinic doodles]", "a": ["Jessica In", "George Profenza", "Sam Price"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427106", "abs": "How does machine learning contribute to our understanding of how ideas are communicated through drawing? Specifically, how can networks capable of exhibiting dynamic temporal behaviour for time sequences be used for the generation of line (vector) drawings? Can machine-learning algorithms reveal something about the way we draw? Can we better understand the way we encode ideas into drawings from these algorithms?"}, {"v": "", "img": "thumbs/5ea0b35519ea.jpg", "t": "Painting of Thousandhands Avalokitesvara", "a": ["Minji Park", "Yowon Jeong", "Jiyun Jeong", "Dain Kim", "Jungbin Yoon", "Haneul Jung", "Kyeongju Hawng", "Junghwan Sung"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427147", "abs": "\"Painting of Thousand-hands Avalokitesvara\" is a media art based on the theme of \"Painting of Thousand-hands Avalokitesvara (千手觀音圖),\" which paintings painted under the theme of Avalokitesvara (千手觀音) during or before Goryeo Dynasty. We reproduces the original Buddhist culture, which accounts for a large portion of Korea's culture archetype, in the three dimensional space. Avalokitesvara (千手觀音) appears in lotus flower on the center of artwork. Avalokitesvara is a Buddhist saint who saves people with a thousand-hands and a thousand eyes. Thousand-hands (千手) literally symbolize a thousand hands, and metaphorically symbolize the ability and its appearance is very diverse. Also in the artwork, Avalokitesvara has 11 faces, indicating that through Avalokitesvara's various appearances, they can save all of the people in various situations. On both sides of the Avalokitesvara, there are Four Devas (四天王), the four heavenly guardians of Buddhism. The Dragon King and the Sudhana (善財童子) appear After the appearance of the Four Devas. All of them gathered to listen to the teaching of the Avalokitesvara. Thousand-hands begin to unfold in the halo (光背) of the Avalokitesvara. After all the elements of the artwork such as the waves in the background and the Litany Buddha (化佛) appear, 42 hands which contained people's wishes with Buddhism things (持物) appear accordingly. Every time a 42-hands appears, the color of the thousand-hands in the halo changes and the thousand-hands take various hand movements (手印)."}, {"v": "", "img": "thumbs/8df70d91b6e4.jpg", "t": "Playing with remine", "a": ["Haemin Kim"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427156", "abs": "Title of my work is 'Playing with Remine.' Playing means playing or interacting with each other. There are two reasons why I design this work."}, {"v": "", "img": "thumbs/9335ddb0a54a.jpg", "t": "Poe’s tree", "a": ["Doros Polydorou"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427164", "abs": "This artwork is inspired by the short story \"The Gold-Bug\" by Edgar Alan Poe. The story follows William Legrand, his servant Jupiter and an unnamed narrator on their quest to uncover a buried treasure. Poe took advantage of the popularity of cryptography as he was writing the \"The Gold-Bug\" and his story revolves around the team trying to solve a cipher. The characters in the story follow a simple substitution cipher to decode a message that eventually leads them to the treasure."}, {"v": "", "img": "thumbs/ea9d7b7a75c1.jpg", "t": "Point Nemo | sea [sic]", "a": ["Johannes DeYoung", "Jack Vees"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427115", "abs": "Point Nemo is the name of the Oceanic pole of inaccessibility. The nearest terrestrial human life is located approximately 1,000 miles away; often, the nearest humans are located in space, approximately 250 miles away, aboard the International Space Station."}, {"v": "", "img": "thumbs/6b08a511c378.jpg", "t": "Prometheus string", "a": ["Seung Jung"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427137", "abs": "Prometheus' string series attempt various artistic experiments applied to 'data refraction', a concept that breaks frame of data with modern concept of accurate delivery of information and induces more creative results. The resulting installation work includes various processes such as data extraction from living creature into 3D shape generation and printing, as well as robotic sculpture and data visual performance."}, {"v": "", "img": "thumbs/62926de131be.jpg", "t": "Rainbow tunnel", "a": ["Dave Payling"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427109", "abs": "A still photo from artificial life, this is a frozen moment from the movement of simple shapes. Repeated geometric forms were rotated and transformed over time and complex interwoven abstract patterns emerged. These unexpected forms are born from motion and feedback. Initial graphical parameters were predefined and the patterned evolution was set in motion. When the motion is paused the cellular beauty of individual frames is revealed. Chance plays its part in this phenomenon. Individual parameters are predetermined but the end result is indeterminate. The space between known quantities is where the unexpected patterns and lights emerge."}, {"v": "", "img": "thumbs/a201d59c6207.jpg", "t": "River’s edge", "a": ["Takuya Yamauchi"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427103", "abs": "\"River's Edge\" is the title of a series of collage artworks created from images obtained via the Internet through the medium of generative programming. In this series of images, the artist used a keyword associated with his childhood memory \"River's Edge\"to conduct an in-depth search for and gather associated images, which he then assembled into vivid and visually appealing collages. In the \"River's Edge\" artwork, blue, gray, and green sections of the collected images were associated with water, stone, and sky. Pieces from hundreds of images were extracted from the Internet in data form, processed, and emplaced in the images. The creative process was based on an algorithm that examined the collected images, extracted appealing sections, subjected them to a limited set of modifications, and then emplaced them into the artwork. Although the algorithm's functionalities are limited to magnification, rotation, and choosing the areas to extract from the collected imagery, the process made it possible to create a wide variety of collages. In the numerous trials that were conducted to develop this art form, several new expressions were identified, and many beautiful patterns were created."}, {"v": "", "img": "thumbs/f4313e1486fe.jpg", "t": "Roads in you", "a": ["Yoon Chung Han", "Ryan Cottone", "Anusha"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427143", "abs": "Roads in You is an interactive biometric-data artwork that allows participants to scan their veins and find the roads that match their vein lines. The vein data as one of the fascinating forms of biometric data contain uniquely complicated lines that resemble the roads and paths surrounding us. The roads resemble how our vein lines are interconnected and how the blood circulates in our bodies in various directions, at various speeds, and in different conditions. This artwork explores the line segmentation and the structure of veins and compares them to roads in the real world. The participants can also export the data and keep them as a personalized souvenir (3d printed sculptures) as part of the artistic experience. Through this project, users can explore the correlation between individuals and environments using the hidden patterns under the skin and vein recognition techniques and image processing. This project also has the potential to lead the way in the interpretation of complicated datasets while providing aesthetically beautiful and mesmerizing visualizations.", "pos": "50% 0%"}, {"v": "", "img": "thumbs/3f5dc0ba3199.jpg", "t": "Room view", "a": ["Yalan Wen"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427122", "abs": "Room View is a piece documenting the view outside of my room in Manhattan, from April to March 2020. I recorded the sound in 30 days of quarantine (including radio, sirens, people clapping for the essential workers, etc.), and several views of the Chrysler Building in different weather conditions. The melting of photographs or videos is triggered by the sounds. Depicting the state of mind when I was absorbed by the view, quiet and slow. As time passing by, the sound became a way I rely on to know what is happening outside my room - in the real world."}, {"v": "", "img": "thumbs/51badf60dddf.jpg", "t": "Scan", "a": ["Yalan Wen"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427123", "abs": "Scan was inspired by an accident I encountered in 2019. After my arm was injured, I barely remember the details of the accident. Through this work, I'd like to explore the relationship between our body memory and the memory we fill up with our own imaginations. As the strips reveal the scar, the memory of the event is not clear anymore, it's filled with our own interpretation."}, {"v": "", "img": "thumbs/c722d058ad72.jpg", "t": "Searching all sources of white", "a": ["Gi Wai Echo Hui"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427131", "abs": "Searching All Sources of White presents the error as the landscape. It is an interactive video installation examining the idea of the limitation of seeing. The projector projects a blue screen while a white spot falls in the middle. Blue is often seen in a digital display namely default screen, calibration screen, sleep mode, and 'Blue Screen of Death'. In an exhibition setting, this work gives the impression of a failure in the display when the projector displays a blue, standbymode. Standby is a component mode in which a system is kept readily available in case an unexpected event occurs. A system may be on standby in case of failure, shortage, or other similar events."}, {"v": "", "img": "thumbs/34cbcbc90d32.jpg", "t": "Selfie + code III: melancholy", "a": ["Yeohyun Ahn"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427128", "abs": "A selfie is a form of art. Over 1 million selfies are now taken every day. Selfies are not always as spontaneous as they seem. They can be a communication tool like any other that can be manipulated for purposes. Selfie + CODE III is a collection of generative selfie series by using computer algorithms. The algorithmic processes expend the concepts of traditional self-portraits to generative and expressive selfies delivering thought or feeling. The artist started taking her generative selfies in 2015 to raise awareness of Asian female faculty being isolated and marginal in a predominantly white institution (http://www.socialhomelessness.com). Her generative selfies have captured psychological moments to express those individual identities are devalued and deconstructed by a homogeneous institution in the United States. It has been shared by social media. The virtual supporting system at Facebook, \"Like,\" by her diverse mentors and friends, helped her to persist and survive in a regionally isolated and exclusive community. Eventually, It has brought her psychological reconciliation and healing to succeed in dealing with difficulties."}, {"v": "", "img": "thumbs/e8c47c467752.jpg", "t": "Seoul landscape", "a": ["Dohee Jeon", "Hannah Kim"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427170", "abs": "See the scenery of the city through Korean traditional music. 'object' exists with time. We sometimes bring the 'object' of the past to reproduce the time of the past. 'object' becomes the music of Korean traditional music. What we are trying to reproduce is nature. What is nature? Nature is a phenomenon itself. For people in the modern world, is nature an urban ecosystem? We find the way back to nature through the 'object' called 'Korean traditional music'. It looks at nature as the whole being, not as an individual who only has the impression of passing through without a clear form."}, {"v": "", "img": "thumbs/e457e132e294.jpg", "t": "Shadow play: tales of urbanization", "a": ["Xiying Yang", "Honglei Li", "He Li"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427102", "abs": "Over the past few decades, China has been undergoing urbanization at an astounding pace. In 2013, the national leadership raised the process to a new gear when it unveiled its plan of converting 70 percent of the population to a cityoriented lifestyle by 2025. Such a significant change would undoubtedly transform the character of a country that has been largely agrarian throughout its millennia of history. One may wonder how, and to what extent, the landscape, culture and the daily being of the nation's people may be altered. As artists, we are compelled to explore and reflect upon the various phases of this historic undertaking while questioning how people are positioned during this monumental social transformation. Through fieldwork in China, we collect the ingredients necessary for a multimedia production that combines traditional artistic expressions with emerging technologies. Weaving three interfaces, namely virtual reality (VR) in cyberspace, a series of painting on canvases and traditional shadow play imagery, the multimedia art project visualizes the metamorphosis that results from the urbanization process. With a retrospective into the past through time-honored imagery and a reflection of the present through immersion in the realities of the modern China, we seek to present stories of everyday people to the conscience of a worldwide audience."}, {"v": "", "img": "thumbs/8212c09c94cf.jpg", "t": "Simplexity 01", "a": ["Kin-Ming Wong"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427117", "abs": "Simplexity 01 is a selection from an on-going experimental project that explores how unexpected visual complexities emerge from simple algorithmic procedures. For this particular work, the artist appropriated a simple space-filling algorithm into a generative medium for producing an unseen imaginary structure. The quality that identifies this work is the structure's semi-organic appearance, and the artist sees this emergence as a direct result of the spatial scale that the algorithm was allowed to explore."}, {"v": "", "img": "thumbs/4a58f24cce86.jpg", "t": "Suprasymmetry", "a": ["Robert Lisek"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427155", "abs": "The topic of my research was problem of creating virtual environments (VE) in immersive art. I was focused on a roles of Presence, Flow, Immersion, and Interactivity. I was particularly interested in the problem of presence and flow in VE. Presence is defined as the subjective experience of being in one place or environment, even when one is physically situated in another. Presence is a normal awareness phenomenon that requires directed attention and is based in the interaction between sensory stimulation, environmental factors that encourage involvement and enable immersion. Flow is a state of experience where someone is completely absorbed and immersed in an activity. I researched relations between presence, flow, immersion and interactivity, e.g. how interactivity and sound spatialization improves experience of presence. I have developed machine learning methods that extend granular and pulsar synthesis in composing and new methods of building and transforming virtual environments."}, {"v": "", "img": "thumbs/db5776b86fd8.jpg", "t": "Surrogate being", "a": ["Su Hyun Nam"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427148", "abs": "Surrogate Being is an interactive virtual environment, where I negotiate the discrepancy between memories and digital data of a nostalgic place, my hometown in Korea. Interweaving the heterogeneity of algorithmic digital images and affective memories, this project overcomes the binary opposition of humans and nonhuman and the anthropocentric perspective to investigate technology as a coevolving cognitive being and vital actor in the cognitive network. This project explores our experience and understanding of the world living in the Cognisphere - the globally interconnected cognitive system of humans and machines - and acknowledges nonlinguistic forces and experiential knowledge. Such affective dynamics among planetary cognitive beings are largely unnoticed and overshadowed by seemingly explicit and errorless digital information, and this project opens up interplays between tangible representations on the interface and underlying affects."}, {"v": "", "img": "thumbs/b9aae617f614.jpg", "t": "The sinking garden", "a": ["Xiying Yang", "Honglei Li", "He Li"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427144", "abs": "Highlighting endangered species in New York State and beyond, 'The Sinking Garden' is a new technology project integrating Virtual Reality application with fine art language to depict ecosystems that are at risk of survival."}, {"v": "", "img": "thumbs/38f2e13f193d.jpg", "t": "The synthetic cameraman", "a": ["Lukasz Mirocha"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427127", "abs": "\"The Synthetic Cameraman\" is a full-screen, real-time, 3D graphics simulation that critically challenges the notions of remediation, processuality, linearity, and creative agency in computer-generated virtual environments. The application is rendering a virtual scene depicting a volcanic mountain landscape with a centrally located volcanic cone that is violently erupting with pyroclastic flow and rocks of different sizes being expelled as molten lava rivers are traveling down the slope forming a lava lake at the foot of the cone. The visual aspect of the phenomenon is enhanced by deep sounds of rumbling earth and rocks hitting the bottom of the caldera and falling down the slope. The viewing takes about 3--5 minutes and is divided into three sections with the middle section constituting the core experience where the control over individual elements in the scene is given over to the algorithms. The weather conditions, eruption, and the settings of virtual camera - its dynamic movement and image properties - are procedurally generated in real-time. The range of possible values that the camera is using can go beyond the capabilities of physical cameras, which makes it a hypermediated representational apparatus, producing partially abstract, semi-photorealistic ever changing fluid visuals originating from a broadened aesthetic spectrum. The algorithms are also controlling various post-processing effects that are procedurally applied to the camera feed. All of these processes are taking place in real-time, therefore every second of the experience is conceived through a unique entanglement of settings and parameters directing both the eruption and its representation. Each second of the simulation as perceived by the viewer is a one-time event, that constitutes this ever-lasting visual spectacle. The artwork can be displayed in a physical setting using a TV / projector or in a virtual setup as a continuous image feed (stream) produced by the application."}, {"v": "", "img": "thumbs/64fcac0321fc.jpg", "t": "The world of freedom", "a": ["Borou Yu", "Tiange Zhou", "Zeyu Wang", "Jiajian Min"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427172", "abs": "Indeed, people spend more time on deep thinking since 2020. The questions which ask mainly by the sociologists, now become the topics on the dining table. The debates on social and moral dilemmas are happening intensively 24 hours on the internet. We started to think more about who we are, where we are going, and how we will value the information we have received. Do we have freedom? Shall we believe absolute freedom? Sometimes people directly transform the idea of liberty into democracy. However, shall we also equal freedom to democracy? Since we are all inside this one pandemic bubble, after most people stay at home for a couple of months, we start emerging a global-size collective memory, which makes people more empathetically understand others' situations. Meanwhile, more and more people have to learn and take experience virtually. The attention of empathy and the new work-from-home mode evokes the initial idea of this virtual reality experience. We start to ask how people could learn and think more effectively in this brand new virtual age? Unity program makes this innovation possible. The innovative architecture modeling could permit a large group of people to experience personal space and sharing areas simultaneously. The sound design is specially designed for the various space sound and the audience's interactivities. We use this program to build up an immersive and empathetic space that embodies a hypothetical argument of a social dilemma into a virtual manifestation. People might be able to figure out the most meaningful answer by wearing the same shoes. The social distance could also be virtually controlled in this program by counting if the number of participates overload spaces."}, {"v": "", "img": "thumbs/7537bb9a7560.jpg", "t": "Tokyo", "a": ["Takuya Yamauchi"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427104", "abs": "\"Tokyo\" is a generative artwork created by visualizing continuous recorded Tokyo temperature data obtained from the Japan Meteorological Agency from 1990 to 2017, and then printing out the result in a creative manner. The colored dots in the artwork reflect the temperature of each day. Cold days were colored in blue while warm days were displayed in orange. There are two primary reasons for using natural phenomena, such as temperature data in generative art creation. First, the data allows us to embrace and comprehend the unpredictability of natural phenomena. Second, when used with a generative algorithm, it makes possible data visualization in ways that allow us to create abstract art. Since there are massive amounts of historical temperature data, such artwork would be impossible to create without computers. Simple patterns like noise are not always random and often contain repeating patterns that can be expressed harmoniously. The seeming randomness of dots showing temperature distributions of hot summer days can be painted as patterns that result in abstract artwork. When applied to Tokyo temperature data, the stain-like patterns that resulted are among the most attractive characteristics of generative art painting and would be difficult to express without the generative algorithm."}, {"v": "", "img": "thumbs/126bd615d140.jpg", "t": "Trace of dance", "a": ["Soyoung You"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427179", "abs": "\"Trace of Dance\" tells the story of modern labor. It is not just to make money, but it includes images of various complex desires, such as social status, personal satisfaction, and the recognition of bosses. The artist likened this behavior of a modern laborers to an inertial Flapping wings of a moth. The thermal data are collected through interviews with workers and produced as sculptures depicting the trace of dance based on them. The sculpture is melted by thermal lighting, which turns on and off in proportion to laborers' working hours. The artist asks whether this quiet misfortune comes from personal aspirations or from systems."}, {"v": "", "img": "thumbs/d7232311e49e.jpg", "t": "Turn over", "a": ["Yuichiro Katsumoto"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427119", "abs": "Turn Over is a kinetic art that illustrate the change of human and society. Twenty four set of Y-shaped object, which means person in Chinese, turn on a flat surface and gradually makes various pattern."}, {"v": "", "img": "thumbs/761982a9bafc.jpg", "t": "Uncertain facing", "a": ["Sihwa Park"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427161", "abs": "Uncertain Facing is a data-driven, interactive audiovisual installation that aims to represent the uncertainty of data points of which their positions in 3D space are estimated by machine learning techniques. It also tries to raise concerns about the possibility of the unintended use of machine learning with synthetic/fake data. Uncertain Facing visualizes the realtime clustering of fake faces in 3D space through t-SNE, a non-linear dimensionality reduction technique, with face embeddings of the faces. This clustering reveals what faces are similar to each other based on the assumption of a probability distribution over data points. However, unlike the original purpose of t-SNE that is meant to be used in an objective data exploration in machine learning, it represents data points as metaballs, in which two or more face images become a merged face when they are close enough, to reflect the uncertain and probabilistic nature of data locations the t-SNE algorithm yields. As a result, metaball rendering is used as a means of an abstract, probabilistic representation of data as opposed to exactness that we expect from the use of scientific visualizations. Along with the t-SNE and metaball-based visualization, Uncertain Facing sonifies the change of the overall data distribution in 3D space based on a granular sound synthesis technique. Uncertain Facing also reflects error values, which t-SNE measures at each iteration between a distribution in original high dimensions and a deduced low-dimensional distribution, to represent the uncertainty of data as jittery motion and inharmonic sound. As an interactive installation, Uncertain Facing allows the audience to see the relationship between their face and the fake faces, implying an aspect that machine learning could be misused in an unintended way as face recognition technology does not distinguish between real and fake faces."}, {"v": "", "img": "thumbs/afe29249ecdf.jpg", "t": "Understand_ V.T.S", "a": ["Jing Ting Lai"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427176", "abs": "Could exploring the limit of consciousness become a mode of cultivating oneself?", "pos": "50% 40%"}, {"v": "", "img": "thumbs/f87304855789.jpg", "t": "Viewporter", "a": ["Jean Ho Chu"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427140", "abs": "Viewporter is an interactive installation that displays a computer-generated video of a city. Viewers can rotate the screen attached to a device that resembles a telescope to accelerate the playback speed of the video. In this project, the deep learning technique with images capturing the Seoul skyline was used to train and generate the artificial city skyline. As one of the most developed metropolitan cities, Seoul has been under continuous development and construction of highrise buildings over the past decades. While the image of the skyscraper-packed skyline has been portrayed by the mainstream media to symbolize the utopian dream of the city, the lives of the residents with mundane duties have been far-fetched from the attractive image promoted through the propagandistic videos on the media. Viewporter uses the analogy of a telescope in tourist attractions to emphasize the distance between the idealized and the real and have viewers re-think the illusion and fantasy promoted by the images of development programs."}, {"v": "", "img": "thumbs/1c9443408593.jpg", "t": "We can’t see the rainbow in the white", "a": ["Gi Wai Echo Hui"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427132", "abs": "When there is light, everything is visible. I decompose the fundamental element in the visual world to let the invisible become visible."}, {"v": "", "img": "thumbs/b005ad5263ef.jpg", "t": "“Mobile” device", "a": ["Chenwei Chiang"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427121", "abs": "This work invites viewers to see the world through a machine's perspective. People are accustomed to seeing the world through an anthropocentric viewpoint and create things accordingly. What will it be like if machines are creating things through their perspective? Created by the Mechanical Creator, what are the challenges this group of mechanical life forms is facing for survival? How do they live within and adapt to the environment? We know that hermit crabs are using human trash as their shells. What would the mechanical life forms do when they are interacting with their living environment?"}, {"v": "", "img": "thumbs/23d3da82e357.jpg", "t": "주마간산 (jumagansan)", "a": ["Youn Soo Kwack", "Hun Soo Kim"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427160", "abs": "주마간산走馬看山 is a four-character chinese idiom that means to look at the scenery while horse riding, and it means to skim through the outer surface of things. <주마간산>, a collaboration between photographer Kim Hun Soo and painter Kwack Youn Soo, captures the scenery of the city as viewed from various perspectives while traveling by various transportations. They live in a city, use the same transportation, and look at similar landscapes, but each person's gaze varies. Even if it is a passing impression, the landscapes that contain each image are piled up and accumulated in the time and space of the city in which we live."}, {"v": "", "img": "thumbs/fbcbfe5e91da.jpg", "t": "Aeolian traces", "a": ["Joel Yuzhi Ong"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3320145", "abs": "Aeolian Traces is a multimedia artwork installed most recently at the CURRENTS NEW MEDIA festival in Santa Fe, New Mexico. The project collects human migration data to generate gusts of wind around the gallery space and trigger sounds in a database of recordings in the migrants' native languages. A work of data sonification and visualization, this project is a part of the author's long-standing interest in the aesthetics and cultural appropriations of environmental data. In Aeolian Traces, wind data is harvested as a metaphor for geographical and cultural nomadism."}, {"v": "", "img": "thumbs/7d620cb0a0bc.jpg", "t": "Air hugs", "a": ["Rachel Dickey"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3320141", "abs": "This paper outlines the description for the Air Hugs project, which is a large-scale interactive installation that transforms the space around the passerby using actuated inflatables and computer vision. The author provides a historical overview of inflatables and specifically examines their use as a driver for innovative shifts in the discipline of architecture. The hug, throughout the paper, is appropriated as a discursive tool for framing the theoretical context and for describing novel ways of generating contemporary forms of experience through architectural performance."}, {"v": "", "img": "", "t": "alt'ai", "a": ["Paul Heinicker", "Lukáš Likavčan", "Qiao Lin"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3320146", "abs": "alt'ai is an agent-based simulation inspired by aesthetics, culture and environmental conditions of the Altai mountain region on the borders between Russia, Kazakhstan, China and Mongolia. It is set into a scenario of a remote automated landscape populated by sentient machines, where biological species, machines and environments autonomously interact to produce unforeseeable visual outputs. It poses a question of designing future machine-to-machine authentication protocols that are based on the use of images encoding agent behavior. Also, the simulation provides rich visual perspective on this challenge. The project pleads for a heavily aestheticized approach to design practice and highlights the importance of productively inefficient and information redundant systems."}, {"v": "", "img": "thumbs/6fa195f0d993.jpg", "t": "Awakened silence", "a": ["Rachel Dickey"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3320142", "abs": "Awakened Silence appropriates techniques of performance, installation and film to memorialize lives lost in recent mass shootings, reveal humanity's fixed relationship to technology and subvert the effects of media overload. It draws from the experience of first responders hearing the incessant sounds of phones after appearing on the scene. The project involves the video and audio recording of hundreds of cell phones turning on after a 24-hour period of silence. The resulting film captures a compilation of messages and notifications, which are composed into a projected performance of darkness and silence gradually awakened by a crescendo of light and sound."}, {"v": "", "img": "", "t": "Cave", "a": ["Kris Layng", "Ken Perlin", "Sebastian Herscher", "Corinne Brenner", "Thomas Meduri"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3320138", "abs": "CAVE is a shared narrative six degrees of freedom (6DoF) virtual reality experience. In 3.5 days, 1,927 people attended its premiere at SIGGRAPH 2018. Thirty participants at a time each saw and heard the same narrative from their own individual location in the room, as they would when attending live theater. CAVE set out to disruptively change how audiences collectively experience immersive art and entertainment. Inspired by the social gatherings of theater and cinema, CAVE resonated with viewers in powerful and meaningful ways. Its specific pairing of colocated audiences and physically shared immersive narrative suggests a possible future path for shared cinematic experiences."}, {"v": "", "img": "thumbs/c9e40d2a03e2.jpg", "t": "Eyes", "a": ["Yoon Chung Han", "Praful Surve"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3324028", "abs": "Distinct biometric patterns such as fingerprints, irises, palm prints and faces represent a person's individual signature and identity in digital society. They are intuitive and powerful resources that represent the individual's genetic identity through microscopic patterns and complicated networks. Thus, these body patterns, known as biometric data, can provide a means not only for discovering our genetic code but also for exploring hidden narratives in relation to others."}, {"v": "", "img": "thumbs/564471a4be1e.jpg", "t": "Fiber-optic ocean", "a": ["Özge Samanci", "Adam Snyder", "Gabriel Caniglia"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3324022", "abs": "Fiber-Optic Ocean is a virtual reality experience that generates procedural music and light from live data. Fiber-Optic Ocean portrays the struggle of human beings to survive in the age of corporations via the metaphor of sharks in an ocean invaded by technology and interprets what happens when technology invades the world's oceans."}, {"v": "", "img": "thumbs/098f7469fe4b.jpg", "t": "Knowing together", "a": ["Rosalie Yu", "Charles Berret"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3320139", "abs": "Knowing Together is a collection of sculptures designed to explore collaborative techniques for capturing three-dimensional images. Thirty-five participants collectively created these images by forming circles and passing a camera around. These images were stitched together to form 3D models whose distortions are preserved as artifacts attesting to their creation process, suggesting novel approaches to photogrammetry that do not treat photorealism as its ideal quality."}, {"v": "", "img": "thumbs/ffa3771c3db6.jpg", "t": "Knowing together", "a": ["Rosalie Yu", "Charles Berret"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3324025", "abs": "Knowing Together is an experiment in collaborative photography and the expression of embodied experience in three-dimensional art. This experiment is intended to probe beyond the typical limits of photogrammetry, a technique for creating 3D models by combining multiple photographs taken of an object from different angles."}, {"v": "", "img": "thumbs/2421d9c2e20d.jpg", "t": "LAVIN", "a": ["Jieliang Luo", "Weidi Zhang"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3352410", "abs": "The current artificial intelligence (AI) technique allows a deep neural network to recognize over 20,000 different categories of objects. Meanwhile, countless deep neural networks are trained for different applications as the output from each neural network is a singular projection of the neural network's own understanding of the real world. Given the same visual input, for example, neural networks trained for facial recognitions can only interpret the input as a collection of faces, while neural networks used for autonomous driving can decompose the input into cars, pedestrians, trees, etc. Regardless of the complexity of the projection, it shapes the \"world value\" of the neutral network it belongs to. Therefore, an intriguing question arises as to what ground truth is in the modern AI age, given the fact that the most complex neural network model cannot inclusively represent the real world."}, {"v": "", "img": "thumbs/6320bca276b1.jpg", "t": "Learning to see", "a": ["Memo Akten", "Rebecca Fiebrink", "Mick Grierson"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3320143", "abs": "The authors present a visual instrument developed as part of the creation of the artwork Learning to See. The artwork explores bias in artificial neural networks and provides mechanisms for the manipulation of specifically trained-for real-world representations. The exploration of these representations acts as a metaphor for the process of developing a visual understanding and/or visual vocabulary of the world. These representations can be explored and manipulated in real time, and have been produced in such a way so as to reflect specific creative perspectives that call into question the relationship between how both artificial neural networks and humans may construct meaning."}, {"v": "", "img": "thumbs/f7d7e5e9746a.jpg", "t": "Making visible the invisible", "a": ["George Legrady", "Rama Hoetzlein"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3320147", "abs": "Making Visible the Invisible is a six-screen, dynamic data visualization artwork at the Seattle Public Library. It visualizes patrons' library checkouts received by the hour through four different animations to give a sense of community interests. The artwork was activated in September 2005 for a 10-year operation and was extended until 2019. As one of the longest-running media arts projects based on live, continuous data, the work has presented significant challenges regarding robustness and durability over time. We review the motivation, design of the system, backup plan, maintenance and novel strategies for a decades-long media artwork."}, {"v": "", "img": "thumbs/bf4ac521f34d.jpg", "t": "No in disguise", "a": ["Simon Boas"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3320144", "abs": "As the distinction between our online and offline selves collapses, how we are able to express ourselves digitally has direct consequences for the world we experience offline. This paper examines those consequences through a work of art that explores how a popular dating app prestructures sexual relationships: The author's collaborative multimedia installation No in Disguise features procedurally composited video of men reading interviews with dating app users algorithmically targeted by their views on sexual consent as expressed in their profiles."}, {"v": "", "img": "thumbs/300ff32ae708.jpg", "t": "NOISE AQUARIUM", "a": ["Victoria Vesna", "Alfred Vendl", "Martina Fröschl", "Glenn Bristol", "Paul Geluso", "Stephan Handschuh", "Thomas Schwaha"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3324024", "abs": "Plankton serve as one of the primary bases of the marine food chain and are as a result a crucial component of Earth's ecosystem. Project Noise Aquarium deals with unnatural noise in the oceans largely associated with fossil fuels as an environmental issue. This project offers a species-rich idyll as well as visual attractiveness, thus evoking interest in and attention for these vital microcreatures and their disturbance from noise pressure waves. Noise Aquarium aims to awaken awareness for biodiversity and introduces a collection of accurate tomographic 3D-scanned 3D models as a resource for scientific and artistic research. The academic and creative potential of a cooperation, as it was developed for this project, allowed all participants to learn to move beyond the comfort of their fields and communicate with experts from other disciplines. The animation was expanded with various scientific imaging techniques. This specific 3D scanning microcreatures technique developed by the biologists adds a layer of authenticity to the animation that has not previously been done with planktons by an art-science team. The installation lets participants interact with enormously enlarged plankton surrounded by microplastics. The ecosystem gets balanced by stillness so that the noise disappears and audiences watching can hear the whale sounds and think about the complex interconnections of the living systems in Earth's bodies of water."}, {"v": "", "img": "thumbs/f788e0d3d5e6.jpg", "t": "Pachinko machine", "a": ["Brigitta Zics"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3324020", "abs": "The pachinko machine is a vertical pinball machine (or pachinko) played by a large number of people mainly in This digital version is a self-learning pachinko displayed on a screen with a highly detailed kinetic graphics simulation. The machine plays the game by itself in an automated setup. Through machine learning algorithms the pachinko becomes increasingly accurate in achieving the winning result. During the period of the exhibition the machine optimizes its own performance and improves its results hour after hour. The only obstruction to fulfill the complete learning cycle is beyond the machine's control; there is a second intelligence embedded within the machine that aims to obfuscate. The work aims to represent the walk of life---although we may be able to control some part of it, there is always an element of chance that may encourage us to stray from our original path."}, {"v": "", "img": "thumbs/03add176d560.jpg", "t": "Robotic voice-activated word-kicking machine", "a": ["Neil Mendoza"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3324032", "abs": "The Robotic Voice-Activated Word-Kicking Machine is a surreal exploration of language and our strange relationship with talking to machines, from customer service bots to \"intelligent assistants.\" It combines projection and robotics to explore the crossover between the virtual and the physical. Viewers' spoken words are converted into text and launched into the virtual world. They accumulate there, sometimes kicked by a robotic foot and sometimes sucked back out into the world as sound, depending on where the words end up. If they touch the foot, it kicks them, and if they get near to the opening of the right hand horn, it sucks them out."}, {"v": "", "img": "thumbs/656f0118e9c6.jpg", "t": "RuShi", "a": ["John Wong"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3324027", "abs": "Is big data the new superstition now? Will a data scientist or artificial intelligence (AI) be the new fortune-teller?"}, {"v": "", "img": "thumbs/d37d07ba75da.jpg", "t": "Tentacle flora", "a": ["Akira Nakayasu"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3324021", "abs": "The tentacles of a sea anemone swaying in the ocean waves recall the image of a primitive organism. Among the studies published in Genome Research in 2014, it was found that sea anemones are genetically half plant and half animal [1,2]. Their primitive mode of life that encompasses diversity amid a chaos that human beings cannot understand reflects a vitality and beauty. Tentacle Flora is a robotic sculpture created with the mysterious sea anemone as its motif."}, {"v": "", "img": "thumbs/bdccb2370e56.jpg", "t": "Terra mars", "a": ["Weili Shi"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3320134", "abs": "Terra Mars presents artistic renderings of Mars with visual reference to our very own planet Earth. The author trained an artificial neural network with topographical data and satellite imagery of Earth so that it can learn the relation between them. The author then applied the trained model to topographical data of Mars to generate images that resemble satellite imagery of Earth. This project suggests a new approach to creative applications of artificial intelligence---using its capability of remapping to broaden the domain of artistic imagination."}, {"v": "", "img": "thumbs/11c24d198b35.jpg", "t": "The trained particles circus", "a": ["Patxi Araujo"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3320133", "abs": "The Trained Particles Circus proposes an improbable, precarious and potentially dangerous meeting place caged between the real and the virtual worlds. Embodied in the relationship between synthetic biomechanics and an automaton, it recreates the figure of the circus artist, the puppet with its own life or the fantastic animal; and it places us as spectators into a contemporary spectacle of hybrid and augmented subjects that conjugate light and shadow, fake and magic, virtual and physical reality, machine and organism [1]."}, {"v": "", "img": "thumbs/3f4de9b3aaf6.jpg", "t": "The yawn chorus", "a": ["Alex Rothera", "Christopher G. Thompson", "Christopher Baker", "Shekpoint Charlie"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3324030", "abs": "The Yawn Chorus involves creating a yawning orchestra."}, {"v": "", "img": "thumbs/098c1e133b4f.jpg", "t": "TransVision", "a": ["Jiabao Li", "Honghao Deng", "Panagiotis Michalatos"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3324023", "abs": "Through three extreme ideal types of perceptual machines, TransVision questions the habitual ways in which we interpret, operate and understand the visual world intervened by digital media: hypersensitive vision---a speculation on social media's amplification effect and our filtered communication landscape; hyperfocused vision---an analog version of the searching behavior on the Internet; hypercommoditized vision---a monetized vision that meditates on the omnipresent advertisement that targets our visual field."}, {"v": "", "img": "thumbs/55bfb7b1de0f.jpg", "t": "Watertight", "a": ["Ziv Schneider", "Caitlin Robinson"], "c": "SIGGRAPH", "y": 2019, "k": "Art Gallery", "doi": "10.1145/3306211.3324026", "abs": "As we hurtle toward the future, some things don't keep up with rapid technological and social change. Housing infrastructure adapts in a far longer time frame, resulting in contemporary life being retrofitted to our legacy-built environment."}, {"v": "", "img": "", "t": "Artist residencies for innovation", "a": ["Nicolas Henchoz", "Pierre-Xavier Puissant", "Ana Solange Leal", "Tânia Moreira", "Hugues Vinet"], "c": "SIGGRAPH", "y": 2019, "k": "Art Papers", "doi": "10.1145/3306211.3320140", "abs": "Artists can play a major role in the success of innovation. The European program STARTS aims to increase their impact in high-tech environments. An international consortium has the mission to implement 45 residencies and set a complete framework for such partnerships. The authors identify methodological gaps from the literature and observe how the STARTS program fills them. The authors discuss the impact of the implemented solutions, providing the leading global study on this large-scale action. The resulting residency framework, including the methodology and its associated tools, will be released publicly, making it available to institutions and companies."}, {"v": "", "img": "", "t": "Off-lining to tape is not archiving", "a": ["Evanthia Samaras", "Andrew Johnston"], "c": "SIGGRAPH", "y": 2019, "k": "Art Papers", "doi": "10.1145/3306211.3320135", "abs": "This paper examines digital asset archiving and preservation practice in the visual effects (VFX) industry. The authors briefly summarize media archaeology theory and provide an overview of how VFX studios presently archive project assets and records, based on case study and interview research conducted with expert VFX practitioners from leading international studios. In addition, the authors propose that current practice could be improved by adopting archival science methods, including digital preservation practices. Doing so will support media archaeology studies of digital cultures over time and ensure that the legacy of VFX creative and technical production thrives for future generations."}, {"v": "", "img": "", "t": "Secrets of balanced composition as seen through a painter's window", "a":

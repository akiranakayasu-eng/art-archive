 ["Jin Wan Park"], "c": "SIGGRAPH", "y": 2019, "k": "Art Papers", "doi": "10.1145/3306211.3320136", "abs": "In this paper, the author implements and uses a subset barycenter pattern to analyze various paintings. The suggested visualization and analysis tool is inspired by Gombrich's theory of a painter's window and Locher's psychological research on computational balance. An image's or an image group's subset (set of cropped images) may reveal genre and artist characteristics. Moreover, it may also reveal forensic information about each artist's individual style and its changes over time with barycenter dispersion patterns. The suggested barycenter pattern analysis can enrich the methods of art history and criticism."}, {"v": "", "img": "", "t": "Weaving objects", "a": ["Claire Harvey", "Emily Holtzman", "Joy Ko", "Brooks Hagan", "Rundong Wu", "Steve Marschner", "David Kessler"], "c": "SIGGRAPH", "y": 2019, "k": "Art Papers", "doi": "10.1145/3306211.3320137", "abs": "3D weaving is an industrial process for creating volumetric material through organized multiaxis interlacing of yarns. The overall complexity and rarity of 3D weaving have limited its market to aerospace and military applications. Current textile design software does not address the ease of iterating through physical trialing so necessary for designers to access this medium. This paper describes the development of a series of volumetric textile samples culminating in the creation of a fully formed shoe and the collaboration with computer scientists to develop a visualization tool that addresses the consumer accessory design opportunities for this medium."}, {"v": "", "img": "", "t": "\"Rebooting memories\"", "a": ["Anju Niwata", "Hidenori Watanave"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3361904", "abs": "In this paper, we explain the creation of \"flow\" in social media and real spaces using AI technology to colorize black-and-white stock photographs from digital archives and other locations. When visualizing the colors that the photographs should have had, the impressions of \"freezing\" in black-and-white photographs are \"rebooted,\" and viewers can more easily imagine the events depicted. This bridges the psychological gap between past events and modern daily life, sparking conversations. The \"flow\" generated here causes the emergence of lively communication and increases the value of information. This method can help to pass precious materials and memories of past events into the future."}, {"v": "", "img": "", "t": "Artistic license in heritage visualisation", "a": ["Kit Devine"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3361903", "abs": "Heritage visualisations are works of the cultural imaginary and this paper examines the artwork Artistic License: VR Sydney Cove ca. 1800 which foregrounds the interpretive nature of heritage visualisation. It is a re-imagining in virtual reality of A View of Sydney Cove, New South Wales, 1804, a contemporaneous print of Sydney Cove. Existing in the liminal space between accuracy and authenticity it is both art object and heritage visualisation. The dual nature of this work supports engagement with wider audiences, fostering and broadening debate at individual, institutional, academic and societal levels about the nature and role of heritage."}, {"v": "", "img": "", "t": "Bridging knowledge between craftsman and learner in Chinese intangible cultural heritage through WebAR", "a": ["Peng Tan", "Yi Ji", "Damian Hills", "Tieming Fu"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3361900", "abs": "The purpose of this paper is to explore new perspectives to learning Intangible Cultural Heritage (ICH) through embodied interaction with focus on learning and experience with traditional Cantonese Porcelain crafting. This research developed a WebAR application where various processes are presented through the tangible interaction of virtual porcelain represented by physical objects. The learner is able to directly interact with the plate that bridges the tangible materials and making processes of ICH utilizing WebAR. Empirical studies found that the WebAR and embodied interaction can enhance student's tangible learning experience to transfer knowledge between craftsman and student."}, {"v": "", "img": "thumbs/b11d97a5bd43.jpg", "t": "CharActor", "a": ["Masaru Mizuochi"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3366358", "abs": "The personality of living things is beautiful. Is it possible to have a personality in the digital world? CharActor is a video work that produces animation by recognizing shader programs as genes and by changing the mathematical expression itself using evolutionary computation."}, {"v": "", "img": "thumbs/28edc5967403.jpg", "t": "Contact/sense", "a": ["Rewa Wright", "Simon Howden"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3366368", "abs": "When we feel and sense through machines, are we still ourselves? In a mixed reality where embodied actions and blinding visions are part woman/part machine, the tactile surface of plants is a portal that conjures augmented materialities into existence."}, {"v": "", "img": "thumbs/9b59e70b1106.jpg", "t": "Dream clanger", "a": ["Baden Pailthorpe"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3366355", "abs": "'Dream Clanger' is a hybrid art/computer science project that re-imagines AFL Player GPS data and match video. Building on Baden Pailthorpe's 2017 major exhibition 'Clanger', this work pushes the envelope further by integrating machine learning."}, {"v": "", "img": "", "t": "Extraordinary accident", "a": ["Tomas Laurenzo", "Alejandro Rodríguez", "Tatjana Kudinova"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3361901", "abs": "This paper presents Extraordinary Accident, an immersive experience exploring how different levels of abstraction can coexist and collaborate in the representation and recreation of urban space. Using Hong Kong as both inspiration and data source, the work attempts to liberate virtual reality compositions from their metaphorical ballast -that is, their recreational onus- and instead, with a temporal amalgamation of poetic representation at different scales, contribute to an alternative, potentially more intimate, understanding of the urban experience."}, {"v": "", "img": "", "t": "gravityZero", "a": ["Suguru Goto", "Satoru Higa", "johnsmith", "Chihiro Suzuki"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3361899", "abs": "This paper reports the exposition of an artistic installation, gravityZERO, and its ongoing technical development. It consists of virtual sound, VR and robotic technologies in order to simulate the state of zero gravity. Audience members can experience a floating sensation within this virtual environment. gravityZERO (zero gravity) is an installation that combines video, sound, and robotics. Translucent cubes are assembled at the venue. Images are quasi-holographically projected on the cube's surfaces, and speakers are placed in the cube's corners. A person is suspended from the ceiling and floats as if there is no gravity. Each rope can be freely moved in 3D space within the cube through motor operation. This project is based upon an idea that utilizes an interface closely related to a human body, and also pursues new possibilities of the performance of Augmented Reality and Projection Mapping."}, {"v": "", "img": "", "t": "Hybrid animation production and the dream of flight", "a": ["Simon Rippingale", "Andrew Johnston", "Andrew Bluff"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3361906", "abs": "Through a detailed account of a recent practice-based research project - a short animation project called Jasper, this paper explores how a hybrid analogue/digital production approach can generate a unique and engaging visual style - one that sits between the tangible, handcrafted feel of miniatures and the cleanness, fluidity and flexibility of computer-generated animation. The author examines the new creative possibilities and challenges that a hybrid animation production approach presents and also outlines various technical platforms encountered during the production of Jasper, including motion-controlled camera systems, 3D printing, game engines, point cloud scans and augmented reality."}, {"v": "", "img": "thumbs/89f082ec8b17.jpg", "t": "Instababy generator", "a": ["Emi Kusano", "Junichi Yamaoka"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3366364", "abs": "This artwork is an installation that expresses the future in which users can manufacture designer's babies themselves. You can design, customize and manufacture your baby with your favorite gene on your laptop. A 3D printed child appears from the display, and the child's face created based on the visitor's face."}, {"v": "", "img": "thumbs/a06cc5943ca0.jpg", "t": "LightWing II", "a": ["Uwe Rieger", "Yinan Liu"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3366362", "abs": "LightWing II creates a mysterious sensation of tactile data. In this interactive installation, a kinetic construction is augmented with stereoscopic 3D projections and spatial sound. A light touch sets the delicate wing-like structure into a rotational oscillation and enables the visitor to navigate through holographic spaces and responsive narratives."}, {"v": "", "img": "", "t": "Narrative's impact on quality of experience in digital storytelling", "a": ["Øyvind Sørdal Klungre", "Asim Hameed", "Andrew Perkis"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3361905", "abs": "Our ways of telling stories have evolved along with advances in technology. This has led to the emergence of digital storytelling. This project explores narrative influences on Quality of Experience of users in digital stories. This is done by creating and implementing a location driven digital story presented to the user by an augmented reality application on a mobile device. This narrative system has been evaluated by 30 people who have participated in a subjective evaluation. The results show that the narrative setup results in a richer, livelier and more engaging experience."}, {"v": "", "img": "thumbs/09c40b9c1042.jpg", "t": "Numb", "a": ["Taeil Lee"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3366356", "abs": "Numb, shaped as an exaggerated eyeball, follows you and reflects the blinks of yours. It makes you become aware of your own blinking and sensitive to your own sensation. Numb illustrates how we build relationship with technology through senses, and how we become sensitive to ourselves by and with technology."}, {"v": "", "img": "thumbs/a277e3ce6068.jpg", "t": "Smile", "a": ["Tomas Laurenzo"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3366367", "abs": "Smile is a mixed-media installation consisting of a screen in a black box, mounted on the wall. When an interactor smiles, drone-footage of the ruins of Gaza fades in. If the interactor stops smiling, the video stops. It only plays when the interactor widely smiles at it."}, {"v": "", "img": "thumbs/e1e3c4f93cd1.jpg", "t": "Tactile microcosm of alife", "a": ["Toshikazu Ohshima"], "c": "SIGGRAPH Asia", "y": 2019, "k": "Art Papers", "doi": "10.1145/3354918.3366357", "abs": "Tactile Microcosm of ALife offers interaction with artificial organisms, whereby the user can enjoy playing with fish-like organisms through aerial imaging and haptic feedback. The holographic organisms float in water in a petri dish, and the user can feel a forcefield of the vital of the organisms via force feedback."}, {"v": "", "img": "thumbs/6ab2e46e208f.jpg", "t": "Art systems", "a": ["Ernest Edmonds"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3205920", "abs": "In this note I describe my personal development of art systems over 50 years. In all of this work I have used computers and computational processes both to make the works and to advance my conception of art. This history is marked by a trace of publications in the journal Leonardo, itself being 50 years old. I will relate the story with specific reference to these publications. Each of the following sections relates to one Leonardo publication and includes quotations from that paper. In the earlier writing \"he\" or \"him\" is used sometimes to refer to a person who could well be female, as used to be the custom."}, {"v": "", "img": "thumbs/bb492e4f33f4.jpg", "t": "Diastrophisms", "a": ["Nicole L'Huillier", "Valentina Montero"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3203090", "abs": "Diastrophisms is a sound installation with a modular system that sends images through rhythmic patterns. It is built on a set of debris from the Alto Río building that was destroyed by the 27F earthquake in 2010 in Chile. Diastrophisms explores poetical, critical and political crossings between technology and matter in order to raise questions about the relationship between human beings and nature, to consider the construction of memory in a community by questioning the notion of monument, and to imagine new forms of communication in times of crisis."}, {"v": "", "img": "thumbs/5b30e515ec8b.jpg", "t": "Diastrophisms", "a": ["Nicole L'Huillier", "Thomas Sanchez Lengeling", "Yasushi Sakai"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3207676", "abs": "Diastrophisms is a sound installation with a modular system that sends images through rhythmic patterns. It is built on a set of debris from the Alto Río building that was destroyed by the 27F earthquake in 2010 in Chile. With Diastrophisms we were looking for a poetical, critical and political crossing between technology and matter, in order to raise questions about the relationship between human beings and nature, and to consider the construction of memory in a community by questioning the notion of monument, as well as to imagine new forms of communication in times of crisis. This piece has a full paper in the Art Papers section on page 356 of this journal."}, {"v": "", "img": "thumbs/45c0a9da9383.jpg", "t": "Haven", "a": ["Alex Beim"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3205926", "abs": "Haven is a place of security and tranquility. Reminiscent of a mother's womb, it recalls our origins, where it all begins. The installation allows guests to leave their phones and all other technology at the door so they can be fully present without any of the prevailing modern distractions. They go in, spend some time, find themselves and maybe come out and start their day again. Fresh. A new beginning."}, {"v": "", "img": "thumbs/deba9d779b9f.jpg", "t": "He ao hou (a new world)", "a": ["Nā 'Anae Mahiki"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3205918", "abs": "He Ao Hou is a point-and-click adventure game set in the far future, when Native Hawaiians have attained the next level of navigation---space travel. The gameplay is based on kānaka maoli (Native Hawaiian) stories and knowledge, and focuses in particular on the uses of the kukui nut, itself a symbol of knowledge."}, {"v": "", "img": "thumbs/399e86b5f93e.jpg", "t": "Instrument | one antarctic night", "a": ["Ruth West", "Violet Johnson", "I Chen Yeh", "Zach Thomas", "Eitan Mendelowitz", "Lars Berg"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3205924", "abs": "INSTRUMENT | One Antarctic Night (IOAN) is a performative, multiparticipant reconfigurable artwork that engages open astronomical data in combination with data generated by robotic telescopes in Antarctica. IOAN places visitors inside a virtual star field of over 800,000 astronomical objects that form part of the Large Magellanic Cloud. This star field, created from observations in Antarctica and fused with additional data from multiple open astronomical repositories, is situated waist high within the virtual environment and stretches out beyond participants in all directions. Multiple participants can walk about the environment and collaboratively explore the star field by taking hold of the \"fabric\" of space, creating ripples and waves, and interacting with individual or sets of objects to create visual and auditory data remixes. The interaction places the astronomical data within a virtual reality visual and sonic remix engine that is a fundamental component of the artwork and is used to construct the virtual world. All graphics and spatialized ambisonic audio are procedurally generated from the data via real-time database queries. Our work incorporates machine learning approaches combined with granular and concatenative synthesis for generating the environment's unique soundscape. INSTRUMENT | One Antarctic Night evolved from our ongoing work in developing aesthetic data remixing and immersive data-driven experiences. Dataremix proposes the creation of the \"datamade,\" a concept analogous to Duchamp's \"readymade.\" IOAN is a meta-datamade in that it is a virtual instrument within which participants collaboratively create datamades through visual and auditory aesthetically driven remixes of astronomical data."}, {"v": "", "img": "thumbs/04711b2e80ee.jpg", "t": "Never alone : the art and the people of the story", "a": ["Amy Fredeen", "Dima Veryovka"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3205927", "abs": "Never Alone (Kisima Inŋitchuŋa) is the product of an uncommon partnership of an Alaska Native community and game developers. Through all stages of development, members of both communities met extensively to ensure that all creative and business decisions were appropriately considered and supported the goals of all stakeholders. Throughout the game and in supporting material, players will hear directly from members of both communities who were instrumental in shaping the game."}, {"v": "", "img": "thumbs/9d506d08db1f.jpg", "t": "She falls for ages", "a": ["Skawennati"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3205917", "abs": "This sci-fi retelling of the Haudenosaunee (Iroquois) creation story reimagines Sky World as a futuristic utopia and Sky Woman as a brave astronaut and world-builder. When she learns that her planet is dying, Sky Woman volunteers to become the seed of the new world---an Earth yet covered in water. She Falls For Ages boldly mixes ancient storytelling with science fiction to connect the deep past with the far future."}, {"v": "", "img": "thumbs/a728d84af29d.jpg", "t": "Somnium", "a": ["Danny Bazo", "Marko Peljhan", "Karl Yerkes"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3205928", "abs": "Somnium is a robotic and audiovisual installation that provides visitors with the ability to contemplate and experience exoplanetary discoveries, their macro- and microdimensions and the potential for life in our galaxy."}, {"v": "", "img": "thumbs/53c2ecbae734.jpg", "t": "Sopro and toque (the blow and touch)", "a": ["Milton Sogabe", "Fabio Oliveira Nunes", "Carolina Peres", "Soraya Braz", "Rodrigo Dorta", "Cleber Gazana", "Mirian Steinberg", "Melina Furquim", "Daniel Malva", "Fernando Luiz Fogliano"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3205921", "abs": "Considering the paradox between energy production and the contamination of the environment and reduction of biodiversity, cAt research group develops its work considering the discussion on sustainable sources of energy. The group's recent projects---Sopro (The Blow) and Toque (Touch)-have sought to aesthetically use the audience body's energy to interact and to animate the artworks. Simple devices are used to seek, in a kind of technological minimalist and interactive-art way, to raise public awareness of the issue of sustainability."}, {"v": "", "img": "thumbs/1ed6ae8a8de7.jpg", "t": "Transformation mask", "a": ["Microsoft Garage", "Andy Klein", "Shawn Hunt"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3205915", "abs": "The Raven, the ultimate trickster, has become a cyborg. In this collaboration with Microsoft Vancouver, Shawn Hunt moves away from engaging with the handmade, exploring authenticity and our expectations of what it means to be indigenous through the removal of the hand-carved surface. The mask appropriates the traditional aspects of metamorphosis with the transformation from bird mask to human, yet in this adaptation the human mask has been altered, upgraded and merged with the machine. Incorporating aspects of technology, sound and space, each part of the work reflects Hunt's interest in how we understand and identify with the term indigenous."}, {"v": "", "img": "thumbs/4ba4a4a7cb86.jpg", "t": "You are the ocean", "a": ["Özge Samanci", "Gabriel Caniglia"], "c": "SIGGRAPH", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3202918.3205916", "abs": "This interactive installation allows participants to control a digitally simulated ocean using only their brainwaves. Calm seas and storms alike are powered by the viewer's thoughts; the sheer act of concentration can conjure a squall or sunshine. Participants intentionally control their thinking while surrounded by the magnified consequence of their thoughts. Created in 2017, You Are the Ocean is about the theme of origins and one of the key concepts of Haudenosaunee and Anishnaabe cosmologies: \"land is alive.\""}, {"v": "", "img": "", "t": "Advertising positions", "a": ["Daniel C. Howe", "Qianxun Chen", "Zong Chen"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203085", "abs": "Advertising Positions integrates 3D scanning, motion capture, novel image mapping algorithms and custom animation to create data portraits from the advertisements served by online trackers. Project volunteers use bespoke software to harvest the ads they receive over months of browsing. When enough ads have been collected, the volunteer is interviewed, 3D scanned and motion captured. Each ad is then mapped to a single polygon on the textured skin of their virtual avatar. Outcomes have been displayed as 2D/3D images, animations and interactive installations."}, {"v": "", "img": "", "t": "Alienating the familiar with CGI", "a": ["Paul Charisse", "Alex Counsell"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203081", "abs": "This paper is an exploration of the processes used and ideas behind an animated full CGI feature film project that attempts to reach blockbuster production values, while retaining Art House sensibilities. It examines methods used to achieve these production values in an academic production environment and ways costs can be minimized while high quality levels are retained. It also examines the film's status as an Art House project, by comparing its narrative design and use of symbolism to existing works of Art House cinema."}, {"v": "", "img": "", "t": "Augmented fauna and glass mutations : a dialogue between material and technique in glassblowing and 3D printing", "a": ["Tobias Klein"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203082", "abs": "3D printing allows unprecedented freedom in the design and manufacturing of even the most geometric complex forms---seemingly through a simple click of a button. In comparison, the making of glass is an analogue craftsmanship, coordinating an intricate interplay of individual tools and personal skills, giving shape to a material during the short time of its temperature-based plasticity. The two artworks discussed in this article, Augmented Fauna and Glass Mutations, were created during the artist's residence at the Pilchuck Glass School and articulate a synthesis between digital workflows and traditional craft processes to establish a digital craftsmanship."}, {"v": "", "img": "", "t": "Casting", "a": ["Yiyun Kang"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203084", "abs": "This paper investigates CASTING, Yiyun Kang's site-specific projection mapping installation at the Victoria and Albert Museum in London, U.K., and the acquisition of the piece by the V&A in the following year. It identifies how CASTING developed distinctive properties in the field of projected moving-image installation artworks and how these novel characteristics were reflected in the acquisition by the V&A."}, {"v": "", "img": "", "t": "Cop to conductor", "a": ["Todd Berreth"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203092", "abs": "There is a crisis in our communities about the tributes to a shared civic life represented in existing public artwork and monuments. Culture wars are being waged herein and appear increasingly unreconcilable. This paper discusses this moment and describes the range of strategies artists and designers have used to remediate these works. It presents a project description of an interactive artwork that suggests innovative approaches in this realm. The author introduces a conceptual model which served as inspiration for the piece that may be useful when discussing and designing such interventions."}, {"v": "", "img": "", "t": "Data materialization", "a": ["Courtney Starrett", "Susan Reiser", "Tom Pacio"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203087", "abs": "Data materialization is a workflow developed to create 3D objects from data-informed designs. Building upon traditional metalwork and craft, and new technology's data visualization with generative art, this workflow expresses conceptually relevant data through 3D forms which are fabricated in traditional media. The process allows for the subtle application of data in visual art, allowing the aesthetic allure of the art object or installation to inspire intellectual intrigue. This paper describes the technical and creative process of Modern Dowry, a silver-plated 3D-print teapot on view at the Museum of the City of New York, June 2017--June 2018."}, {"v": "", "img": "", "t": "Digital heritage", "a": ["Nicolas Henchoz", "Allison Crank"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203089", "abs": "To revive the Montreux Jazz Festival's archival live-concert footage, three immersive installations were designed using three different principles of augmentation, physicality and interaction. The primary aim was to engage the user in a new relationship with digitized heritage. Audience observations indicated a strong emotional connection to the content, the artist and the crowd, as well as the development of new social interactions. Experimentation showed close interaction between the three principles, while the three installations suggested methodologies for reviving audio-visual archives."}, {"v": "", "img": "", "t": "Entropy and fatfinger", "a": ["Daniel Temkin"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203083", "abs": "Coding, the translating of human intent into logical steps, reinforces a compulsive way of thinking, as described in Joseph Weitzenbaum's \"Science and the Compulsive Programmer\" (1976). Two projects by the author, Entropy (2010) and FatFinger (2017), challenge this by encouraging gestural approaches to code. In the Entropy programming language, data becomes slightly more approximate each time it is used, drifting from its original values, forcing programmers to be less precise. FatFinger, a Javascript dialect, allows the programmer to misspell code and interprets it as the closest runnable variation, strategically guessing at the programmer's intent."}, {"v": "", "img": "", "t": "Here and now", "a": ["Brittany Myburgh"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203088", "abs": "Examining the use of new media in works by Ruben Komangapik, Kent Monkman and the Wikiup Indigenous Knowledge Network reveals the diverse ways in which technologies are used to disrupt linear time and Western visions of history. New media works challenge those misleading stories that have been told about Canada's indigenous peoples and assert indigenous presence in both the digital and physical landscape. These artists employ QR codes, video and augmented reality to push artistic boundaries and create representations of the past and present."}, {"v": "", "img": "", "t": "Holojam in wonderland", "a": ["David Gochfeld", "Corinne Brenner", "Kris Layng", "Sebastian Herscher", "Connor DeFanti", "Marta Olko", "David Shinn", "Stephanie Riggs", "Clara Fernández-Vara", "Ken Perlin"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203091", "abs": "Holojam in Wonderland is a prototype of a new type of performance activity, \"Immersive Mixed Reality Theater\" (IMRT). With unique and novel properties possessed by neither cinema nor traditional theater, IMRT promises exciting new expressive possibilities for multi-user, participatory, immersive digital narratives. The authors describe the piece, the technology used to create it and some of the key aesthetic choices and takeaways."}, {"v": "", "img": "", "t": "Inhabitat", "a": ["Haru Hyunkyung Ji", "Graham Wakefield"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203086", "abs": "Inhabitat is a mixed-reality artwork in which participants become part of an imaginary ecology through three simultaneous perspectives of scale and agency; three distinct ways to see with other eyes. This imaginary world was exhibited at a children's science museum for five months, using an interactive projection-augmented sculpture, a large screen and speaker array, and a virtual reality head-mounted display. This paper documents the work's motivations and design contributions, along with accounts of visitors' playful engagements and reflections within the complex interconnectivity of an artificial nature."}, {"v": "", "img": "", "t": "Reconstructing \"sketchpad\" and the \"coons patch\"", "a": ["Daniel Cardoso Llach"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3205925", "abs": "\"Archaeology of CAD\" is an ongoing project that examines the origins of Computer-Aided Design by bringing to life some of its pioneering technologies, which were central to re-shape design practices in the image of computation during the second half of the twentieth century. On display at SIGGRAPH will be two interactive installations from this project: the reconstructions of Steven A. Coons's \"Coons Patch\" and of Ivan Sutherland's \"Sketchpad.\" Drawing from primary archives and oral sources, these interactive installations playfully revisit these transformative technologies from the 1960s, and enable visitors to approximate the experience of designing with the first Computer-Aided Design systems. Developed with computational design students at Carnegie Mellon University using present-day hardware and software languages, these reconstructions are inquisitive artifacts of historical inquiry. By evoking the embodied experience of interacting with these technologies, they shed light on the new forms of human-machine work that emerged with the rise of interactive computing during the Cold-War years, and highlight the sensual and gestural dimensions of the \"computer revolution.\" Along with the two reconstructions, a selection of rare handwritten notes and documents by Coons, and a selection of key contractual documents between the US Air Force and MIT, are displayed to offer glimpses of the institutional and intellectual context that motivated these foundational technologies of computational design."}, {"v": "", "img": "", "t": "Robotype", "a": ["Yuichiro Katsumoto"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3203079", "abs": "Humans use letters, which are two-dimensional static symbols, for communication. Writing these letters requires body movement as well as spending a certain amount of time; therefore, it can be demonstrated that a letter is a trajectory of movement and time. Based on this notion, the author conducted studies regarding multidimensional kinetic typography, primarily using robots to display a letter and visualize its time and movement simultaneously. This paper describes the project background and design of the three types of robotic displays that were developed and discusses possible expressions using robotic displays."}, {"v": "", "img": "", "t": "The computational imagination", "a": ["Matthew Allen"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3264556", "abs": "Should we see the early development of computer-aided design as an aesthetic movement? Just as eighteenth-century England had picturesque gardens and the world of social media today has spawned its own universe of visual conventions (to take two examples at random), was there such a thing as a \"computational aesthetics\" some 50 years ago? These are questions not about \"computer art\" per se, but about how a new visual culture might emerge alongside new practices and new concepts. They are particularly tricky questions to ask of early computational images because such images come from an era when people were eager to frame their work as scientific research, and aesthetics was often ruled out of bounds."}, {"v": "", "img": "", "t": "The future is indigenous", "a": ["Jason Edward Lewis", "Skawennati"], "c": "SIGGRAPH", "y": 2018, "k": "Art Papers", "doi": "10.1145/3202918.3264555", "abs": "We started reading science fiction as teenagers. We fell in love with the fantastic worlds, the strange societies, the alien cultures and the amazing technologies. As we got older, though, we began to notice the lack of Native people in those futures. In fact, there were barely any nonwhite people at all."}, {"v": "", "img": "thumbs/b98cd207e11f.jpg", "t": "Being, nothing more", "a": ["Jason J. Ferguson"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282821", "abs": "My submission for the SIGGRAPH 2018 Art Gallery relates directly to the conference theme Crossover, and more specifically, to the sub-theme of Overlap. In the call for submissions, Overlap is described as \"A state in which two organisms connect and share common ground on contexts, medium and/or aesthetics.\" My project draws connections between my body and an inanimate found rock. My project entitled \"Being, nothing more\" presents the volume of my body (i.e. 5,616.188 cubic inches found using air displacement plethysmography) reimagined as a CNC milled boulder that occupies the same amount of physical space. A small rock, only a few inches across, was 3D scanned then scaled to 5,616.188 cubic inches using Meshmixer. The mesh was then modified, sliced into 1 inch layers, and 2-sided 3D CAM was developed using Fusion 360. I used a Shopbot to mill the parts from polystyrene and reassembled the large volume. The final form was sealed with a thin coat of epoxy and the piece was painted using color-shifting auto paint."}, {"v": "", "img": "thumbs/f77db13fc25e.jpg", "t": "CD prayer", "a": ["Yuichiro Katsumoto"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282808", "abs": "The compact disk (CD) used to be a symbol of the multimedia era, but it has since become the latest out-of-date media. Most people listen to music via the Internet, not physical media. But it is quite sad to forget the media that we once loved. That's why I began to make a Buddha statue. CD Prayer is a portable CD player that prays for the obsolete media. It revives a CD as a halo of Buddha and plays hi-fi music for us. CD Prayer was created by editing the 3D data shared by Yahoo JAPAN under Creative Commons license (CC-BY-3.0). The edited 3D data is also shared at Thingiverse.com, because remix, share, and tribute are an integral part of music culture and Buddhism."}, {"v": "", "img": "thumbs/8ecbb3ed7cc5.jpg", "t": "Data stones", "a": ["Peter Nelson"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282819", "abs": "A mountain and a stone:"}, {"v": "", "img": "thumbs/36ff28b9bb31.jpg", "t": "Deer calling", "a": ["Yuto Hasebe"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282810", "abs": "This string instrument generates its tone through the tailoring of strings along the unique shape of a deer's antlers. Its tone may resound the howling roar of the very lord of nature. The antlers came from a deer who was hunted down by a local hunter and bequeathed to me. In Japan, one often hears of how damaging deer can be, but they are one of god's messengers."}, {"v": "", "img": "thumbs/7a2af6a85f93.jpg", "t": "Digital being", "a": ["Taezoo Park", "Joohee Park"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282811", "abs": "\"DIGITAL BEING\" is an invisible and formless creature born from detritus of discarded and forgotten technologies after digital switchover. It reveals itself through an atypical movement and an interaction according to the machinery that it dominates."}, {"v": "", "img": "thumbs/5f3ae9560025.jpg", "t": "Eclipse", "a": ["Lee Arnold"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282814", "abs": "Eclipse is a 1 minute continuously looped animation in which overlapping moire patterns create a visual and sonic eclipse. The work intentionally changes depending on the format, scale and streaming limitations, and attempts to address the aesthetics of compression and how technology delimits visual and sonic experience."}, {"v": "", "img": "thumbs/7ab77bc0bd6f.jpg", "t": "Eve of dust", "a": ["John McCormick", "Adam Nash", "Stephanie Hutchison"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282807", "abs": "Eve of Dust is a collaborative performance and installation between a human and a robot. The artwork draws on both the possibilities and anxieties arising from the collaboration between humans and emerging intelligent systems personified in the robot. The artwork uses a Sawyer collaborative robot, an articulated 7-jointed robot arm that somewhat resembles a snake. The robot is able to be used in close proximity to humans, unlike most industrial robots, and will stop before causing physical harm. This enables human partners to physically interact with the robot to co-create a performance of dance and music."}, {"v": "", "img": "thumbs/3334eebd9143.jpg", "t": "Genomix Mask", "a": ["Pat Pataranutaporn", "Bank Ngamarunchot"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282820", "abs": "In modern society, human had developed sociotechnological systems to control major parts of their lives as well as the environments they live in. The mental model that ?we? are not part of the wild natural world, but rather a world that we designed and hacked, makes possibility for human to savagely exploit nature as commodities. After the idea of capitalism was established, capital and its accumulation was a center of the world-system. Donna Haraway, the world renowned feminine cyborg scholar proposed a solution ?to stay with the trouble and make kin with nature? bringing human back to be a part of nature are necessity, but it surely is not a smooth pathway. We must face monstrous reactions during this becoming epoch. Whether we agree or disagree with this proposal, the urgency of environmental crisis and alienated roles of human from nature are inevitable. Genomix interpreted ?making kin? as the act of infusing of interspecies genome of humankind and other organisms together (i.e. iguana, monitor, virus, and octopus). Genomix is a collection of masks generated by the collaboration between Artificial intelligent (AI), and human using the genomic data from species that represent the four epochs of the world: Anthropocene, Capitalocene, Plantationocene, and Chthulucene. This collection deliberates on the interplays between technologies, nature and humankind by fusing and visualizing the hybrid biological identities through algorithmic expression. Ironically, to reconcile between human and nature, we need help from an AI. The Deep Learning algorithm learns the heat-map of DNA as well as the biological surface of the organism, and then generates many infused patterns that we can use to recompose as a mask. The masks expressed the tensions that the idea of ?making kin with nature? is an unthought of ours as the machine become the aesthetics catalyst that combine human with nature."}, {"v": "", "img": "thumbs/889d5e1a3106.jpg", "t": "HBG", "a": ["Yuk Yiu Ip"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282809", "abs": "Inspired by the works of the Chinese literary master Qian Zhongshu, HBG: Humans, Beasts and Ghosts is an experimental video game, a playable life simulator in which the player, assuming the role of God, facilitates the everyday being of the different worlds inhabited by humans, beasts and ghosts. The player can choose to act as an interventionist God, creating and destroying whimsically, or simply watching the worlds unfold with minimal or no interference."}, {"v": "", "img": "thumbs/e2e38a7858f2.jpg", "t": "Memoirs of the blind", "a": ["Tomas Laurenzo"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282817", "abs": "Memoirs of the blind is an interactive installation consisting of a screen showing a black-and-white picture of a face with its eyes closed. This image at first remains still, however, when the interactor blinks, the installation detects it and takes a photo at the exact time of the blinking. Once the new face is obtained, it is processed (cropped, turned into b&w, and adjusted) and then it substitutes the displayed face."}, {"v": "", "img": "thumbs/6f2845db9f2d.jpg", "t": "Nebula III", "a": ["Dennis Del Favero"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282815", "abs": "Dennis Del Favero's collaborative research program comprises work across the fields of art, humanities, engineering and science, exploring the theorisation of interactive aesthetics and its application in intelligent visualisation systems. Nebula III explores emergent aesthetic of Georg Buchner, the 19th German dramatist and scientist. This aesthetic is characterised by its emergent dialogic spatial aesthetics, namely its approach to space as a two relationship between things where it is not simply a linear connections between entities. It foreshadows the aesthetics of Karen Barad, the contemporary theoretical physicist and philosopher who conceived of the concept of 'intra-action' to conceptualise how all spatial matter never pre-exists, but is always shaped and formed through the interactive relationships between its constitutive elements. Using this intra-active spatial aesthetic as its inspiration, Nebula III presents a 3D particle world that explores this notion of space as constructed through intra-action. Here 3D particles, while displaying elementary clustering spatial behaviour, are simultaneously single-minded and resistant to control. The user, by controlling an onscreen ball of light through the use of a tablet, can learn to assemble the particles. Gradually, depending on the user's ability to control the particles, the particles are attracted to the light, like moths to a bulb. On successfully assembling all the particles, a particle sphere emerges from the clustered particles, then dissolves into one of a series of different spatial worlds, depending on how the user interacted with the particles --- a rotating planet, a mountainscape, falling snow and a storm."}, {"v": "", "img": "thumbs/3e63fe5d64af.jpg", "t": "Radioactive live soundscape", "a": ["Hiroki Kobayashi", "Hiromi Kudo", "Yuta Sasaki"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282813", "abs": "To understand the effects of the nuclear accident, long-term and wide-range monitoring of the effects of nuclear radiation on animals is required in Fukushima. For monitoring such species, counting the recorded calls of animals is considered an effective method to investigate the wildlife. The sounds of singing birds, buzzing insects, swaying leaves, and trickling water in a beautiful forest implicitly imprints the diversity of organism in the forest. However, it is difficult to use information devices in the exclusion zone as these areas do not have infrastructure services and necessary to develop a monitoring system capable of operating over multiple years in unmanned conditions. The project distributes the soundscape in the zone to the public via the Internet. A microphone has been placed at the entrance to a forest in the exclusion zone (37° 28′ 04.3″ N, 140° 55′ 27.5″ E), 10 km away from the Fukushima Nuclear Power Plant. This allows us to hear the soundscape from this location in real time. This project started with a year of literature search (2011), fundraising with government approval (2012-2014), and the installation of a transmitter station with satellite Internet (2015). Finally, based on official preparations and approvals, a local electric company agreed to sign a service contract with us in an intensive feasibility survey of the all transmission facilities of the location. The final construction was completed by the end of March in 2016. This project aims to watch over the lives that will come to an end in the near future and the new lives that appearing after humans left this place on 11.3.2011. Prior to this project, we had experience in operating a similar system for more than 10 years. Therefore, it is possible to operate this project until the reactor decommissioning work has been completed until approximately 2030."}, {"v": "", "img": "thumbs/990e7833c371.jpg", "t": "The Ising model", "a": ["George Legrady"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282812", "abs": "Blinkand \"Polyptelic\" are software generated animations that consist of a matrix of cells that transition between 2 states, taking stock of their neighbors' actions. The process goes back and forth between states of stability where all cells try to be like their neighbors, and states of transition where the cells know their neighbors' state but cant decide if they should be like them or not. A certain degree of deviance is programmed so that some of the cells resist or differ from the general status quo of the collection. The status of the overall image is dynamically determined computationally in realtime and therefore guarantees a continuous stream of behavior based on the interaction of the cells."}, {"v": "", "img": "thumbs/b18a4c31ff58.jpg", "t": "Untitled (head piece)", "a": ["Wing Hong Tung"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Gallery", "doi": "10.1145/3282805.3282816", "abs": "Combining video in a CRT TV with physical movement to represent a state of human existence. Unlike Brâncuşi's Sleeping Muse which aims to create the most ideal form, the imperfect form of human body placing in an artificial container reveals the condition of our contemporary existence."}, {"v": "", "img": "", "t": "That torch is now in our hands", "a": ["Maurice Benayoun", "Xiao Wang"], "c": "SIGGRAPH Asia", "y": 2018, "k": "Art Papers", "doi": "10.1145/3282805.3282818", "abs": "On February 28, 2016, Donald Trump gave his first address to Congress. He sent a clear message that enlightens his Presidential philosophy: \"Each American generation passes the torch of truth, liberty and justice --- in an unbroken chain all the way down to the present. That torch is now in our hands. And we will use it to light up the world.\" \"That Torch is Now in Our Hands\" is an interactive installation made of 2 parts: - A model of the Statue of Liberty holding the torch. This torch is the main light of the space, up to 5 public address speakers surround the statue (the number commensurate to the exhibition space size). The loudspeakers diffuse the excerpts of the U.S. President talk. The statue light reacts to the sound: the light intensity is stronger when nobody is speaking, and it becomes lower when Trump's voice is heard. The higher the voice, the lower the light. The statue is like a bird, covered with feathers. We understand quickly that the feathers are just glued with tar. In an extended version, we can imagine 5 fans making feathers flying like a tornado around the statue, full Trump's address: https://youtu.be/3ZxsuGEL6yE (after 7')"}, {"v": "", "img": "thumbs/4edcc4408b68.jpg", "t": "Anti-horário", "a": ["Gisela Motta", "Leandro Lima"], "c": "SIGGRAPH", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3072940.3080507", "abs": "Anti-Horário (Counterclockwise) (2011) is a video installation, and a \"wall-clock,\" that addresses the cyclical movement of human existence and the poetics of duration and perception. Anti-Horário combines several layered elements (the earth, a child, an adult couple, and the sky) moving at distinct cadences, registered from the same point of view that results in a disorienting analogic clock. While the child covers a circular movement like the clock's second hand, the adults represent the minute hand. With each revolution, the child causes the couple to move foward, representing the passage of time as well as the cycle of life."}, {"v": "", "img": "thumbs/6c901b5459a5.jpg", "t": "BioSoNot 1.2", "a": ["Gilberto Esparza"], "c": "SIGGRAPH", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3072940.3080500", "abs": "BioSoNot 1.2 (2014--2016) is a musical synthesizer that translates biological activity into sound while cleaning contaminated water samples. A hybrid bio-sound instrument, this sonic device generates music and noise from the biological activity of different living microorganisms."}, {"v": "", "img": "thumbs/51550ebcb667.jpg", "t": "Dispersiones", "a": ["Leo Nuñez"], "c": "SIGGRAPH", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3072940.3080509", "abs": "Dispersiones (Dispersions) (2012/2017) is a site-specific physical network comprised of a series of interconnected relays that produce an artificial and interactive soundscape. The work appears to be a messy web of hundreds of tangled wires through which sounds travel, following an algorithm of artificial life. Using only the metallic clicking sound of the relays, the network behaves as a complex system of electromagnetic actuators that interact with the viewer."}, {"v": "", "img": "thumbs/666f74f89771.jpg", "t": "drumCircle[]", "a": ["Christian Oyarzún"], "c": "SIGGRAPH", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3072940.3080508", "abs": "drumCircle[] (2015) is an autonomous percussion and light instrument composed of an ensemble of eight connected den-den drums mounted to LED spotlights that create a temporal and spatial network of interactions between these machines and the viewer. Arranged in a circle pointing inward toward the center of the installation, these modules project light and sound patterns bidirectionally, creating an immersive and ritualistic technological experience that brings to light connections between technology, corporeality, and time."}, {"v": "", "img": "thumbs/e192321c7f35.jpg", "t": "Echolocalizator", "a": ["Hamilton Mestizo"], "c": "SIGGRAPH", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3072940.3080502", "abs": "Echolocalizator (2015) is a wearable device that aims to change or augment our human way of interacting with the environment. Using \"sound spatialization,\" this technological helmet simulates the echolocation sonar used by animals like bats and dolphins, highlighting the essential role of technology in the coevolution of humans and animals."}, {"v": "", "img": "thumbs/fe6acd82b24d.jpg", "t": "Imaginario inverso", "a": ["Astrovandalistas"], "c": "SIGGRAPH", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3072940.3080504", "abs": "Imaginario Inverso (Reverse Imaginary) (2015/2017) is part of Astrovandalistas's ongoing investigation into the industrialization of our social imaginary through the commercialization of scientifc knowledge. Through a series of workshops, talks, and exhibitions using conceptual prototyping, futurecasting, reappropriations, and micronarratives, Imaginario Inverso proposes different frameworks for reflecting on the geopolitics of technology development and the reinterpretation of technologies for more personal uses."}, {"v": "", "img": "thumbs/87067fd47681.jpg", "t": "JailHead.com", "a": ["Rodolfo Peraza"], "c": "SIGGRAPH", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3072940.3080506", "abs": "That Which Contains Emptiness is a series of multimedia works by Rodolfo Peraza exploring the interiors of abandoned historical spaces designed for social engineering and control. From this series, JailHead.com (2009/2017) is an ongoing web-based project that recreates in virtual reality the Cuban Presidio Modelo, an abandoned prison built after Bentham's Panopticon penitentiary model. The jail is located on the former Isla los Pinos---an island southwest of Cuba, now named Isla de la Juventud---and was considered a definitive example of efficient prisoner control. It became emblematic for housing historical figures both pre- and post-Cuban Revolution, including Fidel and Raúl Castro."}, {"v": "", "img": "thumbs/5c548a377a48.jpg", "t": "Milpa Polímera", "a": ["Marcela Armas", "Arcángelo Constantini"], "c": "SIGGRAPH", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3072940.3080501", "abs": "Milpa Polímera (Polymer Cornfield) (2013) is a 3D open-source printer modified to function as a tractor that plows seeds made out of polylactic acid (PLA), a thermoplastic biopolymer made from corn. The printer-tractor is fixed by an axis to a closed cycle in which the machine is only able to perform a single repetitive and absurd task: print artificial corn seeds and sow them into the soil."}, {"v": "", "img": "thumbs/6db938df925c.jpg", "t": "Octópodos sisíficos", "a": ["Mariela Yeregui", "Miguel Grassi"], "c": "SIGGRAPH", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3072940.3080505", "abs": "Developed by the Artes Electrónicas group at the Universidad Nacional de Tres de Febrero in Argentina, directed by Mariela Yeregui, Octópodos Sisífcos (Sisyphean Octopods) (2010) is an installation comprised of six mobile robots that carry LCD screens displaying endoscopic videos with images that resemble internal body organs."}, {"v": "", "img": "thumbs/963015e493d1.jpg", "t": "The andean pavilion", "a": ["Paul Rosero Contreras"], "c": "SIGGRAPH", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3072940.3080503", "abs": "The Andean Pavilion (2015/2017) is a video installation composed of a series of fictional videos and 3D-printed sculptures, which are the material outcome of the seismic activity in four active volcanoes in the highlands of Ecuador and the Galápagos Islands. This project is part of an experimental inquiry speculating on the possibility of emergent relations between the environment, humans, and technology in settings that are heavily defined by natural phenomena."}, {"v": "", "img": "", "t": "Antecedents", "a": ["María Fernández"], "c": "SIGGRAPH", "y": 2017, "k": "Art Papers", "doi": "10.1145/3072940.3105451", "abs": "For the first time in its history, SIGGRAPH focuses on Latin American artists working with digital technologies. This is momentous, as this subject has seldom been explored---neither in the history of new media art nor in the entire history of art---despite the tremendous growth of these fields in the last 20 years. The insufficiency of study in this area has to do in part with the historical tension between digital art and the art world, and with totalizing stereotypes of Latin American underdevelopment that perpetuate the marginalization of the region from modernity [1]. While the SIGGRAPH 2017 Art Gallery critically advances these histories, a multiplicity of inventive engagements of Latin American artists with a variety of modern technologies precedes it. Hence the exhibition is both unique and in conversation with a long tradition."}, {"v": "", "img": "", "t": "Autoencoding Blade Runner", "a": ["Terence Broad", "Mick Grierson"], "c": "SIGGRAPH", "y": 2017, "k": "Art Papers", "doi": "10.1145/3072940.3072964", "abs": "In this paper, the authors explain how they created Blade Runner---Autoencoded, a film made by training an autoencoder---a type of generative neural network---to recreate frames from the film Blade Runner. The autoencoder is made to reinterpret every individual frame, reconstructing it based on its memory of the film. The result is a hazy, dreamlike version of the original film. The authors discuss how the project explores the aesthetic qualities of the disembodied gaze of the neural network and describe how the autoencoder is also capable of reinterpreting films it has not been trained on, transferring the visual style it has learned from watching Blade Runner (1982)."}, {"v": "", "img": "", "t": "Avoid setup", "a": ["Dejan Grba"], "c": "SIGGRAPH", "y": 2017, "k": "Art Papers", "doi": "10.1145/3072940.3072968", "abs": "Generative artists engage the poetic and expressive potentials of film playfully and efficiently, with explicit or implicit critique of cinema in a broader cultural context. This paper looks at the incentives, insights, and implications of generative cinema, which significantly expands the creative realm for artists working with film, but also incites critical assessment of the business-oriented algorithmic strategies in the film industry. The poetic divergence, technical fluency, and conceptual cogency of generative cinema successfully demonstrate that authorship evolves toward ever more abstract reflection and cognition which equally treat existing creative achievements as inspirations, sources of knowledge, and tools."}, {"v": "", "img": "", "t": "Creature:interactions", "a": ["Andrew Bluff", "Andrew Johnston"], "c": "SIGGRAPH", "y": 2017, "k": "Art Papers", "doi": "10.1145/3072940.3072965", "abs": "This paper discusses Creature:Interactions (2015), a large-scale mixed-reality artwork created by the authors that incorporates immersive 360° stereoscopic visuals, interactive technology, and live actor facilitation. The work uses physical simulations to promote an expressive full-bodied interaction as children explore the landscapes and creatures of Ethel C. Pedley's ecologically focused children's novel, Dot and the Kangaroo. The immersive visuals provide a social playspace for up to 90 people and have produced \"phantom\" sensations of temperature and touch in certain participants."}, {"v": "", "img": "", "t": "Lenticular waterwheels", "a": ["Scott Hessels"], "c": "SIGGRAPH", "y": 2017, "k": "Art Papers", "doi": "10.1145/3072940.3072966", "abs": "After decades as a novelty, lenticular technology has resurfaced in compelling large-scale projects. Without any required energy, the medium offers stereography without glasses and frame animation without electronics. A kinetic artwork installed in a remote river in the French mountains broke from the technology's previous restrictions of static and flat display, recalculated the print mathematics for a curved surface, and explored narrative structures for a moving image on a moving display. This paper documents how the sculpture used custom steel fabrication, site-specific energy, and revised lens calculation to present a previously unexplored hybrid of animation."}, {"v": "", "img": "", "t": "The interactive image", "a": ["Esteban García Bravo", "Andrés Burbano", "Vetria L. Byrd", "Angus G. Forbes"], "c": "SIGGRAPH", "y": 2017, "k": "Art Papers", "doi": "10.1145/3072940.3072969", "abs": "This paper examines the history of the influential Interactive Image computer graphics showcase, which took place at museum and conference venues from 1987 to 1988. The authors present a preliminary exploration of the historical contexts that led to the creation of this exhibition by the Electronic Visualization Lab (EVL), which included the integrated efforts of both artists and computer scientists. In addition to providing historical details about this event, the authors introduce a media archaeology approach for examining the cultural and technological contexts in which this event is situated."}, {"v": "", "img": "", "t": "Transforming the commonplace through machine perception", "a": ["Robert Twomey", "Michael McCrea"], "c": "SIGGRAPH", "y": 2017, "k": "Art Papers", "doi": "10.1145/3072940.3072967", "abs": "Rover is a mechatronic imaging device inserted into quotidian space, transforming the sights and sounds of the everyday through its peculiar modes of machine perception. Using computational light field photography and machine listening, it creates a kind of cinema following the logic of dreams: suspended but mobile, familiar yet infinitely variable in detail. Rover draws on diverse traditions of robotic exploration, landscape and still-life depiction, and audio field recording to create a hybrid form between photography and cinema. This paper describes the mechatronic, machine perception, and audio-visual synthesis techniques developed for the piece."}, {"v": "", "img": "thumbs/4307b6798b67.jpg", "t": "(A)I FEEL", "a": ["Kiattiyot Panichprecha", "Witaya Junma", "Isarun Chamveha"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143754", "abs": "(A)I FEEL is a project to demonstrate how machines learn human emotions by creating a teaching & learning process between humans and machine to analyze human drawing and visualize the drawing in an intuitive and exciting way."}, {"v": "", "img": "thumbs/b3edf43b4b46.jpg", "t": "7x7", "a": ["Yuichiro Katsumoto"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143751", "abs": "We live surrounded by displays such as TV, smartphone, computer. These bitmap displays consist of pixels arranged in a two-dimensional plane. 7x7 was created by re-arranging these pixels multidimensionally. This display consists of 49 pixels, and these pixels do not overlap in the front, at the back, up, down, left or right. Therefore, each pixel is able to represent all six directions. By using these 49 pixels, 7x7 expresses \"Iroha,\" which is an old Japanese pangram that expresses one of the aesthetics called \"Mujo (impermanence and ever changing).\""}, {"v": "", "img": "thumbs/971dbe3a483d.jpg", "t": "Abstract reality", "a": ["Jieliang Luo"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143755", "abs": "Abstract Reality is an interactive installation to create 3D geometric structures as an abstract expression of physical human bodies that the viewers' physical features and their relations to each other and the physical space are transformed into geometric forms and placed in a virtual 3D space, which aims to project the real world into a denoised and human-centered virtual world to connect body and mind through indirect coordinations."}, {"v": "", "img": "thumbs/aab384a0d30c.jpg", "t": "Embodisuit", "a": ["Sophia Brueckner"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143759", "abs": "The Embodisuit empowers its wearer to map signals from an IoT platform to modular haptic actuators on the body simultaneously critiquing and offering an alternative to current trends in wearable technology."}, {"v": "", "img": "thumbs/f627bf235a6b.jpg", "t": "etheroid", "a": ["Jun Fujiki"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143749", "abs": "An etheroid is a device that mediates an invisible \"something\" to exist in space. Each etheroid propagates this behavior to one of the surrounding etheroids repeatedly. From the movements of a whole etheroids, an invisible and movable \"something\" appears."}, {"v": "", "img": "thumbs/4528730df5b3.jpg", "t": "Face of city", "a": ["Jae Hyung Lee", "Jung Min Park"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143761", "abs": "Face of City is a data visualization project portraying emotions in cities. The representative emotions of a city are selected through the thorough analysis of social media posts within a particular area. Then these emotions are visualized through constantly changing ambiguous facial expressions. This exhibition features the facial expressions of Seoul and Bangkok, based on respective analysis results on the same social media keywords."}, {"v": "", "img": "thumbs/928d3a3c457a.jpg", "t": "from this side of space to the other side of the signal", "a": ["Benjamin Rosenthal"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143756", "abs": "\"from this side of space to the other side of the signal\" is a two-channel piece that engages both the history of early video tools and contemporary forms of 2D and 3D animation. Using these analog tools as a way of addressing the historicity of the body, and as a way of defining the space of bodies (via their moving textures) in novel as a way of engaging our contemporary hybrid experience. Queering the distinctions between subject, object, transmission, physicality and the ephemeral larger questions about the nature of our technocultural existence rise to the surface."}, {"v": "", "img": "thumbs/6edde1a98f50.jpg", "t": "HIVE", "a": ["Sölen Kiratli", "Akshay Cadambi"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143765", "abs": "Created via fusing aspects of sculptural form, spatial sound, and interactive methods, HIVE is an art installation that explores the relationship between sound, space, body, and communication. HIVE was produced in 2016 by Sölen Kiratli and Akshay Cadambi and debuted in Santa Barbara Center for Art, Science, and Technology (SBCAST) in December of 2016. More info on http://solenk.net/HIVE.php"}, {"v": "", "img": "thumbs/c117598f8b44.jpg", "t": "I touch you and you touch me", "a": ["Jeff Thompson"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143753", "abs": "A robotic arm plays back hallucinated gestures from a machine learning system trained on my interactions with my phone, exploring issues of human/machine empathy and agency."}, {"v": "", "img": "", "t": "Langjiao", "a": ["Shin-Yu Wu"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143758", "abs": "Langjiao - Beinan Road discusses the human perspective, where we use our eyes to see the world in front of us, whereas the sounds we hear with our ears come from the two sides of us. In this work, viewers can switch from the human perspective to see the world from two sides through the eyes of the hundred-pace viper, and experience the wonder of the merging of your auditory and visual perception. This psychological landscape created using the VR device not only takes us back along the path once taken by the ancestral spirit of the indigenous people."}, {"v": "", "img": "thumbs/1c2807af9203.jpg", "t": "Mantra", "a": ["Hwayong Jung"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143764", "abs": "Mantra is a digital panorama that represents hyper-realistic landscape with the collapse of body language and sound generated from digital object and human are permitted into the digital scenario, and gives birth to the new cycle of synthetic beauty. Inside of endless communication between them, a new experiential form of vision."}, {"v": "", "img": "thumbs/efca5f16c597.jpg", "t": "Record one message to the person you love!", "a": ["Sheng-Chieh Wang", "Chia-Hsiang Lee", "Pey-Chwen Lin"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143763", "abs": "We invite the audience to stand in front of the voice reception installation and say a few words to their loved ones.he messages can also be immediately converted into 3D printing model files, which can then be printed into unique white vinyl disc-shaped objects engraved with each person's own identity markings. Audience will be able to use the AR interface on the mobile device to replay the messages and videos corresponding to each of the 3D prints."}, {"v": "", "img": "thumbs/3d23f2cfb9a2.jpg", "t": "Remnance of form", "a": ["Sang-won Leigh", "Asta Roseway", "Ann Paradiso"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143762", "abs": "Through several vignettes - Disappearing, Showing Fear, Many Faces, and Dream of Flying, a transforming shadow deconstructs the notion of materialistic view of the physical world as well as offers to become a surrogate for channelling the images and imaginations about one's own self."}, {"v": "", "img": "thumbs/823326f33138.jpg", "t": "Robosophy philosophy", "a": ["Predrag K. Nikolic", "Sasa Arsovski", "Adrian David Cheok"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143752", "abs": "Project Robosophy Philosophy is conceptualize as set of philosophical discussions between two robots. The Robots are imitating philosophers and leading their discussion to complete meaningless or meaningful based on knowledge build by artificial intelligence. In the Robosophy Philosophy: Übermensch and Magnanimous conceptual pillars for the discussions are philosophical stand points of Aristotle and Nietzsche. We are combining chatbot technologies and Recurrent Neural Network (RNN) models that will enable reinforcement learning in order to create artificial conversational agents who will achieve human level performance."}, {"v": "", "img": "thumbs/6ebda3fdffb0.jpg", "t": "The ghost in the dandelion", "a": ["Scottie Chih-Chieh Huang"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143760", "abs": "\"the Ghost in the Dandelion\" is an interactive installation features a physiological measuring device with facial recognition technology. The biosensor is able to analyze the facial expressions and heartbeat signals and convert them to the form of dandelion."}, {"v": "", "img": "thumbs/78534ee16717.jpg", "t": "Wandering world", "a": ["Peter Williams", "Sala Wong"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Gallery", "doi": "10.1145/3143748.3143750", "abs": "Wandering World is an interactive installation that utilizes responsive sound, stereoscopic and multichannel projection mapping, three-dimensional, 360-degree animation and helium balloons with whirling images of flowers in suspended states of bloom, representing a desperate and self-defeating attempt at obliterating our perpetual states of distraction."}, {"v": "", "img": "", "t": "Mind dome", "a": ["Chawanan Inkumnoi"], "c": "SIGGRAPH Asia", "y": 2017, "k": "Art Papers", "doi": "10.1145/3143748.3143766", "abs": "Mind dome is a lighting installation art in a form of LED globe. Computer generates movement, color and shape into digital signal, from analog to digital. Participant feel connect to the dome, as their mind and body is part of the mind dome."}, {"v": "", "img": "thumbs/889a4ba4a659.jpg", "t": "Crime scene", "a": ["Mogens Jacobsen"], "c": "SIGGRAPH", "y": 2016, "k": "Art Gallery", "doi": "10.1145/2897843.2915198", "abs": "The internet has enabled us to accomplish so many things. The universal appeal and power of the internet to change and augment our daily lives is both undeniable and inevitable. Every day we go online and consume endless amounts of media---audio, video, text, interactive experiences---that can be electrifyingly fun, educational, or a waste of time. Although a vast amount of information is available to us online, not all of it is free or legal to use without some sort of licensing agreement or pay-per-use model. Most of the bigger utility-like companies, such as Google, Yahoo, and Facebook, give away their online services for free; but when it comes to content created by professional companies, such as television studios, app creators, music or movie studios, there is a price that comes along with it. Despite this monetary inevitability, a great deal of data and information travel through the internet illegally, in violation of copyright and intellectual property laws."}, {"v": "", "img": "thumbs/961c02b29b86.jpg", "t": "Facebook demetricator 2012-present", "a": ["Benjamin Grosser"], "c": "SIGGRAPH", "y": 2016, "k": "Art Gallery", "doi": "10.1145/2897843.2915192", "abs": "Networks---especially social networks and news aggregators on the internet, such as Facebook, Vine, Twitter, YouTube, DIGG, and others---rely on numbers to rank and catalog content and status. People interacting online are now using these numbers as a form of \"social currency\" to rate each other based on how many friends they have, how many \"likes\" they earn on their Facebook and Instagram posts, and how many votes of approval they need to sell more products on sites like eBay, Amazon, and Etsy. Illinois-based artist Benjamin Grosser takes these numbers and metrics as a critical starting point: recognizing the self-perpetuating system of numericizing online activity (friends, \"likes,\" comments, votes, etc.), he decided to create an antidote."}, {"v": "", "img": "thumbs/9065e3574666.jpg", "t": "Grafikdemo 2004", "a": ["Niklas Roy"], "c": "SIGGRAPH", "y": 2016, "k": "Art Gallery", "doi": "10.1145/2897843.2915193", "abs": "Virtual spaces and 3D-rendered objects can both be manipulated in on-screen environments and modified by designers in real time. We are now so accustomed to our ability to \"fly through\" these rendered spaces with computer mice or handheld controllers that they have become commonplace. In today's oversaturated media landscape, we often take for granted the fact that virtual objects can coexist with our physical spaces through head-mounted displays. Increasingly, these devices also allow for augmented reality (AR) such as Microsoft's HoloLens [2], Google's Glass [3], and the countless other VR viewers on the market."}, {"v": "", "img": "thumbs/fa25c8512c26.jpg", "t": "Metaphase sound machine 2015", "a": ["Dmitry Morozov"], "c": "SIGGRAPH", "y": 2016, "k": "Art Gallery", "doi": "10.1145/2897843.2915196", "abs": "Russian artist Dmitry Morozov's Metaphase Sound Machine plays off of our increasing dependence on the information and electronic noise that permeates our everyday lives. The project is based on the ideas of American physicist Nick Herbert, who created the Metaphase Typewriter---invented as a quantum device capable of communicating with ghosts---and Quantum Megaphone, a speech synthesis machine [5]. According to Morozov, Herbert's interests also included the mixing of hallucinogenic drugs, paranormal activity, the nature of consciousness, and speculative connections. These early interests contributed to Herbert's desire to design a quantum computer, but they did not confirm any theoretical research. Morozov's piece was inspired by Herbert's work, especially in relation to the amalgam of devices and networks that permeate our daily routines."}, {"v": "", "img": "thumbs/9c2475acc470.jpg", "t": "Pixelbots 2014", "a": ["Tejaswi Digumarti", "Javier Alonso-Mora", "Roland Siegwart", "Paul Beardsley"], "c": "SIGGRAPH", "y": 2016, "k": "Art Gallery", "doi": "10.1145/2897843.2915197", "abs": "In today's digital media landscape, we are constantly surrounded by displays, from the LCDs found on the phones in our pockets to the ubiquitous screens that greet us whenever we enter a store, airport, taxicab, doctor's office, or educational institution. This plethora of displays both allures us and contributes to the media's saturation of our lives. The truth remains that we are never far from the next form of information display. Disney Research's Pixelbots takes this truth as an inevitability and brings the display into a kinetic form, breaking the screen out of the confines of a rectangular or oval experience. Billed as \"Pixels with Personality,\" the Pixelbots' enticing presence rests on our ability to project human qualities onto objects that move as we do in physical space."}, {"v": "", "img": "thumbs/4cb4d3b547fd.jpg", "t": "Plinko Poetry 2012", "a": ["Deqing Sun", "Peiqi Su"], "c": "SIGGRAPH", "y": 2016, "k": "Art Gallery", "doi": "10.1145/2897843.2915191", "abs": "With the plethora of real-time information and news coming from both commercial news sources and individual broadcasters using the internet and Twitter to get their messages across, we seem to have arrived at a backlog of data chaos that is clamoring for order. Plinko Poetry, by Deqing Sun and Peiqi Su, playfully recontextualizes this heavy onslaught of information. The project gets its name from the game of Plinko, introduced in 1983 on the hit American television game show The Price Is Right. In the original game, contestants climbed a staircase and dropped large chips into a game board fitted with hundreds of pegs. The chips would hit the pegs as they fell, sending them off in different directions until they landed at the bottom of the board into one of several slots assigned with different dollar values."}, {"v": "", "img": "thumbs/2feb4a05b482.jpg", "t": "Submergence 2013", "a": ["Anthony Rowe", "Gaz Bushell", "Liam Birtles", "Chris Bennewith", "Oliver Bown"], "c": "SIGGRAPH", "y": 2016, "k": "Art Gallery", "doi": "10.1145/2897843.2915190", "abs": "In a media landscape filled with touchscreens, flat displays, projections, and virtual reality goggles, immersion in a data landscape is a fairly common experience. Simply put on a headset with some form of VR software, and magically be transported to a 360-degree virtual landscape of your choosing. Whether it is a gaming environment, or a virtual instruction manual---complete with technician---to help fix your kitchen sink, virtual spaces are growing daily, along with our ability to engage with them."}, {"v": "", "img": "thumbs/54e4f45acfc5.jpg", "t": "The kinetic story teller 2016", "a": ["Tine Bech"], "c": "SIGGRAPH", "y": 2016, "k": "Art Gallery", "doi": "10.1145/2897843.2915189", "abs": "Social engagement in public space can be an awkward, challenging, and often difficult experience for people unfamiliar with each other or their surroundings. The need for an impartial mediator to connect people is something that artists have been tackling with their work for many years and is still being readdressed daily. This form of intervention allows for people occupying a space to engage in playful and anonymous interaction with others. Creatively speaking, this can take the form of a simple note on the wall that reminds people that others exist around them or a full-scale interactive experience that encourages interaction between people as well as inviting them to play with a system."}, {"v": "", "img": "", "t": "Deletion process_only you can see my history", "a": ["Kyriaki Goni"], "c": "SIGGRAPH", "y": 2016, "k": "Art Papers", "doi": "10.1145/2897843.2915187", "abs": "In light of recent controversies surrounding massive data collection by corporations and government agencies, digital privacy, the right to oblivion, and data ownership have become increasingly important concerns. This paper describes the author's artwork, Deletion Process_Only you can see my history, an interactive art installation based on her eight-year personal search history in the Google search engine. While the personal search history maintains a sense of privacy, according to the company's own declaration, the author reveals this archive to viewers in order to raise awareness and provoke reflection on the aforementioned subjects. The author discusses her motivation, descri

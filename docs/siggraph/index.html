perience that engages the participant in a job interview with ALEX, a powerful artificial intelligence HR employed by a speculative tech giant called \"Open Mind Corporation.\" Through a science-fiction lens, the experience reveals how artificial intelligence (AI) and the gamification of work can be used as subtle tools of control in the interest of those in power."}, {"v": "", "img": "thumbs/cf0be0113036.jpg", "t": "Cangjie’s poetry", "a": ["Weidi Zhang", "Donghao Ren"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457426", "abs": "Cangjie's Poetry is an interactive art installation that provides a conceptual response to the semantic human-machine reality. In the Cangjie's Poetry art installation, an intelligent system constantly observes the surroundings through the lens of a camera, writes poetry using a symbolic system based on its interpretation of the surroundings, and explains the evolving poem in natural language to audiences in real-time. This work prioritizes the ambiguity and tension between machinic vision and human perception, the actual and the virtual, past and present."}, {"v": "", "img": "thumbs/038a9d23dd17.jpg", "t": "Common datum", "a": ["Tobias Klein", "Jane Prophet"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457433", "abs": "The air we exhale is 100% saturated with water. The air in the lungs is essentially saturated with water at 37 C, which is about 44 mg/liter. The average lung capacity of an adult is about 6 liters. Once exhaled, the air cools to the ambient temperature, leaving the air supersaturated. If it is cool enough it will form a visible cloud. When our breath comes in contact with a cold surface, it will leave visible condensation."}, {"v": "", "img": "thumbs/8f906ef2db4a.jpg", "t": "Figure 1", "a": ["Hirad Sab"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457435", "abs": "Figure 1. is a visual essay on the proliferation and mediation of the \"digital body\" in the contemporary politics of images. It is an attempt at locating the virtual body in the processes of production, circulation, and consumption of images concerning continuing computational advancements."}, {"v": "", "img": "thumbs/85e498d9c9ef.jpg", "t": "Hexells: self-organizing textures", "a": ["Alexander Mordvintsev"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457438", "abs": "Hexells is a self-organizing system of cells that was designed to synthesize and maintain various textures through local communication between the cells. It is inspired by natural pattern formations found on plants and animal skins. The cellular automata (CA) update rule is modeled using a small neural network inspired by Mordvintsev et al. [2020]. We created a WebGL demo that allows users to explore and interact with more than one hundred learned CA texture-generating behaviors. The chosen projection shows the system behavior at local and global scales at the same time."}, {"v": "", "img": "thumbs/5de8da1bbd55.jpg", "t": "Isle of reflections", "a": ["Chaeeun Lee", "Myeongseong Kim", "Hyunjung Kim"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457434", "abs": "Isle of Reflections is an interactive lighting installation that can only be remotely explored via videotelephony. Viewers visit the island filled with iridescent lights and colorful reflections through Zoom, a popular web-based video communication tool. When the viewers see the lights and shadows that respond immediately to their voice through the screen, they recognize that they are interacting with a distant physical space in real-time. The viewers move between \"breakout rooms\" in Zoom to explore this virtual island filled with an immersive spectrum of light and color. Each room provides live scenes of the island from different viewing angles."}, {"v": "", "img": "thumbs/7ec045f55bb4.jpg", "t": "Models for environmental literacy", "a": ["Tivon Rice"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457439", "abs": "Models for Environmental Literacy is a series of experimental digital animations combining drone photogrammetry with A.I. generated narratives. These videos creatively and critically explore the challenges of describing a landscape, an ecosystem, or the specter of environmental collapse through human language. The project further explores how language and vision are impacted by the mediating agency of new technologies. How do we see, feel, imagine, and talk about the environment in this post-digital era, when there are indeed non-human/machine agents similarly trained to perceive \"natural\" spaces? This project explores these questions, as well as emerging relationships with environmental surveillance, drone/computer vision, and A.I."}, {"v": "", "img": "thumbs/b745a05b28da.jpg", "t": "Movement in capture", "a": ["Shira Shvadron"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457430", "abs": "Movement in Capture is an environmental visual story presented as an installation of 4 videos that explores the impact of pollution on ocean life. Dancers' movements were recorded with motion capture technology as they identified with marine creatures forced to live in a polluted environment."}, {"v": "", "img": "thumbs/dbf2cbf2f5e6.jpg", "t": "Straightened trees", "a": ["Daniel Temkin"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457431", "abs": "This series features silver gelatin prints of trees shot on large-format film and then straightened with custom code, giving strip malls, telephone poles, and restaurant signs the curves that once belonged to the elms, palms, and oaks they stand beside. It uses media less associated with technology, in part to emphasize algorithmic and human processes rather than technological tools. Using custom code, the natural curvature of each tree is \"corrected.\" Manufactured objects, i.e., buildings and power lines, twist and contort around the artificially plumbed tree. Each photo is shot on large-format film, the only medium that captures enough detail to straighten the tree without pixelly artifacts. Because the trees need to include human-made objects (such as buildings) straight-on, they are often shot from a car's point of view. That aspect, plus the fact that all were shot in North America, emphasizes the classic photographic road trip (e.g., Lee Friedlander's America By Car)."}, {"v": "", "img": "thumbs/42ef793941c4.jpg", "t": "Suga’: a live virtual dance performance", "a": ["Valencia James", "Thomas Wester", "Simon Boas", "Holly Newlands", "Marin Vesely", "Sandrine Malary", "Terri Ayanna Wright"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457436", "abs": "Suga' is a live volumetric dance performance experience presented in Mozilla Hubs' social virtual reality space. The performer appears as a live-streamed 3D video within a photogrammetry scan of the Annaberg Sugar Mill Ruins in the U.S. Virgin Islands, when in fact she is performing from her living room. She traces the point cloud rendering of the mill with her movements as if preparing the space for ritual, recalling events that happened there. Through movement and soundscape, the performer tells the story of her own deep connection and mixed relationship to similar sites as a Black woman growing up in the Caribbean."}, {"v": "", "img": "thumbs/9c289d606bb4.jpg", "t": "Understand_V.T.S.HAOS", "a": ["Lai Jiun-Ting"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457440", "abs": "Is there any other way for us to understand the world through Human and AI integration? Understand_V.T.S.HAOS is an installation that substitutes senses. It helps explore and ponder in the process of cultivation. This work conducts an experiment in which the possibility of the cooperation between natural and artificial algorithms is assessed, and serves as an approach to human enhancement. That is, it investigates how well our brains (natural) work with AI (man-made)."}, {"v": "", "img": "thumbs/855ea4674ccb.jpg", "t": "Visualization of imaginary stroke movement in painting and calligraphy", "a": ["Tianqin Zhang", "Ruimin Lyu", "Zhaolin Yuan"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457437", "abs": "Beholders can feel the imaginary movement from the artist's brushstrokes in visual artworks. This psychological phenomenon has been recorded in the world's art literature, and its physiological basis has been found by neuroaesthetics researchers. However, past practice and research have neither tried to fetch the \"data\" of the imaginary stroke movement from the brain nor re-created artworks in new forms based on it. By drawing lessons from \"copying,\" a common practice in art skill training, we develop two interactive \"painting\" applications which enable the user to draw their perceived stroke movement on reference artworks."}, {"v": "", "img": "thumbs/57293ecfd22b.jpg", "t": "“Can the subaltern speak?”: critical making in design", "a": ["Behnaz Farahi"], "c": "SIGGRAPH", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3450507.3457429", "abs": "The Bandari women from the southern coast of Iran are famous for their intriguing masks, known as Niqab masks. Legend has it that the practice started during Portuguese colonial rule as a way of protecting the wearer, not only from the harsh sun of the Persian Gulf, but also from slave masters looking for pretty women. Viewed from a contemporary perspective, these masks can be seen as a means of protecting women from patriarchal and colonial oppression."}, {"v": "", "img": "thumbs/f661aabddbcc.jpg", "t": "Bad Mother / Good Mother: The Poetics and Politics of the Sounds of Invisible Labor", "a": ["Annina Rüst"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465617", "abs": "Bad Mother / Good Mother is an audiovisual performance that explores societal perceptions about ideal and non-ideal motherhood through sound and projected visuals. The sound comes from an amplified breast pump, while the visuals are projected on a single screen. In the performance, the artist plays the breast pump at different speeds. She plays it as a solo instrument and as part of an arrangement, and---at certain points in the performance---processes the breast pump sound using filters. This paper situates the performance within a discussion of how audiovisual performance can help express the relationship between gender and invisible labor.", "ja": "Bad Mother / Good Motherは、音と投影されたビジュアルを通じて、理想的な母性と非理想的な母性に関する社会的認識を探求するオーディオビジュアルパフォーマンスです。音は増幅された授乳ポンプから生まれ、ビジュアルは単一のスクリーンに投影されます。パフォーマンスでは、アーティストがさまざまな速度で授乳ポンプを演奏します。彼女はソロ楽器として、またアレンジの一部としてそれを演奏し、特定のポイントでは授乳ポンプの音をフィルターで処理します。この論文は、オーディオビジュアルパフォーマンスがジェンダーと見えない労働の関係を表現するのにどのように役立つかという議論の中で、このパフォーマンスを位置付けます。"}, {"v": "", "img": "thumbs/c3d7809fcd8a.jpg", "t": "Can the Subaltern Speak?: Feminism in Robotic Mask Design", "a": ["Behnaz Farahi"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465621", "abs": "This paper presents AI-controlled robotic masks intended to empower women and allow them to communicate with one another. These are inspired by the historical masks worn by the Bandari women from southern Iran. Legend has it that these masks were developed during Portuguese colonial rule as a way of protecting the wearer from the gaze of slave masters looking for attractive women. In this project two robotic masks seemingly begin to develop their own language to communicate with each other, blinking their eyelashes in rapid succession using AI-generated Morse code. This project draws upon a Facebook experiment where two AI bots apparently began to develop their own language. It also draws upon an incident when an American soldier used his eyes to blink and spell out the word \"TORTURE\" using Morse code during his captivity in Vietnam, as well as stories of women using code to report domestic abuse during the COVID-19 lockdown. The aim is to sow anxiety within the patriarchal system where the \"wink\" of the sexual predator is subverted into a language to protect women from the advances of a predator. The project bridges AI, interactive design, and critical thinking (Figure 1).", "ja": "この論文では、女性をエンパワーメントし、互いにコミュニケーションできるようにすることを目的とした、AI制御ロボットマスクを提示します。これらは、イラン南部のバンダリ女性が着用していた歴史的なマスクに着想を得ています。伝説によれば、これらのマスクはポルトガル植民地支配時代に、魅力的な女性を探す奴隷主人の視線から身を守るために開発されたとされています。本プロジェクトでは、二つのロボットマスクが独自の言語を発展させ、AI生成モールス信号でまばたきを高速で繰り返すことで互いにコミュニケーションを取る様子を示します。このプロジェクトは、二つのAIボットが独自の言語を発展させたとされるFacebookの実験や、ベトナム捕虜時代にアメリカ兵が目のまばたきで「TORTURE（拷問）」という単語をモールス信号で綴った事例、さらにCOVID-19ロックダウン中に女性が家庭内虐待を報告するためにコードを使用した話などに基づいています。目的は、性的捕食者の「ウインク」を女性を保護する言語に転換し、父権制システム内に不安感を植え付けることです。このプロジェクトは、AI、インタラクティブデザイン、批判的思考を橋渡しします（図1）。"}, {"v": "", "img": "thumbs/b0fb85b46e07.jpg", "t": "Cangjie's Poetry: An Interactive Art Experience of a Semantic Human-Machine Reality", "a": ["Weidi Zhang", "Donghao Ren", "George Legrady"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465619", "abs": "This paper describes the conceptual background, artificial intelligent system design, and visualization strategies of an interactive art experience: Cangjie's Poetry. This artwork provides a conceptual response to the human-machine reality in the context of language, symbols, and semantic meanings. In the Cangjie's Poetry art installation, the intelligent system (Cangjie) constantly observes surroundings through the lens of a camera, writes poetry using its symbolic system based on its interpretation, and explains the evolving poem in natural language to audiences in real time. Due to the global pandemic of COVID-19, multiple presentation formats of this work were developed, which include in-person installation, virtual installation, and a special edition with pre-rendered video. This work prioritizes ambiguity and tension between machinic vision and human perception, the actual and the virtual, past and present.", "ja": "この論文は、インタラクティブなアート体験「Cangjie's Poetry」の概念的背景、人工知能システム設計、可視化戦略について述べています。このアートワークは、言語、記号、意味的意味合いの文脈における人間と機械の現実への概念的応答を提供します。Cangjie's Poetry アートインスタレーションでは、インテリジェントシステム（Cangjie）がカメラのレンズを通して周囲を常に観察し、解釈に基づく記号体系を用いて詩を書き、リアルタイムで観客に自然言語で進化する詩を説明します。COVID-19 の世界的なパンデミックにより、本作品の複数のプレゼンテーション形式が開発され、対面インスタレーション、バーチャルインスタレーション、事前にレンダリングされたビデオを用いた特別版が含まれます。この作品は、機械的視覚と人間の知覚、実体と仮想、過去と現在の間の曖昧さと緊張を優先します。"}, {"v": "", "img": "thumbs/f7a533d2fe76.jpg", "t": "drop: An Interactive Art Installation with Waterdrop Projection-Mapping", "a": ["Sadam Fujioka"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465613", "abs": "This paper describes an interactive art installation titled \"drop.\" It is the first artwork using the Waterdrop Projection-Mapping (WPM) system, which animates levitating waterdrops. With this artwork, the anno lab team infuses physical characteristics into computer graphics and materializes them as tangible pixels. WPM consists of a waterdrop generator and an ultra high-speed projector. The team uses an ultra high-speed projector to cast stroboscopic spotlights mapping on waterdrops to create an optical illusion of animating each waterdrop individually. This is a new technique to show computer animation by animating levitating waterdrops. This technique explores a new horizon to create animations with tangible pixels that the viewer can touch physically.", "ja": "この論文は「drop」と題されたインタラクティブなアートインスタレーションについて述べている。これはWaterdrop Projection-Mapping（WPM）システムを使用した初の作品で、浮遊する水滴をアニメーション化する。 このアートワークにより、anno labチームは物理的特性をコンピュータグラフィックスに注入し、触覚的なピクセルとして具体化する。WPMは水滴ジェネレーターと超高速プロジェクターで構成されている。チームは超高速プロジェクターを使用して水滴にストロボ光を投射し、各水滴を個別にアニメーション化する光学的錯覚を作り出す。この新しい技術は、浮遊する水滴をアニメーションさせることでコンピュータアニメーションを示す手法である。この技術は、観客が物理的に触れることができる具体的なピクセルでアニメーションを作成する新たな領域を探求している。"}, {"v": "", "img": "thumbs/21837fc47b56.jpg", "t": "Imaginary Stroke Movement Measurement and Visualization", "a": ["Ruimin Lyu", "Tianqin Zhang", "Zhaolin Yuan"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465625", "abs": "When viewing visual artworks, one can feel the suggestive movement from the brushstrokes. This phenomenon has been recorded widely in literature on art theory, and its physiological basis has been found in neuroaesthetic studies, but there is no method to measure its details at present. In this paper, two experiments are designed to measure the velocity sense and the trace sense, which are the instantaneous and cumulative representations of the same content---the kinetic feeling of strokes, respectively. Furthermore, various visualizations are designed for the two kinds of experimental data as artistic recreation of traditional artworks. In addition, the quantitative analysis is performed on the imaginary stroke movement, showing that imaginary stroke movement can be studied by mathematics.", "ja": "視覚芸術作品を見ると、筆致から示唆される動きを感じることができます。この現象は芸術理論の文献で広く記録されており、その生理学的基盤は神経美学研究で明らかにされていますが、現在のところその詳細を測定する方法はありません。本論文では、筆致の運動感覚、すなわち瞬間的な表現である速度感と累積的な表現である軌跡感という二つの実験を設計して測定します。さらに、二種の実験データに対して様々な可視化を行い、伝統的な芸術作品の芸術的再創造を行います。また、想像上の筆致運動に対する定量的分析を実施し、想像上の筆致運動が数学的に研究できることを示します。"}, {"v": "", "img": "thumbs/c50295568889.jpg", "t": "Instruments of Vision: Eye-Tracking and Robotics as an Embodied Interface", "a": ["Irem Bugdayci", "Anne-Heloise Dautel", "Robert Wuss", "Ruairi Glynn"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465618", "abs": "In the age of ubiquitous visual technologies and systems, our perceptive apparatuses are constantly challenged, adapted, and shaped by instruments and machines, rendering the observing body as an active site of knowledge. Your Eye's Motion by Luna is an interactive installation that uses real-time eye-tracking to control a robotic creature named Luna (Figure 1). Materializing eye movements through a wondrous spectacle of light, motion, and color, the observer becomes conscious of her gaze enacted and extended by a robotic counterpart. Building on a diverse set of theories and understandings of vision from the fields of cybernetics, visual studies, embodied mind, and more, the project explores how our perceptual apparatuses and bodies are reconfigured in relation to machines and the environment to afford new ways of seeing. Once we see how observing bodies accommodate feedback from actions to cognition, we can uncover the embodied and affective potential of eye movement as an interface for robotics. The curiosity of Luna invests in this potential, articulating a unity between our embodied percepts and machinic environments to create a \"vision machine.”", "ja": "視覚技術とシステムが至る所に広がる時代において、我々の知覚装置は常に道具や機械によって挑戦され、適応し、形作られ、観察する身体は知識の能動的な場となります。Your Eye's Motion by Luna は、リアルタイムの眼球追跡を使用してロボット生物 Luna（図1）を制御するインタラクティブなインスタレーションです。光、動き、色彩の驚異的なスペクトクルを通じて眼球運動を具現化することで、観察者は自らの視線がロボットの相棒によって実行され、拡張されていることを意識します。サイバネティクス、ビジュアルスタディーズ、具現化された心などの分野からの多様な理論と視覚の理解に基づき、本プロジェクトは、知覚装置と身体が機械や環境とどのように再構成され、新たな見方を提供できるかを探求します。観察する身体が行動から認知へのフィードバックを受け入れる様子を見ることで、眼球運動をロボティクスのインターフェースとする具現化的かつ情動的な可能性を明らかにできます。Luna の好奇心はこの可能性に投資し、我々の具現化された知覚と機械的環境との統一を表現し、「ビジョンマシン」を創り出します。"}, {"v": "", "img": "thumbs/731d539d8065.jpg", "t": "Jan van Eyck's Perspectival System Elucidated Through Computer Vision", "a": ["Gilles Simon"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465623", "abs": "It is generally accepted that Jan van Eyck was unaware of perspective. However, an a-contrario analysis of the vanishing points in five of his paintings, realized between 1432 and 1439, unveils a recurring fishbone-like pattern that could only emerge from the use of a polyscopic perspective machine with two degrees of freedom. A 3D reconstruction of Arnolfini Portrait compliant with this pattern suggests that van Eyck's device answered a both aesthetic and scientific questioning on how to represent space as closely as possible to human vision. This discovery makes van Eyck the father of today's immersive and nomadic creative media such as augmented reality and synthetic holography.", "ja": "ヤン・ファン・エイクが透視図法を知らなかったというのが通説である。しかし、1432年から1439年にかけて制作された彼の5点の絵画における消失点のア・コントラリオ分析により、二自由度を持つポリスコープ型透視機械を使用した場合にのみ生じうる、魚の骨状の繰り返しパターンが明らかになった。このパターンに準拠した《アルノルフィーニ夫妻像》の3D再構成は、ファン・エイクの装置が、人間の視覚にできる限り近い形で空間を表現する方法という、美的かつ科学的な問いに応えるものであったことを示唆している。この発見により、ファン・エイクは、拡張現実や合成ホログラフィーといった今日のイマーシブかつノマディックなクリエイティブメディアの父とみなされることになる。"}, {"v": "", "img": "thumbs/8b07070de401.jpg", "t": "Making Up 3D Bodies: Artistic and Serendipitous Modeling of Digital Human Figures", "a": ["Kiona Hagen Niehaus", "Rebecca Fiebrink"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3468779", "abs": "This paper describes the process of developing a software tool for digital artistic exploration of 3D human figures. Previously available software for modeling mesh-based 3D human figures restricts user output based on normative assumptions about the form that a body might take, particularly in terms of gender, race, and disability status, which are reinforced by ubiquitous use of range-limited sliders mapped to singular high-level design parameters. CreatorCustom, the software prototype created during this research, is designed to foreground an exploratory approach to modeling 3D human bodies, treating the digital body as a sculptural landscape rather than a presupposed form for rote technical representation. Building on prior research into serendipity in Human-Computer Interaction and 3D modeling systems for users at various levels of proficiency, among other areas, this research comprises two qualitative studies and investigation of the impact on the first author's artistic practice. Study 1 uses interviews and practice sessions to explore the practices of six queer artists working with the body and the language, materials, and actions they use in their practice; these then informed the design of the software tool. Study 2 investigates the usability, creativity support, and bodily implications of the software when used by thirteen artists in a workshop. These studies reveal the importance of exploration and unexpectedness in artistic practice, and a desire for experimental digital approaches to the human form.", "ja": "本論文では、3次元人体のデジタル的・芸術的探求を目的としたソフトウェアツールの開発プロセスについて述べる。従来のメッシュベース3D人体モデリングソフトウェアは、特にジェンダー、人種、障害の有無という観点において、身体が取りうる形態に関する規範的な前提に基づいてユーザーの出力を制限しており、その傾向は、単一のハイレベルなデザインパラメータに対応した可動域の限られたスライダーの広範な使用によって強化されている。本研究で開発されたソフトウェアプロトタイプ「CreatorCustom」は、3D人体モデリングに対して探索的なアプローチを前景化するよう設計されており、デジタルボディを、単なる技術的表現のための所与の形ではなく、彫刻的な風景として捉えている。Human-Computer Interactionにおけるセレンディピティや、さまざまな習熟度のユーザー向け3Dモデリングシステムに関する先行研究などを踏まえ、本研究は2つの定性的研究と、第一著者の芸術実践への影響の考察から構成される。研究1では、身体をテーマに活動する6名のクィアアーティストの実践、および彼らが実践の中で用いる言語・素材・行為を、インタビューと実践セッションを通じて探究し、その結果をソフトウェアツールの設計に反映させた。研究2では、13名のアーティストが参加するワークショップにおいて、当該ソフトウェアの使いやすさ、創造性のサポート機能、および身体への示唆を検証した。これらの研究を通じて、芸術実践における探索と予期せぬ発見の重要性、そして人体の形態に対する実験的なデジタルアプローチへの希求が明らかになった。"}, {"v": "", "img": "thumbs/1586175fce90.jpg", "t": "Mimicry: Genetic-algorithm-based Real-time System of Virtual Insects in a Living Environment—A New and Altered Nature", "a": ["Ziwei Wu", "Lingdong Huang"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465615", "abs": "The authors have collaborated on a machine learning multiscreen video installation powered by computer algorithms and inspired by mimicry in the natural world. The artwork explores a pseudo-environment loop system in nature and artificial mechanical organisms combining living flowers with projectors, webcams, and computer monitors. Technically, the software adopts a genetic algorithm to simulate the process of mimicry; conceptually, this real-time art installation is in conversation with Nam June Paik's piece TV Garden. The project explores the possibilities of integrating artificial intelligence and nature in the landscape of the future.", "ja": "著者らは、コンピュータアルゴリズムによって駆動し、自然界における擬態からインスピレーションを得た、機械学習を用いたマルチスクリーン映像インスタレーションを共同制作した。本作品は、自然界における疑似環境のループシステムを探求するものであり、生きた花とプロジェクター、ウェブカメラ、コンピュータモニターを組み合わせた人工的・機械的生命体を融合させている。技術的には、擬態のプロセスをシミュレートするために遺伝的アルゴリズムを採用しており、概念的には、このリアルタイム・アートインスタレーションはナム・ジュン・パイクの作品《TVガーデン》との対話的関係にある。本プロジェクトは、未来の景観における人工知能と自然の統合の可能性を探るものである。"}, {"v": "", "img": "thumbs/e1d2b8f7d1e5.jpg", "t": "Ming Shan Digital Experience: Immersive Technology for Traditional Taoist Meditation", "a": ["Nicolas Henchoz", "Margaux Charvolin", "Delphine Ribes", "Lara Défayes", "Cédric Duchêne", "Emily Groves", "Andreas Sonderegger"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465620", "abs": "The Ming Shan Digital Experience is an immersive installation designed to support meditation in the context of a new Taoist center. Its creation confronted current academic literature on digital technology for meditation with the practical and cultural requirements of Taoist practice. Quantitative and qualitative learnings show the effectiveness of multimodal biofeedback on individual and collective meditative experience. Now instated in the Taoist center, the installation opens new perspectives for combining digital technology with ancient practice.", "ja": "「Ming Shan Digital Experience」は、新設された道教センターにおける瞑想をサポートするために設計されたイマーシブ型インスタレーションである。その制作にあたっては、瞑想向けデジタル技術に関する現在の学術的知見と、道教の実践が持つ実際的・文化的要件とを照合・検討した。量的・質的両面からの知見により、個人および集団の瞑想体験に対するマルチモーダル・バイオフィードバックの有効性が示された。現在、道教センターに常設されているこのインスタレーションは、デジタル技術と古来の実践を融合させる新たな展望を切り開くものである。"}, {"v": "", "img": "thumbs/d03c282c56a4.jpg", "t": "ReMember: Using Biosignals to Recall Memories of Companion Animals", "a": ["Changyoon Yi", "Juhyun Bae", "Nakkyu Baek", "Jina Jung", "Sunwoong Hur", "Hyun-Jean Lee", "Seung Ah Lee"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465614", "abs": "ReMember is an interactive installation that provides bereaved pet owners with a sense of presence and connection to their deceased companion animals. Many pet owners suffer from bereavement and grief upon the loss of companion animals, and rituals and memorialization can help their grieving process. In this installation, the authors integrate audiovisual effects of the heartbeat recordings of companion animals and cremation stones made for pet memorialization. The audience's responses to ReMember show that interactivity and physiological signals augment the physical object of remembrance and elicit strong emotions. ReMember suggests that digitalized physiological signals and biological data can be a new form of the legacy of animal companionships and that the careful curation of digital, biological, and physical artifacts can support continuing bond expressions in pet loss.", "ja": "「ReMember」は、ペットを亡くした飼い主に、亡くなったコンパニオンアニマルの存在感とのつながりを提供するインタラクティブ・インスタレーションである。多くのペットオーナーはコンパニオンアニマルを失った際に悲嘆と喪失感を経験するが、儀式や追悼行為はその悲しみのプロセスを助けることができる。本インスタレーションでは、コンパニオンアニマルの心拍数の録音による音響・映像効果と、ペットの追悼のために作られた遺骨入りの石を統合している。「ReMember」への観客の反応は、インタラクティビティと生理的シグナルが追悼の物理的対象物を拡張し、強い感情を呼び起こすことを示している。「ReMember」は、デジタル化された生理的シグナルと生体データが、動物との絆の新たな遺産の形となりうること、そしてデジタル・生物学的・物理的なアーティファクトを丁寧にキュレーションすることが、ペットロスにおける継続的な絆の表現をサポートしうることを示唆している。"}, {"v": "", "img": "thumbs/dd9caed8a139.jpg", "t": "Reversal, Disconnect, and Proposition: Noise and Data Politics in the Work of Julian Oliver and Trevor Paglen", "a": ["Kevin Day"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465624", "abs": "This paper examines the potential countertactics of contemporary interactive media art to interrogate the data-mining practices that encode the everyday and exploit user data in the big data economy. It argues that noise is the \"other\" of information, a way to counter the operation of turning the world into data commodities. Through a Brechtian methodology informed by philosophy and critical theories of media and technology, the paper suggests that amplifying the \"noise\" of the digital media assemblages deviates from their everyday normative functions and estranges our relationship to them, inviting critical ways of understanding, relating to, and engaging these ubiquitous systems. All three noted artworks destabilize the protocols of data-mining to examine data politics. Specifically, the paper looks at three different tactics that amplify the \"noise\" of digital culture in different ways: reversing roles, disconnecting, and proposing viable alternatives.", "ja": "本論文は、ビッグデータ経済における日常をコード化しユーザーデータを搾取するデータマイニングの実践を問い直す、現代のインタラクティブ・メディアアートの対抗戦術の可能性を考察する。情報の「他者」としてのノイズが、世界をデータ商品へと変換する操作に対抗する手段となりうると論じる。メディアと技術の哲学および批評理論に基づいたブレヒト的方法論を通じて、本論文は、デジタルメディア・アサンブラージュの「ノイズ」を増幅させることが、その日常的・規範的な機能から逸脱し、それらとの関係を異化することで、遍在するシステムを理解し、関係を結び、関与するための批判的な視座へと誘うと主張する。取り上げる3つの作品はいずれも、データポリティクスを検証するためにデータマイニングのプロトコルを不安定化させるものである。具体的には、デジタル文化の「ノイズ」をそれぞれ異なる形で増幅させる3つの戦術、すなわち「役割の逆転」「切断」「実行可能な代替案の提示」を論じる。"}, {"v": "", "img": "thumbs/187c52934a44.jpg", "t": "Spinning the Conductors of an Indigenous Tradition: Toward a Continuity of Traditional Andean Weaving with New Electronic Technologies", "a": ["Valentina Montero", "Sandra De Berduccy"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465622", "abs": "Over the last decades, there has been an unusual global interest in vindicating the knowledge and practices of indigenous communities. In Latin America one can see this particularly in numerous demands regarding anti-colonial politics, history, anthropology, and aesthetics. Based on interviews and analyses of a selection of aruma-Sandra De Berduccy's artworks, this paper explores aesthetic, material, and conceptual aspects of her work, focusing on her use of the Andean loom as a highly complex technological and social compound. It further puts her art in dialogue with nature and media archaeological debates, suggesting that her work invites us to explore a different path for media art outside hegemonic scientific and technological paradigms.", "ja": "過去数十年にわたり、先住民コミュニティの知識と実践を再評価しようとする異例なほどの世界的関心が高まっている。ラテンアメリカでは、脱植民地主義の政治・歴史・人類学・美学に関する数多くの要求においてこの傾向が特に顕著に見られる。本論文は、アルマ＝サンドラ・デ・ベルドゥッシーの作品群へのインタビューと分析に基づき、彼女の作品における美的・物質的・概念的側面を探究する。とりわけ、高度に複雑な技術的・社会的複合体としてのアンデスの織機の使用に焦点を当てる。さらに、彼女の芸術を自然およびメディア考古学的議論と対話させることで、彼女の作品が、覇権的な科学・技術パラダイムの外側にあるメディアアートの異なる道を探求するよう私たちを誘っていることを示唆する。"}, {"v": "", "img": "thumbs/6864b21b00af.jpg", "t": "The Woods: A Mixed-Reality Two-Player Cooperative Game", "a": ["Kyoung Lee Swearingen", "Scott Swearingen", "Fede Camara Halac", "Sruthi Ammannagari", "Matt Hall"], "c": "SIGGRAPH", "y": 2021, "k": "Art Papers", "doi": "10.1145/3465616", "abs": "While loneliness in our real lives is increasingly recognized as having dire physical, mental, and emotional consequences, cooperative games have been shown to build empathy and provide positive social impact. In this paper, the authors present \"The Woods,\" a local cooperative, mixed-reality game using augmented reality and 4-channel audio spatialization panning that provides players with face-to-face interactions in pursuit of a shared goal. This paper discusses the narrative, mechanical, and sonic components of the game, as well as the game's development process and the players' experiences. The goal of our team is to develop a narrative-driven AR game that promotes collaborative problem-solving and engages players in an emergent physical and digital experience.", "ja": "現実生活における孤独が身体的・精神的・感情的に深刻な影響をもたらすことへの認識が高まる一方、協力型ゲームは共感を育み、ポジティブな社会的影響をもたらすことが示されている。本論文では、著者らが制作した「The Woods」を紹介する。これは、拡張現実と4チャンネル音声空間化パンニングを用いたローカル協力型の複合現実ゲームであり、共通の目標を追求する中でプレイヤーが対面でインタラクションを行うことができる。本論文では、ゲームのナラティブ・メカニカル・音響的要素、ならびにゲームの開発プロセスとプレイヤーの体験について論じる。本チームの目標は、協調的な問題解決を促し、プレイヤーを身体的・デジタル的な創発的体験へと誘う、ナラティブ主導のARゲームを開発することである。"}, {"v": "", "img": "thumbs/e732c4192a16.jpg", "t": "Aerobanquets RMX", "a": ["Mattia Casalegno"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487878", "abs": "Aerobanquets RMX is an immersive, multi-sensorial culinary experience focused on taste perception. The project debuted in 2019 and has been exhibited, in collaboration with international Chefs, in Shanghai, Gwangju, Sanya, and New York. The project investigates rituals, behaviors and modes of eating and experiencing food in the future."}, {"v": "", "img": "thumbs/19c7a1bc371b.jpg", "t": "Aurora Australis Ultimo Choro", "a": ["John McCormick", "Adam Nash", "Stephen Jeal", "Kim Vincs"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487883", "abs": "Aurora Australis Ultimo Choro depicts the final Australian voyage of the RSV Aurora Australis to the Antarctic continent. The Aurora Australis has been carrying expeditioners and resupply to Antarctica for over 30 years. This final voyage was special in many ways. It departed with COVTD-19 just a whisper and returned to a fundamentally changed world. The extra protocols instituted on the ship in response to COVID-19 reinforced the interdependency and collaborative actions of such a tightly knit microcosm, already essential for survival in Antarctica, but with a renewed sense of urgency in the emerging emergency. At that time Antarctica became the last COVID-19 free continent and we had a duty to preserve that status."}, {"v": "", "img": "thumbs/60b851b894ad.jpg", "t": "Escaping to Another", "a": ["Biin Shen"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487882", "abs": "This work is based on the artist's personal experience during quarantine, and it aims to inspire imagination and hope for the future, for unreachable places, especially in the particular situation of the year 2020."}, {"v": "", "img": "thumbs/64276af9e6c4.jpg", "t": "Ethereal Phenomena", "a": ["Silvana Malaver", "Natalia Barragán Nieto", "Igor Igorevich Segrovets", "Carlos Rizzi", "George Chernyshov", "Christopher Changmok Kim", "Kai Kunze"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487870", "abs": "\"Ethereal Phenomena\" is an illustration based on Tibetan thangka art that reacts to the breath."}, {"v": "", "img": "thumbs/2d4252dcbb6d.jpg", "t": "From our deceased bodies flowers will grow, we are in them and that is eternity", "a": ["Wade Marynowsky"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487879", "abs": "Wade Marynowsky, 'From our deceased bodies, flowers will grow we are in them and that is eternity', high definition video, sound, 3mins, 2021."}, {"v": "", "img": "thumbs/f4fceda23ecb.jpg", "t": "Goldfish architecture: therapeutic urban aquaponics", "a": ["Alex Orsholits", "Zhou Li", "Kritika Dhupar", "Yusuke Obuchi", "Chengzhe Zhu", "Yusuke Komata", "Shuta Takagi"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487873", "abs": "In recent years, there has been a transition towards new implementations of digital augmentation and optimization at everincreasing scales. With metropolises now being equipped with a myriad of sensors, these agglomerations are becoming entangled with a new class of infrastructure. Yet, current propositions of big data-based sustainability implementations leave much to be desired in terms of transparency. To the detriment of personal and interpersonal comfort, these configurations operate solely as city-wide optimizers, on a scale that is alienating for the individual. The benefits therefore remain intangible in the eyes of the inhabitants. Could these benefits operate on a smaller, personal scale to a similar effect as that of a larger scale? In a fundamental sense, current environment & sustainability implementations represent a disconnect from the individual needs of the community as the process falls solely on the system developer, rather than the public willing to accommodate such changes in their space."}, {"v": "", "img": "thumbs/45d5321651eb.jpg", "t": "Iris", "a": ["Yamin Xu"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487884", "abs": "Iris is a wearable robot. As an experiment designed to bring onscreen animation closer to physical, real-life animation, Iris is given independent perception and temperament by using facial expression recognition and emotion synthesis. Similar to cartoon animation, this temperament is expressed through movement but generated in real-time. By connecting sensors that measure physiological signals of the wearer's body, the emotion of the Iris is affected by the wearer's emotions. It can be perceived as an independent individual and also a part of the wearer's body. This ability to perceive and emote reflects both a certain connection and difference with the wearer, as if showing a split personality. Giving different responses to others, affects interpersonal interactions and relationships. These effects are heightened during Covid-19, when our faces are covered by masks, the Iris performs a special way to augment humans' expression.", "pos": "50% 15%"}, {"v": "", "img": "thumbs/2a7b3506ba74.jpg", "t": "Microbiospheric engineering", "a": ["Kevin Blackistone", "Amir Bastan"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487875", "abs": "Microbiology invokes features of our environment that are often unseen - interacting without our direct intent or involvement, while automation conjures views of large-scale, tightly controlled mass-production. As our technology has progressed, our abilities to manufacture have extended into the micro world, aided by ever more refined industrial machinery. At the same time, these technologies have allowed us to further populate our own world while extracting from it ever greater resources. I seek to explore this convergence through a merged visual metaphor, involving human bacterial colonies, their interactions amongst wild-spawning microflora, and the automated systems that will be used for their surveillance. This is to be achieved through a clear sphere upon which shall be a layer of sculpted microbial growth media. Human seeded bacterial populations monitored by automated microscope shall present visual landscapes and satellite-style vistas of their expansion. Each day, further growth shall be visible upon the mountains, valleys and planes of the agar topography. The combined built and spontaneous cartographies shall provide means to internalize population expansions and resource depletions of our own biosphere, while the proximal automata presenting these unseen worlds draws focus on the approaching micro : macro interactions of mechanical : biological manufacture and our own potential technological limits of growth."}, {"v": "", "img": "thumbs/04dc5c23971b.jpg", "t": "Mixed Reality Ulysses", "a": ["Neill O’Dwyer", "Gareth W. Young", "Aljosa Smolic", "Matthew Moynihan", "Paul O’Hanrahan"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487880", "abs": "'MR Ulysses' is a creative project investigating the possibilities of live performance using volumetric video (VV) techniques displayed via VR and AR technologies. It explores the opening scene of James Joyce's acclaimed modern masterpiece of twentieth-century literature, 'Ulysses'. Set in 1904, 'Ulysses' is noted for its geographic specificity, and every year Joyce scholars and enthusiasts ritualis-tically visit Dublin on June 16th to celebrate an annual literature pilgrimage called \"Bloomsday.\" The tradition involves dressing up in the fashion of the day, retracing the steps of the central characters by visiting many of the sites that are mentioned, and eating, drinking, and re-enacting scenes from the book."}, {"v": "", "img": "thumbs/c1f5cadedeff.jpg", "t": "SeoulVibe", "a": ["Taeil Lee"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487871", "abs": "City walks, runs, chats, shouts, sings, dances and moves. City flows. City talks. City shows. City still struggles under the pandemic. There still are managing lives with dripping sweat and popping joy. Continuing vitality of city, vitality of streets like shooting buds."}, {"v": "", "img": "thumbs/62405fdedd7a.jpg", "t": "Signal", "a": ["Chin-Hsiang Hu", "Zhao-Qing Chang", "Che-Wei Hsu", "Kuan-Wen Chen", "Yu-Chi Fu"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487877", "abs": "Awaiting for light in the darkness(covid-19) is similar to searching for hope(normal life). The artwork is combined with the physical space, projection visual, laser light, smoke, represent as a \"Cyber Sea\"."}, {"v": "", "img": "thumbs/fd84de7f4f9c.jpg", "t": "Siren", "a": ["Wenqian Gao"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487881", "abs": "I use 3d scanning scan a lot of expressions of a reel girl to make this animation, song of siren is electronic sound which is made from virtual singer software. In the ancient Greek mythology, siren attract the sailors with the song and kill them. In the future, is there also the program who use disillusioned human like siren in the virtual world?"}, {"v": "", "img": "thumbs/ea6ce4679766.jpg", "t": "Strands of Mind", "a": ["Adrian Meyer"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487876", "abs": "Strands Of Mind is cinematic VR, aimed to give the viewer a strongly immersive and emotional audio-visual experience. The film was created fully digital in stereoscopic 4K at 60fps with immersive spatial audio. It is conceptualized to be viewed on high quality VR Head Mounted Displays like Oculus Rift/Quest/Go, HTC Vive and similar."}, {"v": "", "img": "thumbs/e1f4d4cc04be.jpg", "t": "The Tides Within Us", "a": ["Barnaby Churchill Steel", "Kate Farrell", "Bianka Hofmann"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487872", "abs": "A cross-sectoral project utilizing high-end MR research results, 'The Tides Within Us' is an ongoing exploration into the world beyond the limits of our senses at the intersection of art, science and technology."}, {"v": "", "img": "thumbs/581fed19b823.jpg", "t": "Volume II of Voids", "a": ["Shaoyu Su", "Weidi Zhang"], "c": "SIGGRAPH Asia", "y": 2021, "k": "Art Gallery", "doi": "10.1145/3476123.3487885", "abs": "Volume II of Voids is an intelligent interactive art experience that is generated based on the voids between humans. Inspired by the social distancing regulations during the pandemic, people are disconnected physically by keeping social distance to avoid spreading the Coronavirus. It influences the way we live, communicate, and socialize in a profound way. When we keep our distance from other people, what is the volume of voids? How do those negative spaces connect us and shape our connections as a new normal of intricate social networks?"}, {"v": "", "img": "thumbs/178b60cc2dc7.jpg", "t": "Algotecton", "a": ["Daniel Cardoso Llach", "Jingyang (Leo) Liu", "Yi-Chin Lee"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388563", "abs": "Algotecton (from algorithm and tecton---carpentry, articulation) is a site-specific generative sculpture inspired by the Weaire-Phelan structure, a mathematical construct that approximates the geometry of foam. It comprises 16 interlocking polyhedra fabricated using advanced parametric modeling and computer numerical control (CNC) technologies. Evocative of different natural formations---a crystalline structure, a kelp forest, a molecular compound---the sculpture responds to Kendall Buster's Parabiosis II piece at the street level of the Washington Convention Center in Washington, D.C. Algotecton harnesses state-of-the-art computational design and fabrication techniques to give material expression to mathematical concepts, invite discovery and playfully transform people's perception of space and form."}, {"v": "", "img": "thumbs/30766dafe83a.jpg", "t": "Cacophonic choir", "a": ["Hannah E. Wolfe", "Şölen Kıratlı", "Alex Bundy"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388552", "abs": "Cacophonic Choir is an interactive sound installation aimed at bringing attention to the firsthand stories of sexual assault survivors and the way such stories may be distorted by the media and in online discourse. The work is composed of nine vocalizing physical agents distributed in space. Each agent tells a story. Altogether, from a distance, the viewer hears an unintelligible choir---the stories are fragmented and the voices distorted. As the viewer approaches an agent, the story becomes sonically and semantically more coherent. When in the agent's personal space, the viewer can hear the firsthand account [1] of a sexual assault survivor. The work employs several digital media techniques, including machine learning, physical computing, digital audio signal processing, and digital design and fabrication. Agents are fitted with ultrasonic sensors and respond to a viewer approaching it in three ways simultaneously. First, the narrative becomes more coherent, reflecting how stories become distorted by the media. This is achieved by adjusting the accuracy of a generative machine learning algorithm that we designed and trained on the anonymous accounts of more than 500 sexual assault survivors. Second, to express how survivors are silenced, the voices are treated by a granular synthesis algorithm that generates a stuttering and halting effect that decreases as the viewer approaches the agent. Third, the individual form of each agent becomes revealed as the result of it illuminating itself from within, enabling the viewer to see through the soft silicon shell to the digitally fabricated organic form inside. Via these interactions, the work embodies the stories of sexual assault survivors and how these stories are obscured and distorted in online public discourse."}, {"v": "", "img": "thumbs/8bd1eea0196a.jpg", "t": "Captured by an algorithm", "a": ["Sophia Brueckner"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388558", "abs": "Captured by an Algorithm is a commemorative plate series that looks at romance novels through the lens of Amazon Kindle Popular Highlights. A passage in a Kindle e-book becomes a Popular Highlight after a certain number of people independently highlight the same passage. Popular Highlights are displayed as underlined along with the number of times each has been highlighted by a reader. The highlights in romances are not the racy, salacious quotes one might expect. Instead, they reveal the readers' intense feelings of loneliness, grief, and discontent. With all the social technologies available today, it is astonishing to see that so many people feel so lonely.", "pos": "50% 0%"}, {"v": "", "img": "thumbs/076d47694dcc.jpg", "t": "Disruptive devices", "a": ["Neil Mendoza"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388553", "abs": "Disruptive Devices is a triptych of digital kinetic artworks that mediate viewer interactions with virtual wildlife. Our current economic system is set up to treat nature as an infinite resource, disturbing ecosystems in unsustainable ways, often using technology as a tool to amplify these disturbances. This piece invites viewers to contemplate this relationship through a surreal lens. Each of the three machines combines a physical hand mechanism controlled by the viewer via a crank wheel that interacts with a virtual natural environment."}, {"v": "", "img": "thumbs/181d1a961315.jpg", "t": "Dog of zone", "a": ["Łukasz Pazera"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388551", "abs": "The Zone. Seemingly dead space. It becomes a dominating, uncontrolled, autonomous entity in the presence of a human being. It manifests its reactions by changing the state of objects that belong to it. The Dog is one such object. It's an expression of an abrupt, aggressive motion and destructive influence of the Zone. The concept of the Zone is inspired by Arkady and Boris Strugatsky's novel Roadside Picnic, published in 1972, but can also be tied to the movie Stalker, directed by Andrei Tarkovsky (1979), and to a nuclear disaster that occurred on 26 April 1986 in Chernobyl in Ukraine."}, {"v": "", "img": "thumbs/8067f581a18f.jpg", "t": "Down stream [appalachia]", "a": ["David Franusich"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388554", "abs": "Down Stream [Appalachia] is an immersive, interactive art installation that addresses themes of ecological preservation, conservation and connectedness, illuminating the precarity of imperiled freshwater species in the Appalachian region. The exhibition is composed of three reflective, refractive sculptural forms; each form is made from stacked acrylic and mirrored surfaces projected on from within to create glowing objects that appear to float in the darkness. The installation is surrounded by spatialized sound consisting of music and field recorded audio. Each object contains video footage of a different imperiled animal native to southwest Virginia: the candy darter (Etheostoma osburni); the Cumberlandian combshell (Epioblasma brevidens) and other freshwater mussels; and the Eastern hellbender salamander (Cryptobranchus alleganiensis alleganiensis)."}, {"v": "", "img": "thumbs/8a69532abfec.jpg", "t": "Glass entanglement", "a": ["Tobias Klein"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388557", "abs": "In quantum physics, quantum entanglement is a phenomenon that occurs when a group of particles is generated in such a way that the quantum state of each individual particle cannot be described independently from the other. The work Glass Entanglement constructs a similar state in which neither its digital nor analog parts could be read individually and where each part could not be described independently from the other. This work consists of the physical separation of the parts of cellular glass volumes from one another and the 3D-printed form interacting with these single objects to form an ecosystem between the glass volumes. The elements are held together by digitally modeled, tendril-like structures, analogous to the biological cell growth when forming multicellular higher-order organisms.", "pos": "50% 0%"}, {"v": "", "img": "thumbs/2751aed0c8d5.jpg", "t": "Homeostasis", "a": ["Emil Polyak"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388559", "abs": "Emerging technologies are impacting human interactions more than ever, while public perception of automation, artificial intelligence (AI) and human enhancement remains critical. In creative fields, innovative ideas are often triggered by intersecting dissimilar phenomena filtered through aesthetic considerations. One can argue that introducing AI in artistic practice destroys spontaneity, intuition and serendipity; consequently, the outcome is deliberate and premeditated. However, art is open to interpretations and through designing of unorthodox digital artifacts, interfaces and experiences in contrast with mainstream processes, we can challenge existing beliefs and provoke new ideas to reach a better understanding of how technology affects our culture. The project Homeostasis is a speculative interactive visual experience. It connects a distinctive interface design with generative art and meaningful data to communicate a significant topic. Shapes, colors, form and timing are manipulated based on a set of design principles, while the pattern of a vapor cloud from an ultrasonic vaporizer is analyzed and processed in a machine learning model in real time. The variations of the vapor pattern enable infinite possibilities between the natural boundaries and provide exciting data through computer vision that then drives the spatial and temporal attributes of the animation. The design is biologically inspired, and it attempts to create an illusion of cellular life-forms in deep waters."}, {"v": "", "img": "thumbs/21da7a7a044f.jpg", "t": "Inside out", "a": ["Yuichiro Katsumoto"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388556", "abs": "Inside Out is a kinetic installation that expresses the pointlessness of boundaries. We humans draw lines to write letters and sketch pictures. It can be said that drawing lines is an essential part of our culture and art making. However, we also draw lines to divide people by nationality, ethnicity and religion. These lines rely on ephemeral and constantly shifting social contexts. Although such lines are not consistent, the boundaries they create have become the baseline for violence and discrimination."}, {"v": "", "img": "thumbs/75e3e5d0c117.jpg", "t": "MYRIOI", "a": ["JoAnn Kuchera-Morin", "Andres Cabrera", "Kon Hyong Kim", "Gustavo Rincon", "Tim Wood"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388561", "abs": "What would it be like to have a shared VR experience and to be present---to really feel presence together---in immersive worlds unimagined, from the atomic to the cosmic?", "pos": "50% 0%"}, {"v": "", "img": "thumbs/1966a2f4964d.jpg", "t": "Ornamental", "a": ["Luke Demarest"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388560", "abs": "In 1948, Claude Shannon's A Mathematical Theory of Information laid the groundwork for the digital age. It defined the term information, introduced the unit bit and revolutionized how we communicate. Shannon's work gives us physical parameters to define an often perceivably abstract entity: information. It's a seemingly strange and wonderful truth in the digital age that information is physical---where one is often led to believe that information lives in the ether of clouds."}, {"v": "", "img": "thumbs/6b2754710091.jpg", "t": "The skin", "a": ["Sanghwa Hong", "Hyunchul Kim", "Seonghyeon Kim", "Byungjoo Lee"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388555", "abs": "Today, computers interact with humans through their own mechanical skins such as touch pads and touch screens. However, existing computer \"skin\" was only able to measure very limited information, such as contact location and contact pressure, from external contact. The Skin is an interactive artwork with a specially constructed touch surface that can measure a total of eight characteristics related to the object in contact with high precision, including four new kinetic properties (static friction coefficient, kinetic friction coefficient, Young's modulus and stiffness). The special touch surface consists of six load cells with cross-roller guides attached to the aluminum base that allows computers to perceive the outside world, similar to how human skin does. When an audience member touches their body or any object on the surface of The Skin, the computer generates moving images and sounds from those eight measured properties. In this process, the connection between the parameters of the output generated by the computer and the values measured from the touch surface changes in a way that maximizes the duration of interaction with the audience based on Karl Sims's artificial evolution process. This process is similar to a baby born with very sensitive skin gradually forming a solidarity connection with the outside world through repeated contact."}, {"v": "", "img": "thumbs/d633e75188c0.jpg", "t": "V[R]ignettes: a microstory series", "a": ["Mez Breeze"], "c": "SIGGRAPH", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3386567.3388562", "abs": "Originally titled A Million and Two, V[R]ignettes is a series comprising virtual reality crafted microstories. Each individual microstory, or vignette, is designed to encourage a kind of \"narrative smearing\"---where traditional story techniques are truncated and mutated into smears (kinetic actions and mechanics, collagelike layered building blocks, visual distortions, dual-tiered text annotations) that require a reader/interactor to make active choices in order to navigate each microstory space (storybox). The microstories presented are part of the ongoing V[R]ignettes Series. When exploring each microstory, a reader will experience poetically dense language (such as letters bracketed in words---requiring rereading---that are designed to expand and enhance meaning potentials) and various visual, textual and technological elements that require direct audience input (such as: Do you choose to view each microstory in a 3D or VR space---through a virtual reality headset or a mobile phone or computer monitor? Do you set each microstory to autopilot or navigate the experience through manual annotation click-throughs and spatial manipulations? Do you choose to use the model inspector and view the microstories without any post-processing effects, or in wireframe? Do you choose to enable audio? Do you read only the title fields or entire paragraphs?). Such smears are also designed to be combined by the reader to create a story-piecing system that's circular in nature, where a reader/interactor is encouraged to experience each microstory multiple times, in multiple ways. For instance, when experiencing \"In the Skin of the Gloam,\" if a reader chooses to read only the title line of each annotation, they'll experience a minimal poetic (title) text version. If they instead read the rest of the annotation accompanying each title line, the narrative is accented differently. If they choose to manipulate (scale, rotate, zoom) the 3D models in the space (and/or if they engage autoplay or, in the case of \"Wracking in the Upper Bubble,\" read the wall text only), a reader's experience will be markedly different from those choosing to experience each microstory in a VR space (where teleportation is an option and the spatial dimension is crucial). To load each microstory, readers press the white arrow in the middle of each V[R]ignettes storybox (and if viewing on a mobile device, they need to make sure to view each storybox in full screen mode). After clicking on the white arrow, to begin reading the text they click on the \"Select an annotation\" bar at the bottom of each storybox screen. From there, they get to choose how they experience all other narrative smearing possibilities. If they need help with navigation and controls, they can click the \"?\" located at the bottom right side of each storybox.", "pos": "50% 0%"}, {"v": "", "img": "thumbs/bae30318a802.jpg", "t": "Animated robotic sculptures: using SMA motion display to create lifelike movements", "a": ["Akira Nakayasu"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388572", "abs": "This paper describes four animated robotic sculptures that are characterized by their use of shape-memory alloy motion display technologies to express lifelike movements, such as rustling leaves or squirming tentacles. These works of art combine plant and animal motifs with robotics to give their audience a sense of the objects being alive through their lifelike movements. These projects attempt to explore what it means to feel alive. They express the grotesqueness and scariness as well as the beauty of the mystery of life and living things.", "ja": "本論文では、形状記憶合金を用いたモーション表示技術によって、葉のざわめきや触手のうごめきといった生命感あふれる動きを表現することを特徴とする、4点のアニメーション・ロボット彫刻について述べる。これらの芸術作品は、植物と動物のモチーフをロボティクスと組み合わせることで、その生き生きとした動きを通じて、オブジェクトが生きているという感覚を観客に与える。これらのプロジェクトは、「生きているとはどういうことか」を感覚的に探求しようとする試みである。生命と生きものの神秘が持つ美しさとともに、その不気味さや恐ろしさをも表現している。", "pos": "50% 0%"}, {"v": "", "img": "thumbs/8550e08f42a5.jpg", "t": "Body RemiXer: extending bodies to stimulate social connection in an immersive installation", "a": ["John Desnoyers-Stewart", "Ekaterina R. Stepanova", "Bernhard E. Riecke", "Patrick Pennefather"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388569", "abs": "Body RemiXer is a mixed reality installation that connects immersants across the virtual/actual divide through emergent tactility and abstract embodiment. Using a virtual reality headset, Kinect and projections, the installation explores the potential of immersive technology to create copresent experiences that foster intercorporeal relationships between immersants wearing a headset and those using the projections. Immersants' bodies are at the center of the installation, activated as a site for social exchange. Body RemiXer has been exhibited at an art festival and at several smaller events. The authors' observations during these exhibits reveal Body RemiXer's capacity to disrupt social norms and stimulate new connections.", "ja": "「Body ReMiXer」は、創発的な触覚性と抽象的な身体化を通じて、バーチャルと現実の境界を越えて没入者同士をつなぐ複合現実インスタレーションである。VRヘッドセット、Kinect、およびプロジェクションを使用し、本インスタレーションは、ヘッドセットを装着した没入者とプロジェクションを使用する没入者との間に身体間的関係を育む、共在的体験を生み出すイマーシブ技術の可能性を探求する。没入者の身体はインスタレーションの中心に置かれ、社会的交換の場として活性化される。「Body ReMiXer」はアートフェスティバルおよびいくつかの小規模イベントで展示されてきた。これらの展示における著者らの観察は、「Body ReMiXer」が社会規範を撹乱し、新たなつながりを刺激する能力を持つことを明らかにしている。"}, {"v": "", "img": "thumbs/42b1cb5fa079.jpg", "t": "Cacophonic choir: an interactive art installation embodying the voices of sexual assault survivors", "a": ["Şöl en Kıratlı", "Hannah E. Wolfe", "Alex Bundy"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388573", "abs": "This paper describes the conceptual background, design and implementation of an interactive art installation, Cacophonic Choir, that aims to bring attention to the firsthand stories of sexual assault survivors. Cacophonic Choir addresses the ways in which their experiences are distorted by digital and mass media, and how these distortions may affect survivors. The installation comprises multiple agents, distributed in space, that are heard from afar as an incoherent cloud of murmurs. Each agent responds to a visitor's proximity by becoming more visually bright, semantically coherent and sonically clear, revealing a different personal account of a sexual assault survivor.", "ja": "本論文では、性的暴行サバイバーの当事者の声に注目を促すことを目的としたインタラクティブ・アートインスタレーション「Cacophonic Choir」の概念的背景、設計、および実装について述べる。「Cacophonic Choir」は、サバイバーたちの体験がデジタルおよびマスメディアによっていかに歪曲されるか、そしてそうした歪曲がサバイバーにいかなる影響を与えうるかを問題提起する。本インスタレーションは、空間内に分散して配置された複数のエージェントで構成されており、遠方からは不明瞭なざわめきの群れとして聞こえる。各エージェントは訪問者の接近に反応し、視覚的に明るく、意味的に明瞭で、音響的にクリアになっていくことで、性的暴行サバイバーそれぞれの個人的な体験の語りを明らかにしていく。"}, {"v": "", "img": "thumbs/c4878b6ec057.jpg", "t": "Cultural viz: an aesthetic approach to cultural analytics", "a": ["Everardo Reyes", "Lev Manovich"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388568", "abs": "Cultural Analytics (C.A.) is an approach for analyzing media and digital culture using data methods and visual computing techniques. This article explores the aesthetic value of C.A. by approaching cultural visualizations as digital artworks. The authors present a variety of techniques developed since 2007 by members of the C.A. lab for creating visualizations of media artifacts and collections of images. Through a series of projects conducted by them, the authors discuss the artistic meaning of media visualizations and their experience in art exhibitions, workshops and seminars.", "ja": "カルチュラル・アナリティクス（C.A.）は、データ手法と視覚的コンピューティング技術を用いてメディアおよびデジタル文化を分析するアプローチである。本論文は、文化的可視化をデジタルアートワークとして捉えることで、C.A.の持つ美的価値を探究する。著者らは、メディアアーティファクトおよび画像コレクションの可視化を生み出すために、C.A.ラボのメンバーによって2007年以降開発されてきた多様な技術を紹介する。著者らが実施した一連のプロジェクトを通じて、メディア可視化の芸術的意味、およびアート展示・ワークショップ・セミナーにおける経験について論じる。"}, {"v": "", "img": "thumbs/8d12bd5542ad.jpg", "t": "Enhanced family tree: evolving research and expression", "a": ["Fan Xiang", "Shunshan Zhu", "Zhigang Wang", "Kevin Maher", "Yi Liu", "Yilin Zhu", "Kaixi Chen", "Zhiqiang Liang"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388570", "abs": "Enhanced Family Tree reimagines the possibilities of family trees with an evolving series of exhibits. The authors' works combine genealogical data, visualization, 3D technologies and interactivity to explore and display ancient genealogical relationships. Their new approach may reveal questionable relationships in genealogical records. Moreover, the authors' use of an organic metaphor of a \"tree\" can be further extended to increase public understanding and engagement. The audience's questions arising from this project show increased curiosity and nuanced questioning about their own family origins and development.", "ja": "「Enhanced Family Tree」は、進化し続ける一連の展示を通じて、家系図の可能性を再想像するプロジェクトである。著者らの作品は、系譜データ、可視化、3D技術、およびインタラクティビティを組み合わせ、古来の系譜的関係を探求・表示する。この新たなアプローチは、系譜記録における疑わしい関係性を明らかにする可能性がある。さらに、著者らが用いる「木」という有機的なメタファーは、公衆の理解と関与を高めるためにより広く展開することができる。本プロジェクトから生じた観客の問いかけは、自身の家族の起源と発展に対する好奇心の高まりと、より繊細な問いへの深化を示している。"}, {"v": "", "img": "thumbs/c131391bf1bd.jpg", "t": "Hybrid embroidery: exploring interactive fabrication in handcrafts", "a": ["Yi-Chin Lee", "Daniel Cardoso Llach"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388575", "abs": "This paper presents Hybrid Embroidery, a framework for interactive fabrication that leverages computational methods to broaden the possibilities of the craft of embroidery. Combining embroidery techniques, generative design methods, computer vision and a computerized embroidery machine, we show how this framework elicits a variety of innovative fabrication experiences that emphasize open-ended exploration, improvisation and play. The paper documents this framework, a series of sample results, challenges and next steps. It further outlines some of its implications for supporting creative exploration through real-time and direct manipulation of materials and close human-machine interaction.", "ja": "本論文では、刺繍という工芸の可能性を広げるために計算的手法を活用したインタラクティブ・ファブリケーションのフレームワーク「Hybrid Embroidery」を紹介する。刺繍技法、ジェネラティブデザイン手法、コンピュータビジョン、およびコンピュータ制御の刺繍機械を組み合わせることで、本フレームワークが、オープンエンドな探索・即興・遊びを重視した多様な革新的ファブリケーション体験をいかに引き出すかを示す。本論文では、このフレームワーク、一連のサンプル成果、課題、および今後の方向性を記録する。さらに、素材のリアルタイムかつ直接的な操作と、人間と機械の緊密なインタラクションを通じた創造的探索の支援に向けた、いくつかの示唆についても概説する。"}, {"v": "", "img": "thumbs/8ca534987ea4.jpg", "t": "Inverse-rendering-based analysis of the fine illumination effects in Salvator Mundi", "a": ["Marco (Zhanhang) Liang", "Shuang Zhao", "Michael T. Goodrich"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388565", "abs": "The painting Salvator Mundi is attributed to Leonardo da Vinci and depicts Jesus holding a transparent orb. The authors study the optical accuracy of the fine illumination effects in this painting using inverse rendering. Their experimental results provide plausible explanations for the strange glow inside the orb, the anomalies on the orb and the mysterious three white spots, supporting the optical accuracy of the orb's rendering down to its fine-grain details.", "ja": "絵画《サルバトール・ムンディ》はレオナルド・ダ・ヴィンチに帰属され、透明な球体を持つイエス・キリストを描いている。著者らは、逆レンダリングを用いて本絵画における精緻な照明効果の光学的正確さを研究する。実験結果は、球体内部の不思議な光彩、球体上の異常、および謎めいた3つの白い点に対して妥当な説明を与えており、球体の描写が微細なディテールに至るまで光学的に正確であることを支持している。"}, {"v": "", "img": "thumbs/a16147a8fcc0.jpg", "t": "Pixel of matter: new ways of seeing with an active volumetric filmmaking system", "a": ["Seonghoon Ban", "Kyung Hoon Hyun"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388576", "abs": "Using volumetric filmmaking as a medium for artists and designers requires the development of new methodologies and tools. We introduce an installation art project using the active volumetric filmmaking technology to investigate its possibilities in art practice. To do that, we developed a system to film volumetric video in real time, thereby allowing its users to capture large environments and objects without fixed placement or preinstallation of cameras. Active volumetric filmmaking helps us realize the digital reconstruction of physical space in real time and can be expected to ultimately facilitate the coexistence of real and virtual spaces.", "ja": "ボリュメトリック映像制作をアーティストやデザイナーのための媒体として活用するには、新たな方法論とツールの開発が必要となる。本稿では、アクティブ・ボリュメトリック映像制作技術を用いたインスタレーション・アートプロジェクトを紹介し、芸術実践におけるその可能性を探求する。そのために、ボリュメトリック映像をリアルタイムで撮影するシステムを開発した。これにより、カメラの固定設置や事前設置を必要とせず、広大な環境や大型オブジェクトを撮影することが可能となる。アクティブ・ボリュメトリック映像制作は、物理空間のデジタル再構成をリアルタイムで実現し、最終的には現実空間と仮想空間の共存を促進することが期待される。"}, {"v": "", "img": "thumbs/ca15301ea9f2.jpg", "t": "REALational perspectives: strategies for expanding beyond the here and now in mobile augmented reality (AR) art", "a": ["Liron Efrat"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388564", "abs": "This article analyzes mobile AR installations in order to demonstrate different strategies for producing a relational sense of place and time. These installations combine multiple narratives in situ; thus, they reshape existing perceptions and influence national identities. By means of exposing actual environments as constructed and therefore as virtual landscapes, mobile AR art exposes our situatedness and becomes a strong tool for activism as it encourages us to think beyond familiar, material reality. As such, it rejects an absolute perception of reality and reconfigures it as a relational domain.", "ja": "本論文は、場所と時間の関係的な感覚を生み出すための異なる戦略を示すために、モバイルARインスタレーションを分析する。これらのインスタレーションは複数のナラティブを現地（in situ）で組み合わせることで、既存の認識を再形成し、国民的アイデンティティに影響を与える。実際の環境を構築されたもの、すなわち仮想的な景観として露わにすることによって、モバイルAR アートは私たちの「状況づけられた存在」を顕在化させ、馴染み深い物質的現実を超えて考えることを促すことで、アクティビズムの強力なツールとなる。そのようなものとして、それは現実の絶対的な知覚を拒否し、現実を関係的な領域として再構成する。", "pos": "50% 40%"}, {"v": "", "img": "thumbs/7a34445d6c43.jpg", "t": "Resonant waves: immersed in geometry", "a": ["Richard Grillotti", "Andy DiLallo", "Angus G. Forbes"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388567", "abs": "This article introduces Resonant Waves, a work of interactive new media art that incorporates cymatic patterns into an immersive installation. The authors describe their research and design process in creating Resonant Waves, and they discuss technical details about the installation, highlighting innovative aspects of the project and contextualizing the project in terms of previous cymatics research and related artistic explorations of complex phenomena. Finally, the authors discuss audience reaction to different installations of the project and identify directions for future research in immersive cymatics.", "ja": "本論文では、サイマティクスのパターンをイマーシブ型インスタレーションに取り入れたインタラクティブ・ニューメディアアート作品「Resonant Waves」を紹介する。著者らは「Resonant Waves」の制作における研究・デザインプロセスを述べ、インスタレーションの技術的詳細について論じるとともに、プロジェクトの革新的側面を強調し、先行するサイマティクス研究および複雑な現象に関する関連芸術的探求の文脈にプロジェクトを位置づける。最後に、著者らはプロジェクトの各インスタレーションに対する観客の反応について考察し、イマーシブ・サイマティクスにおける今後の研究の方向性を示す。"}, {"v": "", "img": "thumbs/abf8e9c97a1a.jpg", "t": "Rilievo: artistic scene authoring via interactive height map extrusion in VR", "a": ["Sevinc Eroglu", "Patric Schmitz", "Carlos Aguilera Martinez", "Jana Rusch", "Leif Kobbelt", "Torsten W. Kuhlen"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388577", "abs": "The authors present a virtual authoring environment for artistic creation in VR. It enables the effortless conversion of 2D images into volumetric 3D objects. Artistic elements in the input material are extracted with a convenient VR-based segmentation tool. Relief sculpting is then performed by interactively mixing different height maps. These are automatically generated from the input image structure and appearance. A prototype of the tool is showcased in an analog-virtual artistic workflow in collaboration with a traditional painter. It combines the expressiveness of analog painting and sculpting with the creative freedom of spatial arrangement in VR.", "ja": "著者らは、VRにおける芸術的創作のための仮想オーサリング環境を提案する。本環境は、2D画像をボリュメトリックな3Dオブジェクトへと容易に変換することを可能にする。入力素材における芸術的要素は、VRベースの使いやすいセグメンテーションツールによって抽出される。次に、入力画像の構造と外観から自動生成された異なるハイトマップをインタラクティブに合成することで、レリーフ彫刻が行われる。本ツールのプロトタイプは、伝統的な画家との協働による、アナログと仮想を組み合わせた芸術的ワークフローの中で実演される。本環境は、アナログ絵画と彫刻の表現力を、VRにおける空間的配置の創造的自由と組み合わせるものである。"}, {"v": "", "img": "thumbs/b3dbcefad1cc.jpg", "t": "Stepping inside the classification cube: an intimate interaction with an AI system", "a": ["Avital Meshi", "Angus G. Forbes"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388566", "abs": "The Classification Cube art installation invites participants to become familiar with a machine-learning classification system. Inside a private space within the gallery, participants' bodies are subjected to a classification process that detects their faces and estimates their age, gender, emotion and actions. Participants are also able to see how their own classification compares with how the installation classifies a series of animated figures. Rapidly changing results encourage participants to actively perform their behavior to the system and alter the way it \"sees\" them. The entanglement with the system raises awareness regarding the effectiveness of machine interpretation.", "ja": "アートインスタレーション「Classification Cube」は、参加者が機械学習による分類システムに親しむことを促す作品である。ギャラリー内のプライベートな空間において、参加者の身体は、顔を検出し、年齢・ジェンダー・感情・行動を推定する分類プロセスにさらされる。また参加者は、自身の分類結果が、インスタレーションが一連のアニメーションキャラクターを分類する方法とどのように異なるかを比較することもできる。めまぐるしく変化する結果は、参加者がシステムに対して能動的に自らの振る舞いを演じ、システムによる自己の「見られ方」を変えようとする行動を促す。システムとのこうした絡み合いは、機械による解釈の有効性に対する認識を高めることになる。"}, {"v": "", "img": "thumbs/40f34eba73b9.jpg", "t": "The unknown person: post-colonial fictioning, personal stories and surveillance", "a": ["Eddie Wong"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388571", "abs": "the Unknown Person connects the artist's family history to Britain's postcolonial \"fictioning.\" The project interrogates the gaze of surveillance and social control systems to explore the fiction of the self, data and liminal spaces of the City of London. The final output of this research is a video documentary that employs machine learning processes and facial recognition techniques to generate visuals to reveal the aesthetic value of a neural network. The project culminated as an installation of multiple screens mounted on a scaffolding structure.", "ja": "「the Unknown Person」は、アーティストの家族の歴史をイギリスのポストコロニアル的な「フィクション化」と結びつける作品である。本プロジェクトは、監視システムおよび社会的管理システムの眼差しを問い直し、自己のフィクション、データ、そしてロンドン金融街（シティ・オブ・ロンドン）のリミナルな空間を探求する。本研究の最終成果物は、機械学習プロセスと顔認識技術を用いてビジュアルを生成し、ニューラルネットワークの美的価値を明らかにするビデオ・ドキュメンタリーである。本プロジェクトは、足場構造に複数のスクリーンを設置したインスタレーションとして結実した。", "pos": "50% 0%"}, {"v": "", "img": "thumbs/1807aaf04056.jpg", "t": "Visual indeterminacy in GAN art", "a": ["Aaron Hertzmann"], "c": "SIGGRAPH", "y": 2020, "k": "Art Papers", "doi": "10.1145/3386567.3388574", "abs": "This paper explores visual indeterminacy as a description for artwork created with Generative Adversarial Networks (GANs). Visual indeterminacy describes images that appear to depict real scenes, but on closer examination, defy coherent spatial interpretation. GAN models seem to be predisposed to producing indeterminate images, and indeterminacy is a key feature of much modern representational art, as well as most GAN art. The author hypothesizes that indeterminacy is a consequence of a powerful-but-imperfect image synthesis model that must combine general classes of objects, scenes and textures.", "ja": "本論文は、GAN（敵対的生成ネットワーク）を用いて制作されたアートワークの記述として、「視覚的不確定性」を探求する。視覚的不確定性とは、一見すると現実のシーンを描写しているように見えながら、精査すると一貫した空間的解釈を拒む画像を指す。GANモデルは不確定なイメージを生成する傾向があるようであり、不確定性は現代の具象芸術の多く、およびほぼすべてのGANアートにおける重要な特徴である。著者は、不確定性とは、オブジェクト・シーン・テクスチャの一般的なクラスを組み合わせなければならない、強力ではあるが不完全な画像合成モデルの帰結であると仮説を立てる。"}, {"v": "", "img": "thumbs/3c344240ca23.jpg", "t": "A letter across the stars", "a": ["JongKuk Won"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427142", "abs": "From the moment mankind began observing the night sky, there is one question that has been in my mind for a very long time. As our attempts to find answers to these questions continued and progressed, we learned more about the universe and humanity."}, {"v": "", "img": "thumbs/616878681c0c.jpg", "t": "AI: artificial interruption", "a": ["Hyejin Hannah Kum-Biocca", "Jinhong Kwon"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427110", "abs": "The artificial, a curtain of cubes, interrupts and rolls over the natural order. Leaves fall and freeze into polygonal crystals. As the artificial interruption spreads fields and leaves shatter into ice cubes. Nature once fluid, splatters, then freezes. The seasons fold like boxes into structures of gray, as we see time crystalize."}, {"v": "", "img": "thumbs/8f0cc2a042aa.jpg", "t": "Alpha and omega", "a": ["Eunsol Kim"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427168", "abs": "'Alpha and Omega' deals with the emotional temperature difference between the fear and anxiety of those who have experienced a disaster and the attitudes of those who do not."}, {"v": "", "img": "thumbs/23a5d32b79a0.jpg", "t": "Arc diffusion", "a": ["Dave Payling"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427105", "abs": "A still photo from artificial life, this is a frozen moment from the movement of simple shapes. Repeated geometric forms were rotated and transformed over time and complex interwoven abstract patterns emerged. These unexpected forms are born from motion and feedback. Initial graphical parameters were predefined and the patterned evolution was set in motion. When the motion is paused the cellular beauty of individual frames is revealed. Chance plays its part in this phenomenon. Individual parameters are predetermined but the end result is indeterminate. The space between known quantities is where the unexpected patterns and lights emerge."}, {"v": "", "img": "thumbs/480e631d3876.jpg", "t": "Augmented creativity", "a": ["Yanyi Lu"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427177", "abs": "This work explores a new process of creativity generation under the guide of Jordanous's Four PPPPerspectives (2016) and speculates intertwined relationships among multi-contributors in computational creativity. This work can also be seen as an experimental multispecies storytelling on creativity."}, {"v": "", "img": "thumbs/4c9fa0cea8e8.jpg", "t": "Augmented reality media to express the experience of Japanese food culture", "a": ["Kei Kobayashi", "Kazuma Nagata", "Junichi Hoshino"], "c": "SIGGRAPH Asia", "y": 2020, "k": "Art Gallery", "doi": "10.1145/3414686.3427107", "abs": "Japanese cuisine was registered as a UNESCO Intangible Cultural Heritage in 2013 designated with an evaluation as a social diet custom embodying a Japanese spirit that respects nature. However, it is difficult to fully understand the cultural characteristics of Japanese food because the actual meal is limited to taste and visual information such as taste, ingredients, tableware, and presentation. In this system, in order to convey Japanese food culture, interaction and video expressions are combined with actual meals, and as users proceed with meals the natural environment, text, and Ashirai projected on the tableware change and the system allows you to learn about the richness of nature that supports Japanese food, the changes in the four seasons, and the relationship with traditional events. The natural environment changes in 10 stages, and users can experience the changing seasons and beauty at their own pace. Ashirai are vegetables and flowers that are added to complement the dishes, and four types of treats are projected onto the tableware according to the changing seasons. The Japanese food in this work consists of \"Ichiju Sansai,\" which means one soup and three vegetables. \"Ichiju Sansai\" is said to be the basis of Japanese food and is composed of a staple food, a soup, two side dishes, and a main dish, and their arrangement is also fixed. We asked several people to experience the system and we were able to tell the users that Japanese food is supported by natural riches and seasons while influencing traditional events as well. It has been also confirmed as another effect that users re-think the act of eating and re-realize Japanese cuisine including recognition of the blessings of nature. Demonstrations are held at the art gallery using cooking models."}, {"v": "", "img": "thumbs/1861ce183dcf.jpg", "t": "Back and forth: pneumatic anadrome [serial painting 1]", "a": ["Alvaro Cassinelli", "Christian Sandor", "Daniel Saakes"], "c": "SIGGRAPH Asia", "y":

bes the making process and the decisions made at each step of designing the installation, while integrating at the same time a deeper discussion on the place of digital privacy and oblivion within the contemporary approach to art and technology."}, {"v": "", "img": "", "t": "Doors 2015", "a": ["David-Alexandre Chanel", "Romain Constant"], "c": "SIGGRAPH", "y": 2016, "k": "Art Papers", "doi": "10.1145/2897843.2915199", "abs": "In indoor physical spaces, the door is the main obstacle to entering and exiting rooms and hallways. From a usability perspective, Donald Norman is celebrated for wondering how \"such a simple thing as a door\" can be \"so confusing\" [7]. The door as physical object has been transformed metaphorically into a transportation device that allows us to completely shift our perspective from one location to the next. The object itself is often imagined as a \"portal\" between spaces and worlds, as it was in 1950 in the quintessential fantasy novel, The Lion, the Witch, and the Wardrobe, by C. S. Lewis. The children in the story open an apparently ordinary wardrobe door and are transported to the magical world of Narnia. Many other movies and stories use doors as portals through time and space, such as the phone booth door in the movie Bill and Ted's Excellent Adventure."}, {"v": "", "img": "", "t": "Flower 2014", "a": ["Viktor Jan"], "c": "SIGGRAPH", "y": 2016, "k": "Art Papers", "doi": "10.1145/2897843.2915195", "abs": "Although Viktor Jan's Flower may seem like an interloper among the many data sculptures and media representations appearing in this exhibition, it provides a contrast from the other works by focusing on how data can spur the creation and loss of natural entities. Inspired by the poem \"Flower,\" by one of South Korea's leading poets of the late 20th century (Kim Ch'un-Su), the flower \"blooms\" or comes to life in a dark environment, when visitors whisper into its microphone, or when it senses data streams on local networks. Unlike a natural flower, Jan's flower awakens in the evening and will never come to life unless someone calls its name. Flower reacts to the idea of \"the gaze\" in digital space, where people online are always vying for more views, likes, and mentions."}, {"v": "", "img": "", "t": "Perceptual cells", "a": ["Alla Gadassik"], "c": "SIGGRAPH", "y": 2016, "k": "Art Papers", "doi": "10.1145/2897843.2915188", "abs": "James Turrell's perceptual cells incorporate the neurophysiological apparatus as an active participant not only in the reception of projected moving-images, but also in the very production and transmission of virtual moving-images. Combining two perceptual phenomena---the stroboscopic effect and the Ganzfeld Effect---Turrell's perceptual cells integrate the architecture of projection with the architecture of organic vision to produce a single networked extra-sensory medium. This paper performs a phenomenological analysis of Turrell's Light Reignfall (2011) perceptual cell, following its design, effects on the viewer, and cultural and material history. In the process, the paper situates the perceptual cell between the history of avant-garde cinema (what historians have called \"paracinema\") and the history of perceptual psychology and parapsychology (what the author terms \"para-cinema\"). Between these two paracinemas, Turrell's perceptual cells activate the aesthetic potential of what the author discusses as \"edgeless projection.\""}, {"v": "", "img": "", "t": "Pulse Shape 22", "a": ["Mark Cetilia"], "c": "SIGGRAPH", "y": 2016, "k": "Art Papers", "doi": "10.1145/2897843.2915186", "abs": "Pulse Shape 22 is an improvisational audiovisual performance featuring shortwave radio transmissions as the sole source material for real-time audio processing alongside video of the sun projected through cast-glass lenses designed specifically for this piece. The structure of the piece is derived from metrics on energy accumulation over a period of 2.2 nanoseconds resulting from the targeting of 60 laser beams on a single tetrahedral hohlraum in weapons testing experiments as carried out by the Los Alamos Inertial Confinement Fusion unit, at the Omega Laser Facility at the University of Rochester. Pulse Shape 22 is an exploration of architectural space through the use of site- and time-specific information found in regions of the electromagnetic spectrum outside the reaches of the human sensory apparatus. It is an attempt to alter the audience's perceptions of their surroundings and create a moment of rupture from hidden worlds found in our local environment."}, {"v": "", "img": "", "t": "Raised on YouTube", "a": ["Misha Rabinovich"], "c": "SIGGRAPH", "y": 2016, "k": "Art Papers", "doi": "10.1145/2897843.2915184", "abs": "Raised on YouTube is an installation and game that grows plants using only the light of projected video and makes ecology legible as a multiplayer game. The challenge of finding the most nurturing video is crowdsourced online. As players watch a webcam feed of the plants surrounded by two-way mirrors, their computer power is diverted to photosynthetic video analysis. The system calculates the photosynthetic score for each video using a basic botanical model. The resulting shape and density of the plant grow bed serves as a data visualization of the energy patterns in the cultural stream. The system provides opportunities to reflect on the effects of long-term exposure to contemporary media and to imagine ecological possibilities of participatory culture."}, {"v": "", "img": "", "t": "Visual history with choson dynasty annals", "a": ["Seong Kuk Park", "Eun Ju Lee", "Jin Wan Park"], "c": "SIGGRAPH", "y": 2016, "k": "Art Papers", "doi": "10.1145/2897843.2915185", "abs": "For this paper, the authors selected three historical events taken from the Annals of the Choson Dynasty that represent dramatic and tragic stories about parents and their sons for data visualization. By connecting names with entities indicating conductions from history books, they found interesting patterns that tell stories with embedded relations. The visualized images in this paper were mainly code-generated, based on the data of the Annals, with some graphic embellishment added."}, {"v": "", "img": "thumbs/bb88e22c6d4d.jpg", "t": "Agitato", "a": ["Rebecca Ruige Xu", "Sean Hongsheng Zhai"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004469", "abs": "Project Agitato attempts to represent evolving musical information within a single image frame, in the hope of capturing the subjective and perceptual qualities of time as expressed in music. The title of the project, named from the music term agitato, depicts the restless agitated style of the music. Each image in this series is generated based on a musical passage from Nicolas Scherzinger's inter-sax-tive. For any given moment in time, spectrum of the music's frequencies is analyzed and used as the input to construct visual elements with various characteristics. As the music progress, the visual elements accumulate and are composed into a single image reflecting the music material within a defined duration of time, allowing viewers to perceive the movement of music from a single viewpoint, rather than as a linear experience of time."}, {"v": "", "img": "thumbs/9cdac532d3af.jpg", "t": "Bodygraphe", "a": ["Esteban Garcia Bravo", "Tim McGraw", "Aaron Zernack"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004476", "abs": "Bodygraphe is an interactive, visual music application that unifies gestural computing with live performance art. Dancers become instruments and conductors that wholly generate graphics and sounds that correspond with their movements in real time. This video is the result of a process in computational aesthetics that explores the relationship between the body and form. Most specifically, we were inspired by visual art avant-gardes that prioritized expressive geometry, such as the Neo-concrete movement of the 1950s. Trough this project, we seek to make an aesthetic statement while also offering new implications for research regarding the interconnectivity between body and technology."}, {"v": "", "img": "thumbs/86a5de9732a8.jpg", "t": "C. bacon", "a": ["Wu Jiaru"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004483", "abs": "C. Bacon is a set of interactive moving images based on a series of paintings on the theme of \"Crucifixion\" by Francis Bacon(1909-1992). Starting with the mysterious aesthetic language of Francis Bacon, this work attempts to build dialogues between the virtual and reality, postmodern technology and contemporary authorship, and between machine and human."}, {"v": "", "img": "thumbs/af9c73772bbb.jpg", "t": "Convolution by wild system", "a": ["John McCormick", "Adam Nash"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004470", "abs": "In Convolution by Wild System, a robot and humans communicate using neural networks to co-create an evolving responsive immersive virtual environment. A child-sized robot sits immersed in a full-room projection of an evolving audiovisual virtual environment. The robot 'talks' to the virtual environment, telling its impressions and what it would like to see and hear. People come and go, talking with the robot about the virtual environment, and showing it pictures on their phones. The robot learns these impressions and talks of them to the virtual environment, which evolves in response."}, {"v": "", "img": "thumbs/82e0969424bc.jpg", "t": "Criss∼crossing the divine", "a": ["Nina Yankowitz", "Peter Koger", "Barry Holden", "Mauri Kaipainen"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004480", "abs": "Criss∼Crossing The Divine/Spiral Vortex Paint Game is an interactive game installation conceived to address the ever-expanding religious intolerance fueling global wars. Attendees use interactive wands to curate topic-words and assign more or less importance to each topic they select. The player receives color coded scripture perspectives parsed from the individual's search. No search results are the same. Directed to a website, the player learns from which 46,000 scriptures within The Old Testament, The New Testament, The Hindu Rig Vedas, The Quran, and Buddhist Texts, their color-coded text results originated."}, {"v": "", "img": "thumbs/b671f1a5fa60.jpg", "t": "Forces in equilibrium", "a": ["Wei-Chun Chen", "Su-Chu Hsu", "Yu-Hsiung Huang"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004478", "abs": "Forces beyond Equilibrium explores how equilibrium is formed out of chaos. The installation is comprised of two components. In the first component, a sensor is mounted under the top of a pedestal. When magnets are moved on the pedestal, images and sound on a nearby display become wild and unstable, as if the magnet has unusual powers. The second component is a seesaw controlled by a servomotor. When laser light lands on the seesaw, it tilts accordingly, as if the light has weight. The art works show both magnetic force and laser light as not merely ethereal but as entities capable of affecting images, sounds and movements."}, {"v": "", "img": "thumbs/5f58c4bf55fb.jpg", "t": "Homes", "a": ["Tamas Waliczky", "Anna Szepesi", "Jane Prophet"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004485", "abs": "Homes presents the interior spaces where people from the fishing village of Tai O live. The installation includes the everyday objects with which they surround themselves. Two LCD monitors show virtual interiors of two village houses. Visitors to the installation can wander these virtual interior spaces by using trackballs attached to each screen. A large photo showing the street where the houses are located is on a facing wall."}, {"v": "", "img": "thumbs/8e802e94d59b.jpg", "t": "Ink fall", "a": ["Haozhe Li"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004484", "abs": "Ink Fall is an interactive installation using digital techniques to make ancient Chinese paintings come alive. The inspiration for the work reaches back to 3000 years ago, when Chinese artists first began creating Shanshui ink paintings. The emphasis in traditional Chinese ink paintings is on atmosphere, specifically the fluid atmosphere of moving water. The ancient artists' representation was limited by traditional techniques; once painted, the ink would not move. Viewers could only imagine the movement being depicted. Ink Fall experiments with bringing the concept of fluidity to a new reality through modern digital techniques, allowing viewers to perceive atmospheric changes over time."}, {"v": "", "img": "thumbs/b96ce0f3a65a.jpg", "t": "Journey through the centre_01", "a": ["Keith Brown"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004473", "abs": "My sculptures are born out of the direct, spontaneous, manipulation of geometry in a multi-dimensional cyber space where material, as we understand it, does not exist. In the cyber environment 3D entities may be encouraged to behave in ways not achievable through physical means. These virtual sculptures, made manifest through 3D printing, act as a vehicle which transports us to this strange and wonderful \"other place' --- to an environment where physics, materiality and gravity, play no part, freeing form from material constraints, and transcending our given understanding of how objects behave in the world, presenting us with truly new aesthetic experiences."}, {"v": "", "img": "thumbs/d614a8859fe9.jpg", "t": "Light storm PLUS", "a": ["He-Lin Luo", "I-Chun Chen", "Yi-Ping Hung"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004479", "abs": "In the analogue world, electronic signals are based on waveforms. Transmissions of sound waves, light waves, and water waves, all use waveforms to transmit vital information directly related to energy distribution, making waveforms an integral part of our daily lives. The art work Light Storm PLUS uses power generated by waveforms to control the motor of a high-speed rotation device transmitting electroluminescent (EL) cold light. The artwork replicates the shape of wave forms in the real world, thus the light waveforms fluctuate with same rhythm as they do in the analog world. Through interacting with the artwork, people sense that their bodies are key to the transmission of data, as they become active components in the feedback loop, but also become part of the mechanism of transmission."}, {"v": "", "img": "thumbs/ee5098d01eca.jpg", "t": "Luminescent tentacles", "a": ["Akira Nakayasu"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004486", "abs": "Luminescent Tentacles is an interactive installation inspired by waving tentacles of sea anemones in the depths of the ocean. Comprised of 256 shape-memory alloy actuators, the elongated forms move in response to hand movements. Further accentuating the movement, the tip of each actuator softly glows like a bioluminescent organism. Each actuator, or tentacle, is activated by three shape-memory alloy wires, giving the tentacle the flexibility to bend in six directions through the combination of three currents. Employing principles of fluid dynamics, the control application replicates the movement of water ripples. Luminescent Tentacles also includes sounds, prompting the viewer to create music while using hand movements to stimulate the movement of the tentacles, thereby offering an experience similar to interacting with sea anemones."}, {"v": "", "img": "thumbs/db3af3efad45.jpg", "t": "Medallions", "a": ["Joe Takayama"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004481", "abs": "Medallions is comprised of a series of 3D-printed wall plaques featuring algorithmic ornate medallions. Each medallion was generated procedurally with the Processing language. This project is an attempt at translation from traditional ornamentation to modern algorithmic fabrication by using a combination of the procedural approach of Computer Generated Imagery (CGI) and the rapidly expanding field of 3D printing technology."}, {"v": "", "img": "thumbs/364e55c3a43c.jpg", "t": "MovISee", "a": ["Yen-Ting Cho", "Yen-Ling Kuo", "Yen-Ting Yeh"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3007171", "abs": "MovISee is a digital software for people to create personal visual outputs. We use a depth camera to create mixed reality for people to explore the selected information and ultimately transform their understanding the ability of their body movement to create composite customized visual outputs. In short, it is a system to recreate information and explore personal creativity. The results reveal the sedimentary relative movements through filming; time and space are deconstructed to the extent that meaning is shifted and interpretations become multifaceted; multi-layered images are created in which the fragility and instability of our reality is questioned."}, {"v": "", "img": "thumbs/087060d4b6d1.jpg", "t": "NARCISSUS", "a": ["Santiago Echeverry"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004487", "abs": "NARCISSUS is an experimental video and series of large format prints created using the Kinect sensor and Processing 2.0. The works explore the nature of love and tension in the line. The ambiguity of perspective in 3D imagery makes it appear as if the main character in the piece is both lover and loved at the same time, reinforcing the idea of a passionate need that cannot be fulfilled. This work is inspired by a 1976 drawing of Colombian artist Luis Caballero, who died of AIDS in 1995, whose work was a painfully ecstatic, homo-erotic portrait of a generation that was just coming out of the closet. Almost 40 years later, we find ourselves in a Lipovetskian era, where narcissism appears to counterbalance the erotic angst. The actor's performance is altered due to the usage of technologies that question the traditional role of the video camera's single point of view."}, {"v": "", "img": "thumbs/580972669065.jpg", "t": "Notations", "a": ["Johnson Liew", "Jie-Jun Zhu", "Sheng-Chieh Wang", "Jia-Ying Chou"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004482", "abs": "Notations is an interactive musical installation, enabling viewers to instantly compose music and produce clefs on a projection screen. To initiate the interaction, the viewer touches strings, triggering the projection of musical notations. Simultaneously, one of the screens displays an interactive animation. The idea of using music sheet design came from Gregorian Chants, referring to the musical scores used in the mid-5th century Western Europe. Today, as part of the technological generation, the Digital surrounds us in all aspects of our lives, including music. The objective in Notations is to use interactivity to explore the conversion of the digital signal back to the original source of musical notations, expressing the digital aesthetics of interactive technology art and collaborative creation, and imbuing digital kinetic instruments with enhanced cultural and musical qualities."}, {"v": "", "img": "thumbs/4c6d8ab175f8.jpg", "t": "One-stroke", "a": ["Yuichiro Katsumoto"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004475", "abs": "A character or letter is a two-dimensional symbol. Also, it is a static image. But we cannot write a letter without moving our bodies and spending time. Thus, each character or letter potentially has a time axis. In order to reveal this time axis, the device called Mojigen. was created. Mojigen writes alphabets in the air by the trajectory of coil springs operated by eight robot arms. By observing Mojigen from different points of view, the viewer notices that characters and letters contain a time axis with dynamic movements."}, {"v": "", "img": "thumbs/7ecddb159c93.jpg", "t": "Sympathist", "a": ["Wei-Peng Kuo", "Jian-Wun Jhemg", "Chia-Hsiang Lee", "Pey-Chwen Lin"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004488", "abs": "The Sympathist is an exploration of scenery as imagined by our brains. In the digital age, we spend most of our time in cyberspace exchanging information and knowledge; we are more familiar with tools connecting us to cyberspace than to the real environment. Our five senses, originally meant to accept natural frequencies, have been altered by uncoordinated artificial frequencies, so that we are forgetting our original feelings. This work links the brain wave detector to virtual scenes and brain landscapes. The viewers embark on a journey the moment they put on the device, as detected brain data is immediately reflected on the virtual scene. With input from the audience, the device gradually delves into the deepest layer of consciousness. When consciousness loses itself in a trance, it quickly returns to a starting point of rationality. The brain wave detector enables us to let go of rationality and meander around our instincts and deepest memories."}, {"v": "", "img": "thumbs/f58047265cc7.jpg", "t": "The unbearable lightness and heaviness of being", "a": ["Yuko Oda"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004472", "abs": "In the sculptural installation, The Unbearable Lightness and Heaviness of Being, rapid prototyping machines were used to print the 3D forms, which were then installed in unique formations with other natural materials. This work contains conceptual and formal contradictions. Conceptually, it embodies an existence of opposing forces - depicting organisms in flight, but rooted. Structurally, the natural and synthetic are fused; fragile, intricate forms made of plastic and advanced digital technologies are juxtaposed with organic matter."}, {"v": "", "img": "thumbs/304c392cfbb2.jpg", "t": "Time machine", "a": ["YouSuk Kim", "HuiBeom Yu", "JungHwan Sung"], "c": "SIGGRAPH Asia", "y": 2016, "k": "Art Gallery", "doi": "10.1145/3004257.3004471", "abs": "Time Machine is a work constructed on the principles of zoetropes. Through the use of a 200 w motor to control speed and rotation, in combination with a pulsating strobe light, the artists create the optical illusion that 15 separate frames of an animation are actually connected. A small step motor added to the work references a number wheel, which spins separately from the animation, so that that the viewer understands the work as being about expanded time."}, {"v": "", "img": "", "t": "Articulating media arts activities in art-science contexts", "a": ["Angus Graeme Forbes"], "c": "SIGGRAPH", "y": 2015, "k": "Art Papers", "doi": "10.1145/2810177.2810179", "abs": "This paper discusses the conflicting expectations for media artists taking part in art-science collaborations. Despite the increasing opportunity to participate in these interdisciplinary projects, it can be unclear how media arts activities are best articulated, or even if they need to be defined at all. Additionally, this paper examines a methodological framework widely used in the visualization community for identifying different visualization tasks within research activities. Inspired by its success, this paper proposes a new methodological framework for media arts activities in art-science contexts. This framework splits media arts activities into overlapping areas: generation, augmentation, provocation and mediation, providing a useful way to articulate the broader importance of media arts in interdisciplinary collaboration."}, {"v": "", "img": "", "t": "Ethics, ecology, and the future", "a": ["Kayla Anderson"], "c": "SIGGRAPH", "y": 2015, "k": "Art Papers", "doi": "10.1145/2810177.2810180", "abs": "Art and design have become platforms for discussing the long-term implications of technology and modernity, most recently in relation to ecological crisis and the Anthropocene. While artists, designers and curators seek to raise awareness of the Anthropocene, it is important to remain critical of the narratives these practitioners develop. This paper provides a brief critique of how these issues are being addressed in the cultural sphere, suggesting that works of critical, conceptual and speculative design may be best suited to addressing the Anthropocene as they foster critical thinking about how we relate to technology and science, how we organize ourselves politically and socially, and how we define ourselves in the broader ecological assemblage. Artists and designers discussed include Marina Zurkow, Una Chaudhuri, Oliver Kellhammer, Fritz Ertl and Sarah Rothberg; Anthony Dunne and Fiona Raby; and Jae Rhim Lee."}, {"v": "", "img": "", "t": "Hybrid craft", "a": ["Amit Zoran"], "c": "SIGGRAPH", "y": 2015, "k": "Art Papers", "doi": "10.1145/2810185.2810187", "abs": "This article introduces the Hybrid Craft exhibition, positioning 15 hybrid projects in the context of today's Maker culture. Each project demonstrates a unique integration of contemporary making practice with traditional craft. The presenters in the show represent a wide range of professional backgrounds: independent makers, students and teachers, designers associated with research institutes, and commercial organizations. The background of Hybrid Craft, the makers and their works, including tool-making, jewelry, bowl-making and interactive design, are presented. The discussion focuses on integrating human skill and design to introduce a diverse portfolio of technologies used in this hybrid making process."}, {"v": "", "img": "", "t": "Light pattern", "a": ["Daniel Temkin"], "c": "SIGGRAPH", "y": 2015, "k": "Art Papers", "doi": "10.1145/2810177.2810184", "abs": "This paper explores the author's Light Pattern project, a programming language where code is written with photographs rather than text. Light Pattern explores programming languages as the most direct conduit between human thinking and machine logic. It emphasizes the nuance, tone and personal style inherent in all code. It also creates an algorithmic photography structured by the programs one writes, but not ultimately computer-generated. The paper looks at connections to both hobbyist/hacker culture (specifically esolangs) and to art-historical impulses and movements such as Fluxus and Oulipo."}, {"v": "", "img": "", "t": "The Bailey-Derek grammar", "a": ["Vernelle A. A. Noel"], "c": "SIGGRAPH", "y": 2015, "k": "Art Papers", "doi": "10.1145/2810177.2810182", "abs": "This paper presents work on the development of a shape grammar that records the dying, undocumented craft of wire-bending in the Trinidad Carnival. This craft is important for the building and continuation of cultural heritage and identity. Due to the lack of prior research in this non-Western design practice, the author conducted site visits, interviews and observations, and visually examined wire-bent artifacts in Trinidad to develop this grammar. This paper presents the materials, steps and shape rules that begin to synthesize the craft, as well as one design. This study and the resulting grammar have positive implications for design education and practice."}, {"v": "", "img": "", "t": "The dual skins of a media façade", "a": ["Claude Fortin", "Kate Hennessy"], "c": "SIGGRAPH", "y": 2015, "k": "Art Papers", "doi": "10.1145/2810177.2810181", "abs": "In the fall of 2013, Mégaphone, an architectural-scale interactive \"Speakers' Corner,\" was deployed outdoors after dusk in downtown Montréal, Canada. This urban art installation included a monumental media façade designed to display a transcription of some of the words uttered into the microphone by end users. Driven by the system's two temporal modalities---a performative \"live mode\" and an archival \"sleep mode\"---the video projections revealed the dual skins of a media façade that spanned almost an entire city block. This article examines how activists appropriated Mégaphone to transform an ordinary building into an urban mausoleum."}, {"v": "", "img": "", "t": "Yturralde", "a": ["Esteban García Bravo", "Jorge A. García"], "c": "SIGGRAPH", "y": 2015, "k": "Art Papers", "doi": "10.1145/2810177.2810183", "abs": "This research highlights José María Yturralde's most significant involvement and contributions to early computer art from 1968 to 1973. Yturralde collaborated with artists and scientists to expand and redefine his understanding of shapes, and explored ways that the mainframe computer could be used as a tool for complementing his art practices. He is known for developing a mathematical model with which he was able to create a highly sophisticated program where Penrose geometries could be recombined algorithmically. However, there is limited evidence and access to the code of the actual software. The authors' goal is to further understand Yturralde's contribution by developing a re-significance of his model, which they have accomplished through a modern interpretation of manuscripts."}, {"v": "", "img": "", "t": "(Projection) mapping the brain", "a": ["Jane Prophet"], "c": "SIGGRAPH Asia", "y": 2015, "k": "Art Papers", "doi": "10.1145/2835641.2835645", "abs": "This paper discusses the author's artwork, Neuro Memento Mori, a self-portrait comprising digital animations and live action video projection-mapped onto a 3D print. The life-sized sculpture of the head and neck, dissected to reveal the artist's brain, was produced from MRI data gathered as the artist viewed memento mori paintings and meditated on death. The production of the artwork, made with neuroscientists, explores the relationship between the so-called frontier of neuroscience, data and the map. The use of computation to produce neuroimages, 3D prints and projected video is discussed from the perspective of critical cartography."}, {"v": "", "img": "", "t": "Conceptual superposition", "a": ["Fabian Offert"], "c": "SIGGRAPH Asia", "y": 2015, "k": "Art Papers", "doi": "10.1145/2835641.2835643", "abs": "The idea of quantum simulation, first conceived by Richard Feynman in his influential 1982 lecture \"Simulating Physics with Computers\" [Feynman 1982], introduced a peculiar new way of thinking about the relationship between the material and the symbolic. In this paper1, I examine the conceptual and aesthetic implications of quantum simulation by reading Feynman's lecture with Theodor W. Adorno's aesthetic theory. I argue that quantum simulation, as it requires nothing less than the simulated to become the fabric of the simulation, actively symbolizes the material---not by referencing it but by transforming it into an actual symbolic system that exists in the real world, like the electric charges that do not represent but are our thoughts in the realm of the material. The very notion of quantum simulation can thus be understood to be in a state of conceptual superposition---which is, at its core, an aesthetic principle."}, {"v": "", "img": "", "t": "Dear human", "a": ["Lai Chun Wai", "Leung Yi Hang", "Lui Sze Mei", "Ng Siu Tak", "Yuen Kin Hang"], "c": "SIGGRAPH Asia", "y": 2015, "k": "Art Papers", "doi": "10.1145/2835641.2835647", "abs": "Inspired by the cruelty in intensive farming of animals, the aim of this installation is to express the sorrow of livestock and poultry and remind people of the story behind their food. Even if you did not kill the animal, eating is just same as killing them. The installation includes traditional Chinese philosophy, which depict the harmonious relationship of human and animal. We would like audience to meditate about this as well. For the research, there were data showing the correlation between population increment and meat consumption. As meat demand increase, inhumane factory farming was adopted. Moreover, some slaughterhouses were still using cruel way to kill the animals. Even those adopted more humane way of killing still cannot avoid the pain and fear suffered by the animals."}, {"v": "", "img": "", "t": "HCI in performance arts and the case of Illimitable Space System's multimodal interaction and visualization", "a": ["Miao Song", "Serguei A. Mokhov", "Peter Grogono", "Sudhir P. Mudur"], "c": "SIGGRAPH Asia", "y": 2015, "k": "Art Papers", "doi": "10.1145/2835641.2835649", "abs": "The primary aim of this art paper is to present a case study of the use of modern 3D graphics and sensor technologies in interactive stage performances. Specifically, we present studies of interactive performances in which we have used the Illimitable Space System, a proof-of-concept tool box that offers configurable multimodal interaction via a variety of means. The animation and interaction are all done in real-time and can be of arbitrary duration while the system is up and running. Earlier ISS versions were exhibited in the end of 2012 and 2013 during Open House and Stewart Hall Expo-Science events, as well during the 2014 2-day Chinese New Year Gala performance during the Ascension dance at Concordia University, Montreal, Canada, and in the large Like Shadows theatre production in Beijing, China. We describe how ISS was configured and used in these events, and the valuable feedback obtained, confidence gained in interactive technology usage in performances, and lessons learned from them. All of which help us in making continuous improvements in ISS. As a result this paper includes the themes of these events, methods, theory, and history. Since technology has been used in stage performances from ancient times, we start with a brief historical background of technology in performance arts."}, {"v": "", "img": "", "t": "Meditative process in new media art", "a": ["Su Hyun Nam"], "c": "SIGGRAPH Asia", "y": 2015, "k": "Art Papers", "doi": "10.1145/2835641.2835648", "abs": "In this paper, the author suggests affective possibilities in technology that can be found in a digital art making process. As going through a persistent, intimate process of digital production with contemplation, media artists gain a unique experience and build an affective relationship with digital technology. Through the process, artists realize the gap between their mind image and digital representation and discover the affective potentials that connect digital media and bodies. The author explores the ambiguous nature of affect and addresses an alternative relationship between human bodies and digital technology. The author, as a media artist, experiences the awakening through her making process and realizes that its analogy to Zen practice in arts that requires a meditative discipline and inner interaction with the tool and media itself. Media artists overcome the limit of the absolute rationality and discontinuity of digital media through a meditative computational mode of operation."}, {"v": "", "img": "", "t": "Numerical anamorphosis", "a": ["Francesco de Comite", "Laurent Grisoni"], "c": "SIGGRAPH Asia", "y": 2015, "k": "Art Papers", "doi": "10.1145/2835641.2835642", "abs": "Anamorphoses have been know for centuries, as distorted images needing to be seen in a mirror from a special point of view in order to see the non-distorted image. During Renaissance, they have been associated to mathematical techniques for drawing such pictures efficiently, on specific mirror shapes (in the case of cylindrical or conical mirrors). We can expect in the next years a strong interest in such type of images, because of the emergence of various contexts and physical supports for image visualization (soft or deformable screens, lightmapping, projection of images on dynamic objects, etc...). Solving the numerical problem of anamorphosis in the general case belongs to the same class of problems as when the trend is to control image deformation as long as image is seen projected on, or reflected by, a non-planar surface, which can be of arbitrary shape. In this work, we show how raycasting technique, well-known in the computer graphics community, can be used to provide an efficient general framework for such rendering."}, {"v": "", "img": "", "t": "Super-natural", "a": ["In Dae Hwang", "Mark Guglielmetti", "Vince Dziekan"], "c": "SIGGRAPH Asia", "y": 2015, "k": "Art Papers", "doi": "10.1145/2835641.2835644", "abs": "The ways in which digital technologies find themselves integrated into society are influenced to a significant degree by cultural conventions. In Western culture there is a tendency to consider digital technology in terms of hardware and software that is introduced into various processes to enable us to work more efficiently and better negotiate our domestic and networked social lives. Such conventions render digital technologies transparent and invisible and in doing so defers our realization that technology is always with us; everywhere and in everything. This culturally reinforced attitude obscures our perceptual experience of \"technology-being-with-us.\" In response, this paper examines our relationship with technology through exploring alternative, non-Western conceptions of interdependence. In support of this study we examine a series of cultural activities practiced in Korea in order to appreciate how the hardware and software associated with digital technologies can be perceived as non-human entities. This discussion will extend onto an analysis of selected artworks by Nam June Paik, before turning attention to the Japanese media art movement Device Art. The characteristics of this genre --- noted for its particular relation to Japanese cultural influences --- will be examined to reveal how everyday technologies are used to create interactive experiences that promote a sense of \"technology-being-with-us.\""}, {"v": "", "img": "", "t": "SyncDon II", "a": ["Issey Takahashi", "Akihito Ito"], "c": "SIGGRAPH Asia", "y": 2015, "k": "Art Papers", "doi": "10.1145/2835641.2835646", "abs": "\"SyncDon II\" aims to share emotion to others non-verbally by heartbeat synchronization. When you hold the gift-box, the box vibrates, and intermittent pulse sounds with flashing lights are given to you according to heartbeats acquired from a person in the past. When you are exposed to the stimuli; your heartbeat gradually synchronizes to the rhythm of the stimuli, and your circulation through the body gets similar to the heartbeats of the person. The assimilation of the body condition makes you to have similar emotion that the person felt during the recording. This configuration is entirely unique, especially using the heartbeat synchronization for sharing emotion is which nobody ever tried. We believe that \"SyncDon II\" will bring us new sensations we have never experienced."}, {"v": "", "img": "thumbs/ad909fdda526.jpg", "t": "Apparition", "a": ["Paul L. Stout"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2601092", "abs": "Apparition is a series of six artworks about natural processes envisioned as elaborate machines. These constructed devices were meant to build natural systems using technological metaphors, a didactic display of industry and natural history. The project focused on exploring ideas of nature as machine and machine as simulation of nature."}, {"v": "", "img": "thumbs/7c3732084780.jpg", "t": "Levitate", "a": ["Yunsil Heo", "Hyunwoo Bang"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2601089", "abs": "Levitate is a kinetic sculpture composed of levitated ping-pong balls in acrylic tubes that interact with audiences."}, {"v": "", "img": "thumbs/38e6631bf143.jpg", "t": "Lineographs", "a": ["Joseph Farbrook"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2601085", "abs": "Translating the essence of artistic gesture and motion, the Lineograph series is created on electronic ink displays (similar to the original Kindle screen), emitting no light, mimicking the aesthetic of ink drawing, however with movement."}, {"v": "", "img": "thumbs/0513af1aae7f.jpg", "t": "Looking glass time", "a": ["Yoichi Ochiai"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2601083", "abs": "If recording devices had not been invented, duplication of objects would have been required to produce movies. Social media is an artificial timeline that reflects the real world. This work aims to represent social media activities and their timelines with physical clock animation, without any recording media."}, {"v": "", "img": "thumbs/1a4c54cd2488.jpg", "t": "Modern video processor", "a": ["Yunsil Heo", "Hyunwoo Bang"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2601090", "abs": "The Modern Video Processor is a skeuomorphic metaphor to reminisce about the simple days when talking to machines just meant plugging cables, switching buttons, and rotating dials."}, {"v": "", "img": "thumbs/115ef1eea5c4.jpg", "t": "Mother", "a": ["Inmi Lee", "Kyle McDonald"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2601084", "abs": "Mother is a series of generative sculptures that explore synesthetic connections between language and form by analyzing hand gestures that represent the participants' interpretations of unfamiliar spoken words. The gestures of the participants were captured in 3D using a Kinect, interpreted with openFrameworks, and printed with a rapid prototyping machine."}, {"v": "", "img": "thumbs/b24ee5cbf1bb.jpg", "t": "Points of view", "a": ["Zohar Kfir"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2677718", "abs": "Points of View is an interactive web documentary based on video footage shot by Palestinians working with B'Tselem's Camera Distribution Project. It offers an intimate and situated look at life under the Israeli occupation. This project brings these materials to the international public in a manner that is respectful of their content yet innovative enough to provoke a more nuanced form of engagement than conventional documentary; it is an artistic exploration of a complex political issue that raises questions of community engagement, social awareness, and the social and phenomenological shaping of narrative."}, {"v": "", "img": "thumbs/e2dc99f42b98.jpg", "t": "SeeMore", "a": ["Sam Blanchard", "Kirk Cameron"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2601091", "abs": "SeeMore is a kinetic sculpture that showcases the inherent beauty of parallel algorithms through the correlating movements of an animatronic 256-node Raspberry Pi computer cluster."}, {"v": "", "img": "thumbs/0c7bccf90e49.jpg", "t": "Speculatorum oculi", "a": ["Erik Brunvand"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2601088", "abs": "Speculatorum Oculi (The Eyes of Spies) comments on current surveillance activities of governments and corporations through an installation that includes an architectural model surveilled with looming video cameras providing live feeds to a set of video monitors. These monitors show views of the model and of other video cameras placed around the installed site."}, {"v": "", "img": "thumbs/aa5dac3a0c04.jpg", "t": "Subway stories", "a": ["Alon Chitayat", "Jeff Ong"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2601086", "abs": "Subway Stories is an interactive storytelling installation first presented at New York University. The experience begins with a projection of an animated subway car. The train is filled with passengers---illustrations of real-life commuters drawn on subway rides across New York City. A physical \"conductor's box\" gives users control of where the projection is focused. One handle controls the train's speed, and the other handle controls the camera zoom. The audience hears the thoughts and sounds of the passenger in focus. Zooming into specific characters triggers their \"stories\"---audio narrations recorded to capture the inner lives of each passenger."}, {"v": "", "img": "thumbs/1cc1570e1b6d.jpg", "t": "The evolution of silence", "a": ["Rachele Riley"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2601093", "abs": "The Evolution of Silence addresses the scale of damage brought about by 41 years of nuclear testing at the Nevada Test Site. The web-based archive presents a non-linear map and interpretation of the area's destruction and an opportunity to explore this restricted desert landscape."}, {"v": "", "img": "", "t": "TRANSICONMORPHOSIS", "a": ["Emilio Vavarella", "Fito Segrera"], "c": "SIGGRAPH", "y": 2014, "k": "Art Gallery", "doi": "10.1145/2601080.2601087", "abs": "TRANSICONMORPHOSIS, the result of a theoretical reflection on the development of new forms of technological communication and their effects on human beings as well as their political impact, comprises a conventional chat service hosted in a computer interfaced with a series of electrodes connected to the face of the artist. The emoticon received through the chat translates into electrical impulses that force the artist's facial features to mimic the expression of each emoticon."}, {"v": "", "img": "", "t": "A piece of the pie chart", "a": ["Annina Rüst"], "c": "SIGGRAPH", "y": 2014, "k": "Art Papers", "doi": "10.1145/2601080.2677713", "abs": "This paper analyzes the robotic gallery installation A Piece of the Pie Chart. The project addresses gender inequity in the tech world. It consists of a computer workstation and a food robot. The food robot puts pie charts onto edible, pre-baked pies. They depict the gender gap in technical environments. Visitors use the robot to create pies. Pictures of the pies are disseminated via Twitter, and the physical pies are mailed to the places where the data originated. In the following text, the author disassembles the machine in the context of feminist theory, feminist technology research, visualization, and political robotics."}, {"v": "", "img": "", "t": "Aesthetics of biocybernetic designs", "a": ["Reynaldo Thompson", "Tirtha Prasad Mukhopadhyay"], "c": "SIGGRAPH", "y": 2014, "k": "Art Papers", "doi": "10.1145/2601080.2677708", "abs": "The authors identify some of the theoretical premises of biocybernetic art objects, with reference to the works of Nam June Paik, Edward Ihnawitz, Ulrike Gabriel, and most notably, Gilberto Esparza, the Mexican biocybernetic artist. Systems theory anticipates stochastic convergences in nature, defying the classic certitude of the teleological notion of form. Evidence for this paradigmatic shift is found in the biocybernetic creatures conceived by these roboticists. In much biocybernetic art, beauty emerges in the form of adaptive mechanisms, such as in robotic tetrapods or self-organizing artificial plants. Such structures provide a template for survival mechanisms in an increasingly entropic environment."}, {"v": "", "img": "", "t": "Malleable environments and the pursuit of spatial justice in the Bronx", "a": ["Melanie Crean"], "c": "SIGGRAPH", "y": 2014, "k": "Art Papers", "doi": "10.1145/2601080.2677710", "abs": "A design team in the Hunts Point neighborhood of the South Bronx used methodologies of performance and collaborative, location-based storytelling to contend with the effects of urban spatial injustice in the community. Ideation via a series of participatory performances led to creation of a mobile cinema application as the starting point for public, location-based cinema walks. The application accepts user-generated content, acting as a new form of generative monument to the neighborhood as it evolves. The project exemplifies how installing situated technologies for an embodied form of participation can help translate local concerns to outside audiences, in this case using a metaphorical, locative media platform to discuss the evolving nature of environmental discrimination, over-incarceration, and urban spatial justice in New York City."}, {"v": "", "img": "", "t": "Nervous ether", "a": ["Kathy Velikov", "Geoffrey Thün", "Mary O'Malley", "Wiltrud Simbuerger"], "c": "SIGGRAPH", "y": 2014, "k": "Art Papers", "doi": "10.1145/2601080.2677711", "abs": "This paper describes the authors' exploration and experimentation with cellular pneumatic aggregates for kinetic, environmentally responsive envelope systems. The work is situated within the history and technology of pneumatic structures, biological paradigms, the agency and aesthetics of material, information translation, and the tension between performance and affect within responsive environments. The paper elaborates on the physical and computational development of novel pneumatic systems, experimentation with their interactive capabilities, and a recently completed installation, Nervous Ether, a pneumatic spatial envelope that operates as an instrument to register and communicate remote environmental information while also developing affective interaction with inhabitants."}, {"v": "", "img": "", "t": "Object intermediaries", "a": ["Kayla Anderson"], "c": "SIGGRAPH", "y": 2014, "k": "Art Papers", "doi": "10.1145/2601080.2677712", "abs": "This paper uses Walter Benjamin's concept of translation between people and things as a focal point for analysis of the work of contemporary new-media artists Paula Gaetano Adi and Lindsey French, who utilize robotics and interactive technology to explore interspecies communication. Framed by materialist, poststructuralist, and posthumanist theory, along with recent discourse in object-oriented ontology, this paper poses the work of Gaetano Adi and French as potential models for visualizing object-oriented and vital materialist interactions. In the age of the Anthropocene, thinking beyond the human has become increasingly vital in both ethical and ecological terms, making the ability to envision less anthropocentric, more object-oriented worldviews both novel and timely."}, {"v": "", "img": "", "t": "Posture platform and the drawing room", "a": ["Luc Courchesne", "Emmanuel Durand", "Bruno Roy"], "c": "SIGGRAPH", "y": 2014, "k": "Art Papers", "doi": "10.1145/2601080.2677714", "abs": "Three-hundred-sixty-degree audio/visual immersion and the restoration of non-verbal communication cues are essential features for interfaces inviting the human body in cyberspace. The Posture Platform is a network of bases that offers access to a shared virtual environment. Each base is composed of an immersive 360-degree visual display, a surround-sound system, an array of image capture devices, a microphone, an omnidirectional controller/pointer, and a computer with wifi and an internet connection. The Drawing Room is the most recent virtual space developed for the platform. It invites participants to a blank shared space where they draw their own environment collaboratively. The platform, and the project it hosts, is an example of the art, design, and engineering challenges and opportunities associated with development of inhabitable cyberspace."}, {"v": "", "img": "", "t": "The aesthetics of liminality", "a": ["Patrick Lichty"], "c": "SIGGRAPH", "y": 2014, "k": "Art Papers", "doi": "10.1145/2601080.2677709", "abs": "From ARToolkit's emergence in the 1990s to the emergence of augmented reality (AR) as an art medium in the 2010s, AR has developed as a number of evidential sites. As an extension of virtual media, it merges real-time pattern recognition with goggles (finally realizing William Gibson's sci-fi fantasy) or handheld devices. This creates a welding of real-time media and virtual reality, or an optically registered simulation overlaid upon an actual spatial environment. Commercial applications are numerous, including entertainment, sales, and navigation. Even though AR-based works can be traced back to the late 1990s, AR work requires some understanding of coding and tethered imaging equipment. It was not until marker-based AR, affording lower entries to usage, as well as geo-locational AR-based media, using handheld devices and tablets, that augmented reality as an art medium would propagate. While one can argue that AR-based art is a convergence of handheld device art and virtual reality, there are intrinsic gestures specific to augmented reality that make it unique. The author looks at some historical examples of AR as well as critical issues of AR-based gestures such as compounding the gaze, problematizing the retinal, and the representational issues of informatic overlays. This generates four gestural vectors, analogous to those defined in \"The Translation of Art in Virtual Worlds,\" which is examined through case studies. From this, a visual theory of augmentation will be proposed."}, {"v": "", "img": "", "t": "Transmission", "a": ["Oliver Gingrich", "Alain Renaud", "Eugenia Emets", "Zhidong Xiao"], "c": "SIGGRAPH", "y": 2014, "k": "Art Papers", "doi": "10.1145/2601080.2677715", "abs": "Transmission is both a telepresence performance and a research project. As a real-time visualization tool, Transmission creates alternate representations of neural activity through sound and vision, investigating the effect of interaction on human consciousness. As a sonification project, it creates an immersive experience for two users: a soundscape created by the human mind and the influence of kinetic interaction. An electroencephalographic (EEG) headset interprets a user's neural activity. An Open Sound Control (OSC) script then translates this data into a real-time particle stream and sound environment at one end. A second user in a remote location modifies this stream in real time through body movement. Together they become a telematic musical interface--communicating through visual and sonic representation of their interactions."}, {"v": "", "img": "", "t": "XEPA - autonomous intelligent light and sound sculptures that improvise group performances", "a": ["Philip Galanter"], "c": "SIGGRAPH", "y": 2014, "k": "Art Papers", "doi": "10.1145/2601080.2677716", "abs": "XEPA anticipates a future where machines form their own societies. Going beyond mere generative art, machines will exhibit artistic creativity with the addition of artistic judgment via computational aesthetic evaluation. In such a future our notions of aesthetics will undergo a radical translation. The XEPA intelligent sculptures create animated light and sound sequences. Each sculpture \"watches\" the others and modifies its own aesthetic behavior to create a collaborative, improvisational performance. No coordination information or commands are used. Each XEPA independently evaluates the aesthetics of the other sculptures, infers a theme or mood being attempted, and then modifies its own aesthetics to better reinforce that theme. Each performance is unique and widely varied. XEPA is an ever-evolving artwork, intended as a platform for ongoing experiments in computational aesthetic evaluation."}, {"v": "", "img": "thumbs/7b588e51b3ec.jpg", "t": "Cloud Pink", "a": ["Yunsil Heo", "Hyunwoo Bang"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503659", "abs": "Cloud Pink is an immersive media installation with a giant stretchable fabric that covers the entire gallery ceiling. Viewers can poke this sky with their fingers, stirring the simulated pink cloud that floats on it."}, {"v": "", "img": "thumbs/38d11c8d0a02.jpg", "t": "Digiti sonus", "a": ["Yoon Chung Han", "Byeong-jun Han"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503660", "abs": "Fingerprints are unique biometric patterns on human and primate bodies. They are clearly recognizable patterns that can be manipulated and saved into large databases. Due to their distinct and unique visual patterns, they have been useful for personal identification and security. In this digital era, many computing machines and digital interfaces use fingerprints as secure keys to identify and access personal information."}, {"v": "", "img": "thumbs/e32a047fd67f.jpg", "t": "Drawing Machine", "a": ["Robert Twomey"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503661", "abs": "Drawing Machine is the latest in a series of conceptual subtractions from the parameters of drawing as an art act. A precision-controlled CNC device labors in place of the artist, working with unfaltering patience and inhuman precision to fill a sketchbook with images over the course of the exhibition."}, {"v": "", "img": "thumbs/7d83f6afe6f3.jpg", "t": "Expressive Maps", "a": ["Santiago V. Lombeyda"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503662", "abs": "Expressive Maps is an artistic visualization of a complete mouse DNA sequence, taken from embryonic mouse muscle tissue, stretched out in a line. Each individual spiral represents a single chromosome (mice have 20, versus 23 in humans), and active sections perform calls across the corresponding chromosome addresses. It displays three stages of development: before specialization, 60 hours after specialization, and 60 hours post-specialization with an inhibitor present. Each stage has been printed on vellum, so one \"map\" can be placed on top of another to reveal differences."}, {"v": "", "img": "thumbs/0f5781317b82.jpg", "t": "Four Mountains", "a": ["Mark J. Stock"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503663", "abs": "Four Mountains consists of tiny, rapid-prototyped models of four tall stratovolcanoes in the US Pacific Northwest, each isolated, framed, and arranged on the gallery wall to scale, viewed from above, from the point of view of a god (or an astronaut). It draws attention to not only the mountains' detailed, crisp forms, but also to the empty spaces in between."}, {"v": "", "img": "thumbs/ff8d9918c16e.jpg", "t": "Long View", "a": ["Patrick Fitzgerald", "Daniel Lunk", "Lee Cherry", "Jim Martin", "Dwayne Martin"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503664", "abs": "Long View is a gesture-based interactive installation that offers the viewer the ability to affect animated elements in a projected space in ways that the artists hope will increase awareness of our fragile and temporary relationship to our planet."}, {"v": "", "img": "thumbs/3cb96a96a0b6.jpg", "t": "Rhumb Lines", "a": ["Barbara Mary Keating"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503665", "abs": "Rhumb Lines is a playful, immersive, cinematic, interactive video installation that explores how we think we know where we are in time, space, and history. It invites viewers to navigate a mesmerizing series of interlinked videos using location data and scanning the horizon to seek out hidden co-ordinates and signs of the River Tyne's magnetic attraction for artists over the centuries, translated into beautiful Red One super-wide-screen images. Viewers scroll a map generated from sonar-scan data, with the GPS tracks overlaid to trigger corresponding videos. They scrub through the cinematic widescreen videos seeking journey intersections, and the frames of video are graded to look like archive paintings. Device control creates an apparent suspension of \"real\" time that could be staged on any waterway in the world with sonar-scan survey data."}, {"v": "", "img": "thumbs/03f794191a8b.jpg", "t": "Shared Skies (13 global skies)", "a": ["Kim Abeles"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503666", "abs": "Shared Skies is a series of digital prints and sculpture using photographs of skies collected from four sources: my own journeys, artists who participate as they travel worldwide, international friends through social media, and some purchased from photographers through stock photo sites."}, {"v": "", "img": "thumbs/e74ae6bc71fb.jpg", "t": "Spatial Hyperlink", "a": ["Wan-Ying Lai", "Ming-Chang Wu", "Shen-Guan Shih"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503667", "abs": "Spatial Hyperlink, a telecommunications art installation, explores an ideal social interaction. The work encourages viewers' awareness of others' psychological states via speaking boxes through which images and sounds can be transmitted over unknown distances. Devices installed in different places become a giant communication network. Users are able to influence remote doors by opening their own. With each opening, the people and the scenes behind the doors become visible to people in other locations around the world."}, {"v": "", "img": "thumbs/d5fae4cc125a.jpg", "t": "Swarm Vision", "a": ["George Legrady", "Marco Pinter", "Danny Bazo"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503668", "abs": "Swarm Vision is an installation consisting of multiple pan-tilt-zoom cameras on rails positioned above spectators in an exhibition space. Each camera behaves autonomously based on programmed rules of computer vision."}, {"v": "", "img": "thumbs/8e4c7ae6ea86.jpg", "t": "This exquisite forest", "a": ["Aaron Koblin", "Chris Milk"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503669", "abs": "Conceived by Chris Milk and Aaron Koblin and produced by Tate Modern and Google, This Exquisite Forest was inspired by the surrealist game \"exquisite corpse\" and its idea of collaborative creation. The project lets users create short animations that build of one another as they explore specific themes. The result is a collection of branching narratives resembling trees to which anyone may contribute. The project lives online and as a physical installation at the Tate Modern (through June 2013). At the museum, visitors can explore the project as a life-sized projection and contribute animations using high-end digital drawing tablets."}, {"v": "", "img": "thumbs/b62d6c26dd11.jpg", "t": "Traces", "a": ["Cynthia Beth Rubin", "Susanne Menden-Deuer", "Elizabeth Harvey", "Jerry Fishenden"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503670", "abs": "Traces is a collaboration between the artist Cynthia Beth Rubin and the Menden-Deuer Lab at the Graduate School of Oceanography, University of Rhode Island, which studies plankton, the microscopic marine creatures that comprise the most basic piece of our food chain. The original micro-captures are of specimens in small batches of water, devoid of any association with their native environment, and filmed in flat grays. In Rubin's transformation of the raw video, she imagines the plankton moving in water that is infinitely deep, making these mystical creatures leap beyond the confines of the microscopic world into an enticing world of color and movement that begs us to relate to them as part of nature. She does not just reveal the generally unseen life in our ocean waters; she makes it accessible."}, {"v": "", "img": "thumbs/08ce5eb1c1b9.jpg", "t": "Visualizing federal spending", "a": ["Rebecca Ruige Xu", "Sean Hongsheng Zhai"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503671", "abs": "In this project we explore an aesthetics-oriented approach to visualizing federal spending in the United States as 3D compositions in a photorealistic style. Using procedural modeling with Python programming and Maya API, an organic flow of intermingled geometrical units is formed to represent the profile of federal spending for each state, loosely resembling the idea of money flow. The total amount of spending is scaled to a per capita basis to make different states comparable, while the overall surface area or volume occupied by each type of geometrical pattern represents its associated spending data."}, {"v": "", "img": "thumbs/6ef97a9c0136.jpg", "t": "Water Columns", "a": ["Mark Weston"], "c": "SIGGRAPH", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2503649.2503672", "abs": "Water Columns consists of three extremely lightweight, passively actuated kinetic sculptures that take advantage of the relative tendency of wood to absorb moisture from the atmosphere to create passive engines for actuation of a long array of bi-laminate filaments. The sculptures change shape over the course of the day as relative humidity rises and falls with the ambient temperature."}, {"v": "", "img": "", "t": "Early history of french CG", "a": ["Cécile Welker"], "c": "SIGGRAPH", "y": 2013, "k": "Art Papers", "doi": "10.1145/2503649.2503657", "abs": "This paper provides an historical summary of the emergence of computer graphics research and creation in France between 1970 and 1990, a period of innovation that transformed artistic practice and French visual media. The paper shows the role of these developments in the history of art, the evolution of digital technology, and the expansion of animation and visual effects in the film industry."}, {"v": "", "img": "", "t": "Hybrid basketry", "a": ["Amit Zoran"], "c": "SIGGRAPH", "y": 2013, "k": "Art Papers", "doi": "10.1145/2503649.2503651", "abs": "Contemporary 3D printing and traditional craft rarely meet in the same creation. They tend to live in different worlds. In this paper, the author argues for merging these two distinct traditions. To that end, he developed hybrid basketry, a medium where 3D-printed structures are shaped to allow the growth and development of hand-woven patterns. While the 3D-printed plastic elements contribute the aesthetics of the digital curvatures and manifolds, the hand-woven reed, jute, and canvas fibers infuse the baskets with a unique organic appeal. The author discusses his motivation, describes the making process, and presents four hybrid baskets, integrating a deeper discussion on the place of craft and tradition within our contemporary approach to design and fabrication."}, {"v": "", "img": "", "t": "KIMA", "a": ["Oliver Gingrich", "Alain Renaud", "Eugenia Emets"], "c": "SIGGRAPH", "y": 2013, "k": "Art Papers", "doi": "10.1145/2503649.2503652", "abs": "KIMA is a holographic surround-sound installation that visualizes telepresence as both a phonetic and a synaesthetic phenomenon. The performance piece is based on the physical conditions of cymatics--the study of physically visible sound wave patterns. Two environments, a quad surround and a holographic interface, build the framework of a telematic experience that illustrates communication as wave forms while focusing on the relationship between sound and matter."}, {"v": "", "img": "", "t": "Null by Morse", "a": ["Tom Schofield"], "c": "SIGGRAPH", "y": 2013, "k": "Art Papers", "doi": "10.1145/2503649.2503653", "abs": "Null By Morse is an installation artwork that incorporates a military signaling lamp and smartphones. A series of Morse messages is transmitted automatically by the signal lamp. The messages are drawn from the history of Morse and telegraphy. A custom app for iPhone and Android uses the phone's camera to identify the changing light levels of the lamp and the associated timings. The app then decodes the Morse and displays the message on the screen on top of the camera image. This paper discusses the artwork in relation to the following theoretical aspects: It contextualizes the position of smartphones in the history of optical communication. It proposes an approach to smartphones in media art that moves away from futurist perspectives whose fundamental approach is to seek to creatively exploit the latest features. Lastly, it discusses the interaction with the phone in the exhibition context in terms of slow technology."}, {"v": "", "img": "", "t": "The electric \"now indigo blue\"", "a": ["Carolyn Kane"], "c": "SIGGRAPH", "y": 2013, "k": "Art Papers", "doi": "10.1145/2503649.2503655", "abs": "Circa 1969, a few talented electrical engineers and pioneering video artists built video synthesizers capable of generating luminous and abstract psychedelic colors that many believed to be cosmic and revolutionary, and in many ways they were. Drawing on archival materials from Boston's WGBH archives and New York's Electronics Arts Intermix, this paper analyzes this early history in the work of electronics engineer Eric Siegel and Nam June Paik's and Shuya Abe's Paik/Abe Video Synthesizer, built at WGBH in 1969. The images produced from these devices were, as Siegel puts it, akin to a \"psychic healing medium\" used to create \"mass cosmic consciousness, awakening higher levels of the mind, [and] bringing awareness of the soul.\" While such radical and cosmic unions have ultimately failed, these unique color technologies nonetheless laid the foundation for colorism in the history of electronic computer art."}, {"v": "", "img": "", "t": "The emergence and growth of evolutionary art", "a": ["Nicholas Lambert", "William Latham", "Frederic Fol Leymarie"], "c": "SIGGRAPH", "y": 2013, "k": "Art Papers", "doi": "10.1145/2503649.2503656", "abs": "One of the most interesting--if frustrating--aspects of charting the history of computer art is trying to understand the intersections of specific technologies and artistic experimentation. It is rarely as clear-cut as a simple linear influence of one to the other, partly because artists are able to envision all kinds of possibilities that technology might enable them to realize in some kind of form, but as they do so, the technology is itself shaped, especially in terms of how it is perceived by others. Do artists find a way to give technologies an aesthetic outlet, or do some technologies possess--or facilitate--a characteristic aesthetic that finds its expression through specific artists? Certainly, in the history of computer art it would seem that particular aesthetics, technologies, and artists are closely intertwined in certain periods. This intertwining of art, technology, and ideas stolen from the natural world has never been so arguably merged as the period in the history of computer art from 1980 to 1993. We take as the defining start of this period the initial work of Mandelbrot on fractals that became known as the Mandelbrot set and led to his famous illustrated art-science book The Fractal Geometry of Nature. In 1993, this first highly creative period in evolutionary computer art came to an end with major publications by pioneers Karl Sims, Stephen Todd, and William Latham."}, {"v": "", "img": "", "t": "Ut pictura poesis", "a": ["David Griffin"], "c": "SIGGRAPH", "y": 2013, "k": "Art Papers", "doi": "10.1145/2503649.2503654", "abs": "In 1735, Leonard Euler presented a solution to the practical problem of whether a route could be plotted to cross each of seven bridges in Königsberg once. His negative solution used the simplest of mark-making strategies to resolve a conceptual problem. Euler did not actually cross the town's bridges, but used them to resolve questions of connectivity, after which diagrammatic representations can be seen as the restructuring of logical problems to allow for inductive reasoning, for fruitful application beyond theory. But what if such a working graphic has as its target something that is simply incomprehensible? What are the upper limits of the denotational logic of such diagrams? This paper presents a drawing-research project that tests the cognitive advantages of technical graphics by directly engaging with things that cannot be made easier to understand through their use."}, {"v": "", "img": "thumbs/4d28ccc3ca25.jpg", "t": "A-me", "a": ["Jordi Puig", "Andrew Perkis", "Aud Sissel Hoel", "Alvaro Cassinelli"], "c": "SIGGRAPH Asia", "y": 2013, "k": "Art Gallery", "doi": "10.1145/2542256.2542264", "abs": "A-me is a fictitious memory-evoking apparatus at the intersection of science, art and technology. The system enables users to experience other people's memories as well as store their own by interacting with a volumetric representation (MR) of a human brain. The user retrieves or stores memories (audio traces) by pointing and clicking at precise voxels locations. Triggered by their exploratory action, a story is slowly revealed and recomposed in the form of whispering voices revealing intimate stories. A-me it's a public receptacle for private memories, thus exploring the possibility of a collective physical brain."}, {"v": "", "img": "", "t": "5 story building", "a": ["Ricardo Muñoz"], "c": "SIGGRAPH Asia", "y": 2013, "k": "Art Papers", "doi": "10.1145/2542256.2542265", "abs": "A mischievous Monster, a naive Sidekick, ten shallow Girls, a retired Villain, an apathetic Robot, and a Megalomaniac from outer space live under one roof in the \"5 Story Building\". Five simultaneous stories tell the lives of the singular occupants of this confining building. These neighbors carry on with their own ambitions and inherited craziness without realizing that their stories are intertwined in this episodic interactive fiction."}, {"v": "", "img": "", "t": "Cerebral interaction and painting", "a": ["Yiyuan Huang", "Alain Lioret"], "c": "SIGGRAPH Asia", "y": 2013, "k": "Art Papers", "doi": "10.1145/2542256.2542260", "abs": "The research focuses on combination of novel technology and traditional art. In this paper, a novel interactive art installation (IAI) using user's thought to interact with a digital Chinese ink painting is introduced. Meanwhile, the final purpose of this research is to establish a link between novel technology and traditional arts and further to bring out traditional art philosophy by taking the advantages of novel technology. Finally, this research aims to help people understand not only the visual expression of an art, but also its philosophy and spirit through different kinds of interaction. Based on this, the theory research focuses on four parts: traditional art philosophy, artistic and cognitive psychology, traditional art, novel technology. Meanwhile, for practice, a Chinese style IAI experiment including brain waves control technology is introduced to help people better understand the purpose of this research."}, {"v": "", "img": "", "t": "Generating abstract paintings in Kandinsky style", "a": ["Kang Zhang", "Jinhui Yu"], "c": "SIGGRAPH Asia", "y": 2013, "k": "Art Papers", "doi": "10.1145/2542256.2542257", "abs": "This paper presents a recent project on automatic generation of Kandinsky style of abstract paintings using the programming language Processing. It first offers an analysis of Kandinsky's paintings based on his art theories and the author's own understanding and observation. The generation process is described in details and sample generated images styled on four of Kandinsky's paintings are also demonstrated and discussed. Our approach is highly scalable, limited only by the memory space set in Processing. Using random generation, every styled image generated can be unique. A selection of the images generated in the required resolution is also submitted and 70 images are made into a video companion."}, {"v": "", "img": "", "t": "Participating interface", "a": ["Seonah Mok", "Jaehwan Jeon", "Monson H. Hayes", "Joonki Paik"], "c": "SIGGRAPH Asia", "y": 2013, "k": "Art Papers", "doi": "10.1145/2542256.2542263", "abs": "This paper is presents an artwork that is concerned with the interactions among people rather than the interaction between an audience and the artwork. We visualize the physical motion variations from the interactions among different participants using Kinect-based depth estimation and video tracking algorithms. The proposed work can visualize the affective experiences based on the physical distance between participants. We also provide experiences in which a participant becomes a part of the artwork in the form of both shape and interface. The body of a participant plays an important role in communicating and interacting with other participant and the artwork itself."}, {"v": "", "img": "", "t": "SwarmVision", "a": ["George Legrady", "Danny Bazo", "Marco Pinter"], "c": "SIGGRAPH Asia", "y": 2013, "k": "Art Papers", "doi": "10.1145/2542256.2542262", "abs": "A platform of exploratory networked robotic cameras was created, informing new directions in computer vision engineering and utilizing an aesthetic approach to experimentation. Initiated by research in autonomous swarm robotic camera behavior, SwarmVision is an installation consisting of multiple Pan-Tilt-Zoom cameras on rails positioned above spectators in an exhibition space, where each camera behaves autonomously based on its own rules of computer vision and control. Each of the cameras is programmed to detect visual information of interest based on a different algorithm, and each negotiates with the other two, influencing what subject matter to study in a collective way. The emergent behaviors of the system suggest potential new approaches in scene reconstruction, video-based behavior analysis and other areas of vision and imaging research."}, {"v": "", "img": "", "t": "The next generation poetic experience", "a": ["Diana Arellano", "Volker Helzle"], "c": "SIGGRAPH Asia", "y": 2013, "k": "Art Papers", "doi": "10.1145/2542256.2542258", "abs": "This paper presents the motivation, background and implementation of The Muses of Poetry, an interactive installation that combines dynamically generated character animation, semantic analysis, natural voice interaction and affect in poetry. Inspired by the subjectivity and ethereal quality of this literary art, we wanted to enhance the act of reciting poetry by providing a set of characters the possibility to \"understand\" and manifest the emotional content of the poems through facial expressions and affective speech. We believe that this original installation will bring poetry closer to a wider audience, while creating a playful, interactive and surprising experience for the user."}, {"v": "", "img": "", "t": "Topics on aesthetic data visualization", "a": ["Hyoyoung Kim", "Jin Wan Park"], "c": "SIGGRAPH Asia", "y": 2013, "k": "Art Papers", "doi": "10.1145/2542256.2542259", "abs": "Aesthetic data visualization, which looks at complex data sets from an ingenious perspective, is difficult to empirically organize due to its insufficient records. Fortunately, insightful artists and curators have recently provided some notable interdisciplinary exhibitions and publications. This author was a recent participant at such an event; however, it is not easy to summarize the various projects into a single vision because each artist's value, method, philosophy, and aesthetic preference are unique. This paper categorizes data visualization based on various topics. Aesthetic data visualization is similar to conventional data visualization in that it organizes ambiguous data into a database. Artists then tend to integrate the information into their art. In this regard, it might be possible to identify tendencies and examine data as contemporary iconology, as well as discover hidden possibilities of recent aesthetic data visualizations."}, {"v": "", "img": "", "t": "Topics on bible visualization", "a": ["Hyoyoung Kim", "Jin Wan Park"], "c": "SIGGRAPH Asia", "y": 2013, "k": "Art Papers", "doi": "10.1145/2542256.2542261", "abs": "Text visualization begins with understanding text itself which is material of visual expression. To visualize any text data, sufficient understanding about characteristics of the text first and the expressive approaches can be decided depending on the derived unique characteristics of the text. In this research we aimed to establish theoretical foundation about the approaches for text visualization by diverse examples of text visualization which are derived through the various characteristics of the text. To do this, we chose the 'Bible' text which is well known globally and digital data of it can be accessed easily and thus diverse text visualization examples exist and analyzed the examples of the bible text visualization. We derived the unique characteristics of text-content, structure, quotation- as criteria for analyzing and supported validity of analysis by adopting at least 2--3 examples for each criterion. I

探求する実験的なビデオプロジェクトです。画像のスタイル転送と音楽生成を用いて、ダンス、絵画、音楽を統合し、複数の芸術形態が調和的に融合した美的かつ革新的なモンタージュビデオを制作することを目指しています。具体的には、中国舞踊と伝統的な墨絵、AI生成音楽を融合させ、「絵画の中のダンス」と呼ばれる特別なダンス表現を創出します。このプロジェクトは、マルチモーダル生成技術が古典芸術に新たな提示形態をもたらし、テクノロジーと芸術の融合に新たな視点を提供できることを示しています。", "tags": ["Dance Montage", "Music Generation", "Style Transfer"]}, {"v": "", "img": "thumbs/414bdba80860.jpg", "t": "Design and Conversion of Ink Brushstrokes in Three-dimensional Space", "a": ["Zhihao Yao", "Beituo Liu", "Haipeng Mi"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695451", "abs": "Ink painting, as a highly esteemed form of traditional Eastern art, has been increasingly recognized for its 3D design form due to the growing demand for 3D digital materials in the gaming and animation industries. However, creating artistically appealing 3D ink paintings is a considerable challenge, especially in replicating the delicate effects of two-dimensional brush strokes in three-dimensional space. Most current research mainly focuses on using rendering techniques to simulate the effect of ink, with a relative lack of exploration in design methods for 3D transformation of ink paintings. In this paper, we present three 3D ink works created by us, emphasizing the study of the core element of ink painting: the \"brush stroke,\" and its restoration and expression in three-dimensional space. We have outlined design dimensions based on brush stroke characteristics and employed a combination of brushes and procedural shader to recreate the features of brush strokes in three-dimensional space.", "ja": "インク絵画は、伝統的な東洋芸術の中でも高く評価されている形式であり、ゲームやアニメーション産業における3Dデジタル素材への需要の高まりに伴い、3Dデザイン形態としてますます認識されつつあります。しかし、2次元の筆跡の繊細な効果を3次元空間で再現することは、芸術的に魅力的な3Dインク絵画を制作する上で大きな課題です。現在の研究のほとんどは、インクの効果をシミュレートするレンダリング技術に焦点を当てており、インク絵画の3D変換に関するデザイン手法の探求は比較的不足しています。本論文では、私たちが制作した3つの3Dインク作品を提示し、インク絵画の核心要素である「筆跡」の研究と、その3次元空間での復元と表現に重点を置いています。筆跡の特性に基づくデザイン次元を概説し、ブラシと手続き型シェーダの組み合わせを用いて、3次元空間における筆跡の特徴を再現しました。", "tags": ["3D Art", "Chinese painting", "Non-photorealistic rendering"]}, {"v": "", "img": "thumbs/308dec2d0ecf.jpg", "t": "Déjà Vu: Uncanny and Serendipitous Re-encountering of Audiovisual Archives", "a": ["Yuchen Yang"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695438", "abs": "The advent of the \"generative age\" marks a pivotal moment in AI evolution, with models like OpenAI’s GPT-4 and DALL-E transforming content creation across various fields. These advancements bring unprecedented efficiency and new applications but also present challenges, notably AI hallucinations—factually incorrect or nonsensical outputs due to latent space misinterpretations. This research proposes using AI hallucinations and the digital uncanny to improve archival access through a déjà vu generator. This system connects user experiences with archival video clips, creating immersive installations that evoke familiarity and nostalgia, thus transforming archives into dynamic, memory-evoking interfaces.", "ja": "AIの「世代」時代の到来は、GPT-4やDALL‑Eといったモデルがさまざまな分野でコンテンツ制作を変革し、前例のない効率性と新たな応用をもたらす重要な転換点です。しかし、これらの進歩は、潜在空間の誤解釈に起因する事実と異なる、あるいは無意味な出力、すなわちAIハルシネーションという課題も伴います。本研究では、AIハルシネーションとデジタル不気味さを活用し、既視感ジェネレータを通じてアーカイブへのアクセスを向上させることを提案します。このシステムは、ユーザー体験とアーカイブ映像クリップを結びつけ、親しみとノスタルジアを呼び起こす没入型インスタレーションを創出し、アーカイブを動的で記憶を呼び覚ますインターフェースへと変換します。", "tags": ["archival art", "creative interface", "video retrieval"], "pos": "50% 40%"}, {"v": "", "img": "thumbs/3f3a8613c307.jpg", "t": "Embodied Movement and Generative Media Performance", "a": ["Augustus Wendell", "Jingqiu Guan"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695435", "abs": "This paper documents an interactive dance performance installation in an 8’ cubic mesh projection volume. The work presents the difficult history of Asian American immigration and the detention facility on Angel Island in San Francisco Bay. Through a motion capture system, the performer interacts with media projections captured from the detention center, the waterways of the Bay, and from historic archives of the Chinese American immigrant community of San Francisco. Each chapter of the performance engages new movements and poses to create varied generative media conditions.", "ja": "この論文は、8フィート立方メッシュ投影ボリューム内でのインタラクティブなダンスパフォーマンスインスタレーションを記録しています。この作品は、アジア系アメリカ人移民の困難な歴史と、サンフランシスコ湾のエンジェル島にある拘留施設を提示します。モーションキャプチャシステムを通じて、パフォーマーは拘留センター、湾の水路、サンフランシスコの中国系アメリカ人移民コミュニティの歴史的アーカイブからキャプチャされたメディア投影と相互作用します。パフォーマンスの各章は、新しい動きとポーズを取り入れ、さまざまな生成メディア条件を作り出します。", "tags": ["Dance", "Interaction Design", "Motion Capture", "Projection Mapping"]}, {"v": "", "img": "thumbs/76a0220fa1c3.jpg", "t": "Embodied Visions: Interactive Installations That Reimagine Bodily Presence in Digital Imaging Apparatuses as Shadows", "a": ["Yunzi Shi", "John Bell", "Adithya Pediredla"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695436", "abs": "This paper describes the background, design, and exhibition of Embodied Visions, three interactive installations that contend with the disembodying tendencies of contemporary digital imaging. Each installation encourages the participants to interact with and transform the imaging and display pipelines with their bodies as optical and computed shadows. Combining projectors and cameras with machine-learning-based computer vision, this project presents prototypes for digital imaging that integrate optics and bodily presence. Initial feedback from participants confirms the novelty and easy engagement. The installations critique the limitations of existing digital imaging and display technologies and reimagine alternatives that raise bodily awareness for active perceptions.", "ja": "この論文では、現代のデジタルイメージングの非身体化傾向に対抗するインタラクティブなインスタレーション「Embodied Visions」について、その背景、デザイン、展示を説明します。各インスタレーションは、参加者が自らの身体を光学的および計算的な影として、イメージングとディスプレイのパイプラインと相互作用し、変形させることを促します。プロジェクターとカメラを機械学習ベースのコンピュータビジョンと組み合わせることで、本プロジェクトは光学と身体性を統合したデジタルイメージングのプロトタイプを提示します。参加者からの初期フィードバックは、その斬新さと容易なエンゲージメントを確認しています。このインスタレーションは、既存のデジタルイメージングおよびディスプレイ技術の限界を批判し、身体的認識を高める代替手段を再構築します。", "tags": ["Alternative Imaging and Display Technologies", "embodiment", "Interactive Art"]}, {"v": "", "img": "thumbs/fa4b6229f839.jpg", "t": "Exploring Fungal Morphology Simulation and Dynamic Light Containment from a Graphics Generation Perspective", "a": ["Kexin Wang", "Ivy He", "Jinke Li", "Ali Asadipour", "Yitong Sun"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695440", "abs": "Fungal simulation and control are considered crucial techniques in Bio-Art creation. However, coding algorithms for reliable fungal simulations have posed significant challenges for artists. This study equates fungal morphology simulation to a two-dimensional graphic time-series generation problem. We propose a zero-coding, neural network-driven cellular automaton. Fungal spread patterns are learned through an image segmentation model and a time-series prediction model, which then supervise the training of neural network cells, enabling them to replicate real-world spreading behaviors. We further implemented dynamic containment of fungal boundaries with lasers. Synchronized with the automaton, the fungus successfully spreads into pre-designed complex shapes in reality.", "ja": "真菌のシミュレーションと制御は、バイオアート制作において重要な技術とみなされています。しかし、信頼性の高い真菌シミュレーションのためのコーディングアルゴリズムは、アーティストにとって大きな課題となってきました。本研究は、真菌形態シミュレーションを二次元グラフィック時系列生成問題に等置します。ゼロコーディングでニューラルネットワーク駆動のセルラオートマトンを提案します。真菌の拡散パターンは画像セグメンテーションモデルと時系列予測モデルで学習され、これらがニューラルネットワークセルのトレーニングを監督し、実世界の拡散挙動を再現できるようにします。さらに、レーザーを用いた真菌境界の動的封じ込めを実装しました。オートマトンと同期させることで、真菌は現実で事前に設計された複雑な形状へと拡散に成功しました。", "tags": ["Cellular Automata", "Fungal Morphology", "Generative Art"]}, {"v": "", "img": "thumbs/8b21e9e7d862.jpg", "t": "Eye of Flora: Encountering Nature through the Mixed Reality Lens of Plant-Environment Interactions", "a": ["Youyang Hu", "Cyprien Fol", "Chiaochi Chou", "Verena Griess", "Yasuaki Kakehi"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695442", "abs": "This paper presents a hybrid plants-driven mixed reality (MR) system, Eye of Flora, which re-engages humans with nature from a more-than-human perspective. Eye of Flora integrates plants into digital twin systems by merging plant electrophysiology with 3D reconstruction technologies. Utilizing AI to analyze their biosignals, digital plant agents can now participate in digital environments and share their unseen biological responses to various environmental factors through aesthetic particle systems. This approach challenges anthropocentric digital ecosystems by incorporating ecological awareness through a multispecies perspective, promoting a holistic view of human-nature relationships and fostering symbiotic coexistence in the digital age.", "ja": "この論文は、植物主導のハイブリッド混合現実（MR）システム「Eye of Flora」を提示し、人間を超えた視点から自然と再び関わることを目指します。Eye of Floraは、植物の電気生理学と3D再構築技術を統合し、デジタルツインシステムに植物を組み込むことができます。AIを用いて生体信号を解析することで、デジタル植物エージェントはデジタル環境に参加し、さまざまな環境要因に対する見えない生物学的反応を美的なパーティクルシステムを通じて共有できるようになります。このアプローチは、生態学的認識を多種視点で取り入れることで、人間中心のデジタルエコシステムに挑戦し、デジタル時代における人間と自然の関係の包括的な視点を促進し、共生的な共存を育むことを目指します。", "tags": ["Electrophysiology", "Mixed Reality", "More-than-human", "Nature Engagement", "Plant Digital Twin", "Virtual Environment"]}, {"v": "", "img": "thumbs/48ec84977b05.jpg", "t": "I Light U Up: Exploring a New Emergent Narrative Paradigm through Physical Data Participation in AI Generative Experiences", "a": ["Zhen Wu", "Ruoyu Wen", "Marcel Zaes Sagesser", "Sum Yi Ma", "Jiashuo Xian", "Wenda Wu", "Tristan Braud"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695446", "abs": "This paper introduces \"I Light U Up\", an interactive installation that explores the use of light as input for emergent narrative powered by LLM. Through an installation with light sensors, the audience uses light to communicate with the parallel digital beings, generating a narrative experience that emerges from the interaction. This work serves as a proof-of-concept, supporting a conceptual framework that aims to open new perspectives on the participation of physical data in emergent narrative experiences. It seeks to develop a new dimension in contrast to the text-centric one-way relationship between reader and story by including agency beyond human interactivity.", "ja": "この論文は「I Light U Up」というインタラクティブなインスタレーションを紹介し、光を入力として使用し、LLM（大規模言語モデル）によって駆動されるエマージェント・ナラティブを探求します。光センサーを備えたインスタレーションを通じて、観客は光を用いて平行するデジタル存在とコミュニケーションを取り、相互作用から生まれるナラティブ体験を生成します。この作品は概念的枠組みを支える概念実証として機能し、物理データがエマージェント・ナラティブ体験に参加する新たな視点を開くことを目指します。テキスト中心の一方向的な読者と物語の関係に対し、人間以外の相互作用を含むエージェンシーを取り入れることで、新たな次元を発展させようとします。", "tags": ["Emergent Art", "Emergent Narrative", "Large-Language-Model(LLM)"]}, {"v": "", "img": "thumbs/ab7a9acb31c1.jpg", "t": "KnitworkVR: Dual-reality Experience through Distributed Sensor-Actuator Networks in the Living Knitwork Pavilion", "a": ["Irmandy Wicaksono", "Lancelot Blanchard", "Sam Chin", "Cristian Colon", "Joseph Paradiso"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695456", "abs": "KnitworkVR integrates dual-reality and digital twin platforms to simulate the Living Knitwork Pavilion in a desert landscape, using real-time sensor data. The sensor network captures movements, interactions, and spatial positioning of occupants, linking electric field sensor data with VR positioning. This creates a sensor-driven immersive experience with dynamic lighting, live animations, and adaptive soundscapes, enabling telepresence and collaborative interaction in both digital and physical environments. This paper explores the functional textile design, sensing hardware, audiovisual system, and VR framework, highlighting the applications of immersive spaces with knitted electronic textiles and distributed physical-digital systems.", "ja": "KnitworkVR は、デュアルリアリティとデジタルツインプラットフォームを統合し、砂漠の風景にあるリビング・ニットワーク・パビリオンをシミュレートします。リアルタイムのセンサーデータを用いて、センサーネットワークは居住者の動き、相互作用、空間位置を捕捉し、電界センサーのデータと VR の位置情報をリンクさせます。これにより、センサードリブンの没入型体験が実現し、動的な照明、ライブアニメーション、適応的なサウンドスケープが生成され、デジタルと物理の両環境でテレプレゼンスと協調的な相互作用が可能になります。本稿では、機能性テキスタイルデザイン、センシングハードウェア、視聴覚システム、VR フレームワークを検討し、編み込みエレクトロニクステキスタイルと分散型物理‑デジタルシステムを用いた没入空間の応用例を強調します。", "tags": ["AI-generated music", "digital twin", "distributed sensing", "electronic textiles", "immersive environments", "telepresence", "virtual reality"]}, {"v": "", "img": "thumbs/d3f96de1c51b.jpg", "t": "Nature: Metaphysics + Metaphor (N:M+M): Exploring Persistence, Feedback, and Visualisation in Mixed Reality Performance Arts.", "a": ["Tristan Braud", "Brian Lau", "Dominie Hoi Lam Chan", "Chun Ming Wu", "Zhen Wu", "Vi Jun Sean Yong", "Kirill Shatilov"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695439", "abs": "Nature: Metaphysics + Metaphor (N:M+M) is an art experience and exhibition that explores the intersection of Nature, Art, Man, and Technology. This immersive experience aims to bridge physical and digital, tangible and intangible, and ephemeral and persistent in mixed reality arts through new interaction and visualization methods. The performance was presented in front of an audience of 50 people, during which the artists constructed a physical-digital artwork that became part of a subsequent exhibition. This paper describes the rationale, creative approach, and technical contribution behind this work while reflecting on audience feedback and future directions.", "ja": "Nature: Metaphysics + Metaphor (N:M+M) は、自然、芸術、人間、テクノロジーの交差点を探求するアート体験および展示です。この没入型体験は、混合現実アートにおいて物理とデジタル、具体的と抽象的、一時的と永続的を新しいインタラクションと可視化手法を通じて橋渡しすることを目指しています。パフォーマンスは 50 人の観客の前で行われ、その間にアーティストは物理‑デジタル作品を構築し、後続の展示の一部となりました。本稿では、本作品の背後にある理論的根拠、創造的アプローチ、および技術的貢献を述べ、観客のフィードバックと今後の方向性について考察します。", "tags": ["Mixed Reality", "Performance Art", "Persistence", "Tangibility"]}, {"v": "", "img": "thumbs/70a3d08d8297.jpg", "t": "Pulse Memorial: A web broadcasted multichannel sound installation exploring queer grief through audience participation", "a": ["Brook Vann", "J Molina-Garcia", "August Black"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695450", "abs": "The \"Pulse Memorial\" is a participatory art installation exploring multichannel web audio streaming, data sonification, and field recordings to address queer grief and erasure. Inspired by Toni Morrison's concept of \"disremembrance,\" it offers an immersive sonic experience fostering collective remembrance. Sound is generated by combining data sonification and field recordings into an 8-channel score, then transmitted via WebRTC to participants—one channel per device—for a multi-channel sonic event. This project transforms memorials from passive, site-specific events to community-driven experiences. It provokes curiosity about digital media's role in preserving cultural memory and amplifying marginalized voices.", "ja": "「Pulse Memorial」は、クィアの喪失と抹消に取り組む参加型アートインスタレーションであり、マルチチャンネルウェブオーディオストリーミング、データソニフィケーション、フィールドレコーディングを探求します。トニ・モリソンの「disremembrance」の概念に触発され、没入型の音響体験を提供し、集団的な記憶を促進します。音はデータソニフィケーションとフィールドレコーディングを組み合わせて8チャンネルのスコアに生成され、その後WebRTCを通じて参加者に配信され—デバイスごとに1チャンネル—マルチチャンネルの音響イベントが実現します。このプロジェクトは、記念碑を受動的で場所限定的なイベントからコミュニティ主導の体験へと変換します。デジタルメディアが文化的記憶を保存し、周縁化された声を増幅する役割についての好奇心を喚起します。", "tags": ["field recording", "multichannel", "network music", "queer memorial"]}, {"v": "", "img": "thumbs/b99445f7dd95.jpg", "t": "RAY: An Interactive AI Art Experience Re-interprets Rayograph", "a": ["Weidi Zhang"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695453", "abs": "This paper presents the conceptual and artistic background, intelligent system design, visualization strategies, and exhibition design of an interactive intelligent art experience: RAY. This artwork provides a responsive art experience that re-interprets Rayograh (photogram) – a 20th Century cameraless image-making technique – in the perspective of Artificial Intelligent (AI) surveillance to discuss the changing ontology of images. The intelligent interactive system translates live streaming video of audiences into an ever-evolving semantic Rayograph, revealing the hidden information in real-time. RAY bridges intelligent visualization with cameraless photography Rayograph to engage audiences with an interactive poetic experience that constructs the tension between humans and machines and embraces abstraction for meaning-making.", "ja": "この論文では、概念的および芸術的背景、インテリジェントシステム設計、可視化戦略、展示デザインを備えたインタラクティブなインテリジェントアート体験「RAY」を提示します。この作品は、20世紀のカメラレス画像制作技法であるレイオグラフ（フォトグラム）を、人工知能（AI）監視の観点から再解釈し、画像の変容する存在論について議論する応答型アート体験を提供します。インテリジェントなインタラクティブシステムは、観客のライブストリーミング映像をリアルタイムで進化し続けるセマンティックレイオグラフに変換し、隠された情報を明らかにします。RAYは、インテリジェントな可視化とカメラレス写真レイオグラフを結びつけ、人間と機械の緊張関係を構築し、抽象化を通じて意味生成を受け入れるインタラクティブな詩的体験で観客を引き込みます。", "tags": ["Experimental Visualization", "Intelligent System Design", "Interactive Art"]}, {"v": "", "img": "thumbs/727b990057fc.jpg", "t": "ScribGen: Generating Scribble Art Through Metaheuristics", "a": ["Soumyaratna Debnath", "Ashish Tiwari", "Shanmuganathan Raman"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695448", "abs": "Scribble art, arising from chaos and randomness, remains one of the exceptionally attractive forms of art. Many works bridge the gap between sketches and images, but few translate images into meaningful chaotic expressions. While deep generative networks are known for understanding images, their ability to induce scribble drawings is under-explored. Unlike GAN-based approaches that generate line drawings, sketches, and contours, our work uses metaheuristics to produce scribble art from images. We extensively analyse various metaheuristic algorithms, demonstrating their optimal balance between creativity and computational efficiency. They offer better adaptability and accuracy than state-of-the-art deep generative models for image-to-scribble generation.", "ja": "Scribbleアートは、混沌とランダム性から生まれ、最も魅力的な芸術形態の一つです。多くの研究がスケッチと画像のギャップを埋めていますが、画像を意味のある混沌とした表現に変換するものはほとんどありません。深層生成ネットワークは画像理解に優れていますが、scribble描画を誘発する能力は十分に探求されていません。GANベースのアプローチが線画、スケッチ、輪郭を生成するのとは異なり、本研究はメタヒューリスティックを用いて画像からscribbleアートを生成します。さまざまなメタヒューリスティックアルゴリズムを広範に分析し、創造性と計算効率の最適なバランスを実証します。これらは、画像からscribbleへの生成において、最先端の深層生成モデルよりも適応性と精度に優れています。", "tags": ["Metaheuristics", "Optimization", "Scribble Art"]}, {"v": "", "img": "thumbs/0b0900fa2d69.jpg", "t": "Speculative Future Imagined Through Satellite Imageries with Generative AI", "a": ["Yuki Yoshida", "Akira Wakita"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695454", "abs": "\"Water City\" visualizes a speculative city in 2300 affected by sea level rise, using generative AI. The semi-fictional satellite images depict coastal scenes and urban landscapes, stimulating viewers’ imagination and helping them perceive climate change as a personal issue. Balancing scientific accuracy and artistic spontaneity, this approach fosters dialogue about speculative futures. By blending fiction and reality, it encourages viewers to imagine the future of their own city, turning abstract environmental issues into concrete, personal challenges. This method demonstrates the potential of image generation AI for emotional data visualization and creative discussions.", "ja": "「Water City」は、海面上昇の影響を受けた2300年の仮想都市を、生成AIを用いて可視化した作品です。半フィクションの衛星画像は沿岸シーンや都市景観を描き、観客の想像力を刺激し、気候変動を個人的な問題として認識させます。科学的正確さと芸術的自発性のバランスを取りながら、このアプローチは投機的な未来についての対話を促進します。フィクションと現実を融合させることで、観客は自分の街の未来を想像し、抽象的な環境問題を具体的で個人的な課題へと転換させます。この手法は、感情的なデータ可視化と創造的な議論のための画像生成AIの可能性を示しています。", "tags": ["Future Visualization", "Generative AI", "Satellite Imagery", "Science Communication", "Speculative Design"], "pos": "50% 0%"}, {"v": "", "img": "thumbs/3104221905bc.jpg", "t": "Tale of Tales: Interdisciplinary Art at the Intersection of Music, History, Sugar, and Technology", "a": ["Tak Cheung Hui", "Yu Chia Kuo"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695449", "abs": "This paper explores an interdisciplinary art project centered on the history of the sugar industry in Taiwan and Japan. The project integrates sound, imagery, and performance installations to create an immersive experience. Central to the study is Tale of Tales, the musical component of two interconnected works, Another Capital Beneath the Waves and Crystal Seeding, which blend electronic music with historical soundscapes and traditional performances. The project employs newly designed instruments, real-time electronic music, and immersive audio, recontextualizing traditional elements such as Taiwanese glove puppetry and Japanese Bunraku music, offering a rich, multi-layered historical and cultural experience.", "ja": "この論文は、台湾と日本の砂糖産業の歴史を中心とした学際的なアートプロジェクトを探求します。プロジェクトは、音、映像、パフォーマンスインスタレーションを統合し、没入型体験を創出します。研究の中心は、二つの相互接続された作品「Another Capital Beneath the Waves」と「Crystal Seeding」の音楽コンポーネントである「Tale of Tales」であり、電子音楽と歴史的なサウンドスケープ、伝統的なパフォーマンスを融合させています。プロジェクトは新しく設計された楽器、リアルタイム電子音楽、没入型オーディオを使用し、台湾の布袋芝居や日本の文楽音楽などの伝統的要素を再文脈化し、豊かで多層的な歴史的・文化的体験を提供します。", "tags": ["Electronic music", "Interdisciplinary performance", "Music production"]}, {"v": "", "img": "thumbs/be86bad656fb.jpg", "t": "The Next 50 Years", "a": ["Everardo Reyes", "Andrés Burbano"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695441", "abs": "The Next 50 Years is a special project designed for SIGGRAPH 2024. Following the 50th anniversary of the conference, it collected messages from a diverse group of participants, sharing their visions about the future of computer graphics and interactive techniques. This paper describes the process to gather and to showcase the contributions that were received. It employs media theory as a method to classify messages according to their communicative intention. Then, it discusses the development of a dedicated website that both exhibits the contributions and explores thematic interconnections and recurring topics such as artificial intelligence and generativity. In the end, the ongoing efforts on this project align with the contributors’ visions for the future of technology, focusing on innovation, community engagement, and digital media practices.", "ja": "The Next 50 Years は、SIGGRAPH 2024 の特別プロジェクトです。会議の 50 周年を迎え、多様な参加者から集められたメッセージを通じて、コンピュータグラフィックスとインタラクティブ技術の未来に関するビジョンを共有しています。この論文では、受け取った貢献を収集し展示するプロセスを説明します。コミュニケーション意図に基づくメディア理論を用いてメッセージを分類し、人工知能や生成性といったテーマ的な相互関係や繰り返し現れるトピックを探求する専用ウェブサイトの開発についても議論します。最終的に、このプロジェクトの継続的な取り組みは、技術の未来に対する貢献者のビジョンと合致し、イノベーション、コミュニティエンゲージメント、デジタルメディア実践に焦点を当てています。", "tags": ["Community engagement", "Digital Messages", "Future projections", "Generativity", "Media and communication"]}, {"v": "", "img": "thumbs/ee247c66fdf9.jpg", "t": "Thermochromorph: Dynamic Relief Printing with Thermochromic Inks", "a": ["Ticha Sethapakdi", "Paris Myers", "Tianyu Yu", "Juliana Covarrubias", "Mackenzie Leake", "Stefanie Mueller"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695445", "abs": "Thermochromorph is a novel relief printing technique that produces multicolored images that transition into each other through changes in temperature. Our process utilizes two sets of CMYK thermochromic inks that exhibit complementary color-changing behaviors: one shifting from color to transparency, the other from transparency to color at the same activation temperature. We describe our printmaking workflow, provide an open-source software toolkit, showcase prints made with our system, and facilitate an artist workshop. By incorporating new materials and technology with the rich history of printmaking, our work extends the expressive capabilities of relief printing as the medium continues to evolve.", "ja": "Thermochromorphは、温度変化により相互に遷移する多色画像を生成する新しいレリーフ印刷技術です。私たちのプロセスは、相補的な色変化特性を示す2セットのCMYKサーモクロミックインクを利用します。1つは色から透明へ、もう1つは透明から同じ活性化温度で色へ変化します。印刷ワークフローを説明し、オープンソースのソフトウェアツールキットを提供し、システムで作成したプリントを紹介し、アーティストワークショップを実施します。新材料とテクノロジーを豊かな印刷史と組み合わせることで、私たちの作品はレリーフ印刷の表現力を拡張し、媒体が進化し続ける中でその可能性を広げます。", "tags": ["color-changing", "design tools", "fabrication", "printmaking"]}, {"v": "", "img": "thumbs/4472104e42a5.jpg", "t": "Understated Haptics: Physicalization of Tactile Memories through a Co-creative Practice between Human and Nonhuman", "a": ["Ivana Chaloska", "Tatsuya Saito", "Junichi Yamaoka", "Kouta Minamizawa"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695458", "abs": "Figuratively speaking, when two surfaces, such as human skin and an object’s outsideness, deliberately interact - a third, collateral, and temporary surface is created. This work presents an artistic framing of tactility as a third surface: a tactile co-memory generated through tactile interactions in a Co-creative Practice between humans and nonhumans. In this practice, human and nonhuman tactility is documented through drawings and imprints, ultimately translated into haptic expressions. Understated Haptics demonstrates an artistic intersection where haptic artifacts and more-than-human prospects are critically considered in anticipated creative processes.", "ja": "比喩的に言えば、人間の皮膚と物体の外側といった二つの表面が意図的に相互作用すると、第三の、付随的で一時的な表面が生成されます。本研究は、触覚を第三の表面として芸術的に位置付け、人間と非人間の共創的実践における触覚的相互作用を通じて生成された触覚的共記憶を提示します。この実践では、人間と非人間の触覚が図面や印象として記録され、最終的に触覚的表現へと変換されます。Understated Haptics は、触覚的人工物と人間以外の存在可能性が創造的プロセスにおいて批判的に検討される芸術的交差点を示しています。", "tags": ["co-creation", "More-than-human", "tactile interactions", "tactility"]}, {"v": "", "img": "thumbs/29858f90f3d6.jpg", "t": "VR Body Calligraphy - Whole-body Performance Writing for Chinese Calligraphy", "a": ["Pierre Yat Siu Shum", "Tobias Klein"], "c": "SIGGRAPH Asia", "y": 2024, "k": "Art Papers", "doi": "10.1145/3680530.3695447", "abs": "Chinese Calligraphy is a millennia-old art form. It is an intangible heritage of the Chinese culture. Despite our digital lives, this art form has largely remained unaltered in its traditional two-dimensional expression. Current research is focused on AI-driven character generation on one hand, and on the other the replication of ink and brush dynamics within digital environments, as 2D simulations of the traditional paper canvas. Instead of imitating the existing, this research articulates a technical, artistic, and cultural evolution of Chinese Calligraphy Shufa书法 from the traditional two-dimensional, material-based expression to a novel digital three-dimensional form within virtual reality. The paper is structured as a series of cross-disciplinary experiments amalgamating the essence of the traditional craft with today’s possibilities in computer-human-interactions. Each is evaluated and discussed with an established traditional calligraphy master Law Ching-Bor, commenting on the transformation from single character to complex compositions. At the same time, advancements in finger and full body tracking technologies facilitate sculptural inscription in virtual space. We attempt to write calligraphy with choreographed whole-body gestures, translating these movements into dynamic, three-dimensional strokes of digital Shufa. The investigation details the scribing, interpreting, and experiencing multi-character calligraphy in a volumetric VR context. Ultimately, this paper presents Chinese calligraphy not as a relic of the past but as a living tradition—morphing, expanding, and resonating within the digital context, thereby transforming and evolving its cultural legacy.", "ja": "中国の書道は何千年もの歴史を持つ芸術形式であり、中国文化の無形遺産です。デジタル生活が普及する中でも、この芸術形式は従来の二次元表現からほとんど変わっていません。現在の研究は、一方でAI駆動の文字生成に焦点を当て、もう一方ではデジタル環境内でインクと筆の動態を再現し、従来の紙キャンバスの二次元シミュレーションを行っています。既存を模倣するのではなく、本研究は、中国書道（書法）を従来の二次元、素材ベースの表現から、バーチャルリアリティ内の新しいデジタル三次元形態へと技術的、芸術的、文化的に進化させることを提案します。論文は、伝統的な工芸のエッセンスと現代のコンピュータヒューマンインタラクションの可能性を融合させた一連の学際的実験として構成されます。各実験は、確立された伝統的書道家であるLaw Ching-Bor氏によって評価・議論され、単一文字から複雑な構成への変換が検討されます。同時に、指や全身トラッキング技術の進歩により、仮想空間での彫刻的な刻印が可能になります。私たちは、全身のジェスチャーで書道を書き、これらの動きをデジタル書法の動的な三次元ストロークに変換しようと試みます。調査は、体積的VRコンテキストでの多文字書道の記述、解釈、体験の詳細を示しています。最終的に、本論文は中国書道を過去の遺物ではなく、生きた伝統として提示し、デジタルコンテキスト内で変容・拡張・共鳴し、その文化的遺産を変革・進化させることを示します。", "tags": ["Craft", "Culture", "Drawing", "Human interaction", "Immersion", "Multimedia", "Performance", "Sculpture", "virtual reality", "Visualization"]}, {"v": "", "img": "thumbs/ab014b5b5a82.jpg", "t": "An Empty Room", "a": ["Casey Reas"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3603522", "abs": "In conjunction with Coded: Art Enters the ComputerAge, 1952-1982, LACMA's Art + Technology Lab presents a two-part digital work by Casey Reas: a simulation of and an homage to Victor Vasarely's unrealized proposal for LACMA's Art and Technology Program (1967-71). Vasarely was interested in cybernetics and permutation during this period, and he envisioned a machine composed of lights arranged in a grid that would generate millions of different visual patterns related to his paintings (such as the one on view in Coded). Estimated at the time to cost two million dollars to fabricate, the project was deemed prohibitively expensive and was left unrealized."}, {"v": "", "img": "thumbs/079decd0697d.jpg", "t": "Chthulucene", "a": ["Jiabao Li"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593823", "abs": "Since the beginning of the British Industrial Revolution, Humans have become an important force affecting the evolution of the environment. Scientists call it the \"Anthropocene\", which summarizes the geological changes from this period. But after realizing the role of mankind, we once again placed ourselves at the center of the world. In this project, we try to imagine a world where human beings are not the only important actors in the world. Diverse species are intertwined and react upon each other."}, {"v": "", "img": "thumbs/302776f4fdc1.jpg", "t": "Cluster #069", "a": ["Mario Klingemann", "Simon Hudson", "Julia Pryde Thompson"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593818", "abs": "Botto project is an experiment in creating a decentralized autonomous artist that generates art based on community feedback. Every week, Botto creates and sells artwork via a series of models and crowd-sourced evaluations of over 9,000 people who also decide how to manage the artist and its sales. Over the centuries, the idea of autonomous entities with creative or co-creative abilities has captivated the human imagination. From early literary examples [Kantosalo et al., 2021] to today's text-to-image models like Stable Diffusion and Midjourney, which can generate realistic imagery in seconds, the notion of machines as artistic agents has gained prominence."}, {"v": "", "img": "thumbs/5c16528a736b.jpg", "t": "Conservation of Shadows", "a": ["Haru HyunKyung Ji", "Graham D. Wakefield"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593826", "abs": "Time is instantaneously crystallized in space to form glistening trails of you and other creatures within this interactive mixed reality installation, with rustling sounds and mingling shadows as shared physical connections between the visible and invisible realms of a bio-inspired computational ecosystem."}, {"v": "", "img": "thumbs/92e1191d0127.jpg", "t": "Hinemosu 30", "a": ["Yuichiro Katsumoto"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593819", "abs": "Humans draw lines to write letters and sketch pictures. Computers use dots, or pixels, to represent texts and graphics. Then, if a computer controls a linear and not discrete physical object, what kind of image would emerge? This is what I am interested in, and I had been explored kinetic typography by manipulating slender objects such as springs and strings with robot arms. Beyond those practices, I have currently focused on flat lines such as strips, ribbons, and tapes which have two sides with very different widths. Those lines change in apparent thickness depending on the viewpoint. For example, if the ribbon is tilted 90 degrees, the line will appear or disappear. If it is twisted from both ends, the line weight changes continuously like a sine wave. Lines drawn by humans with a brush or calligraphy pen also have continuous changes in line weight. Inspired by this similarity, I began exploring kinetic typography and motion graphics using elastic bands."}, {"v": "", "img": "thumbs/dd97e564595f.jpg", "t": "Hyborg Agency: Cultivating Conversational AI Creatures through Community Connections", "a": ["Yuqian Sun", "Chang Hee Lee", "Ali Asadipour"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593827", "abs": "Hyborg Agency, an interactive art installation, integrates a digital forest with a human discord chat channel, enabling communication with AI deer or 'hyborgs'. The forest metaphorically represents human society, where AI agents use the large language model (LLM) ChatGPT to learn and grow by summarising conversations and updating their knowledge base, assimilating community thoughts as enriching nutrients."}, {"v": "", "img": "thumbs/77dfff7fe22f.jpg", "t": "Re:collection", "a": ["Weidi Zhang", "Jieliang (Rodger) Luo"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593820", "abs": "Re:collection is an interactive AI art installation that assembles synthetic collective visual memories based on language input, blurring the boundaries between remembrance and imagination through intelligent system design and experimental visualization."}, {"v": "", "img": "thumbs/b86c6a2d6168.jpg", "t": "Reinventing the Spindle: Politics of Craft in Space", "a": ["Ebru Kurbak"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593828", "abs": "Reinventing the Spindle is a research-based art project that explores textile crafting in microgravity environments. The project aims to open a broader conversation about the ramifications of near-space exploration and the politics of science and technology research in general."}, {"v": "", "img": "thumbs/a353dc6bbb9f.jpg", "t": "Retrospective of Female Digital Art Pioneers", "a": ["Yoon Chung Han", "Rebecca Allen", "Colette Bangert", "Darcy Gerbarg", "Copper Frances Giloth", "Barbara Nessim", "Joan Truckenbrod", "Jane Veeder"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3606842", "abs": "In celebrating the 50th year anniversary of SIGGRAPH, it is crucial to recognize and honor the contributions of female digital art pioneers by including them in the curated show as a retrospective. This decision not only acknowledges their groundbreaking work but also promotes gender equality, diversity, and inclusivity within the digital art community. The history of digital art has often overlooked or marginalized the achievements of women, despite their significant impact on the field. By featuring female digital art pioneers in a retrospective, SIGGRAPH can rectify this historical imbalance and provide a platform to showcase their innovative and influential creations. This acknowledgement is long overdue and can serve as an inspiration for future generations of artists, both male and female. Including female digital art pioneers in the curated show highlights their invaluable role in shaping the evolution of digital art over the past five decades. Their unique perspectives, artistic approaches, and technical contributions have pushed boundaries, challenged norms, and enriched the creative landscape. Their participation not only adds depth and diversity to the exhibition but also offers a fresh lens through which to appreciate the multifaceted nature of digital art."}, {"v": "", "img": "thumbs/b70eba2302f1.jpg", "t": "Returning the Gaze: Robotic Installation for Milan Fashion Week", "a": ["Behnaz Farahi"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593824", "abs": "Industrial robots have long been used for manufacturing and research purposes around the world. More recently they have also been used in the fields of art, performance, dance, and interaction design, where they have served as a collaborator, autonomous agent, and, in some cases, as an extension of the artist. This project explores how a robotic extension could engage with the critical feminist issue of \"the male gaze.\" In doing so, it provides a brief theoretical context to the notion of the gaze in the context of visual culture and feminism. Finally, it illustrates the application of such a critical concept through the example of a robotic installation developed by the author for Milan Fashion Week in collaboration with Universal Robots. It engages with ways in which robots might extend the gaze through to discourses of resistance, whereby the gaze could be used to empower those who typically face discrimination.", "pos": "50% 0%"}, {"v": "", "img": "thumbs/5a6510f5e5c3.jpg", "t": "RGB Peg Mirror", "a": ["Daniel Rozin"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593821", "abs": "In SIGGRAPH 2000 I debuted my piece Wooden Mirror. Over the past 23 years I have been expanding my series of Mechanical Mirrors to include tens of pieces utilizing various materials and techniques to examine the creation and perception of images and computer graphic concepts in a physical, interactive manner. Recently I have introduced color to my Mechanical Mirrors, the piece RGB Peg Mirror is my first piece that reproduces a full color reflection of the viewer by mechanically controlling 1555 motorized Red, Green, Blue aluminum pegs. I thought it would be appropriate to show this milestone piece where the series began. RGB Peg Mirror has two modes of operation and those change every two minutes: The first mode is the interactive reflective mode where the viewer is reflected on the piece in real time. The second mode is the generative mode, in this mode the piece displays various animations that were designed to take advantage of the colorful/ dynamic nature of the piece.", "pos": "50% 0%"}, {"v": "", "img": "thumbs/a34e8c394d2d.jpg", "t": "Talking with Neurons", "a": ["Prasanth Kunasilan", "Alexandra Arguelles", "Yuri Klebanov", "Siu Yu Angela Chow", "Huaruo Hu", "Tomoya Duenki", "Atsuhiro Nabeta", "Yoshiho Ikeuchi", "Miles Pennington", "Hyunjung Kim"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593825", "abs": "\"Talking with Neurons\" is an interactive installation that enables people to remotely connect with live neural tissues that mimic our nervous system. Audiences activate lab-grown neural circuits called neural organoids in an off-site lab through their vocal cues. The neurons respond to this stimulation by exhibiting patterns of activity that are subsequently translated into audiovisual representations. Essentially, people talk to the neurons, which then promptly respond to the audience."}, {"v": "", "img": "thumbs/0a2c8b95030e.jpg", "t": "The Reminiscence - The Monologues of Being Seen", "a": ["Sangyoon Lee", "Andrea N. Baldwin", "Heidi Henderson"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593829", "abs": "The Reminiscence - The Monologues of Being Seen is the third-generation interactive media installation based on the Posture Portraits Project (PPP). PPP is an interdisciplinary project which examines how bodies have historically been created/made through scientific interventions and surveillance while simultaneously engaging with the concept of inclusivity of all bodies including those traditionally seen as \"Other.\" To do so, we trace the development of healthism - the reinforcement of certain norms that construct the \"healthy\" as moral and pure and the \"unhealthy\" as foreign and polluted - in the modern American university which dates back to the early 17th century, and its relationship to the U.S. eugenics movement in the late 19th to 20th century. We explore how these ideologies were mobilized in the service of creating new disciplining and surveillance technologies in higher education by examining the case of what is known as \"the posture portraits.\" These portraits, taken at colleges and universities across the nation during the 1920s-1960s, were used as a measurement of ability and good posture, which at that time, was linked to intelligence, beauty, and what it meant to be \"normal.\" Most evidence of this malpractice was purged from the archives as if it had never happened."}, {"v": "", "img": "thumbs/5bbbf443f285.jpg", "t": "Time to Snow", "a": ["Myeongseong Kim", "Sunwoo Baek", "Woohun Lee"], "c": "SIGGRAPH", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3588428.3593822", "abs": "\"Time to Snow\" is an interactive installation that showcases the current time using tiny Styrofoam grains resembling snow. The installation highlights the aesthetic allure and ephemeral nature of snow. The title not only evokes \"displaying time with snow\", but it also bears a double entendre, the enchanting moment of \"when snowing\". Viewers can playfully interact with the Styrofoam grains, using hand gestures to immerse themselves in the installation. It presents the sensation of engaging with snow in natural environment."}, {"v": "", "img": "thumbs/77bb6d4908e8.jpg", "t": "Aquaterrestrial Recolonization: AI Environmentalist Toward Design For Climate Action Related Behaviour Change", "a": ["Predrag K. Nikolić", "Giacomo Bertin", "Kishan Munroe"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597630", "abs": "In this paper, we introduce the interactive installation Aquaterrestrial Recolonization as an artistic response to rising climate change concerns and trigger the audience's thoughts and discussions. In the project, we are recording and archiving the current state of the dead coral reefs and feeding artificial intelligence with that data to be able to visualize the virtual 3D dimensional recolonized coral reefs, relieved from human devastation and behaviour from the past and conduct changes in the future. We aim to preserve the current state of the Bahamian coral reefs and use artificial intelligence to return to the planet parts mankind has destroyed and affected the future with necessary human behavioural changes. Our AI Environmentalist is designed to be a chronologist, provocateur, and uncompromised planet Earth's protector.", "ja": "この論文では、気候変動への関心の高まりに対する芸術的な応答として、インタラクティブなインスタレーション「Aquaterrestrial Recolonization」を紹介し、観客の思考と議論を喚起します。プロジェクトでは、死んだサンゴ礁の現在の状態を記録・アーカイブし、そのデータを人工知能に供給して、過去の人間による破壊や行動から解放された、将来に向けて変化をもたらす仮想の三次元再植民サンゴ礁を可視化します。我々はバハマのサンゴ礁の現状を保存し、人工知能を用いて人類が破壊し未来に影響を与えた地球の一部を取り戻すことを目指し、必要な人間行動の変化を促します。AI環境主義者は、年代記者、挑発者、そして妥協のない地球保護者として設計されています。"}, {"v": "", "img": "thumbs/35028f064012.jpg", "t": "Beauty: Explorations of Machine-Microbial Agencies", "a": ["Johnny DiBlasi", "Carlos Castellanos", "Bello Bello"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597626", "abs": "We discuss Beauty, a machine-microbial artwork, currently in development by Phylum, an experimental research collective specializing in cultural production informed by the intersections of science, technology and the arts (and of which the authors are founding members). The work is based upon an artificial intelligence agent that uses deep reinforcement learning to interact with and alter cultures of pattern-forming social bacteria in order to make them more aesthetically pleasing.", "ja": "私たちは、Science, Technology, and the Arts の交差点に情報に基づいた文化的生産を専門とする実験的研究集団 Phylum によって現在開発中の機械微生物アートワーク「Beauty」について論じます（著者は創設メンバーです）。この作品は、深層強化学習を用いた人工知能エージェントが、パターン形成社会バクテリアの文化と相互作用し、それらをより美的に魅力的にするよう変化させることに基づいています。"}, {"v": "", "img": "thumbs/06391881dc37.jpg", "t": "Bodylab: in virtuo sculpting, painting and performing of full-body avatars", "a": ["Daniel Zeidler", "Matthew McGinity"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597631", "abs": "Bodylab is a virtual reality system for creating full-body virtual reality avatars. It provides anatomically realistic mannequins as canvases, which can be painted and textured, sculpted and deformed, adorned with objects and animated with particle effects. The artist can work from a first or third person perspective, and variety of interaction modalities are made available. To assess the system, we invite costume designers and theatrical artists to provide expert reviews. We also describe the use of Bodylab in a live dance performance. We believe Bodylab to be the first virtual reality tool for in virtuo painting and sculpting of full-body avatars.", "ja": "Bodylabは、全身のバーチャルリアリティアバターを作成するためのバーチャルリアリティシステムです。解剖学的にリアルなマネキンをキャンバスとして提供し、これらにペイントやテクスチャを施し、彫刻や変形を行い、オブジェクトを装飾し、パーティクルエフェクトでアニメーションさせることができます。アーティストは第一人称または第三人称の視点から作業でき、さまざまなインタラクションモーダリティが利用可能です。システムを評価するために、衣装デザイナーや演劇アーティストを招いて専門家レビューを行います。また、Bodylabのライブダンスパフォーマンスへの使用についても説明します。Bodylabは、全身アバターのイン・バーチュオペインティングと彫刻のための最初のバーチャルリアリティツールであると考えています。"}, {"v": "", "img": "thumbs/f53407c911d6.jpg", "t": "Communing with Creative AI", "a": ["Robert Twomey"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597633", "abs": "Drawing on historical and contemporary examples, this paper discusses relationships between humans and machines in creative co-production with generative AI. It distinguishes between generative systems as augmenting tools and autonomous collaborators, and adopts the term communion to describe the close degree of exchange that is possible when working with these systems. It draws on historical examples of surrealist and AI artworks, and more recent examples made with Large Language Models and GAN-based generation. It concludes with a discussion of the primacy of text as an entry point to the possibilities of creative AI.", "ja": "創造的な共創における人間と機械の関係について、歴史的および現代的な例を踏まえて論じる。本稿では、生成システムを補助的ツールと自律的協力者に区別し、これらのシステムと協働する際に可能となる緊密な交流の程度を表す用語として「共鳴（communion）」を採用する。超現実主義やAIアートの歴史的例、そして近年の大規模言語モデルやGANベースの生成による作品例を取り上げる。テキストが創造的AIの可能性への入口であることを主張し、結論としてその重要性を論じる。"}, {"v": "", "img": "thumbs/73dc341f9667.jpg", "t": "Fine Motor Skills: Operating standard robotic fabrication as a generative system", "a": ["Sharan R. Elran", "Yuval Harel", "Amit R. Zoran"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597627", "abs": "Our concept of a digital spirit refers to the agency of technology in the creative process and the potential to use it as an autonomous agent that both influences and participates in the artistic process. By attributing a digital spirit, we are able to have a more collaborative and interactive relationship with technology, where the role of the artist is to guide and direct the design rather than fully control it. In this work, we extend the autonomy of this spirit to allow the machine and the material to interact freely and generate forms independently from our will. In this new approach to digital fabrication, we transform a deterministic mechanical procedure into a creative exploration. Rather than designing traditional machine operations, we propose machine-material operations tailored for a specific material context. As a test case, we show a digital agent that manipulates clay while allowing the material's internal dynamics to play a dominant role in the finalization of the design. Through this machine-material interaction, we are able to generate an abundance of forms and complexity that would be impossible to create by hand or through traditional programming. It exposes an untapped expressive potential of digital tools that is made possible by operating digital machines outside the paradigm of tight control.", "ja": "私たちのデジタルスピリットの概念は、創造プロセスにおける技術のエージェンシーと、芸術プロセスに影響を与え、参加する自律的なエージェントとしてそれを使用する可能性を指します。デジタルスピリットを属性付けすることで、技術との協調的でインタラクティブな関係を持つことができ、アーティストの役割は完全に制御するのではなく、デザインを導き指示することになります。本研究では、このスピリットの自律性を拡張し、機械と素材が自由に相互作用し、私たちの意志とは独立して形状を生成できるようにします。この新しいデジタルファブリケーションへのアプローチでは、決定論的な機械手順を創造的な探索に変換します。従来の機械操作を設計するのではなく、特定の素材コンテキストに合わせた機械‑素材操作を提案します。テストケースとして、粘土を操作し、素材の内部ダイナミクスがデザインの最終化に支配的な役割を果たすデジタルエージェントを示します。この機械‑素材相互作用を通じて、手作業や従来のプログラミングでは不可能なほどの形状と複雑さの豊富さを生成することができます。これは、緊密な制御のパラダイムの外でデジタル機械を操作することにより可能になる、デジタルツールの未開拓の表現的可能性を露呈します。"}, {"v": "", "img": "thumbs/b6261e057e10.jpg", "t": "Immersive experience of Chinese poems and paintings", "a": ["Chong Cao", "Lingfei Yang", "Xukun Shen"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597621", "abs": "Chinese painting incorporated with poems is famous for its distinct characteristics and unspeakable moods. Ink lines are used to depict scenes in paintings while concise words are used to describe scenes and events in poems, making for a beautiful yet enigmatic art style. Such an art style requires viewers to patiently examine the details and attempt to understand the meaning, which creates a barrier for a wide audience to relish and disseminate it. The condition can be effectively improved with immersive and interactive animation techniques. In this paper, we present the design and production of an interactive 3D animation entitled \"Illustrating Ten Poems\" based on the famous Chinese painting with the same name. Compared with viewing the original painting, the animation provides immersive scene reconstruction in Chinese painting style, interactive characters and visual-audio experience. Rather than complete three-dimensional reconstruction, we attempted some innovative methods which proved to be effective and efficient in Chinese painting style artwork production.", "ja": "中国の絵画と詩が融合した作品は、その独特な特徴と言葉にできない情緒で有名です。絵画ではインクの線でシーンを描き、詩では簡潔な言葉でシーンや出来事を表現し、美しくも謎めいた芸術様式を生み出します。この芸術様式は、観者が細部を辛抱強く観察し、意味を理解しようと試みる必要があるため、広い観客が楽しみ、広めることへの障壁となります。没入型でインタラクティブなアニメーション技術を用いることで、この状況は効果的に改善できます。本稿では、有名な同名の中国絵画を基にしたインタラクティブな3Dアニメーション「十詩のイラストレーション」の設計と制作を紹介します。元の絵画を見ることと比較して、アニメーションは中国画様式の没入型シーン再構築、インタラクティブなキャラクター、視覚・音声体験を提供します。三次元再構築を完全に行うのではなく、いくつかの革新的な手法を試み、中国画様式の作品制作において効果的かつ効率的であることが証明されました。"}, {"v": "", "img": "thumbs/46e54bced23d.jpg", "t": "Intersection of Seeing: New Ways of Experiencing Reality using Autonomous Volumetric Capture System", "a": ["Seonghoon Ban", "Taeha Yi", "Kyung Hoon Hyun"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597632", "abs": "The authors present an art installation entitled \"Intersection of Seeing\" in which volumetric images were created using nine cameras, one of which moved autonomously throughout the exhibition space. The objective of the installation was to provide a unique visual experience of a volumetrically captured space reconstructed based on mixed reality. A robot module designed to navigate autonomously among visitors in the space is also described, and five different visualization methods are proposed as a new artistic expression. Visitors experienced mixed reality by appreciating layered mechanisms projecting a representation of the real world onto an immersive virtual world in real-time.", "ja": "著者らは「Intersection of Seeing」と題したアートインスタレーションを提示し、9台のカメラのうち1台が展示空間内を自律的に移動しながら体積画像を作成した。インスタレーションの目的は、ミックスドリアリティに基づいて再構築された体積的に捕捉された空間のユニークな視覚体験を提供することにある。来訪者の間を自律的にナビゲートするロボットモジュールも記述され、5つの異なる可視化手法が新たな芸術表現として提案されている。来訪者は、リアルタイムで実世界の表現を没入型の仮想世界に投影する層状メカニズムを鑑賞することで、ミックスドリアリティを体験した。"}, {"v": "", "img": "thumbs/144f18997c6c.jpg", "t": "Kiss/Crash: Using Diffusion Models to Explore Real Desire in the Shadow of Artificial Representations", "a": ["Adam Cole", "Mick Grierson"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597625", "abs": "This paper describes the art installation of Kiss/Crash: a multi-screen work exploring the subject of AI-imagery and representation as well as the autobiographical themes of loneliness, desire, and intimacy in the digital age. The installation consists of three individual works in a shared space, Kiss/Crash, Me Kissing Me, and Crash Me, Gently, which all play with augmenting, inverting, and negating the iconic image of the kiss using diffusion-based image translation. In the production of this work, several potentially novel video translation techniques were developed and refined to create high-quality results central to these pieces. Throughout our research, we reflect on the nature of images and place diffusion models within a history of image-production technologies that artists have been contending with and responding to for the past one hundred years. This paper aims to extend that artistic tradition with a provocative, original aesthetic and technique that reveals the logic of AI imagery and hints at how our relationship to reality will continue to be stretched and shaped by artificial representations at an accelerating pace.", "ja": "この論文は、Kiss/Crashというマルチスクリーン作品のアートインスタレーションを紹介し、AI画像と表象、そしてデジタル時代における孤独、欲望、親密さという自伝的テーマを探求するものです。インスタレーションは、Kiss/Crash、Me Kissing Me、Crash Me, Gentlyという3つの個別作品で構成され、拡散ベースの画像変換を用いてキスの象徴的なイメージを増幅、反転、否定しています。本作品の制作にあたり、いくつかの新規性のある動画変換技術が開発・洗練され、高品質な結果が得られました。研究を通じて、画像の本質を考察し、拡散モデルを過去100年間にわたって芸術家が取り組んできた画像生成技術の歴史の中に位置付けます。本論文は、挑発的で独創的な美学と技術を通じて、AI画像の論理を明らかにし、人工的な表象が加速するペースで現実との関係をどのように伸長・形成し続けるかを示すことで、芸術的伝統を拡張することを目指しています。"}, {"v": "", "img": "thumbs/2d51cb4082c8.jpg", "t": "Lights! Dance! Freeze! Exploring the dance-musical filmic space using embodied search in an interactive installation", "a": ["Theodoros Papatheodorou", "Jessica Wolpert"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597620", "abs": "Conventionally, spectators enjoy films passively. This paper describes an interactive film installation that invites participants to use their entire body as a query to search and explore a large corpus of musical films in a novel way. Using an RGB camera, ML-based skeleton tracking technology and a unique pose and film indexing system, this installation tracks a participant's movements and mirrors them in real-time by finding matching poses among hundreds of thousands from well-known musicals. When the participant freezes in a pose, the installation instantly plays back the short film clip that begins with that pose, immersing them in the music and dance from musicals of different eras. This approach explores themes of tangible interfaces and the new possibilities that emerge from employing embodied interaction to traverse the dance pose space, which is traditionally difficult to index and interact with in real time. The pose indexing system and whole-body interaction we propose in this paper open new pathways for cultural participation, as they lend themselves to different datasets and require no technical skills from participants.", "ja": "従来、観客は映画を受動的に楽しんでいます。この論文では、参加者が全身をクエリとして使用し、大規模なミュージカル映画コーパスを新しい方法で検索・探索することを可能にするインタラクティブな映画インスタレーションを紹介します。RGB カメラ、機械学習ベースのスケルトントラッキング技術、そして独自のポーズと映画のインデックスシステムを使用して、このインスタレーションは参加者の動きを追跡し、何十万もの有名ミュージカルからのポーズと照合してリアルタイムでミラーリングします。参加者がポーズで止まると、インスタレーションはそのポーズで始まる短い映画クリップを即座に再生し、異なる時代のミュージカルからの音楽とダンスに没入させます。このアプローチは、具体的なインターフェースと、従来リアルタイムでインデックス化および対話することが難しかったダンスポーズ空間を探索する新たな可能性というテーマを探求します。本論文で提案するポーズインデックスシステムと全身インタラクションは、異なるデータセットにも適用でき、参加者に技術的スキルを要求しないため、文化的参加への新たな道を開きます。"}, {"v": "", "img": "thumbs/de6bcc7d6c0b.jpg", "t": "Movement Quality Visualization for Wheelchair Dance", "a": ["Yurui Xie", "Giulia Barbareschi", "Ayesha Nabila", "Kai Kunze", "Masa Inakage"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597628", "abs": "Wheelchair dance is an important form of disability art that is still subject to significant levels of ableism and art exclusion. Wheelchair dancers face challenges finding teachers and choreographers who can accommodate their needs, documenting and sharing choreographies that suit their body shapes and their assistive technologies. In turn, this hinders their ability to share creative expressions. Accessible resources and communication tools could help address these challenges. The goal of this research is the development of a visualization system grounded on Laban Movement Analysis (LMA) that notates movement quality while opening new horizons on perceptions of disabled bodies and the artistic legitimacy of wheelchair dance. The system uses video to identify the body landmarks of the dancer and wheelchair and extracts key features to create visualizations of expressive qualities from LMA basic effort. The current evaluation includes a pilot study with the general public and an online questionnaire targeting professionals to gain feedback supporting practical implementation and real-world deployment. Results from the general public evaluation showed that the visualization was effective in conveying basic effort movement qualities even to a novice audience. Expert consulted via questionnaire stated that the tool could be employed for reflective evaluation, as well as performance augmentation. The LMA visualization tool can support the artistic legitimization of wheelchair dancing through education, communication, performance, and documentation.", "ja": "車椅子ダンスは、障害者アートの重要な形態であるものの、依然として有能主義や芸術的排除のレベルが高い。車椅子ダンサーは、自分のニーズに合わせた指導者や振付師を見つけること、身体の形状や補助技術に適した振付を記録・共有することに課題を抱えている。これが、創造的表現を共有する能力を妨げている。アクセシブルなリソースとコミュニケーションツールは、これらの課題に対処するのに役立つ可能性がある。本研究の目標は、Laban Movement Analysis（LMA）に基づいた可視化システムを開発し、動きの質を記譜すると同時に、障害を持つ身体の認識と車椅子ダンスの芸術的正当性に新たな視点を提供することである。システムはビデオを使用してダンサーと車椅子の身体ランドマークを特定し、主要な特徴を抽出してLMAの基本的な努力から表現的な質の可視化を作成する。現在の評価には、一般公衆を対象としたパイロットスタディと、専門家を対象としたオンラインアンケートが含まれ、実践的な実装と実世界への展開を支えるフィードバックを得ている。一般公衆の評価結果は、可視化が初心者の観客にも基本的な努力の動きの質を伝えるのに効果的であることを示した。専門家によるアンケートでは、ツールが反射的評価やパフォーマンスの強化に利用できると述べられた。LMA可視化ツールは、教育、コミュニケーション、パフォーマンス、記録を通じて車椅子ダンスの芸術的正当化を支援できる。"}, {"v": "", "img": "thumbs/c48c239a0e82.jpg", "t": "Sonification of a juggling performance using spatial audio", "a": ["Vojtěch Leischner", "Pavel Husa"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597619", "abs": "We developed a new musical instrument by equipping juggling balls with accelerometers, gyroscopes, and WiFi sensors. The system measures acceleration and rotation, allowing us to distinguish between ball movement and static states. We can determine the direction of each throw based on the acceleration data.A movement-driven instrument animates the virtual audio source position based on the throw direction. A different synthesizer is assigned to each ball, resulting in a synesthetic experience. The system integrates the juggling patterns simulator with OSC and MIDI API, allowing real-time rhythm generation and composition.", "ja": "私たちはジャグリングボールに加速度計、ジャイロスコープ、WiFiセンサーを装備することで新しい楽器を開発しました。このシステムは加速度と回転を測定し、ボールの動きと静止状態を区別できるようにします。加速度データに基づいて各投げの方向を特定することができます。動きに駆動された楽器は、投げの方向に応じて仮想音源の位置をアニメーション化します。各ボールには異なるシンセサイザーが割り当てられ、シナスタジア的体験を生み出します。このシステムはジャグリングパターンシミュレータとOSCおよびMIDI APIを統合し、リアルタイムでリズム生成と作曲を可能にします。"}, {"v": "", "img": "thumbs/e8b2916d6720.jpg", "t": "Synplant: Cymatics Visualization of Plant-Environment Interaction Based on Plants Biosignals", "a": ["Youyang Hu", "Chiaochi Chou", "Yasuaki Kakehi"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597622", "abs": "Synplant is an installation consisting of multiple hybrid plant sensing units. By analyzing biosignals, it can interpret the natural environment from the perspective of plants and translate their experiences into audiovisual expressions that can be experienced by humans. This work is based on a supervised learning system that analyzes the changes in biosignals when plants receive environmental stimuli. The analysis results are used to control acoustic-lighting devices to generate variable cymatics patterns. Through the utilization of wind and rain as vehicles to bridge different sensing units, it creates an immersive audiovisual field that represents the trajectories of the invisible interaction between plants and different elements in the natural environment. This work combines an intelligent machine with botanical perception to extend our understanding of the natural environment and to connect with the land from a non-human perspective.", "ja": "Synplantは、複数のハイブリッド植物センシングユニットからなるインスタレーションです。バイオシグナルを解析することで、植物の視点から自然環境を解釈し、その経験を人間が体験できる視覚・聴覚表現に変換します。この作品は、植物が環境刺激を受けたときのバイオシグナルの変化を解析する教師あり学習システムに基づいています。解析結果は音響・照明装置の制御に使用され、可変的なシンマティックパターンを生成します。風や雨を異なるセンシングユニットを結ぶ媒体として活用することで、植物と自然環境の異なる要素間の目に見えない相互作用の軌跡を表す没入型の視聴覚フィールドを作り出します。この作品は、知的機械と植物の知覚を結びつけ、自然環境に対する理解を深め、人間以外の視点から土地とつながることを目指しています。"}, {"v": "", "img": "thumbs/9d0c24b54106.jpg", "t": "The Kestrel Drone: Reimagining Bird's Eye View with Biomimetic AI-drone for Bird Strike Prevention", "a": ["Jooyoung Oh"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597629", "abs": "Artificial intelligence (AI) is redefining roads and skyways with advanced mobility technologies such as autonomous driving and Urban Air Mobility (UAM), suggesting a new paradigm for human mobility. This project sheds new light on drone mobility technology in terms of environmental aesthetics, focusing on global ecological issues. The Kestrel Drone is proposed based on a speculative scenario where \"birds\" become front-line users of drone technology and share their air routes with drones. At the exhibition hall, five Kestrel Drones were equipped with bird-mimicking wings and an AI tracker. The drones simulated a guiding bird for resident birds in a city. This project aims to evolve AI into a technology that has various parallel values that can coexist with non-human values, thus expanding the possibilities of technology.", "ja": "人工知能（AI）は、自律走行や都市型空中モビリティ（UAM）などの先進的なモビリティ技術により、道路や空路を再定義し、人間の移動に新たなパラダイムを提示しています。本プロジェクトは、環境美学の観点から、地球規模の生態学的課題に焦点を当て、ドローンモビリティ技術に新たな光を当てます。Kestrel Droneは、「鳥」がドローン技術の第一線ユーザーとなり、ドローンと空路を共有するという仮説的シナリオに基づいて提案されました。展示ホールでは、5機のKestrel Droneが鳥を模した翼とAIトラッカーを装備し、都市に生息する鳥たちのために案内鳥としてシミュレーションしました。本プロジェクトは、AIを非人間的価値と共存できるさまざまな平行的価値を持つ技術へと進化させ、技術の可能性を拡大することを目的としています。"}, {"v": "", "img": "thumbs/8979484da0da.jpg", "t": "Using Experimental Filmmaking to Create an Engaging Brain-Computer Interface", "a": ["Claudia Krogmeier", "Esteban García Bravo", "Christos Mousas"], "c": "SIGGRAPH", "y": 2023, "k": "Art Papers", "doi": "10.1145/3597624", "abs": "Inspired by storytelling ideas in surrealist creative productions and experimental films, we created a brain-computer interface (BCI) designed to offer users an exercise of the imagination. While many previous BCIs have used simple visual interfaces, we wanted to understand if an open-ended, story-based BCI experience could be helpful for allowing users to effectively interact with the story using their brain activity. We employed experimental storytelling techniques to prompt users to explore new thought patterns and ideas for changing brain activity. In our BCI, users were able to change the color of the main character in the story using their thoughts. We found that many users were able to change brain activity and enjoyed the BCI experience, while others were primarily frustrated. Based on our results, we offer ideas for future contributions to the development of engaging, story-based BCI applications.", "ja": "インスピレーションを受けたストーリーテリングのアイデアと超現実的なクリエイティブ作品や実験的映画から、私たちはユーザーに想像力の行使を提供する脳-コンピュータインターフェース（BCI）を作成しました。多くの従来のBCIがシンプルな視覚インターフェースを使用しているのに対し、オープンエンドでストーリーに基づくBCI体験が、ユーザーが脳活動を使ってストーリーと効果的に対話できるかどうかを理解したいと考えました。実験的なストーリーテリング技法を用いて、ユーザーが新しい思考パターンや脳活動を変えるアイデアを探求するよう促しました。私たちのBCIでは、ユーザーは自分の思考で物語の主人公の色を変えることができました。多くのユーザーが脳活動を変えることができ、BCI体験を楽しんだ一方で、他のユーザーは主にフラストレーションを感じました。結果に基づき、魅力的でストーリーに基づくBCIアプリケーションの開発への今後の貢献のためのアイデアを提供します。"}, {"v": "", "img": "thumbs/4b249e36adc9.jpg", "t": "#peaches", "a": ["Nooroa Tapuni"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3632937", "abs": "Ancestral time in Mangaian cosmology is an unfolding of multiple worlds through a generative process that extends from energy to matter from which we, Mangaians, are descended. Mangaia is the second largest Island in the Southern Cook Islands group. Its cosmology begins with expanding pulsating energies within the root of an upturned coconut, that generates multiple dimensions of existence. This transformation determines how we understand and navigate worlds. Within this multiplicity is recursion between the material and immaterial, where past, present and future are suspended and collapsed. Two key concepts underpin the generation of self-portrait images in the project #peaches; Akapapa'anga (layering through genealogy, building upon its ancestor genealogical connection within and between artworks) and the Mangaian cybernetic continuum (the ability for recursion to exist between worlds), which functions as ancestral time in practice. #peaches explores this proposition through layering and recursion of Al-generated portraits, and reveals the racial bias inherent in this technology, and its disruption to ancestral time."}, {"v": "", "img": "thumbs/31ef4218549b.jpg", "t": "Aguaviva", "a": ["Thomas Marcusson"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622959", "abs": "Aguaviva juxtaposes the spontaneous nature of biology with the predictable properties of digital technology."}, {"v": "", "img": "thumbs/172245f78338.jpg", "t": "AI History 1890-2090", "a": ["Kaihei Hase", "Syunji Yazaki"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622951", "abs": "The aim of this artwork is to let the audience feel \"brackish waters of fictionality and reality\" by seeing AI-generated history. In the real world, humans train AI with human-generated data. But AI trains humans with AI-generated data in this artwork. AI becomes smarter by learning. Their intelligence might surpass that of humans. When AI acquires more advanced knowledge than humans, will people, in turn, learn from AI? And will we unilaterally accept the AI-generated information without verification of the truth? This artwork anticipates the possible future experience. As AI infiltrates our lives, the information generated by AI is increasing exponentially. In this work, a zoetrope is used to show how the history of AI is being generated as AI generates images, and we can do nothing when we see AI creating its own history with its own generated images. We can only accept the information as it is presented to us. This work shows how we are immersed in this \"brackish zone of fictionality and reality brought about by AI\"."}, {"v": "", "img": "thumbs/cb980b489f91.jpg", "t": "AI Nüshu (Women’s scripts) - An Exploration of Language Emergence in Sisterhood", "a": ["Yuying Tang", "Yuqian Sun", "Ze Gao", "Zhijun Pan", "Zhigang Wang", "Tristan Braud", "Chang Hee Lee", "Ali Asadipour"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622957", "abs": "This paper presents \"AI Nüshu,\" an emerging language system inspired by Nüshu (women's scripts), the unique language created and used exclusively by ancient Chinese women who were illiterate under a patriarchy society. Through an interactive art installation, two artificial intelligent (AI) agents continuously observe their environment and communicate with each other, developing a writing system that encodes Chinese. In this system, two AI agents observe the environment through cameras, record the unconscious behaviors of the audience, and generate summaries of their observations through visual recognition. Subsequently, the agent associates the corresponding original Nüshu poetry lines and generates new poetry text through a Language Model (LLM), representing its reflection. To develop their language, they continuously switch roles between the speaker and listener, constantly communicating their reflections, and encrypting a word in the poetry line with their self-created AI Nüshu character, allowing the other to guess and learn. Gradually, they reach a consensus on AI Nüshu, forming a unique \"AI Nüshu Dictionary\" for machines. This language, algorithmically combined into corresponding characters, has components derived from Nüshu, similar to Chinese characters and traditional textile patterns. Thus, like ancient women, the two agents gradually developed their Chinese writing system, corresponding one-to-one with Chinese characters. In contrast, humans, as the authority of the language system, became an object observed, interpreted, and inspired by machines to stimulate non-human language. This is the first media art project to interpret Nüshu from a computational linguistics perspective, infusing AI and art research with non-English natural language processing, Chinese cultural heritage, and a feminist viewpoint. This encourages the creation of more non-English, linguistically-oriented artworks for diverse cultures. We simulate communication in sisterhood through a multi-agent learning system, which questioned knowledge authority between humans and machines through the lens of language development."}, {"v": "", "img": "thumbs/ce622e53fb2f.jpg", "t": "Aquasia: The world’s first immersive metaworld focused on the future of human habitats in the face of rising sea levels", "a": ["Kay Poh Gek Vasey", "Colin Seah", "Race Krehel", "Olivier Bos"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622945", "abs": "Aquasia is the world's first educational metaworld set in a floating city in Asia. It merges creativity, technology, and sustainability, revolutionising learning into an engaging, memorable journey."}, {"v": "", "img": "thumbs/f2e7733ac5c4.jpg", "t": "Bending the Light: Next generation anamorphic sculptures", "a": ["Louis Pratt", "Nico Pietroni"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622956", "abs": "Bending the light is a new method for generating artworks that extends the classical anamorphic archetype to use freeform reflective and refractive media and 3D surfaces instead of images. The methodology uses a mix of raytracing and surface deformation techniques to determine the proper deformation the object should undergo to be corrected by the optical tool once viewed by the observer in a specific location. The reflected image hovers in front of, rather than behind, the mirror. The audience forms an essential part of the work. The holographic or ghost-like appearance of the reflection results from the interplay between the mirror, sculpture and the eye of the viewer. The sculpture has been recently selected as a finalist for the prestigious Wynne Prize and exhibited at the Art Gallery of New South Wales. Before then, it was also exhibited at Sydney Contemporary."}, {"v": "", "img": "thumbs/d2778b92e90e.jpg", "t": "Cymatic Ground", "a": ["Alvaro Cassinelli", "Tobias Klein"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622961", "abs": "Cymatic Ground is an interactive sound installation doubling as a model of a dynamic urban landscape. Its body, a metallic scaffold designed following the plans of an old neighborhood in Hong Kong, is covered by a fine layer of sand. This exposed skin morphs in response to the sounds and vibrations of the larger environment it is immersed in. In response to fortuitous pressures and occasional gentle beats from the public, Cymatic Ground produces audible moaning and earthquake-like shakings that displace the grains of sand, destroying or revealing transient geometric patterns and complex networks of canals analogous to avenues, streets and alleys faithful to its original plans. On the other hand, when these external influences are not in tune to its fundamental mechanical resonances, its skin wrinkles and breaks apart, and its metallic body produces strident notes of despair as the installation searches for an appearance better attuned to the new reality it is immersed in. In an introspective and concerted effort, each plate - each neighborhood-continuously scans its own mechanical resonances, probing every part of its body with precisely tuned waves of energy, not unlike a city striving to reinvent itself in order to rekindle its appeal in response to global economic crisis, the effects of the climate change or the continuous displacement of its dwellers."}, {"v": "", "img": "thumbs/ce6ca1f3b77e.jpg", "t": "Erased Murmurs", "a": ["Miu Ling Lam"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622952", "abs": "Erased Murmurs is an interactive installation that brings attention to the disappearing and often overlooked graffiti, focusing on emotionally significant words written in public spaces in Hong Kong. The artwork explores themes of public expression and the lasting impact of the 2019 - 2020 Hong Kong protests."}, {"v": "", "img": "thumbs/c423ca731b81.jpg", "t": "Exquisite Corpus", "a": ["Kevin Blackistone"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3632938", "abs": "As humans, we regard our bodies through their visual surface components. The interior, when considered at all, is typically only due to medical concern for one's-self - rarely envisioning that of others. While radiological tools have dramatically improved our capacity for noninvasive representation, their use is often confined to the domains of personal health. This work seeks to instead uncover the possibilities they represent to show the full scope of our bodily form. In their obfuscation of the accustomed visual boundary, they remove associations of race and many aspects of gender. To further the dissolution of perceived identity, it excavates our inner sameness through algorithmically merging bodily interiors into 3d human chimeras - hybrid beings existing beyond the possibilities of genetic merger. Through the collection of simple participant biometrics, blended avatars constructed from real patient data are selected to give viewers a bodily representation that extends beyond the surface manifold commonly regarded as the self in both physical and virtual worlds. These avatars expand the representations usually seen within virtual spaces by, rather than existing as a 3d rendered hollow shell - absent the organs necessary for the operating individual, providing a volumetric representation of those elements unnecessary in the virtual space as the participant's character."}, {"v": "", "img": "thumbs/32ad02a2ac49.jpg", "t": "Fusion: Landscape and Beyond 2.0: An interactive AI generated art installation", "a": ["Mingyong Cheng", "Xuexi Dang", "Zetao Yu"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622954", "abs": "\"Fusion: Landscape and Beyond 2.0\" (2023) is an interactive art installation harnessing the potential of AI to redefine our relationship with urban and natural landscapes. Central to the concept of the installation is the synthetic memory, which dynamically adapts and responds to myriads of instructions, and in turn, influences our understanding of the environment. The installation offers an immersive experience where viewers play an active role. As participants traverse the exhibit, their movements act as triggers, instigating a real-time transformation of the AI-generated landscape. This interactivity reveals layers of cityscapes and landscapes, serving as a visualization of AI's evolving memory and its interpretation of our environment."}, {"v": "", "img": "thumbs/8514f908531e.jpg", "t": "Geomart-ut7: Encountering Geometric Patterns in Media Arts", "a": ["Selcuk Artut"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622942", "abs": "Geometric patterns sometimes appear to reflect an order we observe in nature and sometimes as abstract results of an intuitive process that emerges with different techniques applied. The geometric patterns obtained with the help of a simple compass and ruler reveal a prosperous world with their complex structures that appear at different levels in the visual content they offer us and their perfect layout. In the art of geometry, which takes its inspiration from deep abstractions, we encounter some mysterious bridges that are tried to be built between the representation and the imagined. When these bridges are skillfully built, they have a simple structure that allows us to look through a window that leads to absoluteness, repetition, eternity, simplicity, complexity, order, and chaos. In this series of works titled Geomart-ut7, I try to present a transformation where simple geometric forms can gain movement and turn into complex structures in a world of perception where meaning takes its breath away from expression. I wish to make visible the connections between the past's geometric art and the present's generative art, shrouded in mist."}, {"v": "", "img": "thumbs/820895744e8c.jpg", "t": "Infinite Colours", "a": ["Xavier Ho", "Stephen Krol"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622958", "abs": "\"Infinite Colours\" brings 2,499 videogame titles into a slow canvas of accumulative light. Each game adds a unique shape and colour onto the canvas and plays a unique string of notes. Over 8 hours, the canvas will be filled with infinite colours to celebrate LGBTQIA+ independent videogames."}, {"v": "", "img": "thumbs/228e0eeecd0c.jpg", "t": "LightSense - Long Distance", "a": ["Uwe Rieger", "Yinan Liu", "Tharindu Kaluarachchi", "Amit Barde", "Huidong Bai", "Alaeddin Nassani", "Suranga Nanayakkara", "Mark Billinghurst"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622963", "abs": "'LightSense - Long Distance' explores remote interaction with architectural space. It is a virtual extension of the project 'LightSense,' which is currently presented at the exhibition 'Cyber Physical: Architecture in Real Time' at EPFL Pavilions in Switzerland. Using numerous VR headsets, the setup at the Art Gallery at SIGGRAPH Asia establishes a direct connection between both exhibition sites in Sydney and Lausanne."}, {"v": "", "img": "thumbs/362813e9105f.jpg", "t": "Mākū, te hā o Haupapa: Moisture, the breath of Haupapa", "a": ["Stefan Marks", "Janine Randerson", "Rachel Shearer", "Ron Bull", "Heather Purdie"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622943", "abs": "The cracking and melting Haupapa glacier and lake, Aotearoa New Zealand's fastest growing body of water, are presented in a live cast of mākū, life-giving moisture. Tiny bubbles of ancient breath and atmosphere are pressed inside Haupapa's ancient glacial ice - including sea breezes, pollens, carbon dioxide and methane, as well as the ash of Australian fires. Single words and names of the elemental ancestors in Māori elder Ron Bull's voice, recorded live on the lake Haupapa, are woven through the sound and images to gift and acknowledge Kāi Tahu matauraka (knowledge) in a weather-responsive audio-visual installation. The project bridges meteorology, indigenous cosmologies, and science to create an active and unruly response to this rapidly changing icescape. The artists relinquish the ordering and qualities of sound and video to the weather conditions of Aoraki, recorded by NIWA instruments (New Zealand Institute for Water and Atmosphere) in place near the Haupapa glacier, then turned to digital information which feeds live into the installation, subtly altering the brightness, direction, and movement of the images and sounds according to the real-time weather conditions, and wind direction. Depending on the weather, the image changes and the sound and vocal sequence is endlessly variable. On days of high solar radiation, bright, clear ice and sun predominate and also move the images on screen accordingly, on cloudy days, the image darkens. La Niña conditions for the past three years have brought sunny settled weather to this region in the central South Island and melting has accelerated, indicating the changing climate. This installation expresses what it feels like to be inside that ice and water, responsive to heat, rain and bright sunlight."}, {"v": "", "img": "thumbs/1bd7446b0c2f.jpg", "t": "Penumbra2.0", "a": ["Dennis Del Favero", "Yang Song", "Khalid Moinuddin", "Charles Green", "Jason Sharples", "Alex Ong", "Navin Brohier"], "c": "SIGGRAPH Asia", "y": 2023, "k": "Art Gallery", "doi": "10.1145/3610537.3622946", "abs": "Penumbra2.0 is an AI immersive art installation exploring the visualisation of an unpredictable extreme wildfire scenar
